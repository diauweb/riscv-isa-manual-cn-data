en = '''
[#norm:vfclass_op_result]#The 10-bit mask produced by this instruction is placed in the
least-significant bits of the result elements.  The upper (SEW-10)
bits of the result are filled with zeros.# [#norm:vfclass_SEWge16]#The instruction is only
defined for SEW=16b and above, so the result will always fit in the
