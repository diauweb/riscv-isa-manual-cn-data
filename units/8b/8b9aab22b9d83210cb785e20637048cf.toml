en = '''
* [#norm:Svnapot_valid_encoding_ppn_subst]#If the encoding in _pte_ is
valid according to <<norm:Svnapot_enc_tbl>>, then
instead of returning the original value of _pte_,
implicit reads of a NAPOT PTE
return a copy of _pte_ in which __pte__.__ppn__[__i__][__pte__.__napot_bits__-1:0]
is replaced by __vpn__[__i__][__pte__.__napot_bits__-1:0].#
If the encoding in _pte_ is
[#norm:Svnapot_reserved_encoding_fault]#reserved according to
<<norm:Svnapot_enc_tbl>>, then a page-fault exception must be raised#.

* [#norm:Svnapot_cache_entries]#Implicit reads of NAPOT page table entries
may create address-translation cache entries mapping
_a_ + _j_×PTESIZE to a copy of _pte_ in which
_pte_._ppn_[_i_][_pte_.__napot_bits__-1:0] is replaced by
_vpn[i][pte.napot_bits_-1:0], for any or all _j_ such that
__j__ >> __napot_bits__ = __vpn__[__i__] >> __napot_bits__, all for the
address space identified in _satp_ as loaded by step 1#.'''
zh = '''
* [#norm:Svnapot_valid_encoding_ppn_subst]#如果 _pte_ 中的编码根据 <<norm:Svnapot_enc_tbl>> 有效，则隐式读取 NAPOT PTE 时不返回 _pte_ 的原始值，而是返回 _pte_ 的副本，其中 __pte__.__ppn__[__i__][__pte__.__napot_bits__-1:0] 被替换为 __vpn__[__i__][__pte__.__napot_bits__-1:0]。#
如果 _pte_ 中的编码根据 <<norm:Svnapot_enc_tbl>> 是[#norm:Svnapot_reserved_encoding_fault]##保留的，则必须引发缺页异常##。

* [#norm:Svnapot_cache_entries]#对 NAPOT 页表项的隐式读取可以创建地址转换缓存项，将 _a_ + _j_×PTESIZE 映射到 _pte_ 的副本，其中对于满足 __j__ >> __napot_bits__ = __vpn__[__i__] >> __napot_bits__ 的任意或所有 _j_，_pte_._ppn_[_i_][_pte_.__napot_bits__-1:0] 被替换为 _vpn[i][pte.napot_bits_-1:0]；所有这些均针对由第 1 步加载的 _satp_ 所标识的地址空间。#'''
