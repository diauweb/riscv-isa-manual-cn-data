en = '''
Floating-point to floating-point sign-injection instructions, insn:fsgnj.q[],
insn:fsgnjn.q[], and insn:fsgnjx.q[], are defined analogously to the double-precision
sign-injection instruction.'''
zh = '''
浮点到浮点符号注入指令 insn:fsgnj.q[]、insn:fsgnjn.q[] 和 insn:fsgnjx.q[] 的定义与双精度符号注入指令类似。'''
