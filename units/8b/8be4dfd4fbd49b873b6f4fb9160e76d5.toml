en = '''
If an instruction raises multiple synchronous exceptions, the
decreasing priority order of <<HSyncExcPrio>>
indicates which exception is taken and reported in `mcause` or `scause`.'''
zh = '''
若一条指令引发多个同步异常，则按 <<HSyncExcPrio>> 的递减优先级顺序指示采用哪个异常并在 `mcause` 或 `scause` 中报告。'''
