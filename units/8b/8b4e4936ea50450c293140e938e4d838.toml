. 陷入向量指令内影响 csr:vstart[] CSR 中索引之前的结果元素的任何操作都已提交其结果
. 陷入向量指令内影响 csr:vstart[] CSR 处或之后元素的任何操作都没有改变架构状态，除非重新启动并完成受影响的向量指令将仍然产生正确的最终状态。'''
