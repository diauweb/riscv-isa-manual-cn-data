en = '''
[#norm:c-nop_op]#`C.NOP` is a CI-format instruction that does not change any user-visible
state, except for advancing the `pc` and incrementing any applicable
performance counters. `C.NOP` expands to `nop`.#
[#norm:c-nop_hint]#The `C.NOP` code points
with _imm_≠0 encode HINTs.#'''
zh = '''
[#norm:c-nop_op]##`C.NOP` 是 CI 格式指令，除推进 `pc` 并递增任何适用的性能计数器外，不改变任何用户可见状态。`C.NOP` 展开为 `nop`。##
[#norm:c-nop_hint]##_imm_≠0 的 `C.NOP` 编码点编码 HINT。##'''
