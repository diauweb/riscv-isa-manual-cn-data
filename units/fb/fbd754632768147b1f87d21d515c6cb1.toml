en = '''
The `mew` bit (`inst[28]`) when set is expected to be used to encode
expanded memory sizes of 128 bits and above, but these encodings are
currently reserved.'''
zh = '''
`mew` 位（`inst[28]`）置位时预期用于编码 128 位及以上的扩展内存大小，但这些编码当前为保留。'''
