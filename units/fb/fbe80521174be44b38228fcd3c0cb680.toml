en = '''
[#norm:Zilsd_ld_x0]#LD instructions with destination `x0` are processed as any other load,
but the result is discarded entirely and x1 is not written.#
[#norm:Zilsd_c-ldsp_x0]#For C.LDSP, usage of `x0` as the destination is reserved.#'''
zh = '''
[#norm:Zilsd_ld_x0]##目标为 `x0` 的 LD 指令像任何其他加载一样处理，但结果被完全丢弃，且不写入 x1。##
[#norm:Zilsd_c-ldsp_x0]##对于 C.LDSP，将 `x0` 用作目标的情况是保留的。##'''
