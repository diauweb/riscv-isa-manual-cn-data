status = "machine"
en = '''
Compilers should flag each object file (for example, using flags in the ELF
attributes) to indicate if the object file has been compiled with the ext:zicfiss[]
instructions. The linker should flag (for example, using flags in the ELF
attributes) the binary/executable generated by linking objects as being
compiled with the ext:zicfiss[] instructions only if all the object files that are
linked have the same ext:zicfiss[] attributes.'''
zh = '''
编译器应标记每个目标文件（例如，使用 ELF 属性中的标志），以指示该目标文件是否已使用 ext:zicfiss[] 指令编译。链接器应仅当所有被链接的目标文件具有相同的 ext:zicfiss[] 属性时，才将链接目标文件生成的二进制文件/可执行文件标记为（例如，使用 ELF 属性中的标志）使用 ext:zicfiss[] 指令编译。'''
