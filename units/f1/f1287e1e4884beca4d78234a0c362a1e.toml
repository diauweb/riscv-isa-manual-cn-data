en = '''
[#norm:vector_reset_state]#The vector extension must have a consistent state at reset.  In
particular, csr:vtype[] and csr:vl[] must have values that can be read and
then restored with a single csr:vsetvl[] instruction.#'''
zh = '''
[#norm:vector_reset_state]#向量扩展在复位时必须具有一致的状态。特别地，csr:vtype[] 和 csr:vl[] 必须具有可读取、然后通过单条 csr:vsetvl[] 指令恢复的值。#'''
