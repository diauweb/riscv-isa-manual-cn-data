en = '''
[#norm:menvcfg_cde_op]#If the Smcdeleg extension is implemented, the CDE (Counter Delegation Enable) bit
controls whether Zicntr and Zihpm counters can be delegated to S-mode. When CDE=1, the Smcdeleg extension is
enabled, see <<smcdeleg>>. When CDE=0, the Smcdeleg and Ssccfg extensions appear to be not implemented.#
[#norm:menvcfg_cde_rdonly0]#If Smcdeleg is not implemented, CDE is read-only zero.#'''
zh = '''
[#norm:menvcfg_cde_op]#如果实现了 Smcdeleg 扩展，则 CDE（Counter Delegation Enable，计数器委托使能）位控制 Zicntr 和 Zihpm 计数器是否可以委托给 S 模式。当 CDE=1 时，启用 Smcdeleg 扩展，见 <<smcdeleg>>。当 CDE=0 时，Smcdeleg 和 Ssccfg 扩展看起来未实现。#
[#norm:menvcfg_cde_rdonly0]#如果未实现 Smcdeleg，则 CDE 为只读零。#'''
