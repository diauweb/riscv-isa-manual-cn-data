en = '''
The `vfmv.f.s` instruction copies a single SEW-wide element from index
0 of the source vector register to a destination scalar floating-point
register.'''
zh = '''
`vfmv.f.s` 指令将单个 SEW 宽元素从源向量寄存器的索引 0 复制到目标标量浮点寄存器。'''
