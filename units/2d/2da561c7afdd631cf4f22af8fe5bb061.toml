en = '''
[#norm:mseccfg_mlpe_presence]#The Zicfilp extension adds the `MLPE` field in `mseccfg`.#
[#norm:mseccfg_mlpe_set_op]#When `MLPE` field is 1, Zicfilp extension is enabled in M-mode.#
[#norm:mseccfg_mlpe_clr_op_lead_in]#When the `MLPE` field is 0, the Zicfilp extension is not enabled
in M-mode and the following rules apply to M-mode.#'''
zh = '''
[#norm:mseccfg_mlpe_presence]#Zicfilp 扩展在 `mseccfg` 中增加 `MLPE` 字段。#
[#norm:mseccfg_mlpe_set_op]#当 `MLPE` 字段为 1 时，Zicfilp 扩展在 M 模式下启用。#
[#norm:mseccfg_mlpe_clr_op_lead_in]#当 `MLPE` 字段为 0 时，Zicfilp 扩展在 M 模式下不启用，且以下规则适用于 M 模式。#'''
