en = '''
NOTE: While the insn:pause[] instruction is a HINT that can be implemented as a
insn:nop[] and hence trivially supported by hardware implementers, its
inclusion in the mandatory extension list signifies that software
should use the instruction whenever it would make sense and that
implementers are expected to exploit this information to optimize
hardware execution.'''
zh = '''
注意：虽然 insn:pause[] 指令是一个 HINT，可以实现为 insn:nop[]，因而硬件实现者可以轻松支持，但将其纳入强制扩展列表意味着软件应在有意义时使用该指令，并且实现者应利用这一信息来优化硬件执行。'''
