en = '''
This chapter describes the machine-level operations available in
[#norm:m_highest_priv_mode]#machine-mode (M-mode), which is the highest privilege mode in a RISC-V
hart.# [#norm:m_mode_first_at_reset]#M-mode is used for low-level access to a hardware platform and
is the first mode entered at reset.# M-mode can also be used to implement
features that are too difficult or expensive to implement in hardware
directly. The RISC-V machine-level ISA contains a common core that is
extended depending on which other privilege levels are supported and
other details of the hardware implementation.'''
zh = '''
本章介绍机器模式（M 模式）中可用的机器级操作，[#norm:m_highest_priv_mode]##M 模式是 RISC-V 硬件线程中特权级最高的模式。##[#norm:m_mode_first_at_reset]##M 模式用于对硬件平台进行低层访问，且是复位后进入的第一个模式。##M 模式还可用于实现那些直接在硬件中实现过于困难或成本过高的特性。RISC-V 机器级 ISA 包含一个公共核心，该核心会根据所支持的其他特权级以及硬件实现的其他细节进行扩展。'''
