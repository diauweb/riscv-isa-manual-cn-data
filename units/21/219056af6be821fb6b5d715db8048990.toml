en = '''
We use the term IALIGN (measured in bits) to refer to the
instruction-address alignment constraint the implementation enforces.
IALIGN is 32 in the base ISA, but some ISA extensions, including
the compressed ISA extension, relax IALIGN to 16. IALIGN may not
take on any value other than 16 or 32.'''
zh = '''
我们用术语 IALIGN（以位为单位）指代实现所强制执行的指令地址对齐约束。在基础 ISA 中，IALIGN 为 32，但某些 ISA 扩展（包括压缩 ISA 扩展）将 IALIGN 放宽到 16。IALIGN 不得取 16 或 32 以外的任何值。'''
