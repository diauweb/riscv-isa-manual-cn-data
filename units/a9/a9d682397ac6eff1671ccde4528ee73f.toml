en = '''
[#norm:mstatus_sz_acc]#The csr:mstatus[] register is an MXLEN-bit read/write register formatted as
shown in <<mstatusreg-rv32>> for RV32 and <<mstatusreg>> for RV64. csr:mstatus[] must be implemented.#
The csr:mstatus[] register keeps track of and controls the hart’s current operating state. A
restricted view of csr:mstatus[] appears as the csr:sstatus[] register in the S-level ISA.'''
zh = '''
[#norm:mstatus_sz_acc]##csr:mstatus[] 寄存器是一个 MXLEN 位读写寄存器，RV32 下的格式如 <<mstatusreg-rv32>> 所示，RV64 下的格式如 <<mstatusreg>> 所示。csr:mstatus[] 应实现。##csr:mstatus[] 寄存器跟踪并控制硬件线程的当前运行状态。csr:mstatus[] 的受限视图在 S 级 ISA 中表现为 csr:sstatus[] 寄存器。'''
