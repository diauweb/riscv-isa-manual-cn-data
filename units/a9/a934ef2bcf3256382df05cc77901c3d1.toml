en = '''
An implementation with the ext:ziccid[] extension behaves in a manner consistent
with the following operational model.
This model only applies to instruction fetches to memory regions with the
cacheability and coherence PMAs; instruction fetches to other memory regions
proceed as though the ext:ziccid[] extension were not implemented.'''
zh = '''
具有 ext:ziccid[] 扩展的实现以与以下操作模型一致的方式运作。
该模型仅适用于对具有可缓存性和一致性 PMA 的内存区域的指令取指；对其他内存区域的指令取指则如同未实现 ext:ziccid[] 扩展一样进行。'''
