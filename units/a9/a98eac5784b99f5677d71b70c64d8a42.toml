en = '''
- extlink:zabha[] Byte and halfword atomic memory operations.
- extlink:zacas[] Compare-and-swap instructions.
- extlink:ziccamoc[] Main memory regions with both the coherence and
  cacheability PMAs must provide AMOCASQ-level PMA support.
- extlink:zama16b[] Misaligned loads, stores and AMOs to main memory regions
  with both the coherence and cacheability PMAs that do not cross a naturally
  aligned 16-byte boundary are atomic.'''
zh = '''
- extlink:zabha[] 字节与半字原子内存操作。
- extlink:zacas[] 比较并交换指令。
- extlink:ziccamoc[] 同时具有一致性与可缓存性 PMA 的主内存区域必须提供 AMOCASQ 级 PMA 支持。
- extlink:zama16b[] 对同时具有一致性与可缓存性 PMA 的主内存区域进行的、不跨越自然对齐 16 字节边界的非对齐加载、存储与 AMO 是原子的。'''
