en = '''
The MOPs defined in the ext:zimop[] extension do not carry a syntactic dependency
from `x[rs1]` or `x[rs2]` to `x[rd]`, though an extension that redefines the
MOP may impose such a requirement.'''
zh = '''
ext:zimop[] 扩展中定义的 MOP 不携带从 `x[rs1]` 或 `x[rs2]` 到 `x[rd]` 的语法依赖，尽管重新定义该 MOP 的扩展可能施加此类要求。'''
