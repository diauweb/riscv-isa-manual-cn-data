en = '''
[NOTE]
====
Instruction-address-misaligned exceptions are not possible on machines
with IALIGN=16, e.g., those with the
compressed instruction-set extension, ext:c[].
===='''
zh = '''
[NOTE]
====
在 IALIGN=16 的机器上，例如那些具有压缩指令集扩展 ext:c[] 的机器，不可能出现指令地址非对齐异常。
===='''
