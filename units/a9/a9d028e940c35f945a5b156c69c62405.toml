en = '''
This chapter describes the Zfh standard extension for _half-precision_
floating-point, which adds computational instructions compliant with the IEEE
754-2008 arithmetic standard's binary16 format and operations. The Zfh extension
depends on the F extension. The NaN-boxing scheme described in <<nanboxing>> is
extended to allow a half-precision value to be NaN-boxed inside a
single-precision value (which may be recursively NaN-boxed inside a double- or
quad-precision value when the D or Q extension is present).'''
zh = '''
本章描述用于 _半精度_ 浮点的 Zfh 标准扩展，它增加符合 IEEE 754-2008 算术标准 binary16 格式和操作的计算指令。Zfh 扩展依赖 F 扩展。<<nanboxing>> 中描述的 NaN 装箱方案经过扩展，允许半精度值 NaN 装箱在单精度值内（当存在 D 或 Q 扩展时，该单精度值可递归地 NaN 装箱在双精度或四精度值内）。'''
