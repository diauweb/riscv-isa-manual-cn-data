en = '''
The `mseccfg.MML` (Machine Mode Lockdown) is a WARL field. The `MML` bit changes
the interpretation of the `pmpcfg.L` bit defined in <<pmp-locking>>. This is a
sticky bit, meaning that once set it cannot be unset until a *PMP reset*. When
`mseccfg.MML` is set the system's behavior changes in the following way:'''
zh = '''
