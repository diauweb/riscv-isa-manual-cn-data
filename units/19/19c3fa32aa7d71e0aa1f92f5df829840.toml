en = '''
The first letter following the ext:z[] conventionally indicates the most closely
related alphabetical extension category, IMAFDQLCBKJTVPH. For the ext:zfa[]
extension for additional floating-point instructions, for example, the letter
`f` indicates the extension is related to the ext:f[] extension.'''
zh = '''
按惯例，ext:z[] 之后的第一个字母表示与其关系最密切的字母类扩展类别，即 IMAFDQLCBKJTVPH。例如，对于附加浮点指令的 ext:zfa[] 扩展，字母 `f` 表示该扩展与 ext:f[] 扩展相关。'''
