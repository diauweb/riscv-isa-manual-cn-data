en = '''
The ext:zicfiss[] extension depends on the ext:zicsr[], ext:zimop[] and ext:zaamo[] extensions. Furthermore,
if the ext:zcmop[] extension is implemented, the ext:zicfiss[] extension also provides the
insn:c.sspush[] and insn:c.sspopchk[] instructions. Moreover, use of ext:zicfiss[] in U-mode
requires S-mode to be implemented. Use of ext:zicfiss[] in M-mode is not supported.'''
zh = '''
ext:zicfiss[] 扩展依赖于 ext:zicsr[]、ext:zimop[] 和 ext:zaamo[] 扩展。此外，如果实现了 ext:zcmop[] 扩展，ext:zicfiss[] 扩展还提供 insn:c.sspush[] 和 insn:c.sspopchk[] 指令。此外，在 U 模式下使用 ext:zicfiss[] 要求实现 S 模式。不支持在 M 模式下使用 ext:zicfiss[]。'''
