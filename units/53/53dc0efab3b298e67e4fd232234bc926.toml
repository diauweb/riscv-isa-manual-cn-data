en = '''
When the DM is reset, all harts must be placed in the lowest-numbered
halt and resume groups that they can be in. (This will usually be group
0.)'''
zh = '''
当 DM 被复位时，所有硬件线程都必须被放入其可处于的最小编号停机组和恢复组。（通常为组 0。）'''
