en = '''
The fields required to control a Trace Encoder are defined in the
RISC-V Trace Control Interface Specification in <<chap:tci>>, which is intended to apply to any and all RISC-V trace encoders, regardless of encoding protocol. This section details which of those fields apply to E-Trace. To avoid replication, descriptions are not provided here; additional E-Trace specific context or clarification is provided only where required.'''
zh = '''
控制跟踪编码器所需的字段在 <<chap:tci>> 中的《RISC-V 跟踪控制接口规范》中定义，该规范旨在适用于任何及所有 RISC-V 跟踪编码器，无论其编码协议为何。本节详细说明其中哪些字段适用于 E-Trace。为避免重复，此处不提供描述；仅在需要时提供 E-Trace 特有的额外上下文或澄清。'''
