en = '''
Note: If ext:zve32x[] is supported then ext:zvkb[] or ext:zvbb[] provide support for EEW of 8, 16, and 32. If ext:zve64x[] is supported then ext:zvkb[] or ext:zvbb[] also add support for EEW 64.'''
