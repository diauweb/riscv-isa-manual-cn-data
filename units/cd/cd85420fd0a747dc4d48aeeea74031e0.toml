en = '''
NOTE: Ssstrict definition applies to the execution environment claiming to be
RVB23S64-compatible.
That execution environment will take a contained trap to supervisor-mode
(however that trap is implemented, including, but not limited to,
emulation/delegation in the outer execution environment).
Ssstrict (and all the other RVB23S64 mandates and options) does not apply to
any guest VMs run by a hypervisor.
An RVB23S64 hypervisor can provide guest VMs that are also RVB23S64-compatible
but with an expanded set of emulated standard instructions.
An RVB23S64 hypervisor can also choose to implement guest VMs that are not
RVB23S64 compatible (e.g., only RVA20S64).'''
zh = '''
NOTE: Ssstrict 定义适用于声称兼容 RVB23S64 的执行环境。该执行环境将引发到监管模式的受控陷阱（无论该陷阱如何实现，包括但不限于外部执行环境中的模拟/委托）。Ssstrict（以及所有其他 RVB23S64 强制要求和选项）不适用于由虚拟机监控器运行的任何客户机 VM。RVB23S64 虚拟机监控器可以提供同样兼容 RVB23S64 的客户机 VM，但具有扩展的模拟标准指令集。RVB23S64 虚拟机监控器也可以选择实现不兼容 RVB23S64 的客户机 VM（例如，仅 RVA20S64）。'''
