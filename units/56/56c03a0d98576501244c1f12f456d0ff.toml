en = '''
[#norm:c-andi_op]#C.ANDI is a CB-format instruction that computes the bitwise AND of the
value in register _rd′_ and the sign-extended 6-bit
immediate, then writes the result to _rd′_. C.ANDI
expands to `andi rd′, rd′, imm`.#'''
zh = '''
[#norm:c-andi_op]#C.ANDI 是一条 CB 格式指令，计算寄存器 _rd′_ 中的值与符号扩展的 6 位立即数的按位 AND，然后将结果写入 _rd′_。C.ANDI 扩展为 `andi rd′, rd′, imm`。#'''
