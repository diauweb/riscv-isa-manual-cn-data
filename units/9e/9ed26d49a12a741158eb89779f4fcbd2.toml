en = '''
[#norm:c-jal_op]#C.JAL is an RV32C-only instruction that performs the same operation as
C.J, but additionally writes the address of the instruction following
the jump (`pc+2`) to the link register, `x1`. C.JAL expands to
`jal x1, offset`.#'''
zh = '''
[#norm:c-jal_op]##C.JAL 是仅用于 RV32C 的指令，它执行与 C.J 相同的操作，但此外还将跳转之后指令的地址（`pc+2`）写入链接寄存器 `x1`。C.JAL 展开为 `jal x1, offset`。##'''
