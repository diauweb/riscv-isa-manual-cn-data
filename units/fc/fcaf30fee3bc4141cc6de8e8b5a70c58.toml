en = '''
When XLEN=32, reads of the `mcycle`, `minstret`, `mhpmcounter__n__`, and `mhpmevent__n__`
CSRs return bitj 31-0 of the corresponding register, and writes change only bits 31-0;
[#norm:mcycleh_minstreth_mhpmh_op]#reads of the `mcycleh`, `minstreth`, `mhpmcounter__n__h`, and `mhpmevent__n__h`
CSRs return bits 63-32 of the corresponding register, and writes change only bits 63-32.#
[#norm:mhpmeventh_presence]#The `mhpmevent__n__h` CSRs are provided only if the Sscofpmf extension is implemented.#'''
zh = '''
当 XLEN=32 时，读取 `mcycle`、`minstret`、`mhpmcounter__n__` 和 `mhpmevent__n__` CSR 会返回相应寄存器的第 31-0 位，写入仅改变第 31-0 位；[#norm:mcycleh_minstreth_mhpmh_op]#读取 `mcycleh`、`minstreth`、`mhpmcounter__n__h` 和 `mhpmevent__n__h` CSR 会返回相应寄存器的第 63-32 位，写入仅改变第 63-32 位。# [#norm:mhpmeventh_presence]#仅当实现了 Sscofpmf 扩展时才提供 `mhpmevent__n__h` CSR。#'''
