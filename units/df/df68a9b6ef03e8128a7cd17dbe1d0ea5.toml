en = '''
[#norm:menvcfg_menvcfgh_no_U_mode]#In harts with U-mode, `menvcfg` must be
implemented, but all `WARL` fields may be read-only zero.
For harts with S-mode and XLEN=32, `menvcfgh` must be similarly implemented.
If U-mode is not supported, then registers `menvcfg` and `menvcfgh` do
not exist.#'''
zh = '''
[#norm:menvcfg_menvcfgh_no_U_mode]##在具有 U 模式的硬件线程中，`menvcfg` 应实现，但所有 `WARL` 字段可为只读零。对于具有 S 模式且 XLEN=32 的硬件线程，`menvcfgh` 应类似地实现。若不支持 U 模式，则寄存器 `menvcfg` 和 `menvcfgh` 不存在。##'''
