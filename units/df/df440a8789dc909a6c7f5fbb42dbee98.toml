en = '''
[#norm:misa_extensions_dependencies]#If an ISA feature _x_ depends on an ISA feature _y_, then attempting to
enable feature _x_ but disable feature _y_ results in both features
being disabled.#
For example, setting "F"=0 and "D"=1 results in both "F" and "D" being cleared.
Similarly, setting "U"=0 and "S"=1" results in both "U" and "S" being cleared.'''
zh = '''
[#norm:misa_extensions_dependencies]##若 ISA 特性 _x_ 依赖于 ISA 特性 _y_，则试图使能特性 _x_ 而禁用特性 _y_ 将导致两个特性均被禁用。##例如，设置“F”=0 且“D”=1 将导致“F”和“D”均被清除。类似地，设置“U”=0 且“S”=1 将导致“U”和“S”均被清除。'''
