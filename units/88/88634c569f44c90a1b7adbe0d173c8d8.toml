en = '''
Each aligned memory instruction that accesses XLEN or fewer bits gives rise
to exactly one memory operation, unless specified otherwise. An aligned AMO
gives rise to a single memory operation that is both a load operation and a
store operation simultaneously.'''
zh = '''
除非另有规定，每条访问 XLEN 位或更少位的对齐内存指令恰好产生一个内存操作。对齐的 AMO 产生一个同时既是加载操作又是存储操作的单一内存操作。'''
