en = '''
Non-standard extensions are named by using a single ext:x[] followed by the
alphanumeric name. The name must end with an alphabetic character. The second
letter from the end cannot be numeric if the last letter is `p`. For example,
ext:xhwacha[] names the Hwacha vector-fetch ISA extension
cite:[hwacha-esscirc2014].'''
zh = '''
非标准扩展使用单个 ext:x[] 后跟字母数字名称来命名。名称必须以
字母字符结尾。如果最后一个字母是 `p`，则倒数第二个字母不能是数字。
例如，ext:xhwacha[] 命名了 Hwacha 向量取指 ISA 扩展
cite:[hwacha-esscirc2014]。'''
