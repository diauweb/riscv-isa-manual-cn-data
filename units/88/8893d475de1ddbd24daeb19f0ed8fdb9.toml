en = '''
`mnstatus` also holds the NMIE bit. When NMIE=1, nonmaskable interrupts
are enabled. When NMIE=0, _all_ interrupts are disabled.'''
zh = '''
`mnstatus` 还持有 NMIE 位。当 NMIE=1 时，不可屏蔽中断使能。当 NMIE=0 时，__所有__中断被禁用。'''
