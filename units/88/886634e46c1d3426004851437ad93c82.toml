en = '''
For RV64, insn:ssamoswap.w[] atomically loads a 32-bit data value from address of a
shadow stack location in `rs1`, sign-extends the loaded value and puts it in
`rd`, and stores the lower 32 bits of the value held in `rs2` to the original
address in `rs1`.'''
zh = '''
对于 RV64，insn:ssamoswap.w[] 从 `rs1` 中的影子栈位置地址原子加载一个 32 位数据值，对加载的值进行符号扩展并放入 `rd`，并将 `rs2` 中保存的值的低 32 位存储到 `rs1` 中的原始地址。'''
