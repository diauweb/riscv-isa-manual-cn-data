en = '''
Pointer masking only adds the ability to ignore pointer tags during regular memory accesses. [#norm:pm_tag_check_impl]#The tag checks themselves can be implemented in software or hardware.# If implemented in software, pointer masking still provides performance benefits since non-checked accesses do not need to transform the address before every memory access. Hardware implementations are expected to provide even larger benefits due to performing tag checks out-of-band and hardening security guarantees derived from these checks. We anticipate that future extensions may build on pointer masking to support this functionality in hardware.'''
zh = '''
指针掩码仅增加了在常规内存访问期间忽略指针标签的能力。[#norm:pm_tag_check_impl]#标签检查本身可以在软件或硬件中实现。# 如果在软件中实现，指针掩码仍能带来性能收益，因为未经检查的访问不需要在每次内存访问前转换地址。硬件实现预计将带来更大的收益，因为它们可以带外执行标签检查，并强化由此类检查衍生的安全保证。我们预计未来的扩展可能会基于指针掩码来在硬件中支持此功能。'''
