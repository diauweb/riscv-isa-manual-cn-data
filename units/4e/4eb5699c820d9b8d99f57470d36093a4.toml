==== 虚拟机监控器时间差寄存器（`htimedelta`）

`htimedelta` CSR 是一个 64 位读/写寄存器，包含 `time` CSR 的值与在 VS 模式或 VU 模式中返回的值之间的差值。也就是说，在 VS 或 VU 模式下读取 `time` CSR 返回 `htimedelta` 的内容与 `time` 实际值之和。

