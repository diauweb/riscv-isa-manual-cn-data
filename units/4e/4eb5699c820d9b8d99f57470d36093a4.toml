当 `hcounteren` 寄存器中的 CY、TM、IR 或 HPM_n_ 位为 0 时，若 `mcounteren` 中相同位为 1，则在 V=1 时尝试读取 `cycle`、`time`、`instret` 或 `hpmcounter` _n_ 寄存器将导致虚拟指令异常。当这些位之一置位时，允许在 V=1 时访问相应寄存器，除非因某种其他原因被阻止。在 VU 模式下，除非适用位在 `hcounteren` 和 `scounteren` 中均置位，否则计数器不可读。

