若 `henvcfg` 中的位 FIOM（Fence of I/O implies Memory，I/O 屏障蕴含内存屏障）置 1，则在 V=1 时执行的 FENCE 指令被修改，使得对设备 I/O 访问排序的要求也蕴含对主存访问排序的要求。<<henvcfg-FIOM>> 详细说明 FIOM=1 且 V=1 时 FENCE 指令位 PI、PO、SI 和 SO 的修改后解释。

类似地，当 FIOM=1 且 V=1 时，若访问按设备 I/O 排序区域的原子指令的 _aq_ 和/或 _rl_ 位置位，则该指令如同访问设备 I/O 和内存两者一样排序。

[[henvcfg-FIOM]]
.当 FIOM=1 且虚拟化模式 V=1 时对 FENCE 前驱集和后继集的修改后解释。
[%autowidth,float="center",align="center",cols="^,<",options="header"]
|===
|指令位 |置位时的含义
|PI +
PO
|前驱设备输入和内存读（隐含 PR） +
前驱设备输出和内存写（隐含 PW）
|SI +
SO
|后继设备输入和内存读（隐含 SR） +
后继设备输出和内存写（隐含 SW）
|===

PBMTE 位控制 Svpbmt 扩展是否可用于 VS 阶段地址转换。当 PBMTE=1 时，Svpbmt 可用于 VS 阶段地址转换。当 PBMTE=0 时，实现的行为如同 Svpbmt 未针对 VS 阶段地址转换实现。若未实现 Svpbmt，则 PBMTE 为只读 0。

若实现了 Svadu 扩展，ADUE 位控制针对 VS 阶段地址转换是否使能 PTE A/D 位的硬件更新。当 ADUE=1 时，VS 阶段地址转换期间使能 PTE A/D 位的硬件更新，且实现的行为如同 Svade 扩展未针对 VS 模式地址转换实现。当 ADUE=0 时，实现的行为如同 Svade 已针对 VS 阶段地址转换实现。若未实现 Svadu，则 ADUE 为只读 0。

STCE 字段的定义将由即将发布的 Sstc 扩展提供。其在 `henvcfg` 内的分配可能在该扩展批准之前发生变化。

CBZE 字段的定义将由即将发布的 Zicboz 扩展提供。其在 `henvcfg` 内的分配可能在该扩展批准之前发生变化。

CBCFE 和 CBIE 字段的定义将由即将发布的 Zicbom 扩展提供。它们在 `henvcfg` 内的分配可能在该扩展批准之前发生变化。

PMM 字段的定义将由即将发布的 Ssnpm 扩展提供。其在 `henvcfg` 内的分配可能在该扩展批准之前发生变化。

当 XLEN=32 时，`henvcfgh` 是一个 32 位读/写寄存器，别名 `henvcfg` 的第 63:32 位。当 XLEN=64 时，寄存器 `henvcfgh` 不存在。

