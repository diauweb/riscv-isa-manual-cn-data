en = '''
[#norm:mstatus_mstatush_xbe_warl]#The csr::[mbe], csr::[sbe], and csr::[ube] bits in csr:mstatus[] and csr:mstatush[] are *WARL* fields that
control the endianness of memory accesses other than instruction fetches.
Each may be read/write or read-only.#'''
zh = '''
[#norm:mstatus_mstatush_xbe_warl]##csr:mstatus[] 和 csr:mstatush[] 中的 csr::[mbe]、csr::[sbe] 和 csr::[ube] 位是 *WARL* 字段，控制除取指之外的内存访问的字节序。每个字段可为可读写或只读。##'''
