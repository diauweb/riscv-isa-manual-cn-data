en = '''
The G-stage address translation and protections remain unaffected by the Zicfiss
extension. The `xwr == 010b` encoding in the G-stage PTE remains reserved.
[#norm:active_g_stage_pte]#When G-stage page tables are active, the shadow stack instructions that access memory
require the G-stage page table to have read-write permission for the accessed
memory; else a store/AMO guest-page-fault exception is raised.#'''
zh = '''
G 阶段地址转换和保护不受 Zicfiss 扩展影响。G 阶段 PTE 中的 `xwr == 010b` 编码保持保留。[#norm:active_g_stage_pte]#当 G 阶段页表处于活动状态时，访问内存的影子栈指令要求 G 阶段页表对被访问内存具有读-写权限；否则引发存储/AMO 客户机页错误异常。#'''
