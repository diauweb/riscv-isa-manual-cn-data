If csr:jvt[mode] = 0 (Jump Table Mode) then insn:cm.jt[] behaves as specified here. If csr:jvt[mode] is a reserved value, then insn:cm.jt[] is also reserved. In the future other defined values of csr:jvt[mode] may change the behaviour of insn:cm.jt[].
