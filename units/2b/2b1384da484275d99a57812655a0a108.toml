en = '''
This chapter describes the Q standard extension for _quad-precision_
floating-point, which adds computational instructions compliant with the IEEE
754-2008 arithmetic standard's binary128 format and operations. The Q extension
depends on the D extension.'''
zh = '''
本章描述用于__四精度__浮点的 ext:q[] 标准扩展，它添加了符合 IEEE 754-2008 算术标准 binary128 格式和操作的计算指令。ext:q[] 扩展依赖于 ext:d[] 扩展。'''
