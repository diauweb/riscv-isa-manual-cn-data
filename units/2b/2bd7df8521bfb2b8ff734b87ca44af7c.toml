en = '''
* [[norm:cbo-inval_m-mode_op1]]`01b` -- The instruction is executed and performs a flush operation, even if
  configured by a mode less privileged than M to perform an invalidate operation.
* [[norm:cbo-inval_m-mode_op2]]`11b` -- The instruction is executed and performs an invalidate operation,
  unless configured by a mode less privileged than M to perform a flush
  operation.'''
zh = '''
* [[norm:cbo-inval_m-mode_op1]]`01b` —— 该指令被执行并执行刷新操作，即使已被特权级低于 M 的模式配置为执行无效化操作。
* [[norm:cbo-inval_m-mode_op2]]`11b` —— 该指令被执行并执行无效化操作，除非已被特权级低于 M 的模式配置为执行刷新操作。'''
