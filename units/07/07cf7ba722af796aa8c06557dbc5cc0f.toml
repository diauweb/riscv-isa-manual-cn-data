en = '''
[float="center",align="center",cols="<23,<61,^10,^10",options="header"]
|===
|Field |Description |Access |Reset
|[[etrigger-hit]] `((hit))`
a|If this bit is implemented, the hardware sets it when this
trigger matches. The trigger's user can set or clear it at any
time. It is used to determine which
trigger(s) matched.  If the bit is not implemented, it is always 0
and writing it has no effect.
a|*WARL*
a|0
|[[etrigger-vs]] `((vs))`
a|When set, enable this trigger for exceptions that are taken from VS
mode.
This bit is hard-wired to 0 if the hart does not support
virtualization mode.
a|*WARL*
a|0
|[[etrigger-vu]] `((vu))`
a|When set, enable this trigger for exceptions that are taken from VU
mode.
This bit is hard-wired to 0 if the hart does not support
virtualization mode.
a|*WARL*
a|0
|[[etrigger-m]] `((m))`
a|When set, enable this trigger for exceptions that are taken from M
mode.
a|*WARL*
a|0
|[[etrigger-s]] `((s))`
a|When set, enable this trigger for exceptions that are taken from S/HS
mode.
This bit is hard-wired to 0 if the hart does not support
S-mode.
a|*WARL*
a|0
|[[etrigger-u]] `((u))`
a|When set, enable this trigger for exceptions that are taken from U
mode.
This bit is hard-wired to 0 if the hart does not support
U-mode.
a|*WARL*
a|0
|[[etrigger-action]] `((action))`
a|The action to take when the trigger fires. The values are explained
in xref:tab:action[].
a|*WARL*
a|0
|==='''
