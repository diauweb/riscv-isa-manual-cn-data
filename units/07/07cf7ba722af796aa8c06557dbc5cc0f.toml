[float="center",align="center",cols="<23,<61,^10,^10",options="header"]
|===
|字段 |说明 |访问 |复位
|[[etrigger-hit]] `((hit))`
a|若实现此位，则硬件在触发器匹配时将其置位。触发器的用户可随时设置或清除它。它用于确定哪些触发器匹配。若未实现该位，则它始终为 0，写入它无效果。
a|*WARL*
a|0
|[[etrigger-vs]] `((vs))`
a|置位时，为从 VS 模式采取的异常使能此触发器。若硬件线程不支持虚拟化模式，此位硬连线为 0。
a|*WARL*
a|0
|[[etrigger-vu]] `((vu))`
a|置位时，为从 VU 模式采取的异常使能此触发器。若硬件线程不支持虚拟化模式，此位硬连线为 0。
a|*WARL*
a|0
|[[etrigger-m]] `((m))`
a|置位时，为从 M 模式采取的异常使能此触发器。
a|*WARL*
a|0
|[[etrigger-s]] `((s))`
a|置位时，为从 S/HS 模式采取的异常使能此触发器。若硬件线程不支持 S 模式，此位硬连线为 0。
a|*WARL*
a|0
|[[etrigger-u]] `((u))`
a|置位时，为从 U 模式采取的异常使能此触发器。若硬件线程不支持 U 模式，此位硬连线为 0。
a|*WARL*
a|0
|[[etrigger-action]] `((action))`
a|触发器触发时要采取的动作。各值在 xref:tab:action[] 中说明。
a|*WARL*
a|0
|==='''
