en = '''
All register definitions in this volume follow the format shown below.
A simple graphic shows which fields are in the register. The upper and
lower bit indices are shown to the top left and top right of each field.
The total number of bits in the field is shown below it.'''
zh = '''
本卷中所有寄存器定义均遵循以下所示格式。一个简明图形显示寄存器中包含哪些字段。高、低位索引分别显示于每个字段的左上角和右上角。字段的总位数显示于其下方。'''
