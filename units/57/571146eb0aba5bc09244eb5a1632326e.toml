en = '''
[#norm:Zawrs_virtual_instr_excp]#When executing in VS or VU mode, if the `VTW` bit is set in `hstatus`, the
`TW` bit in `mstatus` is clear, and the `WRS.NTO` does not complete within an
implementation-specific bounded time limit, the `WRS.NTO` instruction will cause
a virtual-instruction  exception.#'''
zh = '''
[#norm:Zawrs_virtual_instr_excp]#在 VS 或 VU 模式下执行时，若 `hstatus` 中的 `VTW` 位被置位、`mstatus` 中的 `TW` 位为 0，且 `WRS.NTO` 未在实现特有的有界时间限制内完成，则 `WRS.NTO` 指令将引发虚拟指令异常。#'''
