en = '''
The `mnscratch` CSR holds an MXLEN-bit read-write register which enables
the NMI trap handler to save and restore the context that was
interrupted.'''
zh = '''
`mnscratch` CSR 持有一个 MXLEN 位可读写寄存器，使 NMI 陷阱处理程序能够保存和恢复被中断的上下文。'''
