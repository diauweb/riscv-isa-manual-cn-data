en = '''
[#norm:mstateen_bit_correspondence]#For every bit with a defined purpose in an `sstateen` CSR, the same bit is
defined in the matching `mstateen` CSR to control access below machine level to
the same state.# The upper 32 bits of an `mstateen` CSR (or for RV32, the
corresponding high-half CSR) control access to state that is inherently
inaccessible to user level, so no corresponding enable bits in the
supervisor-level `sstateen` CSR are applicable. [#norm:mstateen_bit_allocation]#The intention is to allocate bits
for this purpose starting at the most-significant end, bit 63, through to bit
32, and then on to the next-higher `mstateen` CSR.# [#norm:mstateen_bit_encroachment]#If the rate that bits are
being allocated from the least-significant end for `sstateen` CSRs is
sufficiently low, allocation from the most-significant end of `mstateen` CSRs may
be allowed to encroach on the lower 32 bits before jumping to the next-higher
`mstateen` CSR.# [#norm:sstateen_encroachment_bits_roz]#In that case, the bit positions of "encroaching" bits will remain
forever read-only zeros in the matching `sstateen` CSRs.#'''
zh = '''
[#norm:mstateen_bit_correspondence]##对于 `sstateen` CSR 中每一位具有已定义用途的位，在对应的 `mstateen` CSR 中定义了同一位，用于控制机器级以下对同一状态的访问。##`mstateen` CSR 的高 32 位（对于 RV32，则是对应的高半部分 CSR）控制对用户级本来就无法访问的状态的访问，因此监管级 `sstateen` CSR 中不存在适用的对应使能位。[#norm:mstateen_bit_allocation]##其意图是：从最高有效端第 63 位开始分配用于该目的的位直到第 32 位，然后继续使用编号更高的下一个 `mstateen` CSR。## [#norm:mstateen_bit_encroachment]##如果从最低有效端为 `sstateen` CSR 分配位的速率足够低，则允许从 `mstateen` CSR 最高有效端的分配在跳转到编号更高的下一个 `mstateen` CSR 之前侵入低 32 位。## [#norm:sstateen_encroachment_bits_roz]##在这种情况下，“侵入”位的位置在对应的 `sstateen` CSR 中将永远保持为只读零。##'''
