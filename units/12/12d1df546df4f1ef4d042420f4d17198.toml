en = '''
[#norm:c-addw_op]#`C.ADDW` is an RV64C-only instruction that adds the values in
registers _rd′_ and _rs2′_, then
sign-extends the lower 32 bits of the sum before writing the result to
register _rd′_. `C.ADDW` expands into
`addw rd′, rd′, rs2′`.#'''
zh = '''
[#norm:c-addw_op]##`C.ADDW` 是仅用于 RV64C 的指令，它将寄存器 _rd′_ 和 _rs2′_ 中的值相加，然后将和的低 32 位符号扩展后再写入寄存器 _rd′_。`C.ADDW` 展开为 `addw rd′, rd′, rs2′`。##'''
