en = '''
If bit FIOM (Fence of I/O implies Memory) is set to one in `henvcfg`,
FENCE instructions executed when V=1 are modified so the requirement to
order accesses to device I/O implies also the requirement to order main
memory accesses. <<norm:henvcfg_fiom_fence_presuc_op>> details the modified
interpretation of FENCE instruction bits PI, PO, SI, and SO when FIOM=1
and V=1.'''
zh = '''
如果 `henvcfg` 中的位 FIOM（Fence of I/O implies Memory，I/O 栅栏蕴含内存栅栏）被设置为 1，则当 V=1 时执行的 FENCE 指令被修改，使得对设备 I/O 访问排序的要求也蕴含对主存访问排序的要求。<<norm:henvcfg_fiom_fence_presuc_op>> 详细说明了当 FIOM=1 且 V=1 时 FENCE 指令位 PI、PO、SI 和 SO 的修改后解释。'''
