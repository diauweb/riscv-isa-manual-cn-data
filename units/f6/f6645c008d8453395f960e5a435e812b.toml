en = '''
[#norm:c-jr_op]#C.JR (jump register) performs an unconditional control transfer to the
address in register _rs1_. C.JR expands to `jalr x0, 0(rs1)`.#
[#norm:c-jr_rsv]#C.JR is
valid only when _rs1_≠`x0`; the code
point with _rs1_=`x0` is reserved.#'''
zh = '''
[#norm:c-jr_op]##C.JR（跳转寄存器）执行到寄存器 _rs1_ 中地址的无条件控制转移。C.JR 展开为 `jalr x0, 0(rs1)`。##
[#norm:c-jr_rsv]##C.JR 仅在 _rs1_≠`x0` 时有效；_rs1_=`x0` 的编码点保留。##'''
