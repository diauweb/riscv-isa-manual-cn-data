en = '''
[#norm:roundingmode_dynamic]#Floating-point operations use either a static rounding mode encoded in
the instruction, or a dynamic rounding mode held in `frm`. Rounding
modes are encoded as shown in <<norm:dyn_round_enc>>. A value of 111 in the
instruction's _rm_ field selects the dynamic rounding mode held in
`frm`#. [#norm:roundingmode_rsv]#The behavior of floating-point instructions that depend on
rounding mode when executed with a reserved rounding mode is _reserved_, including both static reserved rounding modes (101{endash}110) and dynamic reserved rounding modes (101{endash}111).# [#norm:roundingmode_unaffected_rm_decode]#Some instructions, including widening conversions, have the _rm_ field but are nevertheless mathematically unaffected by the rounding mode; software should set their _rm_ field to
RNE (000) but implementations must treat the _rm_ field as usual (in
particular, with regard to decoding legal vs. reserved encodings).#'''
zh = '''
[#norm:roundingmode_dynamic]#浮点操作使用编码在指令中的静态舍入模式，或保存在 `frm` 中的动态舍入模式。舍入模式的编码如 <<norm:dyn_round_enc>> 所示。指令 _rm_ 字段中的值 111 选择 `frm` 中保存的动态舍入模式#。[#norm:roundingmode_rsv]#依赖舍入模式的浮点指令在以保留舍入模式执行时的行为是__保留的__，包括静态保留舍入模式（101{endash}110）和动态保留舍入模式（101{endash}111）。# [#norm:roundingmode_unaffected_rm_decode]#某些指令（包括加宽转换）带有 _rm_ 字段，但在数学上不受舍入模式影响；软件应将其 _rm_ 字段设置为 RNE（000），但实现必须像往常一样处理 _rm_ 字段（特别是关于区分合法编码与保留编码）。#'''
