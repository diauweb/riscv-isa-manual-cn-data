en = '''
While BF16 (also known as BFloat16) is not an IEEE 754 _standard_ format, it
is a valid floating-point format as defined by IEEE 754-2008, with radix 2,
number of significand digits 8, and maximum exponent 127.'''
zh = '''
虽然 BF16（也称为 BFloat16）不是 IEEE 754 __标准__格式，但它是 IEEE 754-2008 定义的有效浮点格式，基数为 2，有效数字位数为 8，最大指数为 127。'''
