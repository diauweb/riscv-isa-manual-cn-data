en = '''
.Note
[NOTE, caption="A" ]
===============================================================
The insn:clmulr[] instruction is used to accelerate CRC calculations.
The insn:r[] in the instruction's mnemonic stands for _reversed_, as the
instruction is equivalent to bit-reversing the inputs, performing
a insn:clmul[], then bit-reversing the output.
==============================================================='''
zh = '''
.注
[NOTE, caption="A" ]
===============================================================
insn:clmulr[] 指令用于加速 CRC 计算。该指令助记符中的 insn:r[] 表示 _reversed_（反转），因为该指令等价于对输入进行位反转、执行 insn:clmul[]，然后对输出进行位反转。
==============================================================='''
