en = '''
The hypervisor extension augments or modifies machine CSRs `mstatus`,
`mstatush`, `mideleg`, `mip`, and `mie`, and adds CSRs `mtval2` and
`mtinst`.'''
zh = '''
虚拟机监控器扩展增强或修改机器 CSR `mstatus`、`mstatush`、`mideleg`、`mip` 和 `mie`，并添加 CSR `mtval2` 和 `mtinst`。'''
