en = '''
The ext:zicntr[] standard extension comprises the first three of these
counters (csr:cycle[], csr:time[], and csr:instret[]), which have dedicated functions
(cycle count, real-time clock, and instructions retired, respectively).
The ext:zicntr[] extension depends on the ext:zicsr[] extension.'''
zh = '''
ext:zicntr[] 标准扩展包含这些计数器中的前三个（csr:cycle[]、csr:time[] 和 csr:instret[]），它们具有专用功能（分别为周期计数、实时时钟和已退休指令数）。ext:zicntr[] 扩展依赖于 ext:zicsr[] 扩展。'''
