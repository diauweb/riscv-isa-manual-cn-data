en = '''
[#norm:fmin-s_fmax-s_op]#Floating-point minimum-number and maximum-number instructions insn:fmin.s[] and insn:fmax.s[] write, respectively, the smaller or larger of _rs1_ and _rs2_ to _rd_#.
[#norm:fmin-s_fmax-s_zero_compare]#For the purposes of these instructions only, the value −0.0 is considered to be less than the value +0.0#.
[#norm:fmin-s_fmax-s_both_nan_input]#If both inputs are NaNs, the result is the canonical NaN#.
[#norm:fmin-s_fmax-s_one_nan_input]#If only one operand is a NaN, the result is the non-NaN operand#.
[#norm:fmin-s_fmax-s_signaling_nan_nv]#Signaling NaN inputs set the invalid operation exception flag, even when the result is not NaN#.'''
zh = '''
[#norm:fmin-s_fmax-s_op]##浮点最小数指令和最大数指令 insn:fmin.s[] 和 insn:fmax.s[] 分别将 _rs1_ 与 _rs2_ 中较小或较大的值写入 _rd_。##
[#norm:fmin-s_fmax-s_zero_compare]##仅就这些指令而言，值 −0.0 被视为小于值 +0.0。##
[#norm:fmin-s_fmax-s_both_nan_input]##若两个输入均为 NaN，则结果为规范 NaN。##
[#norm:fmin-s_fmax-s_one_nan_input]##若只有一个操作数为 NaN，则结果为非 NaN 操作数。##
[#norm:fmin-s_fmax-s_signaling_nan_nv]##信号 NaN 输入会置位无效操作异常标志，即使结果不是 NaN。##'''
