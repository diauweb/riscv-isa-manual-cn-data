en = '''
[#norm:pma_amo_levels]#Within AMOs, there are four levels of support: _AMONone_, _AMOSwap_,
_AMOLogical_, and _AMOArithmetic_. AMONone indicates that no AMO
operations are supported. AMOSwap indicates that only `amoswap`
instructions are supported in this address range. AMOLogical indicates
that swap instructions plus all the logical AMOs (`amoand`, `amoor`,
`amoxor`) are supported. AMOArithmetic indicates that all RISC-V AMOs defined by
the A extension are supported.#
[#norm:pma_amo_sz_support]#For each level of support, naturally aligned AMOs of a given width
are supported if the underlying memory region supports reads and writes of that width.#
[#norm:pma_amo_far_subset_proc]#Main memory and I/O regions may only support a subset or none of the processor-supported atomic operations.#'''
zh = '''
[#norm:pma_amo_levels]#在 AMO 中，有四个支持级别：_AMONone_、_AMOSwap_、_AMOLogical_ 和 _AMOArithmetic_。AMONone 指示不支持任何 AMO 操作。AMOSwap 指示该地址范围仅支持 `amoswap` 指令。AMOLogical 指示支持交换指令以及所有逻辑 AMO（`amoand`、`amoor`、`amoxor`）。AMOArithmetic 指示支持 A 扩展定义的所有 RISC-V AMO。# [#norm:pma_amo_sz_support]#对于每个支持级别，若底层内存区域支持给定宽度的读和写，则支持该宽度的自然对齐 AMO。# [#norm:pma_amo_far_subset_proc]#主存区域和 I/O 区域可以只支持处理器所支持原子操作的子集，或不支持任何原子操作。#'''
