en = '''
The ext:zcb[] extension adds several compressed instructions which, like those
in the extlink:zca[] extension, expand into a single 32-bit instruction.
The ext:zcb[] extension depends on the ext:zca[] extension.'''
zh = '''
ext:zcb[] 扩展增加了几条压缩指令，这些指令与 extlink:zca[] 扩展中的指令一样，展开为单条 32 位指令。ext:zcb[] 扩展依赖于 ext:zca[] 扩展。'''
