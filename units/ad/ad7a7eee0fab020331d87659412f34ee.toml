en = '''
[#norm:H_tinst_addr_offset]#In all the transformed instructions above, the Addr. Offset field that
replaces the instruction’s rs1 field in bits 19:15 is the positive
difference between the faulting virtual address (written to `mtval` or
`stval`) and the original virtual address. This difference can be
nonzero only for a misaligned memory access.# [#norm:H_trans_ldst_imm_zero]#Note also that, for basic
loads and stores, the transformations replace the instruction’s
immediate offset fields with zero.#'''
zh = '''
[#norm:H_tinst_addr_offset]#在上述所有变换后的指令中，替换指令位 19:15 处 rs1 字段的 Addr. Offset 字段是故障虚拟地址（写入 `mtval` 或 `stval`）与原始虚拟地址之间的正差值。此差值仅在未对齐内存访问时才可能非零。# [#norm:H_trans_ldst_imm_zero]#另请注意，对于基本加载和存储，变换将指令的立即数偏移字段替换为零。#'''
