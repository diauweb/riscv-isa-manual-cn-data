en = '''
[#norm:NTL-ALL_op]#The NTL.ALL instruction indicates that the target instruction does not
exhibit temporal locality within the capacity of any level of cache in
the memory hierarchy.# [#norm:NTL-ALL_enc]#NTL.ALL is encoded as ADD _x0, x0, x5_.#'''
zh = '''
[#norm:NTL-ALL_op]##NTL.ALL 指令指示目标指令在内存层次中任何层高速缓存的容量内不表现出时间局部性。## [#norm:NTL-ALL_enc]##NTL.ALL 编码为 ADD _x0, x0, x5_。##'''
