en = '''
Memory-accessing instructions give rise to _memory operations_. A memory
operation can be either a _load operation_, a _store operation_, or both
simultaneously.
[#norm:rvwmo_single_copy_atomic]#All memory operations are single-copy atomic:
they can never be observed in a partially complete state.#
(((operations, memory)))'''
zh = '''
访存指令产生__内存操作__。内存操作可以是__加载操作__、__存储操作__，或同时二者兼有。
[#norm:rvwmo_single_copy_atomic]##所有内存操作都是单副本原子的：绝不可能观察到它们处于部分完成状态。##
(((operations, memory)))'''
