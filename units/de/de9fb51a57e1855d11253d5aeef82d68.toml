en = '''
<<norm:Zca_hints_tbl>> lists all ext:zca[] HINT code points. For XLEN=32, 78%
of the HINT space is reserved for standard HINTs. The remainder of the HINT space is designated for custom HINTs;
no standard HINTs will ever be defined in this subspace.'''
zh = '''
<<norm:Zca_hints_tbl>> 列出了所有 ext:zca[] HINT 代码点。对于 XLEN=32，78% 的 HINT 空间保留用于标准 HINT。HINT 空间的其余部分指定用于自定义 HINT；该子空间中将永远不会定义标准 HINT。'''
