en = '''
[#norm:c-addi_op]#C.ADDI adds the non-zero sign-extended 6-bit immediate to the value in
register _rd_ then writes the result to _rd_. C.ADDI expands into
`addi rd, rd, imm`.#
[#norm:c-addi_hint]#The code points with _rd_≠0 and _imm_=0 are HINTs.#
[#norm:c-addi_nop]#The code points with _rd_=`x0` encode the C.NOP instruction, of
which the code points with _imm_≠0 are HINTs.#'''
zh = '''
[#norm:c-addi_op]##C.ADDI 将非零符号扩展的 6 位立即数加到寄存器 _rd_ 中的值，然后将结果写回 _rd_。C.ADDI 展开为 `addi rd, rd, imm`。##
[#norm:c-addi_hint]##_rd_≠0 且 _imm_=0 的编码点为 HINT。##
[#norm:c-addi_nop]##_rd_=`x0` 的编码点编码 C.NOP 指令，其中 _imm_≠0 的编码点为 HINT。##'''
