en = '''
[NOTE]
====
RV32I was designed to be sufficient to form a compiler target and to
support modern operating system environments. The ISA was also designed
to reduce the hardware required in a minimal implementation. RV32I
contains 40 unique instructions, though a simple implementation might
cover the insn:ecall[]/insn:ebreak[] instructions with a single insn:system[] hardware
instruction that always traps and might be able to implement the insn:fence[]
instruction as a insn:nop[], reducing base instruction count to 38 total. RV32I
can emulate almost any other unprivileged ISA extension (except the ext:a[] and other ext:za*[] extensions,
which require additional hardware support for atomicity).

In practice, a hardware implementation including the machine-mode
privileged architecture will also require the 6 CSR instructions in the extlink:zicsr[] extension.

Subsets of the base integer ISA might be useful for pedagogical
purposes, but the base has been defined such that there should be little
incentive to subset a real hardware implementation beyond omitting
support for misaligned memory accesses and treating all insn:system[]
instructions as a single trap.
===='''
zh = '''
[NOTE]
====
RV32I 旨在足以构成编译器目标并支持现代操作系统环境。该 ISA 的设计还旨在减少最小实现所需的硬件。RV32I 包含 40 条唯一指令，不过简单实现可能用一条总是陷入的 insn:system[] 硬件指令来覆盖 insn:ecall[]/insn:ebreak[] 指令，并且可能将 insn:fence[] 指令实现为 insn:nop[]，从而将基础指令数量减少到总共 38 条。RV32I 几乎可以模拟任何其他非特权 ISA 扩展（除了 ext:a[] 和其他 ext:za*[] 扩展，这些需要额外的原子性硬件支持）。

在实践中，包含机器模式特权架构的硬件实现还需要 extlink:zicsr[] 扩展中的 6 条 CSR 指令。

基础整数 ISA 的子集可能对教学目的有用，但基础的定义方式应使得除了省略对非对齐内存访问的支持以及将所有 insn:system[] 指令视为单个陷阱之外，几乎没有动力对真实硬件实现进行子集化。
===='''
