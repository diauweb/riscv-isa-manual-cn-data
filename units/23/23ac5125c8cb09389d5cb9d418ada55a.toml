en = '''
As shown on the individual instruction pages, many of the instructions in
ext:zcb[] depend upon another extension being implemented.
For example, insn:c.mul[] is only implemented if extlink:m[] or extlink:zmmul[] is
implemented, and insn:c.sext.b[] is only implemented if extlink:zbb[] is
implemented.'''
zh = '''
如各指令页面所示，ext:zcb[] 中的许多指令依赖于已实现的另一扩展。例如，insn:c.mul[] 仅在实现了 extlink:m[] 或 extlink:zmmul[] 时实现，insn:c.sext.b[] 仅在实现了 extlink:zbb[] 时实现。'''
