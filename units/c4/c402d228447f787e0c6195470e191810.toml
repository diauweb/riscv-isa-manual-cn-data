en = '''
Description::
This instruction performs a rotate right of _rs1_ by the amount in the least-significant log2(XLEN) bits of _shamt_.
For RV32, the encodings corresponding to _shamt[5]_=1 are reserved.'''
zh = '''
说明::
本指令将 _rs1_ 循环右移 _shamt_ 的最低有效 log2(XLEN) 位所指定的量。对于 RV32，与 _shamt[5]_=1 相对应的编码为保留编码。'''
