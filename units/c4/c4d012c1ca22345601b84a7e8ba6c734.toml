en = '''
[NOTE]
====
The C99 language standard effectively mandates the provision of a
dynamic rounding mode register. In typical implementations, writes to
the dynamic rounding mode CSR state will serialize the pipeline. Static
rounding modes are used to implement specialized arithmetic operations
that often have to switch frequently between different rounding modes.

Previous versions of the specification mandated that an illegal-instruction
exception was raised when an instruction was executed with a reserved dynamic
rounding mode. This requirement has been weakened to reserved, which matches the
behavior of static rounding-mode instructions. Raising an illegal-instruction
exception is a valid behavior when encountering a reserved encoding, so
implementations compatible with the previous specification are compatible with
the current specification.
===='''
zh = '''
[NOTE]
====
C99 语言标准实际上要求提供动态舍入模式寄存器。在典型实现中，对动态舍入模式 CSR 状态的写入会使流水线串行化。静态舍入模式用于实现专用算术操作，这些操作通常需要在不同舍入模式之间频繁切换。

本规范的先前版本要求：当指令用保留的动态舍入模式执行时，触发非法指令异常。该要求已弱化为保留，这与静态舍入模式指令的行为一致。遇到保留编码时，触发非法指令异常是有效行为，因此与先前规范兼容的实现也与当前规范兼容。
===='''
