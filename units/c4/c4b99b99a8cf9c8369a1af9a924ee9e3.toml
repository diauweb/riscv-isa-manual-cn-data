en = '''
Correct execution of shadow stack instructions that access memory requires the
accessed memory to be idempotent. [#norm:ssmp_ss_idempotent_memory]#If the memory referenced by
insn:sspush[], insn:c.sspush[], insn:sspopchk[], insn:c.sspopchk[], insn:ssamoswap.w[] and insn:ssamoswap.d[] instructions is not
idempotent, then the instructions cause a store/AMO access-fault exception.#'''
zh = '''
访问内存的影子栈指令的正确执行要求所访问的内存是幂等的。[#norm:ssmp_ss_idempotent_memory]#如果 insn:sspush[]、insn:c.sspush[]、insn:sspopchk[]、insn:c.sspopchk[]、insn:ssamoswap.w[] 和 insn:ssamoswap.d[] 指令所引用的内存不是幂等的，则这些指令会导致存储/AMO 访问故障异常。#'''
