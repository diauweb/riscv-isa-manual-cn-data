en = '''
The Zvfh extension provides support for vectors of IEEE 754-2008
binary16 values.
When the Zvfh extension is implemented, all instructions in
<<sec-vector-float>>, <<sec-vector-float-reduce>>,
<<sec-vector-float-reduce-widen>>, <<sec-vector-float-move>>,
<<sec-vfslide1up>>, and <<sec-vfslide1down>>
become defined when SEW=16.
The EEW=16 floating-point operands of these instructions use the binary16
format.'''
zh = '''
Zvfh 扩展为 IEEE 754-2008 binary16 值的向量提供支持。当实现 Zvfh 扩展时，<<sec-vector-float>>、<<sec-vector-float-reduce>>、<<sec-vector-float-reduce-widen>>、<<sec-vector-float-move>>、<<sec-vfslide1up>> 和 <<sec-vfslide1down>> 中的所有指令在 SEW=16 时变为已定义。这些指令的 EEW=16 浮点操作数使用 binary16 格式。'''
