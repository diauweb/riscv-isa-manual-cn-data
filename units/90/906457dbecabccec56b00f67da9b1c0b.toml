en = '''
The ext:ziccid[] extension mandates more stringent requirements for
consistency between instruction fetches and other memory accesses than those
imposed by the base ISA.
As described in detail in the next section, ext:ziccid[] guarantees that
a hart's instruction fetches appear to occur in program order with respect to
each other, and that stores eventually become visible to all harts'
instruction fetches.'''
zh = '''
与基础 ISA 所施加的要求相比，ext:ziccid[] 扩展对指令取指与其他内存访问之间的一致性强制了更严格的要求。如下一节详细所述，ext:ziccid[] 保证硬件线程的指令取指彼此之间表现为按程序顺序发生，并且存储最终会对所有硬件线程的指令取指可见。'''
