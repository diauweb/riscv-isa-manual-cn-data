en = '''
NOTE: The software-check and hardware-error exceptions were defined in
version 1.13 of the privileged architecture.
Hence, in previous versions of the privileged architecture, the
corresponding bits in `hedeleg` were not mandatorily writable.'''
zh = '''
NOTE: 软件检查和硬件错误异常是在特权架构 1.13 版中定义的。因此，在先前版本的特权架构中，`hedeleg` 中相应的位并非强制可写。'''
