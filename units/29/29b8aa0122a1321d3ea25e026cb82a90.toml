en = '''
[#norm:fcvt-s-d_fcvt-d-s_op]#The double-precision to single-precision and single-precision to
double-precision conversion instructions, FCVT.S.D and FCVT.D.S, are
encoded in the OP-FP major opcode space and both the source and
destination are floating-point registers. The _rs2_ field encodes the
datatype of the source, and the _fmt_ field encodes the datatype of the
destination#. [#norm:fcvt_float_rounding]#FCVT.S.D rounds according to the RM field; FCVT.D.S will
never round#.
(((double-precision, to single-precision)))
(((single-precision, to double-precision )))'''
zh = '''
[#norm:fcvt-s-d_fcvt-d-s_op]#双精度到单精度以及单精度到双精度的转换指令 FCVT.S.D 和 FCVT.D.S 编码在 OP-FP 主操作码空间中，源和目标都是浮点寄存器。_rs2_ 字段编码源的数据类型，_fmt_ 字段编码目标的数据类型#。[#norm:fcvt_float_rounding]#FCVT.S.D 根据 RM 字段进行舍入；FCVT.D.S 从不舍入#。
(((double-precision, to single-precision)))
(((single-precision, to double-precision )))'''
