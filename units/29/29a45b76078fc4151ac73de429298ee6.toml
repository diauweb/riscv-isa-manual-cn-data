en = '''
[#norm:mip_lcofip_mie_lcofie_op]#If the Sscofpmf extension is implemented, bits `mip`.LCOFIP and `mie`.LCOFIE
are the interrupt-pending and interrupt-enable bits for local-counter-overflow interrupts.#
[#norm:mip_lcofip_acc]#LCOFIP is read-write in `mip`# and [#norm:mip_lcofip_op2]#reflects the occurrence of a local
counter-overflow overflow interrupt request resulting from any of the `mhpmevent__n__`.OF bits being set.#
[#norm:mip_lcofip_mie_lcofie_rdonly0]#If the Sscofpmf extension is not implemented, `mip`.LCOFIP and `mie`.LCOFIE are
read-only zeros.#'''
zh = '''
[#norm:mip_lcofip_mie_lcofie_op]##若实现了 Sscofpmf 扩展，则 `mip`.LCOFIP 和 `mie`.LCOFIE 位是本地计数器溢出中断的中断挂起位和中断使能位。##[#norm:mip_lcofip_acc]##LCOFIP 在 `mip` 中可读写##，且[#norm:mip_lcofip_op2]##反映由任何 `mhpmevent__n__`.OF 位被置位而产生的本地计数器溢出中断请求的发生。##[#norm:mip_lcofip_mie_lcofie_rdonly0]##若未实现 Sscofpmf 扩展，则 `mip`.LCOFIP 和 `mie`.LCOFIE 为只读零。##'''
