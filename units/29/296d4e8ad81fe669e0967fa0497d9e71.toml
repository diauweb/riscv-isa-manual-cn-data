en = '''
[#norm:bitmanip_uw_suffix_semantics]#Bitmanip instructions with the suffix _.uw_ have one operand that is an unsigned 32-bit value that is extracted from the least-significant 32 bits of the specified register.  Other than that, these perform full-XLEN operations.#'''
zh = '''
[#norm:bitmanip_uw_suffix_semantics]##带 _.uw_ 后缀的位操作指令有一个操作数，该操作数是从指定寄存器的最低有效 32 位中提取的无符号 32 位值。除此之外，这些指令执行全 XLEN 操作。##'''
