en = '''
[#norm:vsext_vzext_op]#The vector integer extension instructions zero- or sign-extend a
source vector integer operand with EEW less than SEW to fill SEW-sized
elements in the destination.#  [#norm:vsext_vzext_vs_eew_emul]#The EEW of the source is 1/2, 1/4, or
1/8 of SEW, while EMUL of the source is (EEW/SEW)*LMUL.#  [#norm:vsext_vzext_vd_eew_emul]#The
destination has EEW equal to SEW and EMUL equal to LMUL.#'''
zh = '''
[#norm:vsext_vzext_op]#向量整数扩展指令将一个 EEW 小于 SEW 的源向量整数操作数零扩展或符号扩展，以填充目标中 SEW 大小的元素。#  [#norm:vsext_vzext_vs_eew_emul]#源的 EEW 为 SEW 的 1/2、1/4 或 1/8，而源的 EMUL 为 (EEW/SEW)*LMUL。#  [#norm:vsext_vzext_vd_eew_emul]#目标的 EEW 等于 SEW，EMUL 等于 LMUL。#'''
