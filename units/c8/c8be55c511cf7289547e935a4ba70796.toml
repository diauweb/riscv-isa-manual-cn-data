en = '''
[#norm:zicntr_rdinstret_op]#The insn:rdinstret[] pseudoinstruction reads the low XLEN bits of the
csr:instret[] CSR, which counts the number of instructions retired by this
hart from some arbitrary start point in the past.# [#norm:zicntr_rdinstreth_op]#insn:rdinstreth[] is only
present when XLEN=32 and reads bits 63-32 of the same instruction
counter.# The underlying 64-bit counter should never overflow in
practice.'''
zh = '''
[#norm:zicntr_rdinstret_op]##insn:rdinstret[] 伪指令读取 csr:instret[] CSR 的低 XLEN 位，该 CSR 计数该硬件线程自过去某个任意起始点起已退休的指令数。## [#norm:zicntr_rdinstreth_op]##insn:rdinstreth[] 仅在 XLEN=32 时存在，读取同一指令计数器的位 63-32。## 底层 64 位计数器在实践中不宜上溢。'''
