en = '''
The ext:zba[] instructions can be used to accelerate the generation of addresses that index into arrays of basic types (halfword, word, doubleword) using both unsigned word-sized and XLEN-sized indices: a shifted index is added to a base address.'''
zh = '''
ext:zba[] 指令可用于加速生成索引基本类型（半字、字、双字）数组的地址，同时使用无符号字大小和 XLEN 大小的索引：将移位后的索引加到基地址上。'''
