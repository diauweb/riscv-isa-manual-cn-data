en = '''
The ext:zicfiss[] extension introduces a shadow stack to enforce backward-edge
CFI. A shadow stack is a second stack used to store a
shadow copy of the return address in the link register if it needs to be
spilled.'''
zh = '''
ext:zicfiss[] 扩展引入影子栈以强制执行后向边 CFI。影子栈是第二个栈，用于在链接寄存器中的返回地址需要保存时存储其影子副本。'''
