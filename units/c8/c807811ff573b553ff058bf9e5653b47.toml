en = '''
[NOTE]
====
For the ext:zicbom[], ext:zicboz[], and ext:zicbop[] extensions, this specification recommends
the following common trigger module behaviors:

* Type 6 address match triggers, i.e. csr:tdata1[type]=6 and csr:mcontrol6[select]=0,
  should be supported

* Type 2 address/data match triggers, i.e. csr:tdata1[type]=2, should be
  unsupported

* The size of a memory access equals the size of the cache block accessed, and
  the compare values follow from the addresses of the NAPOT memory region
  corresponding to the cache block containing the effective address

* Unless an encoding for a cache block is added to the csr:mcontrol6[size] field,
  an address trigger should only match a memory access from a CBO instruction if
  csr:mcontrol6[size]=0

If the ext:zicbom[] extension is implemented, this specification recommends the
following additional trigger module behaviors:

* Implementing address match triggers should be optional

* Type 6 data match triggers, i.e. csr:tdata1[type]=6 and csr:mcontrol6[select]=1,
  should be unsupported

* Memory accesses are considered to be stores, i.e. an address trigger matches
  only if csr:mcontrol6[store]=1

If the ext:zicboz extension is implemented, this specification recommends the
following additional trigger module behaviors:

* Implementing address match triggers should be mandatory

* Type 6 data match triggers, i.e. csr:tdata1[type]=6 and csr:mcontrol6[select]=1,
  should be supported, and implementing these triggers should be optional

* Memory accesses are considered to be stores, i.e. an address trigger matches
  only if csr:mcontrol6[store]=1

If the ext:zicbop[] extension is implemented, this specification recommends the
following additional trigger module behaviors:

* Implementing address match triggers should be optional

* Type 6 data match triggers, i.e. csr:tdata1[type]=6 and csr:mcontrol6[select]=1,
  should be unsupported

* Memory accesses may be considered to be loads or stores depending on the
  implementation, i.e. whether an address trigger matches on these instructions
  when csr:mcontrol6[load]=1 or csr:mcontrol6[store]=1 is _implementation-specific_

This specification also recommends that the behavior of trigger modules with
respect to the ext:zicboz[] extension should be defined in version 1.0 of the debug
architecture specification. The behavior of trigger modules with respect to the
ext:zicbom[] and ext:zicbop[] extensions is expected to be defined in future extensions.
===='''
zh = '''
[NOTE]
====
对于 ext:zicbom[]、ext:zicboz[] 和 ext:zicbop[] 扩展，本规范推荐以下通用的触发模块行为：

* 应支持类型 6 地址匹配触发，即 csr:tdata1[type]=6 且 csr:mcontrol6[select]=0

* 不应支持类型 2 地址/数据匹配触发，即 csr:tdata1[type]=2

* 内存访问的大小等于所访问缓存块的大小，比较值由与包含有效地址的缓存块相对应的 NAPOT 内存区域的地址得出

* 除非在 csr:mcontrol6[size] 字段中为缓存块添加了编码，否则地址触发应仅在 csr:mcontrol6[size]=0 时匹配来自 CBO 指令的内存访问

如果实现了 ext:zicbom[] 扩展，本规范推荐以下额外的触发模块行为：

* 实现地址匹配触发应为可选的

* 不应支持类型 6 数据匹配触发，即 csr:tdata1[type]=6 且 csr:mcontrol6[select]=1

* 内存访问被视为存储操作，即地址触发仅在 csr:mcontrol6[store]=1 时匹配

如果实现了 ext:zicboz 扩展，本规范推荐以下额外的触发模块行为：

* 实现地址匹配触发应为强制性的

* 应支持类型 6 数据匹配触发，即 csr:tdata1[type]=6 且 csr:mcontrol6[select]=1，且实现这些触发应为可选的

* 内存访问被视为存储操作，即地址触发仅在 csr:mcontrol6[store]=1 时匹配

如果实现了 ext:zicbop[] 扩展，本规范推荐以下额外的触发模块行为：

* 实现地址匹配触发应为可选的

* 不应支持类型 6 数据匹配触发，即 csr:tdata1[type]=6 且 csr:mcontrol6[select]=1

* 根据实现的不同，内存访问可被视为加载或存储，即当 csr:mcontrol6[load]=1 或 csr:mcontrol6[store]=1 时，地址触发是否匹配这些指令是__实现特定的__

本规范还建议，触发模块相对于 ext:zicboz[] 扩展的行为应在调试架构规范 1.0 版中定义。触发模块相对于 ext:zicbom[] 和 ext:zicbop[] 扩展的行为预期将在未来的扩展中定义。
===='''
