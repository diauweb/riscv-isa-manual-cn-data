[#norm:misa_extensions_collective_warl]#An implementation may impose additional constraints on the collective
setting of two or more csr:misa[] fields, in which case they function
collectively as a single *WARL* field. An attempt to write an unsupported combination causes those bits to be set to some supported combination.#'''
zh = '''
[#norm:misa_extensions_collective_warl]##实现可对两个或更多 csr:misa[] 字段的集体设置施加额外约束，此时它们作为一个 *WARL* 字段共同起作用。试图写入不支持的组合会导致这些位被设置为某个支持的组合。##'''
