en = '''
[NOTE]
====
This definition of csr::[fs] does not disallow setting csr::[fs] to Dirty as a result
of errant speculation. Some platforms may choose to disallow
speculatively writing csr::[fs] to close a potential side channel.
===='''
zh = '''
[NOTE]
====
csr::[fs] 的这一定义不禁止因错误推测而将 csr::[fs] 设置为 Dirty。某些平台可选择禁止推测性写入 csr::[fs]，以封闭潜在的侧信道。
===='''
