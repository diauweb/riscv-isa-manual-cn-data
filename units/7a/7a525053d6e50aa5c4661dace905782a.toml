实现可以将此字段中任意数量的高位硬连线为 0。如果未实现 H 扩展，建议在 RV32 上实现 6 位，在 RV64 上实现 13 位（通过 {csr-mcontext} 寄存器可见）。如果实现了 H 扩展，建议在 RV32 上实现 7 位，在 RV64 上实现 14 位。
