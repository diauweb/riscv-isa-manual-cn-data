en = '''
[#norm:ctr_freeze_vs]#If the H extension is implemented, freeze behavior for LCOFIs and breakpoint exceptions that trap to VS-mode is determined by the LCOFIFRZ and BPFRZ values, respectively, in `vsctrctl`.  This includes virtual LCOFIs pended by a hypervisor.#'''
zh = '''
[#norm:ctr_freeze_vs]#如果实现了 H 扩展，则陷入 VS 模式的 LCOFI 和断点异常的冻结行为分别由 `vsctrctl` 中的 LCOFIFRZ 和 BPFRZ 值决定。这包括由管理程序挂起的虚拟 LCOFI。#'''
