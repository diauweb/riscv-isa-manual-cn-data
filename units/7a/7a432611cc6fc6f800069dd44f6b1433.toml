en = '''
* **Ssnpm**: [#norm:ssnpm_definition]#A supervisor-level extension that provides pointer masking for the next lower privilege mode (U-mode), and for VS- and VU-modes if the H extension is present.# See <<sec:senvcfg>>, <<sec:henvcfg>>, <<sec:hstatus>>, and <<pm-two-stage>>.
* **Smnpm**: [#norm:smnpm_definition]#A machine-level extension that provides pointer masking for the next lower privilege mode (S/HS if S-mode is implemented, or U-mode otherwise).# See <<sec:menvcfg>>.
* **Smmpm**: [#norm:smmpm_definition]#A machine-level extension that provides pointer masking for M-mode.# See <<sec:mseccfg>>.'''
zh = '''
* **Ssnpm**：[#norm:ssnpm_definition]#一个监管级扩展，为下一较低特权模式（U 模式）提供指针掩码；如果存在 H 扩展，还为 VS 和 VU 模式提供指针掩码。# 见 <<sec:senvcfg>>、<<sec:henvcfg>>、<<sec:hstatus>> 和 <<pm-two-stage>>。
* **Smnpm**：[#norm:smnpm_definition]#一个机器级扩展，为下一较低特权模式（如果实现了 S 模式，则为 S/HS；否则为 U 模式）提供指针掩码。# 见 <<sec:menvcfg>>。
* **Smmpm**：[#norm:smmpm_definition]#一个机器级扩展，为 M 模式提供指针掩码。# 见 <<sec:mseccfg>>。'''
