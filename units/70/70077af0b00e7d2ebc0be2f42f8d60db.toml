en = '''
Loads a 64-bit value into registers `rd` and `rd+1`.
The effective address is obtained by adding register rs1 to the
sign-extended 12-bit offset.'''
zh = '''
将 64 位值加载到寄存器 `rd` 和 `rd+1`。有效地址由寄存器 rs1 加上符号扩展的 12 位偏移得到。'''
