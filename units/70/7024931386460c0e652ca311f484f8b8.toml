en = '''
The FS and XS fields are read by the privileged code before saving the
context. The FS field is set directly by privileged code when resuming a
user context, while the XS field is set indirectly by writing to the
status register of the individual extensions.
[#norm:mstatus_fs_vs_xs_update_indep_priv]#The status fields will
also be updated during execution of instructions, regardless of privilege mode.#'''
zh = '''
特权代码在保存上下文之前读取 FS 和 XS 字段。FS 字段在恢复用户上下文时由特权代码直接设置，而 XS 字段通过写入各扩展的状态寄存器间接设置。[#norm:mstatus_fs_vs_xs_update_indep_priv]##状态字段也会在指令执行期间更新，无论特权模式如何。##'''
