en = '''
[#norm:pte_a_def]#Each leaf PTE contains an accessed (A) and dirty (D) bit. The A bit
indicates the virtual page has been read, written, or fetched from since
the last time the A bit was cleared.# [#norm:pte_d_def]#The D bit indicates the virtual
page has been written since the last time the D bit was cleared.#'''
zh = '''
[#norm:pte_a_def]##每个叶 PTE 包含已访问（A）位和脏（D）位。A 位指示自上次清零 A 位以来该虚拟页是否被读取、写入或取指。## [#norm:pte_d_def]##D 位指示自上次清零 D 位以来该虚拟页是否被写入。##'''
