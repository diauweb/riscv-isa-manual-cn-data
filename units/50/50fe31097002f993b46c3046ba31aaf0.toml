en = '''
[#norm:vmv-nr-r_enc]#The instruction is encoded as an OPIVI instruction.  The number of
vector registers to copy is encoded in the low three bits of the
`imm` field (`imm[2:0]`) using the same encoding as the `nf[2:0]` field for memory
instructions (Figure <<fig-nf>>), i.e., `imm[2:0]` = NREG-1.#'''
zh = '''
[#norm:vmv-nr-r_enc]#该指令编码为 OPIVI 指令。要复制的向量寄存器数量编码在 `imm` 字段的低三位（`imm[2:0]`）中，使用与内存指令的 `nf[2:0]` 字段相同的编码（图 <<fig-nf>>），即 `imm[2:0]` = NREG-1。#'''
