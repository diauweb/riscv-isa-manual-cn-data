en = '''
On implementations that support the ext:Zca[] extension, compressed forms of
instructions permitted inside constrained LR/SC sequences, as
described in <<sec:lrscseq>>, are also permitted
inside constrained LR/SC sequences.'''
zh = '''
在支持 ext:Zca[] 扩展的实现上，如 <<sec:lrscseq>> 所述，允许出现在受约束 LR/SC 序列内的指令的压缩形式也允许出现在受约束 LR/SC 序列内。'''
