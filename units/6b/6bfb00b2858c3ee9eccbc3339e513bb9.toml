en = '''
[#norm:mcountinhibit_cy_shared]#The `mcycle` CSR may be shared between harts on the same core,
in which case the `mcountinhibit.CY` field is also shared between those harts,
and so writes to `mcountinhibit.CY` will be visible to those harts.#'''
zh = '''
[#norm:mcountinhibit_cy_shared]##`mcycle` CSR 可在同一核心的硬件线程之间共享，此时 `mcountinhibit.CY` 字段也在那些硬件线程之间共享，因此对 `mcountinhibit.CY` 的写入将对那些硬件线程可见。##'''
