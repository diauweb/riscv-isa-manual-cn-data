en = '''
[#norm:mstatus_xs_acc]#In harts without additional user extensions requiring new state, the
XS field is read-only zero.#
[#norm:mstatus_xs_equiv]#Every additional extension with state
provides a CSR field that encodes the equivalent of the XS states.#
[#norm:mstatus_xs_op2]#The XS field represents a summary of all extensions' status as shown in
<<norm:mstatus_fs_vs_xs_enc>>.#'''
zh = '''
[#norm:mstatus_xs_acc]##在不需要新状态的其他用户扩展的硬件线程中，XS 字段为只读零。##[#norm:mstatus_xs_equiv]##每个带状态的附加扩展都提供一个 CSR 字段，编码等同于 XS 状态的信息。##[#norm:mstatus_xs_op2]##XS 字段表示所有扩展状态的汇总，如 <<norm:mstatus_fs_vs_xs_enc>> 所示。##'''
