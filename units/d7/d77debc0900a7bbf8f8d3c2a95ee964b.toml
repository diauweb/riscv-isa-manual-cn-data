en = '''
[#norm:cycle_counting]#The cycle counter will simply count CPU cycles while the CPU is in a non-inhibited privilege mode.#
Mode transition operations (traps and trap returns) may take multiple clock cycles, and the change of privilege mode may be reported as occurring in any one of those cycles (possibly different for each occurrence of a trap or trap return).'''
zh = '''
[#norm:cycle_counting]##当 CPU 处于非受抑制特权模式时，cycle 计数器将仅计数 CPU 周期。##
模式转换操作（陷阱和陷阱返回）可能花费多个时钟周期，特权模式改变可能报告为在其中任一周期发生（对于每次陷阱或陷阱返回可能不同）。'''
