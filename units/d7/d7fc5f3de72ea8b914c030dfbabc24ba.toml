en = '''
C.BNEZ is defined analogously, but it takes the branch if
_rs1′_ contains a nonzero value. It expands to
`bne rs1′, x0, offset`.'''
zh = '''
C.BNEZ 的定义类似，但若 _rs1′_ 包含非零值则采用该分支。它展开为 `bne rs1′, x0, offset`。'''
