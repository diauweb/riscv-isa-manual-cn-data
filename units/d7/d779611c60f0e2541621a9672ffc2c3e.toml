en = '''
Floating-point loads and stores use the same base+offset addressing mode as the integer base ISAs, with a base address in register _rs1_ and a 12-bit signed byte offset. The insn:flw[] instruction loads a single-precision floating-point value from memory into floating-point register _rd_. insn:fsw[] stores a single-precision value from floating-point register _rs2_ to memory.'''
zh = '''
浮点加载和存储使用与整数基本 ISA 相同的基址加偏移寻址模式，基址位于寄存器 _rs1_ 中，并带有 12 位有符号字节偏移。insn:flw[] 指令从内存加载单精度浮点值到浮点寄存器 _rd_。insn:fsw[] 将浮点寄存器 _rs2_ 中的单精度值存储到内存。'''
