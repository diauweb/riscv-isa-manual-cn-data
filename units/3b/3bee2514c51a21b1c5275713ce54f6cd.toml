en = '''
insn:fnmadd.s[] multiplies the values in _rs1_ and _rs2_, negates the product, subtracts the value in _rs3_, and writes the final result to _rd_. insn:fnmadd.s[] computes _−(rs1×rs2)−rs3_.'''
zh = '''
