en = '''
RV32E and RV64E reduce the integer register count to 16 general-purpose
registers, (`x0-x15`), where `x0` is a dedicated zero register.'''
zh = '''
RV32E 和 RV64E 将整数寄存器数量减少到 16 个通用寄存器（`x0-x15`），其中 `x0` 是专用的零寄存器。'''
