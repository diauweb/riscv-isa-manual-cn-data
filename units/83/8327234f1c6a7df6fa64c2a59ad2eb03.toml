en = '''
This chapter describes the scalar floating-point extensions.
The extlink:f[] extension adds floating-point registers and
instructions for computation on single-precision floating-point values.
The extlink:d[] and extlink:q[] extensions widen those registers to
hold double- and quad-precision floating-point values, respectively, and add
instructions for computation on those formats.
We use the term ((FLEN)) to describe the width of the floating-point registers.
FLEN can be 32, 64, or 128 depending on which of the ext:f[], ext:d[], and
ext:q[] extensions are supported.
Several additional extensions with the ext:zf[] prefix provide
additional formats and computational instructions.'''
zh = '''
本章描述标量浮点扩展。
extlink:f[] 扩展添加了浮点寄存器以及用于对单精度浮点值进行计算
的指令。
extlink:d[] 和 extlink:q[] 扩展分别加宽这些寄存器，以保存
双精度和四精度浮点值，并添加用于对这些格式进行计算的
指令。
我们使用术语 ((FLEN)) 来描述浮点寄存器的宽度。
FLEN 可以是 32、64 或 128，取决于所支持的是 ext:f[]、ext:d[] 和
ext:q[] 扩展中的哪些。
若干带有 ext:zf[] 前缀的附加扩展提供了
额外的格式和计算指令。'''
