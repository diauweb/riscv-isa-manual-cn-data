en = '''
[#norm:Sv39_pte_count_sz]#Sv39 page tables contain 2^9^ page table entries
(PTEs), eight bytes each.#
A page table is [#norm:Sv39_pt_sz]#exactly the size of a page# and
[#norm:Sv39_pt_align]#must always be aligned to a page boundary#.
The physical page number of the root page table is stored in the `satp`
register's PPN field.'''
zh = '''
[#norm:Sv39_pte_count_sz]##Sv39 页表包含 2^9^ 个页表项（PTE），每项 8 字节。## 页表 [#norm:Sv39_pt_sz]##的大小恰好等于一页##，并且 [#norm:Sv39_pt_align]##应始终按页边界对齐##。根页表的物理页号保存在 `satp` 寄存器的 PPN 字段中。'''
