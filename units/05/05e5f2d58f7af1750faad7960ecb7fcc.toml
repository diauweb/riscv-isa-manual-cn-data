en = '''
Because TSR and TVM in `mstatus` are intended to impact only S-mode
(HS-mode), they are ignored for determining exceptions in VS-mode.'''
zh = '''
由于 `mstatus` 中的 TSR 和 TVM 旨在仅影响 S 模式（HS 模式），因此在确定 VS 模式中的异常时忽略它们。'''
