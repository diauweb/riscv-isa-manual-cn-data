en = '''
The RVB23S64 profile specifies the ISA features available to a supervisor-mode
execution environment in 64-bit applications processors.  RVB23S64 is based on
privileged architecture version 1.13.'''
zh = '''
RVB23S64 配置集规定 64 位应用处理器中监管模式执行环境可用的 ISA 特性。RVB23S64 基于特权架构版本 1.13。'''
