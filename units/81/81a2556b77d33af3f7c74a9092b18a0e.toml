en = '''
The following example code sequence illustrates the use of insn:amocas.q[] to
implement the _enqueue_ operation for a non-blocking concurrent queue using the
algorithm outlined in cite:[queue]. The algorithm atomically operates on a pointer
and its associated modification counter using the insn:amocas.q[] instruction to
avoid the ABA problem.'''
zh = '''
以下示例代码序列说明使用 insn:amocas.q[] 实现非阻塞并发队列的__入队__操作，所用算法概述于 cite:[queue]。该算法使用 insn:amocas.q[] 指令对指针及其关联的修改计数器进行原子操作，以避免 ABA 问题。'''
