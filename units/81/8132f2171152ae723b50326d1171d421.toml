对于特权模式 U 和 VU，__名义特权模式__为 U；对于特权模式 HS 和 VS，名义特权模式为 S。

HS 模式特权高于 VS 模式，VS 模式特权高于 VU 模式。当在 U 模式中执行时，VS 模式中断全局禁用。

