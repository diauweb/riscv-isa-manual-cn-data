|[[tinfo-version]] `((version))`
a|包含所实现 Sdtrig 扩展的版本。

0（0）：支持本规范中截至 2023 年 2 月 2 日提交 5a5c078 所描述的触发器。

在这些较旧版本中：

. {csr-mcontrol6} 具有与 {mcontrol-timing} 相同的计时位。
. {mcontrol6-hit0} 的行为与 {mcontrol-hit} 相同。
. {mcontrol6-hit1} 为只读 0。
. 访问大小大于 64 位时 {mcontrol6-size} 的编码不同。


1（1）：支持本文档批准版本 1.0 中所描述的触发器。
a|*R*
a|预设
|[[tinfo-info]] `((info))`
a|对于 {csr-tdata1} 中枚举的每个可能的 {tdata1-type}，有一个位。位 N 对应类型 N。如果该位置位，则当前选中的触发器支持该类型。

如果当前选中的触发器不存在，则此字段包含 1。
a|*R*
