en = '''
[#norm:wfi_intr_dis]#The WFI instruction can also be executed when interrupts are disabled.#
[#norm:wfi_unaffected_conditions]#The operation of WFI must be unaffected by the global interrupt bits in
`mstatus` (MIE and SIE) and the delegation register `mideleg` (i.e.,
the hart must resume if a locally enabled interrupt becomes pending,
even if it has been delegated to a less-privileged mode), but should
honor the individual interrupt enables (e.g, MTIE) (i.e.,
implementations should avoid resuming the hart if the interrupt is
pending but not locally enabled).# [#norm:wfi_resume_any_priv]#WFI is also required to resume
execution for locally enabled interrupts pending at any privilege level,
regardless of the global interrupt enable at each privilege level.#'''
zh = '''
[#norm:wfi_intr_dis]#WFI 指令也可以在中 interrupt 被禁用时执行。#
[#norm:wfi_unaffected_conditions]#WFI 的操作必须不受 `mstatus` 中的全局中断位（MIE 和 SIE）以及委托寄存器 `mideleg` 的影响（即，如果某个本地使能的中断变为挂起，硬件线程必须恢复执行，即使该中断已被委托给较低特权模式），但应遵循各单独中断使能位（例如 MTIE）（即，如果中 interrupt 挂起但未在本地使能，实现应避免恢复硬件线程）。# [#norm:wfi_resume_any_priv]#WFI 还必须在任何特权级有本地使能的中断挂起时恢复执行，无论每个特权级的全局中断使能如何。#'''
