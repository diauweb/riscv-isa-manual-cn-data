en = '''
[#norm:seed_entropy_unique]#Each returned csr:seed[][15:0] = csr::[entropy] value represents unique randomness
when csr::[opst]=`ES16` (`seed[31:30]` = `10`), even if its numerical value is
the same as that of a previously polled csr::[entropy] value.# The implementation
requirements of csr::[entropy] bits are defined in <<crypto_scalar_es_req>>.
[#norm:seed_entropy_zero_non_es16]#When csr::[opst] is not `ES16`, csr::[entropy] must be set to 0.#
An implementation may safely set reserved and custom bits to zeros.'''
zh = '''
[#norm:seed_entropy_unique]##当 csr::[opst]=`ES16`（`seed[31:30]` = `10`）时，每个返回的 csr:seed[][15:0] = csr::[entropy] 值都代表唯一的随机性，即使其数值与先前轮询到的 csr::[entropy] 值相同。##实现要求
csr::[entropy] 位的要求定义于 <<crypto_scalar_es_req>>。
[#norm:seed_entropy_zero_non_es16]##当 csr::[opst] 不为 `ES16` 时，csr::[entropy] 应置为 0。##
实现可安全地将保留位和自定义位设为零。'''
