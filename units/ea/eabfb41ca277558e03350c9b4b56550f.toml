en = '''
insn:fmv.h.x[] moves the half-precision value encoded in the IEEE 754-2008
encoding from the lower 16 bits of integer register _rs1_ to the
floating-point register _rd_, NaN-boxing the result.'''
zh = '''
insn:fmv.h.x[] 将以 IEEE 754-2008 编码编码的半精度值从整数寄存器 _rs1_ 的低 16 位移动到浮点寄存器 _rd_，并对结果进行 NaN 装箱。'''
