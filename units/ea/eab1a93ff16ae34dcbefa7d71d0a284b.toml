en = '''
[#norm:ssccfg_scountinhibit_exists]#Smcdeleg/Ssccfg defines a new `scountinhibit` register, a masked alias of `mcountinhibit`.# [#norm:ssccfg_scountinhibit_delegated_rw]#For counters delegated to S-mode, the associated `mcountinhibit` bits can be accessed via `scountinhibit`#.[#norm:ssccfg_scountinhibit_nondelegated_ro]#For counters not delegated to S-mode, the associated bits in `scountinhibit` are read-only zero.#'''
zh = '''
[#norm:ssccfg_scountinhibit_exists]#Smcdeleg/Ssccfg 定义一个新寄存器 `scountinhibit`，它是 `mcountinhibit` 的掩码别名。# [#norm:ssccfg_scountinhibit_delegated_rw]#对于委托给 S 模式的计数器，可通过 `scountinhibit` 访问关联的 `mcountinhibit` 位#。[#norm:ssccfg_scountinhibit_nondelegated_ro]#对于未委托给 S 模式的计数器，`scountinhibit` 中的关联位为只读零。#'''
