en = '''
[#norm:zbkx_lookup_table_model]#These instructions implement a "`lookup table`" for 4- and 8-bit elements
inside the general purpose registers.#
_rs1_ is used as a vector of N-bit words, and _rs2_ as a vector of N-bit
indices into _rs1_.
[#norm:zbkx_indexing_behavior]#Elements in _rs1_ are replaced by the indexed element in _rs2_, or zero
if the index into _rs2_ is out of bounds.#'''
zh = '''
[#norm:zbkx_lookup_table_model]##这些指令为通用寄存器内的 4 位和 8 位元素实现一个“查找表”。##
_rs1_ 用作 N 位字的向量，_rs2_ 用作指向 _rs1_ 的 N 位索引的向量。
[#norm:zbkx_indexing_behavior]##_rs1_ 中的元素被 _rs2_ 中索引到的元素替换；如果 _rs2_ 中的索引越界，则替换为零。##'''
