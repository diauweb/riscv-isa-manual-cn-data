en = '''
In spite of the fact that ext:ztso[] adds no new instructions to the ISA, code
written assuming RVTSO will not run correctly on implementations not
supporting ext:ztso[]. Binaries compiled to run only under ext:ztso[] should
indicate as such via a flag in the binary, so that platforms which do
not implement ext:ztso[] can simply refuse to run them.'''
zh = '''
尽管 ext:ztso[] 并未向 ISA 添加任何新指令，但假定 RVTSO 编写的代码在不支持 ext:ztso[] 的实现上无法正确运行。仅针对 ext:ztso[] 编译的二进制文件应通过二进制文件中的标志表明这一点，以便未实现 ext:ztso[] 的平台可以直接拒绝运行它们。'''
