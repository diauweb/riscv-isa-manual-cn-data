en = '''
Further assembler pseudoinstructions are defined to set and clear bits
in the CSR when the old value is not required: insn:csrs[csr,rs1], insn:csrc[csr,rs1],
insn:csrsi[csr,uimm], and insn:csrci[csr,uimm].'''
zh = '''
还定义了其他汇编伪指令，用于在不需要旧值时置位和清除 CSR 中的位：insn:csrs[csr,rs1]、insn:csrc[csr,rs1]、insn:csrsi[csr,uimm] 和 insn:csrci[csr,uimm]。'''
