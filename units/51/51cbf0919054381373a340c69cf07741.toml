en = '''
A insn:fence.i[] instruction orders all explicit memory accesses that precede
the insn:fence.i[] in program order before all instruction fetches that follow
the insn:fence.i[] in program order.'''
zh = '''
insn:fence.i[] 指令将在程序顺序中先于该 insn:fence.i[] 的所有显式内存访问，排在程序顺序中后于该 insn:fence.i[] 的所有指令取指之前。'''
