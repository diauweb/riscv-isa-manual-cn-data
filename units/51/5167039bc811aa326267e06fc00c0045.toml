en = '''
Such use cases involve polling on memory locations, and such busy loops can be a
wasteful expenditure of energy. To mitigate the wasteful looping in such usages,
a insn:wrs.nto[] (WRS-with-no-timeout) instruction is provided. Instead of polling
for a store to a specific memory location, software registers a reservation set
that includes all the bytes of the memory location using the insn:lr[] instruction.
[#norm:Zawrs_wrs-nto_stall_exec]#Then a subsequent insn:wrs.nto[] instruction would cause the hart to temporarily
stall execution in a low-power state until a store occurs to the reservation set
or an interrupt is observed.#'''
zh = '''
此类用例涉及对内存位置的轮询，而这种忙循环可能造成能源的浪费性消耗。为缓解此类用法中的浪费性循环，提供了 insn:wrs.nto[]（WRS-with-no-timeout，无超时 WRS）指令。软件不再轮询对特定内存位置的存储，而是使用 insn:lr[] 指令注册一个预留集，该预留集包含该内存位置的所有字节。[#norm:Zawrs_wrs-nto_stall_exec]#随后执行 insn:wrs.nto[] 指令会使硬件线程以低功耗状态暂时停顿执行，直到对该预留集发生存储或观察到中断为止。#'''
