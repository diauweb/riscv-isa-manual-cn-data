en = '''
Floating-point arithmetic instructions with one or two source operands
use the R-type format with the OP-FP major opcode. [#norm:fadd-s_fmul-s_op]#FADD.S and FMUL.S
perform single-precision floating-point addition and multiplication
respectively, between _rs1_ and _rs2_#. [#norm:fsub-s_op]#FSUB.S performs the
single-precision floating-point subtraction of _rs2_ from _rs1_#. [#norm:fdiv-s_op]#FDIV.S performs the single-precision floating-point division of _rs1_ by _rs2_#. [#norm:fsqrt-s_op]#FSQRT.S computes the square root of _rs1_#. [#norm:fp_rd]#In each case, the result is written to _rd_.#'''
zh = '''
具有一个或两个源操作数的浮点算术指令使用带 OP-FP 主操作码的 R 型格式。[#norm:fadd-s_fmul-s_op]##FADD.S 和 FMUL.S 分别对 _rs1_ 与 _rs2_ 执行单精度浮点加法和乘法。## [#norm:fsub-s_op]##FSUB.S 执行从 _rs1_ 中减去 _rs2_ 的单精度浮点减法。## [#norm:fdiv-s_op]##FDIV.S 执行 _rs1_ 除以 _rs2_ 的单精度浮点除法。## [#norm:fsqrt-s_op]##FSQRT.S 计算 _rs1_ 的平方根。## [#norm:fp_rd]##在每种情况下，结果写入 _rd_。##'''
