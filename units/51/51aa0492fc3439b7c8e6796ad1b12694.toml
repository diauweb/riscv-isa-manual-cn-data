en = '''
{dm-data0} etc. are mapped into regular memory at an address relative to `zero` with only
a 12-bit `imm`. The exact address is an implementation detail that a
debugger must not rely on. For example, the `data` registers might be
mapped to `0x400`.'''
zh = '''
{dm-data0} 等被映射到常规内存中相对于 `zero` 的地址处，且仅使用 12 位的 `imm`。确切地址属于实现细节，调试器不得依赖它。例如，`data` 寄存器可能被映射到 `0x400`。'''
