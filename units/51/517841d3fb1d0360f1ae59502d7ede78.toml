en = '''
[#norm:bitmanip_w_suffix_semantics]#The bitmanip extension follows the convention in RV64 that insn:*w[]-suffixed instructions (without a dot before the insn:w[]) ignore the upper 32 bits of their inputs, operate on the least-significant 32 bits as signed values, and produce a 32-bit signed result that is sign-extended to XLEN.#'''
zh = '''
[#norm:bitmanip_w_suffix_semantics]#bitmanip 扩展遵循 RV64 中的约定：带 insn:*w[] 后缀的指令（insn:w[] 前没有点）忽略其输入的高 32 位，将最低有效 32 位作为有符号值操作，并产生一个符号扩展至 XLEN 的 32 位有符号结果。#'''
