en = '''
As is defined in IEEE 754-2008, under default exception handling, underflow is
only signalled when the result is tiny and inexact. In such a case, both the
underflow and inexact flags are raised.'''
zh = '''
正如 IEEE 754-2008 所定义，在默认异常处理下，仅当结果极小且不精确时才会发出下溢信号。在这种情况下，下溢和不精确标志都会被置位。'''
