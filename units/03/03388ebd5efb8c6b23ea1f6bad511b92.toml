en = '''
(((exceptions))) (((traps))) (((interrupts)))
[#norm:exception_def]#We use the term _exception_ to refer to an unusual condition occurring
at run time associated with an instruction in the current RISC-V hart.#
[#norm:interrupt_def]#We use the term _interrupt_ to refer to an external asynchronous event
that may cause a RISC-V hart to experience an unexpected transfer of
control.# [#norm:trap_def]#We use the term _trap_ to refer to the transfer of control to a
trap handler caused by either an exception or an interrupt.#'''
zh = '''
(((exceptions))) (((traps))) (((interrupts)))
[#norm:exception_def]##我们用术语__异常__指代在当前 RISC-V hart 中与某条指令相关联、在运行时发生的不寻常状况。##
[#norm:interrupt_def]##我们用术语__中断__指代外部异步事件，它可能导致 RISC-V hart 经历意外的控制转移。## [#norm:trap_def]##我们用术语__陷阱__指代由异常或中断引起的、向陷阱处理程序的控制转移。##'''
