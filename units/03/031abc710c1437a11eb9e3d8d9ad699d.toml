en = '''
The value in csr::[vsew] sets the dynamic _selected element width_
(SEW).  By default, a vector register is viewed as being divided into
VLEN/SEW elements.'''
zh = '''
csr::[vsew] 中的值设置动态 _所选元素宽度_（SEW）。默认情况下，向量寄存器被视为划分为 VLEN/SEW 个元素。'''
