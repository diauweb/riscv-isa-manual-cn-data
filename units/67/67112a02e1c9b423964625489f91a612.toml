en = '''
The underflow exception defined in IEEE 754-2008 requires that a result be
inexact and tiny, where tininess can be detected before or after rounding. In
RISC-V, tininess is detected after rounding.'''
zh = '''
IEEE 754-2008 中定义的下溢异常要求结果不精确且极小，其中极小性可以在舍入前或舍入后检测。在 RISC-V 中，极小性在舍入后检测。'''
