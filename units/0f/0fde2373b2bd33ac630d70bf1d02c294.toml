en = '''
[#norm:jvt_mode_acc]#_jvt.mode_ is a *WARL* field, so can only be programmed to modes which are implemented.# Therefore the discovery mechanism is to
attempt to program different modes and read back the values to see which are available. Jump table mode _must_ be implemented.'''
