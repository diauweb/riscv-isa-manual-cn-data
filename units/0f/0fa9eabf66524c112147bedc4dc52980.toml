en = '''
Bitwise rotation instructions are similar to the shift-logical operations from the base spec. However, [#norm:Zbb_rotate_semantics]#where the shift-logical
instructions shift in zeros, the rotate instructions shift in the bits that were shifted out of the other side of the value.#
Such operations are also referred to as "`circular shifts`".'''
zh = '''
按位循环移位指令类似于基础规范中的移位逻辑操作。然而，[#norm:Zbb_rotate_semantics]##移位逻辑
指令移入零，而循环移位指令移入从值的另一侧移出的位。##
此类操作也称为“循环移位”。'''
