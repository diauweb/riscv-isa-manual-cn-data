en = '''
* The previous version of this document was released under a Creative
Commons Attribution 4.0 International License by the original authors,
and this and future versions of this document will be released under the
same license.
* Rearranged chapters to put all extensions first in canonical order.
* Improvements to the description and commentary.
* Modified implicit hinting suggestion on insn:jalr[] to support more efficient
macro-op fusion of insn:lui[]/insn:jalr[] and insn:auipc[]/insn:jalr[] pairs.
* Clarification of constraints on load-reserved/store-conditional
sequences.
* A new table of control and status register (CSR) mappings.
* Clarified purpose and behavior of high-order bits of csr:fcsr[].
* Corrected the description of the insn:fnmadd[] and insn:fnmsub[]
instructions, which had suggested the incorrect sign of a zero result.
* Instructions insn:fmv.s.x[] and insn:fmv.x.s[] were renamed to insn:fmv.w.x[] and insn:fmv.x.w[]
respectively to be more consistent with their semantics, which did not
change. The old names will continue to be supported in the tools.
* Specified behavior of narrower (<FLEN) floating-point
values held in wider `f` registers using NaN-boxing model.
* Defined the exception behavior of FMA({inf}, 0, qNaN).
* Added note indicating that the ext:p[] extension might be reworked into an
integer packed-SIMD proposal for fixed-point operations using the
integer registers.
* A draft proposal of the ext:v[] vector instruction-set extension.
* An early draft proposal of the ext:n[] user-level traps extension.
* An expanded pseudoinstruction listing.
* Removal of the calling convention chapter, which has been superseded
by the RISC-V ELF psABI Specification cite:[riscv-elf-psabi].
* The ext:c[] extension has been frozen and renumbered version 2.0.'''
zh = '''
* 本文档的上一版本由原作者根据 Creative Commons Attribution 4.0 International License 发布，本文档的当前版本和未来版本将根据同一许可证发布。
* 重新排列各章，将所有扩展按规范顺序放在前面。
* 对描述和评注的改进。
* 修改了 insn:jalr[] 上的隐式提示建议，以支持更高效的 insn:lui[]/insn:jalr[] 与 insn:auipc[]/insn:jalr[] 指令对的宏操作融合。
* 澄清了对加载保留/条件存储序列的约束。
* 新增控制与状态寄存器（CSR）映射表。
* 澄清了 csr:fcsr[] 高位的作用和行为。
* 更正了 insn:fnmadd[] 和 insn:fnmsub[] 指令的描述，原描述暗示了错误的零结果符号。
* 指令 insn:fmv.s.x[] 和 insn:fmv.x.s[] 分别重命名为 insn:fmv.w.x[] 和 insn:fmv.x.w[]，以更符合其语义，语义本身未改变。工具将继续支持旧名称。
* 规定了使用 NaN 装箱模型在更宽 `f` 寄存器中保存较窄（<FLEN）浮点值的行为。
* 定义了 FMA({inf}, 0, qNaN) 的异常行为。
* 增加注释，指出 ext:p[] 扩展可能被改写为使用整数寄存器的定点操作整数打包 SIMD 提案。
* ext:v[] 向量指令集扩展的草案提案。
* ext:n[] 用户级陷阱扩展的早期草案提案。
* 扩展了伪指令列表。
* 移除了调用约定章节，该章节已由 RISC-V ELF psABI 规范 cite:[riscv-elf-psabi] 取代。
* ext:c[] 扩展已冻结并重新编号为版本 2.0。'''
