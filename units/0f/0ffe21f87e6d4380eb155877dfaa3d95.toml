en = '''
[#norm:jvt_en]#If the Smstateen extension is implemented, then bit 2 in _mstateen0_, _sstateen0_, and _hstateen0_ is implemented.  If bit 2 of a controlling _stateen0_ CSR is zero, then access to the _jvt_ CSR and execution of a _cm.jalt_ or _cm.jt_ instruction by a lower privilege level results in an illegal-instruction trap (or, if appropriate, a virtual-instruction trap).#'''
zh = '''
[#norm:jvt_en]##若实现了 Smstateen 扩展，则实现 _mstateen0_、_sstateen0_ 和 _hstateen0_ 中的位 2。若控制 _stateen0_ CSR 的位 2 为零，则较低特权级对 _jvt_ CSR 的访问以及执行 _cm.jalt_ 或 _cm.jt_ 指令会导致非法指令陷阱（或在适当时导致虚拟指令陷阱）。##'''
