en = '''
For writing unframed data to memory, alternative synchronisation mechanisms may also be employed.   For example, by dividing memory into blocks of known size, and requiring that packets do not straddle block boundaries.  The first byte of every block will therefore be the start of a packet.  Details of such schemes are out of scope of this chapter.'''
zh = '''
对于将无帧数据写入存储器，也可采用其他同步机制。例如，将存储器划分为已知大小的块，并要求数据包不跨越块边界。因此，每个块的第一个字节将是数据包的起始。此类方案的细节不在本章范围内。'''
