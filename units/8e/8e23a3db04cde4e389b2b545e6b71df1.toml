en = '''
[#norm:c-li_op]#C.LI loads the sign-extended 6-bit immediate, _imm_, into register _rd_.
C.LI expands into `addi rd, x0, imm`.#
[#norm:c-li_hint]#The C.LI code points with _rd_=`x0` are HINTs.#'''
zh = '''
[#norm:c-li_op]##C.LI 将符号扩展的 6 位立即数 _imm_ 加载到寄存器 _rd_。C.LI 展开为 `addi rd, x0, imm`。##
[#norm:c-li_hint]##_rd_=`x0` 的 C.LI 编码点为 HINT。##'''
