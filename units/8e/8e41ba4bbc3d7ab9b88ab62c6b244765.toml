en = '''
.Software Hint
[NOTE, caption="SH" ]
===============================================================
This operation is known as population count, popcount, sideways sum, bit summation, or Hamming weight.

The GCC builtin function `+__builtin_popcount (unsigned int x)+` is implemented by insn:cpop[] on RV32 and by insn:cpopw[] on RV64.
The GCC builtin function `+__builtin_popcountl (unsigned long x)+` for LP64 is implemented by insn:cpop[] on RV64.
==============================================================='''
zh = '''
.软件提示
