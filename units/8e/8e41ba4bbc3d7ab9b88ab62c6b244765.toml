===============================================================
此操作称为 population count、popcount、sideways sum、bit summation 或 Hamming weight。

GCC 内建函数 `+__builtin_popcount (unsigned int x)+` 在 RV32 上由 insn:cpop[] 实现，在 RV64 上由 insn:cpopw[] 实现。
对于 LP64，GCC 内建函数 `+__builtin_popcountl (unsigned long x)+` 在 RV64 上由 insn:cpop[] 实现。
==============================================================='''
