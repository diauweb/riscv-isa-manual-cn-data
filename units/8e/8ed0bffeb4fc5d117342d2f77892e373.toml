en = '''
[#norm:hstatus_spvp_op]#When V=1 and a trap is taken into HS-mode, bit SPVP (Supervisor Previous
Virtual Privilege) is set to the nominal privilege mode at the time of
the trap, the same as `sstatus`.SPP. But if V=0 before a trap, SPVP is
left unchanged on trap entry.# [#norm:hstatus_spvp_virtls_op]#SPVP controls the effective privilege of
explicit memory accesses made by the virtual-machine load/store
instructions, HLV, HLVX, and HSV.#'''
zh = '''
[#norm:hstatus_spvp_op]#当 V=1 且陷阱进入 HS-mode 时，位 SPVP（监管前一虚拟特权）被设置为陷阱时的名义特权模式，与 `sstatus`.SPP 相同。但如果在陷阱之前 V=0，则 SPVP 在陷阱进入时保持不变。# [#norm:hstatus_spvp_virtls_op]#SPVP 控制虚拟机加载/存储指令 HLV、HLVX 和 HSV 所做显式内存访问的有效特权。#'''
