en = '''
[#norm:hip_vstip_vstie_acc_op]#Bits csr:hip[vstip] and csr:hie[vstie] are the interrupt-pending and interrupt-enable
bits for VS-level timer interrupts.# [#norm:hip_vstip_acc]#csr::[vstip] is read-only in csr:hip[], and is the
logical-OR of csr:hvip[vstip] and, when the ext:sstc[] extension is implemented, the
timer interrupt signal resulting from csr:vstimecmp[].# [#norm:hip_vstip_vstimecmp_op]#The csr:hip[vstip] bit, in
response to timer interrupts generated by csr:vstimecmp[], is set by writing
csr:vstimecmp[] with a value that is less than or equal to the sum of csr:time[] and
csr:htimedelta[], truncated to qty:64[bits]; it is cleared by writing csr:vstimecmp[] with a
greater value.# [#norm:hip_vstip_defined_v0]#The csr:hip[vstip] bit remains defined while V=0 as well as V=1.#'''
zh = '''
[#norm:hip_vstip_vstie_acc_op]##csr:hip[vstip] 和 csr:hie[vstie] 位分别是 VS 级定时器中断的中断挂起位和中断使能位。## [#norm:hip_vstip_acc]##csr::[vstip] 在 csr:hip[] 中为只读，且为 csr:hvip[vstip] 以及（当实现了 ext:sstc[] 扩展时）由 csr:vstimecmp[] 产生的定时器中断信号的逻辑或。## [#norm:hip_vstip_vstimecmp_op]##为响应由 csr:vstimecmp[] 产生的定时器中断，通过向 csr:vstimecmp[] 写入小于或等于 csr:time[] 与 csr:htimedelta[] 之和（截断至 qty:64[bits]）的值来置位 csr:hip[vstip] 位；通过向 csr:vstimecmp[] 写入更大的值将其清零。## [#norm:hip_vstip_defined_v0]##无论 V=0 还是 V=1，csr:hip[vstip] 位始终保持已定义。##'''
