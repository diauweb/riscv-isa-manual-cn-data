en = '''
MBE controls whether non-instruction-fetch memory accesses made from
M-mode (assuming `mstatus`.MPRV=0) are little-endian (MBE=0) or
big-endian (MBE=1).'''
zh = '''
MBE 控制从 M 模式发起的非取指内存访问（假设 `mstatus`.MPRV=0）是小端序（MBE=0）还是大端序（MBE=1）。'''
