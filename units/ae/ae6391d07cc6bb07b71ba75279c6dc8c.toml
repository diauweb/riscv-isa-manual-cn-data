en = '''
RV32/RV64 provides two types of control transfer instructions - unconditional
jumps and conditional branches. Conditional branches encode an offset in the
immediate field of the instruction and are thus direct branches that are not
susceptible to control-flow subversion. Unconditional direct jumps using insn:jal[]
transfer control to a target that is in a {pm}qty:1[MiB] range from the current `pc`.
Unconditional indirect jumps using the insn:jalr[] obtain their branch target by
adding the sign extended 12-bit immediate encoded in the instruction to the
`rs1` register.'''
zh = '''
RV32/RV64 提供两种类型的控制转移指令——无条件跳转和条件分支。条件分支在指令的立即数字段中编码偏移量，因此是不易受控制流颠覆的直接分支。使用 insn:jal[] 的无条件直接跳转将控制转移到距当前 `pc` {pm}qty:1[MiB] 范围内的目标。使用 insn:jalr[] 的无条件间接跳转通过将指令中编码的符号扩展 12 位立即数加到 `rs1` 寄存器上来获得其分支目标。'''
