en = '''
[#norm:c-and_op]#`C.AND` computes the bitwise `AND` of the values in registers
_rd′_ and _rs2′_, then writes the result
to register _rd′_. `C.AND` expands into
`and rd′, rd′, rs2′`.#'''
zh = '''
[#norm:c-and_op]##`C.AND` 计算寄存器 _rd′_ 和 _rs2′_ 中的值的按位 `AND`，然后将结果写入寄存器 _rd′_。`C.AND` 展开为 `and rd′, rd′, rs2′`。##'''
