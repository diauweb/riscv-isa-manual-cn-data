en = '''
[#norm:mseccfg_pmm_presence_op]#If the Smmpm extension is implemented,
the `PMM` field enables or disables pointer masking (see <<Zpm>>) for M-mode
according to the values in <<norm:mseccfg_pmm_enc>>.#
[#norm:mseccfg_pmm_rdonly0]#If Smmpm is not implemented, `PMM` is read-only zero.
The `PMM` field is read-only zero for RV32.#'''
zh = '''
[#norm:mseccfg_pmm_presence_op]#若实现了 Smmpm 扩展，`PMM` 字段根据 <<norm:mseccfg_pmm_enc>> 中的值，为 M 模式启用或禁用指针掩码（见 <<Zpm>>）。# [#norm:mseccfg_pmm_rdonly0]#若未实现 Smmpm，则 `PMM` 为只读零。对于 RV32，`PMM` 字段为只读零。#'''
