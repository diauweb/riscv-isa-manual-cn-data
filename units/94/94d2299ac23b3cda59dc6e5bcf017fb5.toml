en = '''
[#norm:mvendorid_sz_acc_op]#The csr:mvendorid[] CSR is a 32-bit read-only register providing the JEDEC
manufacturer ID of the provider of the core.#
[#norm:mvendorid_always_rd]#This register must be readable in any implementation, but a value of 0 can be returned to
indicate the field is not implemented or that this is a non-commercial implementation.#'''
zh = '''
[#norm:mvendorid_sz_acc_op]##csr:mvendorid[] CSR 是一个 32 位只读寄存器，提供核心提供方的 JEDEC 制造商 ID。##[#norm:mvendorid_always_rd]##该寄存器在任何实现中都应可读，但可返回 0 值以指示该字段未实现，或指示这是一个非商业实现。##'''
