en = '''
[#norm:c-swsp_op]#C.SWSP stores a 32-bit value in register _rs2_ to memory. It computes an
effective address by adding the _zero_-extended offset, scaled by 4, to
the stack pointer, `x2`. It expands to `sw rs2, offset(x2)`.#'''
zh = '''
[#norm:c-swsp_op]##C.SWSP 将寄存器 _rs2_ 中的 32 位值存储到内存。它通过将按 4 缩放的__零__扩展偏移加到栈指针 `x2` 上来计算有效地址。它展开为 `sw rs2, offset(x2)`。##'''
