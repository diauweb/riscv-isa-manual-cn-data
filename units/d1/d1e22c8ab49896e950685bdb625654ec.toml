en = '''
[#norm:vmfeq_vmfne_vmflt_vmfle_vmfgt_vmfge_op]#These vector FP compare instructions compare two source operands and
write the comparison result to a mask register.#  [#norm:vmfeq_vmfne_vmflt_vmfle_vmfgt_vmfge_vd_single_vreg]#The destination mask
vector is always held in a single vector register, with a layout of
elements as described in <<sec-mask-register-layout>>.#  [#norm:vmfeq_vmfne_vmflt_vmfle_vmfgt_vmfge_vd_eq_v0]#The
destination mask vector register may be the same as the source vector
mask register (`v0`).#  [#norm:vmfeq_vmfne_vmflt_vmfle_vmfgt_vmfge_tail_agnostic]#Compares write mask registers, and so always
operate under a tail-agnostic policy.#'''
zh = '''
[#norm:vmfeq_vmfne_vmflt_vmfle_vmfgt_vmfge_op]#这些向量 FP 比较指令比较两个源操作数并将比较结果写入掩码寄存器。#  [#norm:vmfeq_vmfne_vmflt_vmfle_vmfgt_vmfge_vd_single_vreg]#目标掩码向量始终保存在单个向量寄存器中，元素布局如 <<sec-mask-register-layout>> 所述。#  [#norm:vmfeq_vmfne_vmflt_vmfle_vmfgt_vmfge_vd_eq_v0]#目标掩码向量寄存器可以与源向量掩码寄存器（`v0`）相同。#  [#norm:vmfeq_vmfne_vmflt_vmfle_vmfgt_vmfge_tail_agnostic]#比较指令写入掩码寄存器，因此始终以尾部不可知策略操作。#'''
