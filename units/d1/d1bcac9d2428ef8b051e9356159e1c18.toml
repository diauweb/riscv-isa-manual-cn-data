en = '''
Support for guest external interrupts requires an interrupt controller
that can collect virtual-machine-directed interrupts separately from
other interrupts.'''
zh = '''
对客户机外部中断的支持需要中断控制器能够将导向虚拟机的中断与其他中断分开收集。'''
