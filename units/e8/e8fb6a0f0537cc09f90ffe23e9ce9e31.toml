kind = "paragraph"
translatable = true
status = "machine"
en = '''
Address and data trigger implementation is heavily dependent on how
the processor core is implemented. To accommodate various
implementations, execute, load, and store address/data triggers may fire at
whatever point in time is most convenient for the implementation.
The debugger may request specific timings as described in {mcontrol-timing}.
<<tab:hwbp_timing>> suggests timings for the best user experience.'''
zh = '''
地址和数据触发器的实现严重依赖处理器核心如何实现。为了适应各种实现，执行、加载和存储地址/数据触发器可以在对实现最方便的任何时间点触发。调试器可以请求特定时序，如 {mcontrol-timing} 所述。<<tab:hwbp_timing>> 建议了获得最佳用户体验的时序。'''
