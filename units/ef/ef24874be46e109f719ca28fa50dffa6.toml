en = '''
* _Calls_:
** *_jal_* x1;
** *_jal_* x5;
** *_jalr_* x1, rs where rs != x5;
** *_jalr_* x5, rs where rs != x1;
** *_c.jalr_* rs1 where rs1 != x5;
** *_c.jal_*.
* _Jumps_:
** *_jal_* x0;
** *_c.j_*;
** *_jalr_* x0, rs where rs != x1 and rs != x5;
** *_c.jr_* rs1 where rs1 != x1 and rs1 != x5.
* _Returns_:
** *_jalr_* rd, rs where (rs == x1 or rs == x5) and rd != x1 and rd !=
x5;
** *_c.jr_* rs1 where rs1 == x1 or rs1 == x5.
* _Co-routine swap_:
** *_jalr_* x1, x5;
** *_jalr_* x5, x1;
** *_c.jalr_* x5.
* _Other_:
** *_jal_* rd where rd != x0 and rd != x1 and rd != x5;
** *_jalr_* rd, rs where rs != x1 and rs != x5 and rd != x0 and rd != x1
and rd != x5.'''
zh = '''
* _调用_：
** *_jal_* x1；
** *_jal_* x5；
** *_jalr_* x1, rs，其中 rs != x5；
** *_jalr_* x5, rs，其中 rs != x1；
** *_c.jalr_* rs1，其中 rs1 != x5；
** *_c.jal_*。
* _跳转_：
** *_jal_* x0；
** *_c.j_*；
** *_jalr_* x0, rs，其中 rs != x1 且 rs != x5；
** *_c.jr_* rs1，其中 rs1 != x1 且 rs1 != x5。
* _返回_：
** *_jalr_* rd, rs，其中 (rs == x1 或 rs == x5) 且 rd != x1 且 rd != x5；
** *_c.jr_* rs1，其中 rs1 == x1 或 rs1 == x5。
* _协程交换_：
** *_jalr_* x1, x5；
** *_jalr_* x5, x1；
** *_c.jalr_* x5。
* _其他_：
** *_jal_* rd，其中 rd != x0 且 rd != x1 且 rd != x5；
** *_jalr_* rd, rs，其中 rs != x1 且 rs != x5 且 rd != x0 且 rd != x1 且 rd != x5。'''
