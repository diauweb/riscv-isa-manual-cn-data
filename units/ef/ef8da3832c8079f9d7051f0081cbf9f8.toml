en = '''
[#norm:mstatus_sbe_implicit]#For _implicit_ accesses to supervisor-level memory management data
structures, such as page tables, endianness is always controlled by SBE.#
[#norm:mstatus_sbe_change_fence]#Since changing SBE alters the implementation’s interpretation of these
data structures, if any such data structures remain in use across a
change to SBE, M-mode software must follow such a change to SBE by
executing an SFENCE.VMA instruction with _rs1_=`x0` and _rs2_=`x0`.#'''
zh = '''
[#norm:mstatus_sbe_implicit]#对于对监管级内存管理数据结构（例如页表）的__隐式__访问，字节序始终由 SBE 控制。# [#norm:mstatus_sbe_change_fence]#由于改变 SBE 会改变实现对这些数据结构的解释，若在 SBE 改变期间仍在使用任何此类数据结构，则 M 模式软件必须在改变 SBE 之后，通过执行一条 _rs1_=`x0` 且 _rs2_=`x0` 的 SFENCE.VMA 指令来跟进。#'''
