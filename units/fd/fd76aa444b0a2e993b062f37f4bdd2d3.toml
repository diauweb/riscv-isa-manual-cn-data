en = '''
<<tab:priority>> lists the synchronous exceptions from
<<vol:priv,Volume II>>, and where the various types of triggers fit in.
The first 3 columns come from <<vol:priv,Volume II>>, and the final
column shows where triggers fit in. Priorities in the table are
separated by horizontal lines, so e.g. etrigger and itrigger have the
same priority. If this table contradicts the table in
<<vol:priv,Volume II>>, then the latter takes precedence.'''
zh = '''
<<tab:priority>> 列出 <<vol:priv,第 II 卷>> 中的同步异常，以及各类型触发器在其中的位置。前 3 列来自 <<vol:priv,第 II 卷>>，最后一列显示触发器在其中的位置。表中优先级以水平线分隔，因此例如 etrigger 和 itrigger 具有相同优先级。若此表与 <<vol:priv,第 II 卷>> 中的表相矛盾，则后者优先。'''
