en = '''
[#norm:Zbb_orc-b_semantics]#insn:orc.b[] sets the bits of each byte in the result _rd_ to all zeros if no bit within the respective byte of _rs_ is set, or to all ones if any bit within the respective byte of _rs_ is set.#'''
zh = '''
[#norm:Zbb_orc-b_semantics]##若 _rs_ 的相应字节内没有任何位被置位，则 insn:orc.b[] 将结果 _rd_ 中每个字节的各位全部置零；若 _rs_ 的相应字节内有任一位被置位，则全部置一。##'''
