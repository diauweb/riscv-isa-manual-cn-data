en = '''
[#norm:ctr_ccounter_inc]#The elapsed cycle counter (CtrCycleCounter) increments at the same rate as the `mcycle` counter.  Only cycles while CTR is active are counted, where active implies that the current privilege mode is enabled for recording and CTR is not frozen.  If the CtrCycleCounter value is less than 4096, the CC field is encoded with CCE holding 0 and CCM holding CtrCycleCounter bits 11:0.  Otherwise, CCE holds the index of the most significant one bit in the CtrCycleCounter value, minus 11, and CCM holds CtrCycleCounter bits CCE+10:CCE-1.#'''
zh = '''
[#norm:ctr_ccounter_inc]##已用周期计数器（CtrCycleCounter）以与 `mcycle` 计数器相同的速率递增。仅对 CTR 活动期间的周期计数，其中活动意味着当前特权模式使能记录且 CTR 未冻结。若 CtrCycleCounter 值小于 4096，则 CC 字段编码为 CCE 为 0、CCM 保存 CtrCycleCounter 的位 11:0。否则，CCE 保存 CtrCycleCounter 值中最高有效 1 位的索引减 11，CCM 保存 CtrCycleCounter 的位 CCE+10:CCE-1。##'''
