en = '''
[#norm:c-sw_op]#C.SW stores a 32-bit value in register `_rs2′_` to memory.
It computes an effective address by adding the _zero_-extended offset,
scaled by 4, to the base address in register `_rs1′_`. It
expands to `sw rs2′, offset(rs1′)`.#'''
zh = '''
[#norm:c-sw_op]##C.SW 将寄存器 `_rs2′_` 中的 32 位值存储到内存。它通过将按 4 缩放的__零__扩展偏移加到寄存器 `_rs1′_` 中的基址上来计算有效地址。它展开为 `sw rs2′, offset(rs1′)`。##'''
