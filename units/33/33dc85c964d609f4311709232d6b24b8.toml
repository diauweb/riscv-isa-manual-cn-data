en = '''
[#norm:m_mode_mandatory]#All hardware implementations must provide M-mode#, as this is the only
mode that has unfettered access to the whole machine. The simplest
RISC-V implementations may provide only M-mode, though this will provide
no protection against incorrect or malicious application code.'''
zh = '''
[#norm:m_mode_mandatory]#所有硬件实现都必须提供 M 模式#，因为这是唯一能够不受限制地访问整台机器的模式。最简单的 RISC-V 实现可以只提供 M 模式，不过这将无法针对不正确或恶意应用代码提供任何保护。'''
