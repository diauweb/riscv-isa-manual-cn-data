any of the following conditions are true:'''
zh = '''
[#norm:zicflip_lpad_enabled_instr_allowed]#当 ext:zicfilp[] 启用时，当 csr::[elp] 状态为 `LP_EXPECTED` 时，insn:lpad[] 是唯一允许执行的指令。如果 ext:zicfilp[] 未启用，则该指令为空操作。# [#norm:zicflip_lpad_enabled_exception]#如果 ext:zicfilp[] 启用，则在以下任一条件为真时，insn:lpad[] 指令会引发软件检查异常，将 `__x__tval` 设置为“landing pad fault (code=2)”：#'''
