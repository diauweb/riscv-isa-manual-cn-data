en = '''
Standard extensions to the RISC-V ISA are given other reserved letters: ext:q[]
for quad-precision floating-point, ext:c[] for the 16-bit compressed instruction
format, and such.'''
zh = '''
RISC-V 指令集架构的标准扩展还分配了其他保留字母：ext:q[] 表示四精度浮点，ext:c[] 表示 16 位压缩指令格式，等等。'''
