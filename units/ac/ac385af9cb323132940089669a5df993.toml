en = '''
To address the threat model outlined in Section <<smepmp_threat>>, this
extension introduces the `RLB`, `MMWP`, and `MML` fields in the `mseccfg` CSR
and their associated rules. See <<mseccfg>> for the detailed specification of
these fields and the corresponding rules.'''
zh = '''
为应对第 <<smepmp_threat>> 节概述的威胁模型，本扩展在 `mseccfg` CSR 中引入 `RLB`、`MMWP` 和 `MML` 字段及其关联规则。有关这些字段及对应规则的详细规范，见 <<mseccfg>>。'''
