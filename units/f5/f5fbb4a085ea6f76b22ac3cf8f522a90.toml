ext:zicfilp[] 扩展的非特权 ISA 在 <<ext:zicfilp>> 中规定，ext:zicfiss[] 扩展的非特权 ISA 在
<<ext:zicfiss>> 中规定。ext:zicfilp[] 扩展的特权 ISA 在
<<priv-forward>> 中规定，ext:zicfiss[] 扩展的特权 ISA 在
<<priv-backward>> 中规定。'''
