地址传输符合 IEEE-5001 Nexus 标准（跳过最高有效 0），并带有可选扩展，允许跳过相同的高有效位。有关说明，请参见下面的 <<Virtual Addresses Optimization, Virtual Addresses Optimization>> 章节。'''
