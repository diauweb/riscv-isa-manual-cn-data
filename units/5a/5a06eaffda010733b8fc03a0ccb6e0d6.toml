en = '''
If S-mode is implemented, the set of legal values that the UXL field may
assume excludes those that would cause UXLEN to be greater than SXLEN.'''
zh = '''
若实现了 S 模式，则 UXL 字段可以采用的合法值集合不包含会导致 UXLEN 大于 SXLEN 的值。'''
