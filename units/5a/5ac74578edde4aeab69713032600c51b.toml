en = '''
If multiple ext:z[] extensions are named, they should be ordered first by
category, then alphabetically within a category -- for example,
Zicsr_Zifencei_Ztso.'''
zh = '''
如果命名了多个 ext:z[] 扩展，它们应首先按类别排序，
然后在类别内按字母顺序排序——例如，
Zicsr_Zifencei_Ztso。'''
