en = '''
[#norm:H_trap_xtinst_std_trans_mem]#As enumerated in the table, a synchronous exception may write to the
trap instruction register a standard transformation of the trapping
instruction only for exceptions that arise from explicit memory accesses
(from load, store, AMO, cache-block management, and
cache-block zero instructions).# Accordingly, standard
transformations are currently defined only for these memory-access
instructions. [#norm:H_trap_xtinst_no_trans_zero]#If a synchronous trap occurs for a standard instruction
for which no transformation has been defined, the trap instruction
register shall be written with zero (or, under certain circumstances,
with a special pseudoinstruction value).#'''
zh = '''
[#norm:H_trap_xtinst_std_trans_mem]#如表中所列举，同步异常仅对于由显式内存访问（来自加载、存储、AMO、缓存块管理和缓存块清零指令）产生的异常，才可能将导致陷阱指令的标准变换写入陷阱指令寄存器。# 因此，目前仅为这些内存访问指令定义了标准变换。[#norm:H_trap_xtinst_no_trans_zero]#如果对于未定义变换的标准指令发生同步陷阱，则陷阱指令寄存器应写入零（或在某些情况下写入特殊伪指令值）。#'''
