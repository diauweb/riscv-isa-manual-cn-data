[#norm:menvcfg_cbie_rdonly0]##当未实现 Zicbom 扩展时，`CBIE` 为只读零。##
编码 `0b10` 为保留。
[#norm:menvcfg_cbie_cbo-inval_op_lead-in]##当 `CBIE` 设置为 `0b01` 或 `0b11`，且在低于 M 的模式下使能执行时，其行为如下：##'''
