en = '''
[#norm:vgmul-vv_op_coeff]#The NIST specification (see extlink:zvkg[]) orders the coefficients from left to right x~0~x~1~x~2~...x~127~
for a polynomial x~0~ + x~1~u +x~2~ u^2^ + ... + x~127~u^127^. This can be viewed as a collection of
byte elements in memory with the byte containing the lowest coefficients (i.e., 0,1,2,3,4,5,6,7)
residing at the lowest memory address. Since the bits in the bytes are reversed,
This instruction internally performs bit swaps within bytes to put the bits in the standard ordering
(e.g., 7,6,5,4,3,2,1,0).#'''
zh = '''
[#norm:vgmul-vv_op_coeff]#NIST 规范（见 extlink:zvkg[]）将多项式 x~0~ + x~1~u +x~2~ u^2^ + ... + x~127~u^127^ 的系数
从左到右排列为 x~0~x~1~x~2~...x~127~。
这可以看作内存中的一组字节元素，其中包含最低系数（即 0,1,2,3,4,5,6,7）的字节
位于最低内存地址。由于字节中的位是反转的，
该指令在内部执行字节内的位交换，以将位置于标准顺序
（例如 7,6,5,4,3,2,1,0）。#'''
