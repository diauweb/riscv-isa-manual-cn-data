en = '''
(((floating-point, exception flag)))
[#norm:fcsr_fflags_op]#The accrued exception flags indicate the exception conditions that have
arisen on any floating-point arithmetic instruction since the field was
last reset by software, as shown in <<norm:fflags_enc>>#. The base
RISC-V ISA does not support generating a trap on the setting of a
floating-point exception flag.'''
zh = '''
(((浮点, 异常标志)))
[#norm:fcsr_fflags_op]##累积异常标志指示自该字段上次由软件复位以来，在任何浮点算术指令上出现的异常条件，如 <<norm:fflags_enc>> 所示。## 基本 RISC-V ISA 不支持在设置浮点异常标志时生成陷阱。'''
