en = '''
A bit in `mie` must be writable if the corresponding interrupt can ever
become pending. Bits of `mie` that are not writable must be read-only
zero.'''
zh = '''
若相应中断可能成为挂起，则 `mie` 中的位应可写。`mie` 中不可写的位应为只读零。'''
