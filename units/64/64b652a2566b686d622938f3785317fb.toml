en = '''
When the fault-only-first instruction takes a trap due to an
interrupt, implementations should not reduce csr:vl[] and should instead
set a csr:vstart[] value.'''
zh = '''
当仅首错指令因中断而陷入陷阱时，实现不应缩减 csr:vl[]，而应设置 csr:vstart[] 值。'''
