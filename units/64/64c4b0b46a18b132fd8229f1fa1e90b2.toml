en = '''
Changes in major version numbers imply a loss of backwards compatibility,
whereas changes in only the minor version number must be backwards-compatible.
For example, the original 64-bit standard ISA defined in release 1.0 of this
manual can be written in full as RV64I1p0M1p0A1p0F1p0D1p0, more concisely as
RV64I1M1A1F1D1.'''
zh = '''
主版本号的变化意味着失去向后兼容性，而仅次版本号的变化必须是
向后兼容的。例如，本手册 1.0 版中定义的原始 64 位标准 ISA
可以完整写作 RV64I1p0M1p0A1p0F1p0D1p0，更简洁地写作
RV64I1M1A1F1D1。'''
