en = '''
For a standard cache-block management instruction (CBO.CLEAN, CBO.FLUSH, or
CBO.INVAL) or cache-block zero instruction (CBO.ZERO), the transformed
instruction has the format shown in <<transformedcboinst>>. The operation
field corresponds to the 12 most significant bits of the trapping
instruction.'''
zh = '''
对于标准缓存块管理指令（CBO.CLEAN、CBO.FLUSH 或 CBO.INVAL）或缓存块清零指令（CBO.ZERO），变换后的指令具有 <<transformedcboinst>> 所示的格式。操作字段对应于导致陷阱指令的最高 12 位。'''
