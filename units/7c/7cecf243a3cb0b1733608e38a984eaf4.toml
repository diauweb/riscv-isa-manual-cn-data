en = '''
. csr:vl[] = AVL if `AVL {le} VLMAX`
. `ceil(AVL / 2) {le} vl {le} VLMAX` if `AVL < (2 * VLMAX)`
. csr:vl[] = VLMAX if `AVL {ge} (2 * VLMAX)`
. Deterministic on any given implementation for same input AVL and VLMAX values
. These specific properties follow from the prior rules:
.. csr:vl[] = 0 if  `AVL = 0`
.. csr:vl[] > 0 if `AVL > 0`
.. csr:vl[] {le} VLMAX
.. csr:vl[] {le} AVL
.. a value read from csr:vl[] when used as the AVL argument to insn:vset*[] results in the same
value in csr:vl[], provided the resultant VLMAX equals the value of VLMAX at the time that csr:vl[] was read'''
zh = '''
. 若 `AVL {le} VLMAX`，则 csr:vl[] = AVL
. 若 `AVL < (2 * VLMAX)`，则 `ceil(AVL / 2) {le} vl {le} VLMAX`
. 若 `AVL {ge} (2 * VLMAX)`，则 csr:vl[] = VLMAX
. 对于相同的输入 AVL 和 VLMAX 值，在任何给定实现上是确定性的
. 以下特定性质源自上述规则：
.. 若 `AVL = 0`，则 csr:vl[] = 0
.. 若 `AVL > 0`，则 csr:vl[] > 0
.. csr:vl[] {le} VLMAX
.. csr:vl[] {le} AVL
.. 从 csr:vl[] 读取的值当用作 insn:vset*[] 的 AVL 参数时，会在 csr:vl[] 中产生相同的值，前提是所得的 VLMAX 等于读取 csr:vl[] 时的 VLMAX 值'''
