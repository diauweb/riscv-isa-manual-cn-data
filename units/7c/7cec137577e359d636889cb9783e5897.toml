en = '''
[#norm:jvt_op]#If ext:zcmt[] is implemented then csr:jvt[] must also be implemented, but can contain a read-only value.# [#norm:jvt_legal_values]#If csr:jvt[] is writable, the set of values the register may hold can vary by implementation.# [#norm:jvt_base_align]#The value in the BASE field must always be aligned on a 64-byte boundary.#
[#norm:jvt_base_enc]#Note that the CSR contains only bits XLEN-1 through 6 of the address _base_. When computing jump-table accesses, the lower six bits of _base_ are filled with zeroes to obtain an XLEN-bit jump-table base address csr:jvt[base] that is always aligned on a 64-byte boundary.#'''
zh = '''
[#norm:jvt_op]#如果实现了 ext:zcmt[]，则也必须实现 csr:jvt[]，但它可以包含只读值。# [#norm:jvt_legal_values]#如果 csr:jvt[] 可写，则该寄存器可保存的值的集合可因实现而异。# [#norm:jvt_base_align]#BASE 字段中的值必须始终按 64 字节边界对齐。#
[#norm:jvt_base_enc]#注意，该 CSR 仅包含地址 _base_ 的第 XLEN-1 位到第 6 位。计算跳转表访问时，_base_ 的低六位用零填充，以获得始终按 64 字节边界对齐的 XLEN 位跳转表基址 csr:jvt[base]。#'''
