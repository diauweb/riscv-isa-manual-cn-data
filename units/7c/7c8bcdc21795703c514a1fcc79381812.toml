en = '''
The _preserved program order_ (PPO) rules are defined by the RVWMO
memory ordering model. How the operations resulting from CMO instructions fit
into these rules is described below.'''
zh = '''
__保持的程序顺序__（PPO）规则由 RVWMO 内存排序模型定义。CMO 指令所产生操作如何纳入这些规则，将在下文描述。'''
