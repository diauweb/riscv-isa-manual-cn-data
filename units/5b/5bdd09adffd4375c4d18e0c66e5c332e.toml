en = '''
Only `x1` and `x5` registers are supported as `rs2` for insn:sspush[].
ext:zicfiss[] provides a 16-bit version of the insn:sspush[x1] instruction using
the ext:zcmop[] defined insn:c.mop.1[] encoding. The insn:c.sspush[x1] expands
to insn:sspush[x1].'''
zh = '''
insn:sspush[] 仅支持 `x1` 和 `x5` 寄存器作为 `rs2`。
ext:zicfiss[] 使用 ext:zcmop[] 定义的 insn:c.mop.1[] 编码提供 insn:sspush[x1] 指令的 16 位版本。insn:c.sspush[x1] 展开为 insn:sspush[x1]。'''
