zh = '''
====

类似地，当 V=1 时，`vsstatus`.VS 和 HS 级 `sstatus`.VS 均生效。当任一字段为 0（关）时尝试执行向量指令将引发非法指令异常。当 V=1 时修改向量状态会使两个字段均置为 3（脏）。

只读字段 SD 和 XS 汇总对 VS 模式仅可见的扩展上下文状态。例如，HS 级 `sstatus`.FS 的值不影响 `vsstatus`.SD。

实现可使字段 UBE 成为 `hstatus`.VSBE 的只读副本。

当 V=0 时，`vsstatus` 不直接影响机器行为，除非使用虚拟机加载/存储（HLV、HLVX 或 HSV）或 `mstatus` 寄存器中的 MPRV 特性来_如同_V=1 一样执行加载或存储。

==== 虚拟监管者中断寄存器（`vsip` 和 `vsie`）

`vsip` 和 `vsie` 寄存器是 VSXLEN 位读/写寄存器，是 VS 模式下对监管者 CSR `sip` 和 `sie` 的版本，分别格式如 <<vsipreg>> 和 <<vsiereg>> 所示。当 V=1 时，`vsip` 和 `vsie` 替代通常的 `sip` 和 `sie`，因此通常读取或修改 `sip`/`sie` 的指令实际上改为访问 `vsip`/`vsie`。然而，当 V=1 时，发给 HS 级的中断继续在 HS 级 `sip` 寄存器中指示，而非在 `vsip` 中。

