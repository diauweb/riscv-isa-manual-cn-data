en = '''
NOTE: This requires misaligned support for all regular load and store
instructions (including scalar and vector) but not AMOs or other specialized
forms of memory access.  Even though mandated, misaligned loads and stores might
execute extremely slowly.  Standard software distributions should assume their
existence only for correctness, not for performance.'''
zh = '''
注意：这要求对所有常规加载和存储指令（包括标量和向量）提供非对齐支持，但不包括 AMO 或其他特殊形式的内存访问。尽管是强制要求，非对齐加载和存储的执行速度可能极慢。标准软件发行版应仅在正确性上假定其存在，而不应在性能上假定。'''
