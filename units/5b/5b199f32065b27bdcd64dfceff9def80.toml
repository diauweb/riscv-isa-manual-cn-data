en = '''
The Ssdbltrp extension addresses a double trap (See <<machine-double-trap>>)
privilege modes lower than M. [#norm:HS-mode_invoke_error]#It enables HS-mode to invoke a critical error
handler in a virtual machine on a double trap in VS-mode.# [#norm:M-mode_invoke_error]#It also allows M-mode
to invoke a critical error handler in the OS/Hypervisor on a double trap in
S/HS-mode.#'''
zh = '''
Ssdbltrp 扩展处理低于 M 的特权模式中的双重陷阱（参见 <<machine-double-trap>>）。[#norm:HS-mode_invoke_error]#它使 HS 模式能够在 VS 模式发生双重陷阱时，在虚拟机中调用关键错误处理程序。# [#norm:M-mode_invoke_error]#它还允许 M 模式在 S/HS 模式发生双重陷阱时，在操作系统/虚拟机监控程序中调用关键错误处理程序。#'''
