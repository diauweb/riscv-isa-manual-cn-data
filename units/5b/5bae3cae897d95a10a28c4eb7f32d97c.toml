en = '''
Stores a stack-pointer relative 64-bit value from registers `rs2'` and `rs2'+1`. It computes an effective address by adding the _zero_-extended offset, scaled by 8, to the stack pointer, `x2`. It expands to insn:sd[rs2,offset(x2)].'''
zh = '''
将来自寄存器 `rs2'` 和 `rs2'+1` 的、相对于栈指针的 64 位值存储。它通过将__零__扩展的偏移（按 8 缩放）加到栈指针 `x2` 上来计算有效地址。它展开为 insn:sd[rs2,offset(x2)]。'''
