en = '''
[#norm:pm_apply_explicit]#When pointer masking is enabled, the ignore transformation will be applied to every explicit memory access (e.g., loads/stores, atomics operations, and floating point loads/stores).# [#norm:pm_not_apply_implicit]#The transformation *does not* apply to implicit accesses such as page-table walks or instruction fetches.# The set of accesses that pointer masking applies to is described in <<_memory_accesses_subject_to_pointer_masking>>.'''
zh = '''
[#norm:pm_apply_explicit]##当指针掩码使能时，忽略变换将应用于每次显式内存访问（例如加载/存储、原子操作和浮点加载/存储）。## [#norm:pm_not_apply_implicit]##该变换 *不* 应用于页表遍历或指令取指等隐式访问。## 指针掩码适用的访问集合在 <<_memory_accesses_subject_to_pointer_masking>> 中描述。'''
