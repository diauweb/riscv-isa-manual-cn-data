[NOTE]
====
必须在每个特权模式显式使能 Zicfiss 才能使用。

当未实现 Zicfiss 扩展或未使能该扩展时，使用 `LPAD` 指令编译的程序仍能正确运行，但没有前向边 CFI 保护。
===='''
