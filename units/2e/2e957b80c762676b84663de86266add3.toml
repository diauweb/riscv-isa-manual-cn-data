en = '''
The Zkr extension adds the `SSEED` and `USEED` fields to the `mseccfg` CSR to
control access to the `seed` CSR from modes less privileged than M.'''
zh = '''
Zkr 扩展在 `mseccfg` CSR 中增加了 `SSEED` 和 `USEED` 字段，以控制特权级低于 M 的模式对 `seed` CSR 的访问。'''
