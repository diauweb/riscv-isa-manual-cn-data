en = '''
[#norm:pmp_entry_priority]#PMP entries are statically prioritized. The lowest-numbered PMP entry
that matches any byte of a memory operation determines whether that operation
succeeds or fails.# [#norm:pmp_full_match_required]#The matching PMP entry must match all bytes of a memory
operation, or the operation fails, irrespective of the L, R, W, and X bits.#
For example, if a PMP entry is configured to match the four-byte range
`0xC`–`0xF`, then an 8-byte access to the range `0x8`–`0xF` will fail,
assuming that PMP entry is the highest-priority entry that matches those
addresses.'''
zh = '''
[#norm:pmp_entry_priority]#PMP 条目是静态优先的。匹配某内存操作任一字节的编号最小的 PMP 条目决定该操作成功还是失败。# [#norm:pmp_full_match_required]#匹配的 PMP 条目必须匹配某内存操作的所有字节，否则该操作失败，与 L、R、W 和 X 位无关。# 例如，若某 PMP 条目被配置为匹配四字节范围 `0xC`–`0xF`，则对范围 `0x8`–`0xF` 的 8 字节访问将失败，假定该 PMP 条目是匹配那些地址的最高优先级条目。'''
