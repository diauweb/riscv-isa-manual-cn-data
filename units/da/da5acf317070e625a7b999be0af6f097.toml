en = '''
[#norm:menvcfg_adue_op]#If the Svadu extension is implemented, the ADUE bit controls whether hardware
updating of PTE A/D bits is enabled for S-mode and G-stage address translations.
When ADUE=1, hardware updating of PTE A/D bits is enabled during S-mode
address translation, and the implementation behaves as though the Svade
extension were not implemented for S-mode address translation.
When the hypervisor extension is implemented, if ADUE=1, hardware updating of
PTE A/D bits is enabled during G-stage address translation, and the
implementation behaves as though the Svade extension were not implemented for
G-stage address translation.
When ADUE=0, the implementation behaves as though Svade were implemented for
S-mode and G-stage address translation.#
[#norm:menvcfg_adue_rdonly0]#If Svadu is not implemented, ADUE is read-only zero.#
Furthermore, [#norm:menvcfg_adue_henvcfg_adue_rdonly0]#for implementations with the hypervisor extension,
`henvcfg`.ADUE is read-only zero if `menvcfg`.ADUE is zero.#'''
zh = '''
[#norm:menvcfg_adue_op]#若实现了 Svadu 扩展，ADUE 位控制是否为 S 模式和 G 级地址转换启用 PTE A/D 位的硬件更新。当 ADUE=1 时，在 S 模式地址转换期间启用 PTE A/D 位的硬件更新，并且实现的行为如同 Svade 扩展对 S 模式地址转换未被实现。当实现了 hypervisor 扩展时，若 ADUE=1，则在 G 级地址转换期间启用 PTE A/D 位的硬件更新，并且实现的行为如同 Svade 扩展对 G 级地址转换未被实现。当 ADUE=0 时，实现的行为如同 Svade 对 S 模式和 G 级地址转换均已实现。# [#norm:menvcfg_adue_rdonly0]#若未实现 Svadu，则 ADUE 为只读零。# 此外，[#norm:menvcfg_adue_henvcfg_adue_rdonly0]#对于具有 hypervisor 扩展的实现，若 `menvcfg`.ADUE 为零，则 `henvcfg`.ADUE 为只读零。#'''
