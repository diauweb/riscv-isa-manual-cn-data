en = '''
[NOTE]
====
The csr::[tvm] mechanism improves virtualization efficiency by permitting guest
operating systems to execute in S-mode, rather than classically
virtualizing them in U-mode. This approach obviates the need to trap
accesses to most S-mode CSRs.

Trapping csr:satp[] accesses and the insn:sfence.vma[] and insn:sinval.vma[] instructions
provides the hooks necessary to lazily populate shadow page tables.
===='''
zh = '''
[NOTE]
====
csr::[tvm] 机制通过允许客户操作系统在 S 模式下执行（而不是像传统方式那样在 U 模式下虚拟化它们）来提高虚拟化效率。这种方法免除了对大多数 S 模式 CSR 访问进行陷阱的需要。

对 csr:satp[] 访问以及 insn:sfence.vma[] 和 insn:sinval.vma[] 指令进行陷阱，提供了惰性填充影子页表所需的钩子。
===='''
