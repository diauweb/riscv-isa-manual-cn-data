en = '''
[#norm:vnop_vd_vs2_eew_emul]#A few instructions are provided to convert double-width source vectors
into single-width destination vectors.  These instructions convert a
vector register group specified by `vs2` with EEW/EMUL=2*SEW/2*LMUL to a vector register
group with the current SEW/LMUL setting.#  [#norm:vnop_vs1_eew_emul]#Where there is a second
source vector register group (specified by `vs1`), this has the same
(narrower) width as the result (i.e., EEW=SEW).#'''
zh = '''
[#norm:vnop_vd_vs2_eew_emul]#提供了少数指令，用于将双宽度源向量转换为单宽度目标向量。这些指令将由 `vs2` 指定、EEW/EMUL=2*SEW/2*LMUL 的向量寄存器组转换为具有当前 SEW/LMUL 设置的向量寄存器组。#  [#norm:vnop_vs1_eew_emul]#当存在第二个源向量寄存器组（由 `vs1` 指定）时，它具有与结果相同的（更窄）宽度（即 EEW=SEW）。#'''
