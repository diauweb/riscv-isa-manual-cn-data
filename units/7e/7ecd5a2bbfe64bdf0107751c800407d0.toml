en = '''
If the ext:zfh[] extension is implemented, insn:fround.h[] and insn:froundnx.h[] instructions
are analogously defined to operate on half-precision numbers. They are
encoded like insn:fcvt.h.s[], but with _rs2_=4 and 5, respectively,'''
zh = '''
如果实现了 ext:zfh[] 扩展，insn:fround.h[] 和 insn:froundnx.h[] 指令类似地定义为对半精度数进行操作。它们的编码与 insn:fcvt.h.s[] 类似，但 _rs2_ 分别为 4 和 5，'''
