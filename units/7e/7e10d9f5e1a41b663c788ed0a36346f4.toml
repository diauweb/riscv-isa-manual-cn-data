translatable = true
status = "machine"
en = '''
Compilers and linkers should provide an attribute flag to indicate if the
program has been compiled with the ext:zicfilp[] extension and use that to determine
if the ext:zicfilp[] extension should be activated. The dynamic loader should activate
the use of ext:zicfilp[] extension for an application only if all executables (the
application and the dependent dynamically linked libraries) used by that
application use the ext:zicfilp[] extension.'''
zh = '''
编译器和链接器宜提供一个属性标志，以指示程序是否已使用 ext:zicfilp[] 扩展编译，并据此确定是否应激活 ext:zicfilp[] 扩展。动态加载器仅当某应用所使用的所有可执行文件（该应用及依赖的动态链接库）都使用 ext:zicfilp[] 扩展时，才宜为该应用激活 ext:zicfilp[] 扩展的使用。
</｜DSML｜ parameter>'''
