en = '''
Description::
This instruction implements the rotation, SubBytes and Round Constant
addition steps of the AES block cipher Key Schedule.
This instruction must _always_ be implemented such that its execution
latency does not depend on the data being operated on.
Note that _rnum_ must be in the range `0x0`{endash}``0xA``.
The values `0xB`{endash}``0xF`` are reserved.'''
zh = '''
描述::
该指令实现 AES 分组密码密钥调度的旋转、SubBytes 和轮常量相加步骤。
该指令必须 _始终_ 以实现为其执行延迟不依赖于所操作数据的方式实现。
注意 _rnum_ 必须在 `0x0`{endash}``0xA`` 范围内。
值 `0xB`{endash}``0xF`` 为保留值。'''
