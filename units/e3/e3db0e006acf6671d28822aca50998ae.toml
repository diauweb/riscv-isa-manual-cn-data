en = '''
Similar to the AMOs specified in the ext:zaamo[] and ext:zacas[] extensions, the AMOs in the
ext:zabha[] extension optionally provide release consistency semantics, using the `aq`
and `rl` bits, to help implement multiprocessor synchronization.'''
zh = '''
与 ext:zaamo[] 和 ext:zacas[] 扩展中规定的 AMO 类似，ext:zabha[] 扩展中的 AMO 使用 `aq` 和 `rl` 位可选地提供释放一致性语义，以帮助实现多处理器同步。'''
