en = '''
Standard supervisor-level extensions should be listed after standard
unprivileged and user-level extensions, and like other multi-letter extensions,
must be separated from other multi-letter extensions by an underscore. If
multiple supervisor-level extensions are listed, they should be ordered
alphabetically.'''
zh = '''
标准监管级扩展宜列在标准非特权扩展和用户级扩展之后，且与其他多字母扩展一样，与其他多字母扩展之间应以一条下划线分隔。若列出多个监管级扩展，宜按字母顺序排序。'''
