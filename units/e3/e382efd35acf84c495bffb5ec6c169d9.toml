en = '''
RISC-V ISA strings begin with either RV32I, RV32E, RV64I, or RV64E,
indicating the supported address space size in bits for the base integer
ISA.'''
zh = '''
RISC-V 指令集架构字符串以 RV32I、RV32E、RV64I 或 RV64E 开头，表示基础整数指令集架构所支持地址空间的位数。'''
