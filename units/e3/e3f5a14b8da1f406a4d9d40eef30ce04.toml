en = '''
[NOTE]
====
Previously, insn:slliw[], insn:srliw[], and insn:sraiw[] with _imm[5]_{ne}0
were defined to cause illegal-instruction exceptions, whereas now they
are marked as reserved. This is a backwards-compatible change.
===='''
