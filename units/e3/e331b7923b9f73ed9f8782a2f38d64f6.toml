en = '''
[float="center",align="center",cols="<23,<61,^10,^10",options="header"]
|===
|Field |Description |Access |Reset
|[[dcsr-debugver]] `((debugver))`
a|

0 (none): There is no debug support.


4 (1.0): Debug support exists as it is described in this document.


15 (custom): There is debug support, but it does not conform to any
available version of this spec.
a|*R*
a|Preset
|[[dcsr-extcause]] `((extcause))`
a|When {dcsr-cause} is 7, this optional field contains the value of a
more specific halt reason than "other." Otherwise it contains 0.

0 (critical error): The hart entered a critical error state, as defined in the
((Smdbltrp)) extension.

All other values are reserved for future versions of this spec, or
for use by other RISC-V extensions.
a|*R*
a|0
|[[dcsr-cetrig]] `((cetrig))`
a|This bit is part of ((Smdbltrp)) and only exists when that extension
is implemented.

0 (disabled): A hart in a critical error state does not enter Debug Mode but
instead asserts the critical-error signal to the platform.


1 (enabled): A hart in a critical error state enters Debug Mode instead of
asserting the critical-error signal to the platform. Upon such
entry into Debug Mode, the cause field is set to 7, and the
extcause field is set to 0, indicating a critical error
triggered the Debug Mode entry.  This cause has the highest
priority among all reasons for entering Debug Mode. Resuming
from Debug Mode following an entry from the critical error state
returns the hart to the critical error state.

[NOTE]
====
When {dcsr-cetrig} is 1, resuming from Debug Mode
following an entry due to a critical error will result in an
immediate re-entry into Debug Mode due to the critical error.
The debugger may resume with {dcsr-cetrig} set to 0 to allow the
platform defined actions on critical-error signal to occur.
Other possible actions include initiating a hart or platform
reset using the Debug Module reset control.
====
a|*WARL*
a|0
|[[dcsr-pelp]] `((pelp))`
a|This bit is part of ((Zicfilp)) and only exists when that extension
is implemented.

0 (NO_LP_EXPECTED): No landing pad instruction expected.


1 (LP_EXPECTED): A landing pad instruction is expected.
a|*WARL*
a|0
|[[dcsr-ebreakvs]] `((ebreakvs))`
a|

0 (exception): `ebreak` instructions in VS-mode behave as described in the
Privileged Spec.


1 (debug mode): `ebreak` instructions in VS-mode enter Debug Mode.

This bit is hardwired to 0 if the hart does not support virtualization mode.
a|*WARL*
a|0
|[[dcsr-ebreakvu]] `((ebreakvu))`
a|

0 (exception): `ebreak` instructions in VU-mode behave as described in the
Privileged Spec.


1 (debug mode): `ebreak` instructions in VU-mode enter Debug Mode.

This bit is hardwired to 0 if the hart does not support virtualization mode.
a|*WARL*
a|0
|[[dcsr-ebreakm]] `((ebreakm))`
a|

0 (exception): `ebreak` instructions in M-mode behave as described in the
Privileged Spec.


1 (debug mode): `ebreak` instructions in M-mode enter Debug Mode.
a|*R/W*
a|0
|[[dcsr-ebreaks]] `((ebreaks))`
a|

0 (exception): `ebreak` instructions in S-mode behave as described in the
Privileged Spec.


1 (debug mode): `ebreak` instructions in S-mode enter Debug Mode.

This bit is hardwired to 0 if the hart does not support S-mode.
a|*WARL*
a|0
|[[dcsr-ebreaku]] `((ebreaku))`
a|

0 (exception): `ebreak` instructions in U-mode behave as described in the
Privileged Spec.


1 (debug mode): `ebreak` instructions in U-mode enter Debug Mode.

This bit is hardwired to 0 if the hart does not support U-mode.
a|*WARL*
a|0
|[[dcsr-stepie]] `((stepie))`
a|

0 (interrupts disabled): Interrupts (including NMI) are disabled during single stepping
with {dcsr-step} set.
This value should be supported.


1 (interrupts enabled): Interrupts (including NMI) are enabled during single stepping
with {dcsr-step} set.

Implementations may hard wire this bit to 0.
In that case interrupt behavior can be emulated by the debugger.

The debugger must not change the value of this bit while the hart
is running.
a|*WARL*
a|0
|[[dcsr-stopcount]] `((stopcount))`
a|

0 (normal): Increment counters as usual.


1 (freeze): Don't increment any hart-local counters while in Debug Mode or
on `ebreak` instructions that cause entry into Debug Mode.
These counters include the `instret` CSR. On single-hart cores
`cycle` should be stopped, but on multi-hart cores it must keep
incrementing.

An implementation may hardwire this bit to 0 or 1.
a|*WARL*
a|Preset
|[[dcsr-stoptime]] `((stoptime))`
a|

0 (normal): `time` continues to reflect `mtime`.


1 (freeze): `time` is frozen at the time that Debug Mode was entered. When
leaving Debug Mode, `time` will reflect the latest
value of `mtime` again.

While all harts have {dcsr-stoptime}=1 and are in Debug Mode,
`mtime` is allowed to stop incrementing.

An implementation may hardwire this bit to 0 or 1.
a|*WARL*
a|Preset
|[[dcsr-cause]] `((cause))`
a|Explains why Debug Mode was entered.

When there are multiple reasons to enter Debug Mode in a single
cycle, hardware should set {dcsr-cause} to the cause with the highest
priority.  See <<tab:dcsrcausepriority>> for priorities.

1 (ebreak): An `ebreak` instruction was executed.


2 (trigger): A Trigger Module trigger fired with action=1.


3 (haltreq): The debugger requested entry to Debug Mode using {dmcontrol-haltreq}.


4 (step): The hart single stepped because {dcsr-step} was set.


5 (resethaltreq): The hart halted directly out of reset due to {resethaltreq}. It
is also acceptable to report 3 when this happens.


6 (group): The hart halted because it's part of a halt group.
Harts may report 3 for this cause instead.


7 (other): The hart halted for a reason other than the ones mentioned above.
{dcsr-extcause} may contain a more specific reason.
a|*R*
a|0
|[[dcsr-v]] `((v))`
a|Extends the prv field with the virtualization mode the hart was operating
in when Debug Mode was entered. The encoding is described in <<tab:privmode>>.
A debugger can change this value to change the hart's virtualization mode
when exiting Debug Mode.
This bit is hardwired to 0 on harts that do not support virtualization mode.
a|*WARL*
a|0
|[[dcsr-mprven]] `((mprven))`
a|

0 (disabled): `mprv` in `mstatus` is ignored in Debug Mode.


1 (enabled): `mprv` in `mstatus` takes effect in Debug Mode.

Implementing this bit is optional. It may be tied to either 0 or 1.
a|*WARL*
a|Preset
|[[dcsr-nmip]] `((nmip))`
a|When set, there is a Non-Maskable-Interrupt (NMI) pending for the hart.

Since an NMI can indicate a hardware error condition,
reliable debugging may no longer be possible once this bit becomes set.
This is implementation-dependent.
a|*R*
a|0
|[[dcsr-step]] `((step))`
a|When set and not in Debug Mode, the hart will only execute a single
instruction and then enter Debug Mode. See xref:stepbit[]
for details.

The debugger must not change the value of this bit while the hart
is running.
a|*R/W*
a|0
|[[dcsr-prv]] `((prv))`
a|Contains the privilege mode the hart was operating in when Debug
Mode was entered. The encoding is described in <<tab:privmode>>.  A debugger can change this value to change
the hart's privilege mode when exiting Debug Mode.

Not all privilege modes are supported on all harts. If the
encoding written is not supported or the debugger is not allowed to
change to it, the hart may change to any supported privilege mode.
a|*WARL*
a|3
|==='''
zh = '''
[float="center",align="center",cols="<23,<61,^10,^10",options="header"]
|===
|字段 |描述 |访问 |复位
|[[dcsr-debugver]] `((debugver))`
a|

0（none）：没有调试支持。


4（1.0）：存在本文档所述的调试支持。


15（custom）：存在调试支持，但它不符合本规范的任何可用版本。
a|*R*
a|预设
|[[dcsr-extcause]] `((extcause))`
a|当 {dcsr-cause} 为 7 时，此可选字段包含比“其他”更具体的停止原因值。否则它包含 0。

0（critical error）：硬件线程进入严重错误状态，如 ((Smdbltrp)) 扩展所定义。

所有其他值保留供本规范未来版本使用，或供其他 RISC-V 扩展使用。
a|*R*
a|0
|[[dcsr-cetrig]] `((cetrig))`
a|此位属于 ((Smdbltrp))，并且仅当实现该扩展时才存在。

0（disabled）：处于严重错误状态的硬件线程不进入调试模式，而是向平台置位 critical-error 信号。


1（enabled）：处于严重错误状态的硬件线程进入调试模式，而不是向平台置位 critical-error 信号。在此类进入调试模式时，cause 字段设置为 7，extcause 字段设置为 0，指示严重错误触发了调试模式进入。此原因在进入调试模式的所有原因中具有最高优先级。从严重错误状态进入后从调试模式恢复会使硬件线程返回到严重错误状态。

[NOTE]
====
当 {dcsr-cetrig} 为 1 时，因严重错误进入后从调试模式恢复将导致由于严重错误而立即重新进入调试模式。调试器可以在将 {dcsr-cetrig} 设置为 0 的情况下恢复，以允许平台定义的 critical-error 信号动作发生。其他可能的动作包括使用调试模块复位控制发起硬件线程或平台复位。
====
a|*WARL*
a|0
|[[dcsr-pelp]] `((pelp))`
a|此位属于 ((Zicfilp))，并且仅当实现该扩展时才存在。

0（NO_LP_EXPECTED）：不期望着陆垫指令。


1（LP_EXPECTED）：期望着陆垫指令。
a|*WARL*
a|0
|[[dcsr-ebreakvs]] `((ebreakvs))`
a|

0（exception）：VS 模式中的 `ebreak` 指令按特权规范所述行为执行。


1（debug mode）：VS 模式中的 `ebreak` 指令进入调试模式。

如果硬件线程不支持虚拟化模式，则此位硬连线为 0。
a|*WARL*
a|0
|[[dcsr-ebreakvu]] `((ebreakvu))`
a|

0（exception）：VU 模式中的 `ebreak` 指令按特权规范所述行为执行。


1（debug mode）：VU 模式中的 `ebreak` 指令进入调试模式。

如果硬件线程不支持虚拟化模式，则此位硬连线为 0。
a|*WARL*
a|0
|[[dcsr-ebreakm]] `((ebreakm))`
a|

0（exception）：M 模式中的 `ebreak` 指令按特权规范所述行为执行。


1（debug mode）：M 模式中的 `ebreak` 指令进入调试模式。
a|*R/W*
a|0
|[[dcsr-ebreaks]] `((ebreaks))`
a|

0（exception）：S 模式中的 `ebreak` 指令按特权规范所述行为执行。


1（debug mode）：S 模式中的 `ebreak` 指令进入调试模式。

如果硬件线程不支持 S 模式，则此位硬连线为 0。
a|*WARL*
a|0
|[[dcsr-ebreaku]] `((ebreaku))`
a|

0（exception）：U 模式中的 `ebreak` 指令按特权规范所述行为执行。


1（debug mode）：U 模式中的 `ebreak` 指令进入调试模式。

如果硬件线程不支持 U 模式，则此位硬连线为 0。
a|*WARL*
a|0
|[[dcsr-stepie]] `((stepie))`
a|

0（interrupts disabled）：当 {dcsr-step} 置位进行单步时，中断（包括 NMI）被禁用。应支持此值。


1（interrupts enabled）：当 {dcsr-step} 置位进行单步时，中断（包括 NMI）被启用。

实现可以将此位硬连线为 0。在这种情况下，中断行为可由调试器模拟。

硬件线程正在运行时，调试器不得更改此位的值。
a|*WARL*
a|0
|[[dcsr-stopcount]] `((stopcount))`
a|

0（normal）：照常递增计数器。


1（freeze）：在调试模式期间或在导致进入调试模式的 `ebreak` 指令上，不递增任何硬件线程本地计数器。这些计数器包括 `instret` CSR。在单硬件线程核心上，`cycle` 应停止，但在多硬件线程核心上，它必须继续递增。

实现可以将此位硬连线为 0 或 1。
a|*WARL*
a|预设
|[[dcsr-stoptime]] `((stoptime))`
a|

0（normal）：`time` 继续反映 `mtime`。


1（freeze）：`time` 在进入调试模式时冻结。离开调试模式时，`time` 将再次反映 `mtime` 的最新值。

当所有硬件线程都满足 {dcsr-stoptime}=1 且处于调试模式时，允许 `mtime` 停止递增。

实现可以将此位硬连线为 0 或 1。
a|*WARL*
a|预设
|[[dcsr-cause]] `((cause))`
a|解释进入调试模式的原因。

当在单个周期中有多个原因进入调试模式时，硬件应将 {dcsr-cause} 设置为优先级最高的原因。优先级参见 <<tab:dcsrcausepriority>>。

1（ebreak）：执行了 `ebreak` 指令。


2（trigger）：触发模块触发器以 action=1 触发。


3（haltreq）：调试器使用 {dmcontrol-haltreq} 请求进入调试模式。


4（step）：由于 {dcsr-step} 置位，硬件线程单步。


5（resethaltreq）：由于 {resethaltreq}，硬件线程直接在复位后停止。在这种情况下报告 3 也是可接受的。


6（group）：硬件线程因属于停止组而停止。硬件线程可以改为报告 3。


7（other）：硬件线程因上述原因之外的原因停止。{dcsr-extcause} 可能包含更具体的原因。
a|*R*
a|0
|[[dcsr-v]] `((v))`
a|用进入调试模式时硬件线程所运行的虚拟化模式扩展 prv 字段。编码在 <<tab:privmode>> 中描述。调试器可以更改此值，以在退出调试模式时更改硬件线程的虚拟化模式。在不支持虚拟化模式的硬件线程上，此位硬连线为 0。
a|*WARL*
a|0
|[[dcsr-mprven]] `((mprven))`
a|

0（disabled）：在调试模式中忽略 `mstatus` 中的 `mprv`。


1（enabled）：在调试模式中，`mstatus` 中的 `mprv` 生效。

实现此位是可选的。它可以硬连线为 0 或 1。
a|*WARL*
a|预设
|[[dcsr-nmip]] `((nmip))`
a|置位时，硬件线程有挂起的不可屏蔽中断（NMI）。

由于 NMI 可以指示硬件错误条件，因此一旦此位置位，可靠的调试可能不再可能。这取决于实现。
a|*R*
a|0
|[[dcsr-step]] `((step))`
a|置位且不在调试模式时，硬件线程将仅执行单条指令然后进入调试模式。详细信息参见 xref:stepbit[]。

硬件线程正在运行时，调试器不得更改此位的值。
a|*R/W*
a|0
|[[dcsr-prv]] `((prv))`
a|包含进入调试模式时硬件线程所运行的特权模式。编码在 <<tab:privmode>> 中描述。调试器可以更改此值，以在退出调试模式时更改硬件线程的特权模式。

并非所有特权模式都在所有硬件线程上受支持。如果写入的编码不受支持或不允许调试器更改到该模式，则硬件线程可以更改为任何受支持的特权模式。
a|*WARL*
a|3
|==='''
