en = '''
[NOTE]
====
We required the counters be 64 bits wide, even when XLEN=32, as
otherwise it is very difficult for software to determine if values have
overflowed.
The sample code <<zicntr-rv32-sample>> shows how the full 64-bit width value can
be safely read using the individual 32-bit width pseudoinstructions.
===='''
zh = '''
[NOTE]
