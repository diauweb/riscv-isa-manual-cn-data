我们要求计数器宽度为 64 位，即使 XLEN=32 也是如此，否则软件很难判断值是否已溢出。示例代码 <<zicntr-rv32-sample>> 展示了如何使用各个 32 位宽伪指令安全地读取完整的 64 位宽值。
===='''
