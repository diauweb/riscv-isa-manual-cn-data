如果 JVT.mode = 0（跳转表模式），则 _cm.jalt_ 的行为如此处所述。如果 JVT.mode 为保留值，则 _cm.jalt_ 也是保留的。将来 JVT.mode 的其他已定义值可能改变 _cm.jalt_ 的行为。
===='''
