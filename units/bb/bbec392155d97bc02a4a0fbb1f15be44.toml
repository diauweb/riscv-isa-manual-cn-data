translatable = true
status = "machine"
en = '''
[#norm:hip_vstip_op]#A virtual supervisor timer interrupt becomes pending, as reflected in the
VSTIP bit in the `hip` register, whenever (`time` + `htimedelta`), truncated
to 64 bits, contains a value greater than or equal to `vstimecmp`, treating
the values as unsigned integers.#
[#norm:hip_vstip_clear]#If the result of this comparison changes, it is guaranteed to be reflected in
VSTIP eventually, but not necessarily immediately.
The interrupt remains posted until `vstimecmp` becomes greater than (`time`
+ `htimedelta`), typically as a result of writing `vstimecmp`.#
[#norm:hip_vstip_enable]#The interrupt will be taken based on the standard interrupt enable and
delegation rules while V=1.#'''
zh = '''
[#norm:hip_vstip_op]##当 (`time` + `htimedelta`)（截断到 64 位）包含大于或等于 `vstimecmp` 的值时，虚拟监管定时器中断变为挂起，如 `hip` 寄存器中的 VSTIP 位所反映，将这些值视为无符号整数。##
[#norm:hip_vstip_clear]##若此比较结果改变，保证最终会反映在 VSTIP 中，但不一定立即反映。该中断保持挂起，直到 `vstimecmp` 变得大于 (`time`
+ `htimedelta`)，通常通过写入 `vstimecmp` 实现。##
[#norm:hip_vstip_enable]##当 V=1 时，将依据标准中断使能和委托规则接受该中断。##'''
