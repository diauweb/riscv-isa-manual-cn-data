en = '''
RV32E and RV64E use the same instruction-set encoding as RV32I and RV64I
respectively, except that only registers `x0`{endash}``x15`` are provided. All
encodings specifying the other registers `x16`{endash}``x31`` are reserved.'''
zh = '''
RV32E 和 RV64E 分别使用与 RV32I 和 RV64I 相同的指令集编码，区别仅在于只提供寄存器 `x0`{endash}``x15``。所有指定其他
寄存器 `x16`{endash}``x31`` 的编码均保留。'''
