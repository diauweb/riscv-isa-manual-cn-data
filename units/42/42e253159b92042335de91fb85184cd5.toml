zh = '''
* 与本规范新增的跟踪相关引脚以 `*highlighted*` 显示。
* 所有 JTAG/cJTAG 引脚的含义与调试规范中定义的相同。
* 信号名中的 "A / B" 写法用于区分同一引脚的两个可选功能。'''
