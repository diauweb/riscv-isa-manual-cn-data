en = '''
Caches organize copies of data into _cache blocks_, each of which represents a
contiguous, _naturally aligned power-of-two_ (NAPOT) range of memory
locations. A cache block is identified by any of the physical addresses corresponding to
the underlying memory locations. [#norm:cache_block_size]#The capacity and organization of a cache and
the size of a cache block are both _implementation-specific_, and# [#norm:cache_block_discovery]#the execution
environment provides software a means to discover information about the caches
and cache blocks in a system.# [#norm:cache_block_size_uniform]#In the initial set of CMO extensions, the size of
a cache block shall be uniform throughout the system.#'''
zh = '''
缓存将数据副本组织为__缓存块__，每个缓存块表示内存位置的一段连续的__自然对齐的 2 的幂__（NAPOT）范围。缓存块由对应于其底层内存位置的任一物理地址来标识。[#norm:cache_block_size]#缓存的容量和组织以及缓存块的大小都是__实现特定的__，# 并且 [#norm:cache_block_discovery]#执行环境向软件提供发现系统中缓存和缓存块相关信息的手段。# [#norm:cache_block_size_uniform]#在初始的 CMO 扩展集中，缓存块的大小应在整个系统中保持一致。#'''
