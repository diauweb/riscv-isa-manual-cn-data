that `sepc` can hold, with VSXLEN substituting for SXLEN.'''
zh = '''
`vsepc` 是一个 *WARL* 寄存器，必须能够保存 `sepc` 可以保存的相同值集合，并以 VSXLEN 替代 SXLEN。'''
