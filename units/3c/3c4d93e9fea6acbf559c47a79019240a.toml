en = '''
Implementations with VLEN < 256 require LMUL>1 to combine 32-bit elements from register groups
to provide all eight elements of the element group.'''
zh = '''
VLEN < 256 的实现需要 LMUL>1 来组合来自寄存器组的 32 位元素，
