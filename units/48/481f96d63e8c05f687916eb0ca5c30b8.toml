en = '''
NOTE: For RV64, the insn:packw[] instruction with _rs2_=`x0` is the insn:zext.h[]
instruction.
Hence, for RV64, any extension that contains the insn:packw[] instruction also
contains the insn:zext.h[] instruction.'''
zh = '''
注意：对于 RV64，_rs2_=`x0` 的 insn:packw[] 指令就是 insn:zext.h[]
指令。
因此，对于 RV64，任何包含 insn:packw[] 指令的扩展也
包含 insn:zext.h[] 指令。'''
