en = '''
All floating-point to integer and integer to floating-point conversion
instructions round according to the _rm_ field. Note that insn:fcvt.d.w[] and insn:fcvt.d.wu[] always
produce an exact result and are unaffected by rounding mode.'''
zh = '''
所有浮点到整数以及整数到浮点的转换指令都根据 _rm_ 字段进行舍入。注意，insn:fcvt.d.w[] 和 insn:fcvt.d.wu[] 总是产生精确结果，不受舍入模式影响。'''
