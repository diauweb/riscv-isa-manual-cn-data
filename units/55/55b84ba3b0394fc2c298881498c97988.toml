en = '''
[NOTE]
====
The FENCE.I instruction in ext:ziccid[] is specified such that software
written for non-ext:ziccid[] machines is compatible with ext:ziccid[]
machines.
For cacheable and coherent memory regions, the combination of making older
stores globally visible and flushing the instruction buffer on FENCE.I
suffices to implement FENCE.I's pre-ext:ziccid[] semantics for those regions.
===='''
zh = '''
[NOTE]
====
ext:ziccid[] 中的 FENCE.I 指令的规定方式，使得为不支持 ext:ziccid[] 的机器编写的软件与支持 ext:ziccid[] 的机器兼容。对于可缓存且一致的内存区域，使较早的存储全局可见与在 FENCE.I 时冲刷指令缓冲相结合，足以在这些区域实现 FENCE.I 在 ext:ziccid[] 之前的语义。
===='''
