en = '''
- extlink:zvfhmin[] Vector minimal half-precision floating-point.

- extlink:zvbb[] Vector basic bit-manipulation instructions.

- extlink:zvkt[] Vector data-independent execution latency.

- extlink:zihintntl[] Non-temporal locality hints.

- extlink:zicond[] Integer conditional operations.

- extlink:zimop[] may-be-operations.

- extlink:zcmop[] Compressed may-be-operations.

- extlink:zcb[] Additional compressed instructions.

- extlink:zfa[] Additional floating-point instructions.

- extlink:zawrs[] Wait-on-reservation-set instructions.

- <<sec:pm-exts,**Supm**>> Pointer masking, with the execution environment
  providing a means to select PMLEN=0 and PMLEN=7 at minimum.'''
