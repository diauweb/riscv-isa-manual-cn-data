en = '''
If the ext:q[] extension is implemented, insn:fli.q[] performs the analogous
operation, but loads a quad-precision value into floating-point register
_rd_. Note that entry 1 (corresponding to the minimum positive normal
value) has a numerically different value for quad-precision. insn:fli.q[] is
encoded like insn:fli.s[], but with _fmt_=Q.'''
zh = '''
若实现了 ext:q[] 扩展，insn:fli.q[] 执行类似操作，但将四精度值加载到浮点寄存器 _rd_。注意，条目 1（对应于最小正规格化值）在四精度下的数值不同。insn:fli.q[] 的编码类似 insn:fli.s[]，但 _fmt_=Q。'''
