en = '''
(((double-precision, floating point)))
(((floating point, double precision)))
This chapter describes the ext:d[] standard extension for _double-precision_
floating-point, which adds computational instructions compliant with the IEEE
754-2008 arithmetic standard's binary64 format and operations. The ext:d[] extension
depends on the ext:f[] extension.'''
zh = '''
(((双精度, 浮点)))
(((浮点, 双精度)))
本章描述用于 _双精度_ 浮点的 ext:d[] 标准扩展，它增加符合 IEEE 754-2008 算术标准 binary64 格式和操作的计算指令。ext:d[] 扩展依赖 ext:f[] 扩展。'''
