en = '''
These instructions replace the generalized idioms insn:slli[rd,rs,(XLEN-<size>)] + insn:srai[rd,rd,(XLEN-<size>)] for sign extension of 8-bit and 16-bit quantities and insn:slli[] + insn:srli[] for zero extension of 16-bit quantities.'''
zh = '''
这些指令取代用于 8 位和 16 位量符号扩展的通用惯用法 insn:slli[rd,rs,(XLEN-<size>)] + insn:srai[rd,rd,(XLEN-<size>)]，以及用于 16 位量零扩展的 insn:slli[] + insn:srli[]。'''
