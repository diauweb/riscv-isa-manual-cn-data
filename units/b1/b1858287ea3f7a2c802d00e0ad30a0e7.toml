en = '''
C.ADDI adds the non-zero sign-extended 6-bit immediate to the value in
register _rd_ then writes the result to _rd_. C.ADDI expands into
`addi rd, rd, imm`.
The code point with _rd_=`x0` and _imm_=0 encodes the C.NOP instruction.
The code points with _rd_≠0 and _imm_=0 are HINTs.'''
zh = '''
C.ADDI 将非零符号扩展的 6 位立即数加到寄存器 _rd_ 中的值上，然后将结果写入 _rd_。C.ADDI 展开为 `addi rd, rd, imm`。_rd_=`x0` 且 _imm_=0 的代码点编码 C.NOP 指令。_rd_≠0 且 _imm_=0 的代码点是 HINT。'''
