unit_id = "38be8f2618c570662a1745b1d359aed3"
kind = "paragraph"
translatable = true
status = "machine"
en = '''
When the Smdbltrp extension is implemented, executing an `MRET` instruction, or executing
an `SRET` instruction while the current privilege mode is M, has the following additional
effects.
[#norm:mstatus_mdt_clr_mret_sret]#The `MDT` bit is set to 0.#
[#norm:sstatus_sdt_clr_mret_sret]#If the Ssdbltrp extension is also implemented, and the new privilege mode is U, VS, or VU, then `sstatus.SDT` is also set to 0.#
[#norm:vsstatus_sdt_clr_mret_sret]#Additionally, if it is VU, then `vsstatus.SDT` is also set to 0.#'''
zh = '''
当实现了 Smdbltrp 扩展时，执行 `MRET` 指令，或在当前特权模式为 M 时执行 `SRET` 指令，具有以下额外效果。
[#norm:mstatus_mdt_clr_mret_sret]##`MDT` 位被设置为 0。##
[#norm:sstatus_sdt_clr_mret_sret]##若还实现了 Ssdbltrp 扩展，且新的特权模式为 U、VS 或 VU，则 `sstatus.SDT` 也被设置为 0。##
[#norm:vsstatus_sdt_clr_mret_sret]##此外，若为 VU，则 `vsstatus.SDT` 也被设置为 0。##'''
