en = '''
The quad-precision floating-point classify instruction, insn:fclass.q[], is
defined analogously to its double-precision counterpart, but operates on
quad-precision operands.'''
zh = '''
四精度浮点分类指令 insn:fclass.q[] 的定义与对应的双精度指令类似，但操作于四精度操作数。'''
