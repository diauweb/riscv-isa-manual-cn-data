[IMPORTANT]
===='''
zh = '''
====

__获取__操作，如将在临界区开始时使用的那样，要求程序顺序中位于获取之后的所有内存操作在全局内存顺序中也位于该获取之后。例如，这确保临界区内的所有加载和存储相对于用于保护它的同步变量是最新的。获取排序可以通过两种方式之一强制执行：使用获取注释，它仅相对于同步变量本身强制排序；或使用 FENCE R,RW，它相对于所有先前的加载强制排序。

[[spinlock_atomics]]
.使用原子操作的自旋锁
[source%linenums,asm]
....
          sd           x1, (a1)     # Arbitrary unrelated store
          ld           x2, (a2)     # Arbitrary unrelated load
          li           t0, 1        # Initialize swap value.
      again:
          amoswap.w.aq t0, t0, (a0) # Attempt to acquire lock.
          bnez         t0, again    # Retry if held.
          # ...
          # Critical section.
          # ...
          amoswap.w.rl x0, x0, (a0) # Release lock by storing 0.
          sd           x3, (a3)     # Arbitrary unrelated store
          ld           x4, (a4)     # Arbitrary unrelated load
....

考虑 <<spinlock_atomics, 示例 1>>。由于此示例使用 _aq_，临界区中的加载和存储保证在全局内存顺序中出现在用于获取锁的 AMOSWAP 之后。然而，假设 `a0`、`a1` 和 `a2` 指向不同的内存位置，临界区中的加载和存储在全局内存顺序中可能出现在示例开头的“任意无关加载”之后，也可能不出现。

[[spinlock_fences]]
.使用栅栏的自旋锁
[source%linenums,asm]
....
          sd           x1, (a1)     # Arbitrary unrelated store
          ld           x2, (a2)     # Arbitrary unrelated load
          li           t0, 1        # Initialize swap value.
      again:
          amoswap.w    t0, t0, (a0) # Attempt to acquire lock.
          fence        r, rw        # Enforce "acquire" memory ordering
          bnez         t0, again    # Retry if held.
          # ...
          # Critical section.
          # ...
          fence        rw, w        # Enforce "release" memory ordering
          amoswap.w    x0, x0, (a0) # Release lock by storing 0.
          sd           x3, (a3)     # Arbitrary unrelated store
          ld           x4, (a4)     # Arbitrary unrelated load
....

现在，考虑 <<spinlock_fences, 示例 2>> 中的替代方案。在这种情况下，即使 AMOSWAP 没有通过 _aq_ 位强制排序，栅栏仍然强制获取 AMOSWAP 在全局内存顺序中比临界区中的所有加载和存储更早出现。然而请注意，在这种情况下，栅栏还强制了额外的排序：它还要求程序开头的“任意无关加载”在全局内存顺序中比临界区的加载和存储更早出现。（不过，这个特定栅栏并不强制相对于代码片段开头“任意无关存储”的任何排序。）这样，由栅栏强制的排序比由 _.aq_ 强制的排序略粗略。

释放排序的工作方式与获取排序完全相同，只是方向相反。释放语义要求程序顺序中位于释放操作之前的所有加载和存储在全局内存顺序中也位于释放操作之前。例如，这确保临界区中的内存访问在全局内存顺序中出现在释放锁的存储之前。正如获取语义一样，释放语义可以使用释放注释或 FENCE RW,W 操作来强制。使用相同的示例，临界区中的加载和存储与代码片段末尾“任意无关存储”之间的排序仅由 <<spinlock_fences, 示例 2>> 中的 FENCE RW,W 强制，而不是由 <<spinlock_atomics, 示例 1>> 中的 _rl_ 强制。

仅使用 RCpc 注释时，存储-释放到加载-获取的排序不会被强制。这便于移植在 TSO 和/或 RCpc 内存模型下编写的代码。要强制存储-释放到加载-获取排序，代码必须使用存储-释放-RCsc 和加载-获取-RCsc 操作，以便 PPO 规则 7 适用。仅 RCpc 对 C/C++ 中的许多用例足够，但对 C/C++、Java 和 Linux 中的许多其他用例不够，这里仅举几个例子；详见 <<memory_porting, 内存移植>>。

PPO 规则 8 指出，SC 在全局内存顺序中必须出现在其配对 LR 之后。由于固有的数据依赖，LR/SC 常用于执行原子读-修改-写操作，因此这会自然遵循。然而，即使所存储的值在语法上不依赖于配对 LR 返回的值，PPO 规则 8 也适用。

最后，我们注意到，与栅栏一样，排序注释不是累积的。

