[IMPORTANT]
===='''
zh = '''
====

_获取_操作（如在临界区开始时使用的那样）要求在程序顺序中跟随该获取操作的所有内存操作在全局内存顺序中也跟随该获取操作。这例如确保临界区内的所有加载和存储相对于用于保护它的同步变量都是最新的。获取排序可以以两种方式之一强制：使用获取标注，它仅相对于同步变量本身强制排序；或使用 FENCE R,RW，它相对于此前所有加载强制排序。

[[spinlock_atomics]]
.使用原子操作的自旋锁
[source%linenums,asm]
....
          sd           x1, (a1)     # Arbitrary unrelated store
          ld           x2, (a2)     # Arbitrary unrelated load
          li           t0, 1        # Initialize swap value.
      again:
          amoswap.w.aq t0, t0, (a0) # Attempt to acquire lock.
          bnez         t0, again    # Retry if held.
          # ...
          # Critical section.
          # ...
          amoswap.w.rl x0, x0, (a0) # Release lock by storing 0.
          sd           x3, (a3)     # Arbitrary unrelated store
          ld           x4, (a4)     # Arbitrary unrelated load
....

考虑 <<spinlock_atomics, 示例 1>>。
由于本示例使用 _aq_，临界区中的加载和存储保证在用于获取锁的 AMOSWAP 之后出现在全局内存顺序中。然而，假定 `a0`、`a1` 和 `a2` 指向不同的内存位置，临界区中的加载和存储可能也可能不在全局内存顺序中出现在示例开头的“Arbitrary unrelated load”之后。

[[spinlock_fences]]
.使用屏障的自旋锁
[source%linenums,asm]
....
          sd           x1, (a1)     # Arbitrary unrelated store
          ld           x2, (a2)     # Arbitrary unrelated load
          li           t0, 1        # Initialize swap value.
      again:
          amoswap.w    t0, t0, (a0) # Attempt to acquire lock.
          fence        r, rw        # Enforce "acquire" memory ordering
          bnez         t0, again    # Retry if held.
          # ...
          # Critical section.
          # ...
          fence        rw, w        # Enforce "release" memory ordering
          amoswap.w    x0, x0, (a0) # Release lock by storing 0.
          sd           x3, (a3)     # Arbitrary unrelated store
          ld           x4, (a4)     # Arbitrary unrelated load
....

现在考虑 <<spinlock_fences, 示例 2>> 中的替代方案。在此情况下，即使 AMOSWAP 未用 _aq_ 位强制排序，该屏障仍然强制获取 AMOSWAP 在全局内存顺序中比临界区中所有加载和存储更早出现。但请注意，在此情况下，该屏障还强制了额外的排序：它还要求程序开头处的“Arbitrary unrelated load”在全局内存顺序中比临界区的加载和存储更早出现。（不过，这一特定屏障并不相对于片段开头的“Arbitrary unrelated store”强制任何排序。）这样，由屏障强制的排序比由 _.aq_ 强制的排序略粗。

释放排序与获取排序的工作方式完全相同，只是方向相反。释放语义要求在程序顺序中先于释放操作的所有加载和存储也在全局内存顺序中先于该释放操作。这例如确保临界区中的内存访问在全局内存顺序中出现在释放锁的存储之前。正如获取语义一样，释放语义可使用释放标注或使用 FENCE RW,W 操作来强制。沿用同样的示例，临界区中的加载和存储与代码片段末尾的“Arbitrary unrelated store”之间的排序仅由 <<spinlock_fences, 示例 2>> 中的 FENCE RW,W 强制，而不是由 <<spinlock_atomics, 示例 1>> 中的 _rl_ 强制。

仅使用 RCpc 标注时，不强制存储-释放到加载-获取的排序。这便于移植在 TSO 和/或 RCpc 内存模型下编写的代码。要强制存储-释放到加载-获取的排序，代码必须使用存储-释放-RCsc 和加载-获取-RCsc 操作，以便 PPO 规则 7 适用。仅 RCpc 对 C/C++ 中的许多用例已足够，但对 C/C++、Java 和 Linux 中的许多其他用例则不够（仅举几例）；详见 <<memory_porting, 内存移植>>。

PPO 规则 8 指示 SC 在全局内存顺序中必须出现在其配对 LR 之后。由于固有的数据依赖，这在 LR/SC 常用于执行原子读-改-写操作的情形下会自然成立。然而，即使所存储的值在语法上并不依赖于配对 LR 返回的值，PPO 规则 8 也适用。

最后，我们指出，与屏障一样，排序标注不是累积的。

