en = '''
Standard ISA extensions are given a name consisting of a single letter. For
example, the first four standard extensions to the integer bases are: ext:m[]
for integer multiplication and division, ext:a[] for atomic memory instructions,
ext:f[] for single-precision floating-point instructions, and ext:d[] for
double-precision floating-point instructions. Any RISC-V instruction-set variant
can be succinctly described by concatenating the base integer prefix with the
names of the included extensions, e.g., RV64IMAFD.'''
zh = '''
标准指令集架构扩展以单个字母作为名称。例如，整数基础的前四个标准扩展为：ext:m[] 表示整数乘除法，ext:a[] 表示原子内存指令，ext:f[] 表示单精度浮点指令，ext:d[] 表示双精度浮点指令。任何 RISC-V 指令集变体都可以通过将基础整数前缀与所包含扩展的名称拼接来简明描述，例如 RV64IMAFD。'''
