en = '''
Some standard CSRs, such as the counter CSRs of extension
ext:zicntr[], are always 64-bit, even when XLEN=32 (RV32).
For each such 64-bit CSR (for example, counter csr:time[]),
a corresponding 32-bit _high-half CSR_ is usually defined with
the same name but with the letter '`h`' appended at the end (csr:timeh[]).
The high-half CSR aliases bits 63:32 of its namesake
64-bit CSR, thus providing a way for RV32 software
to read and modify the otherwise-unreachable qty:32[bits].'''
zh = '''
某些标准 CSR，例如 ext:zicntr[] 扩展中的计数器 CSR，即使 XLEN=32（RV32）时也始终为 64 位。对于每个这样的 64 位 CSR（例如计数器 csr:time[]），通常会定义一个对应的 32 位__高半部分 CSR__，其名称相同，但在末尾附加字母 '`h`'（csr:timeh[]）。高半部分 CSR 别名其同名 64 位 CSR 的位 63:32，从而为 RV32 软件提供了一种读取和修改原本无法访问的 qty:32[位] 的方法。'''
