en = '''
[#norm:mstatus_fs_vs_warl]#The csr::[fs][1:0] and csr::[vs][1:0] *WARL* fields
and the csr::[xs][1:0] read-only field are used
to reduce the cost of context save and restore by setting and tracking
the current state of the floating-point unit and any other user-mode
extensions respectively.#
[#norm:mstatus_fs_op]#The csr::[fs] field encodes the status of the
floating-point unit state, including the floating-point registers
`f0`{endash}``f31`` and the CSRs csr:fcsr[], csr:frm[], and csr:fflags[].#
[#norm:mstatus_vs_op]#The csr::[vs] field encodes the status of the
vector extension state, including the vector
registers `v0`{endash}``v31`` and the CSRs csr:vcsr[], csr:vxrm[], csr:vxsat[], csr:vstart[],
csr:vl[], csr:vtype[], and csr:vlenb[].#
[#norm:mstatus_xs_op1]#The csr::[xs] field encodes the status of
additional user-mode extensions and associated state.#
These fields can be checked by a context switch routine to quickly determine whether a
state save or restore is required. If a save or restore is required,
additional instructions and CSRs are typically required to effect and
optimize the process.'''
zh = '''
[#norm:mstatus_fs_vs_warl]##csr::[fs][1:0] 和 csr::[vs][1:0] *WARL* 字段以及 csr::[xs][1:0] 只读字段用于通过设置和跟踪浮点单元及任何其他用户模式扩展的当前状态，降低上下文保存和恢复的成本。##
[#norm:mstatus_fs_op]##csr::[fs] 字段编码浮点单元状态的状态，包括浮点寄存器 `f0`{endash}``f31`` 以及 CSR csr:fcsr[]、csr:frm[] 和 csr:fflags[]。##
[#norm:mstatus_vs_op]##csr::[vs] 字段编码向量扩展状态的状态，包括向量寄存器 `v0`{endash}``v31`` 以及 CSR csr:vcsr[]、csr:vxrm[]、csr:vxsat[]、csr:vstart[]、csr:vl[]、csr:vtype[] 和 csr:vlenb[]。##
[#norm:mstatus_xs_op1]##csr::[xs] 字段编码其他用户模式扩展及相关状态的状态。##
上下文切换例程可检查这些字段，以快速确定是否需要保存或恢复状态。若需要保存或恢复，通常需要额外的指令和 CSR 来完成并优化该过程。'''
