en = '''
An "`ISA contract`" is made between a programmer and the RISC-V implementation
that ext:zkt[] instructions do not leak information about processed secret data
(plaintext, keying information, or other "`sensitive security parameters`" --
FIPS 140-3 term) through differences in execution latency. ext:zkt[] does _not_
define a set of instructions available in the core; it just restricts the
behaviour of certain instructions if those are implemented.'''
zh = '''
程序员与 RISC-V 实现之间订立一项“ISA 契约”：ext:zkt[] 指令不会通过执行延迟的差异泄露有关所处理的秘密数据（明文、密钥信息或其他“敏感安全参数”——FIPS 140-3 术语）的信息。ext:zkt[] __不__ 定义核心中可用的一组指令；它仅在实现某些指令时限制这些指令的行为。'''
