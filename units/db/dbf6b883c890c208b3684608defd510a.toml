en = '''
NOTE: The rationale to not include ext:q[] as an optional extension is that
quad-precision floating-point is unlikely to be implemented in
hardware, and so we do not require or expect software to expend effort
optimizing use of ext:q[] instructions in case they are present.'''
zh = '''
NOTE: 不将 ext:q[] 作为可选扩展的理由是：四精度浮点不太可能在硬件中实现，因此我们不要求也不期望软件在 ext:q[] 指令存在时花费精力优化其使用。'''
