en = '''
[NOTE]
====
insn:pause[] is encoded as a hint within the insn:fence[] opcode because some
implementations are expected to deliberately stall the insn:pause[] instruction
until outstanding memory transactions have completed. Because the
successor set is null, however, insn:pause[] does not _mandate_ any particular
memory ordering—hence, it truly is a HINT.
(((PAUSE, encoding)))

Like other insn:fence[] instructions, insn:pause[] cannot be used within LR/SC
sequences without voiding the forward-progress guarantee.
(((PAUSE, LR/RC sequences)))

The choice of a predecessor set of W is arbitrary, since the successor
set is null. Other HINTs similar to insn:pause[] might be encoded with other
predecessor sets.
===='''
zh = '''
[NOTE]
====
insn:pause[] 之所以编码为 insn:fence[] 操作码内的一个 HINT，是因为预期某些实现会故意停顿 insn:pause[] 指令，直到未完成的内存事务完成为止。然而，由于后继集为空，insn:pause[] 并不_强制_任何特定的内存排序——因此，它确实是一个 HINT。
(((PAUSE, encoding)))

与其他 insn:fence[] 指令一样，insn:pause[] 不能在 LR/SC 序列内使用而不使前向进展保证失效。
(((PAUSE, LR/RC sequences)))

由于后继集为空，选择 W 作为前驱集是任意的。其他类似 insn:pause[] 的 HINT 可能使用其他前驱集编码。
===='''
