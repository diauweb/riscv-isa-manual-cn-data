en = '''
[float="center",align="center",cols="<23,<61,^10,^10",options="header"]
|===
|Field |Description |Access |Reset
|[[tcontrol-mpte]] `((mpte))`
a|M-mode previous trigger enable field.

{tcontrol-mpte} and {tcontrol-mte} provide one solution to a problem
regarding triggers with action=0 firing in M-mode trap handlers. See
xref:nativetrigger[] for more details.

When any trap into M-mode is taken, {tcontrol-mpte} is set to the value of
{tcontrol-mte}.
a|*WARL*
a|0
|[[tcontrol-mte]] `((mte))`
a|M-mode trigger enable field.

0 (disabled): Triggers with action=0 do not match/fire while the hart is in M-mode.


1 (enabled): Triggers do match/fire while the hart is in M-mode.

When any trap into M-mode is taken, {tcontrol-mte} is set to 0. When `mret` is executed, {tcontrol-mte} is set to the value of {tcontrol-mpte}.
a|*WARL*
a|0
|==='''
zh = '''
[float="center",align="center",cols="<23,<61,^10,^10",options="header"]
|===
|字段 |说明 |访问 |复位
|[[tcontrol-mpte]] `((mpte))`
a|M 模式先前触发器使能字段。

{tcontrol-mpte} 和 {tcontrol-mte} 为有关在 M 模式陷阱处理程序中触发的 action=0 触发器的问题提供了一种解决方案。更多细节见 xref:nativetrigger[]。

当采取任何陷入 M 模式的陷阱时，{tcontrol-mpte} 被设为 {tcontrol-mte} 的值。
a|*WARL*
a|0
|[[tcontrol-mte]] `((mte))`
a|M 模式触发器使能字段。

0（禁用）：当硬件线程处于 M 模式时，action=0 的触发器不匹配/触发。


1（启用）：当硬件线程处于 M 模式时，触发器确实匹配/触发。

当采取任何陷入 M 模式的陷阱时，{tcontrol-mte} 被设为 0。当执行 `mret` 时，{tcontrol-mte} 被设为 {tcontrol-mpte} 的值。
a|*WARL*
a|0
|==='''
