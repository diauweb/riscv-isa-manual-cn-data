en = '''
The insn:xperm4[] instruction operates on nibbles.
`GPR[rs1]` contains a vector of `XLEN/4` 4-bit elements.
`GPR[rs2]` contains a vector of `XLEN/4` 4-bit indexes.
Each element of the result is formed by using the corresponding index element
from `GPR[rs2]` to select an element from `GPR[rs1]`, or zero if the index
element is out of bounds.'''
zh = '''
insn:xperm4[] 指令对半字节进行操作。`GPR[rs1]` 包含由 `XLEN/4` 个 4 位元素组成的向量。`GPR[rs2]` 包含由 `XLEN/4` 个 4 位索引组成的向量。结果的每个元素通过使用来自 `GPR[rs2]` 的相应索引元素从 `GPR[rs1]` 中选择一个元素来形成；若索引元素越界，则为零。'''
