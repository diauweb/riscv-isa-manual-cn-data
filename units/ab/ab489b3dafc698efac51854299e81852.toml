en = '''
The EEI will define whether the memory system is little-endian or
big-endian. In RISC-V, endianness is byte-address invariant.'''
zh = '''
EEI 将定义内存系统是小端序还是大端序。在 RISC-V 中，字节序具有字节地址不变性。'''
