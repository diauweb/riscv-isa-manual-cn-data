en = '''
The insn:sspopchk[] and insn:c.sspopchk[] instructions perform a load identically to the
existing load instructions, with the difference that the base is implicitly
csr:ssp[] and the width is implicitly `XLEN`.'''
zh = '''
insn:sspopchk[] 和 insn:c.sspopchk[] 指令执行的加载与现有加载指令相同，区别在于基址隐式为 csr:ssp[]，宽度隐式为 `XLEN`。'''
