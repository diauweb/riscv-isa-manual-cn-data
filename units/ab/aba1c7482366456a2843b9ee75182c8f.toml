en = '''
* [[norm:cbo-inval_h_mode_flush_enc]]`0b01` -- The instruction is executed and performs a flush operation, even if
  configured by VS-mode to perform an invalidate operation.
* [[norm:cbo-inval_h_mode_inval_enc]]`0b11` -- The instruction is executed and performs an invalidate operation,
  unless configured by VS-mode to perform a flush operation.'''
zh = '''
* [[norm:cbo-inval_h_mode_flush_enc]]`0b01` —— 指令被执行并执行刷新操作，即使 VS-mode 将其配置为执行无效化操作。
* [[norm:cbo-inval_h_mode_inval_enc]]`0b11` —— 指令被执行并执行无效化操作，除非 VS-mode 将其配置为执行刷新操作。'''
