en = '''
[#norm:c-ld_op]#C.LD is an RV64C-only instruction that loads a 64-bit value from
memory into register `_rd′_`. It computes an effective
address by adding the _zero_-extended offset, scaled by 8, to the base
address in register `_rs1′_`. It expands to
`ld rd′, offset(rs1′)`.#'''
zh = '''
[#norm:c-ld_op]#C.LD 是一条仅限 RV64C 的指令，从内存加载一个 64 位值到寄存器 `_rd′_`。它通过将 __零__扩展的偏移量（按 8 缩放）加到寄存器 `_rs1′_` 中的基地址上来计算有效地址。它扩展为 `ld rd′, offset(rs1′)`。#'''
