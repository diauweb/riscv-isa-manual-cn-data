en = '''
The bit-manipulation (bitmanip) extension collection is comprised of several component extensions to the base RISC-V architecture that are intended to provide some combination of code-size reduction, performance improvement, and energy reduction.
While the instructions are intended for general use, some instructions are more useful in certain domains than in others.
Hence, several smaller bitmanip extensions are provided. Each of these smaller ext:zb*[] extensions is grouped by common function and use case.
The extlink:b[] extension, intended for application processors, combines the ext:zb*[] extensions most useful in general code.'''
zh = '''
位操作（bitmanip）扩展集合由若干基础 RISC-V 架构的组件扩展组成，旨在提供代码尺寸缩减、性能提升和能耗降低的某种组合。
虽然这些指令旨在用于通用用途，但某些指令在某些领域比其他领域更有用。
因此，提供了若干较小的 bitmanip 扩展。每个较小的 ext:zb*[] 扩展按常见功能和使用场景分组。
面向应用处理器的 extlink:b[] 扩展组合了在通用代码中最有用的 ext:zb*[] 扩展。'''
