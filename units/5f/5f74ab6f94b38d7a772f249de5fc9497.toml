en = '''
RISC-V provides several extensions that atomically read-modify-write memory to
support synchronization between multiple RISC-V harts running in the same
memory space.
The two forms of atomic instruction provided are
load-reserved/store-conditional instructions and atomic fetch-and-op memory
instructions.
Both types of atomic instruction support various memory consistency orderings
including unordered, acquire, release, and sequentially consistent semantics.
These instructions allow RISC-V to support the RCsc memory consistency model.
cite:[Gharachorloo90memoryconsistency]'''
zh = '''
RISC-V 提供若干扩展，可对内存进行原子读-改-写，以支持在同一内存空间中运行的多个 RISC-V 硬件线程之间的同步。所提供的两类原子指令是加载保留/条件存储指令以及原子取并运算（fetch-and-op）内存指令。这两类原子指令都支持多种内存一致性排序，包括无序、获取、释放和顺序一致语义。这些指令使 RISC-V 能够支持 RCsc 内存一致性模型。cite:[Gharachorloo90memoryconsistency]'''
