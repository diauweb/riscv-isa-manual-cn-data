en = '''
The form `vmv.v.v vd, vd`, which leaves body elements unchanged,
can be used to indicate that the register will next be used
with an EEW equal to SEW.'''
zh = '''
形式 `vmv.v.v vd, vd` 保持主体元素不变，可用于指示该寄存器接下来将以等于 SEW 的 EEW 使用。'''
