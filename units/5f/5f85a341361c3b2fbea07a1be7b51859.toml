- extlink:c[] 压缩指令。
- <<bits,**B**>> 位操作指令。
- extlink:zicsr[]  CSR 指令。这些由 F 的存在隐含。
- <<zicntr,**Zicntr**>> 基础计数器和定时器。
- <<zihpm,**Zihpm**>> 硬件性能计数器。
