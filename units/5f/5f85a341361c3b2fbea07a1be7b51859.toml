- <<ziccrse,**Ziccrse**>> 同时具有可缓存性和一致性 PMA 的主内存区域应支持 RsrvEventual。
- extlink:ziccamoa[] 同时具有一致性和可缓存性 PMA 的主内存区域应支持 AMOArithmetic。
- extlink:zicclsm[] 应支持对同时具有一致性和可缓存性 PMA 的主内存区域的非对齐加载和存储。
- <<za64rs,**Za64rs**>> 保留集连续、自然对齐，且最大为 64 字节。
- <<zihintpause,**Zihintpause**>> 暂停提示。
- <<zic64b,**Zic64b**>> 缓存块的大小应为 64 字节，并在地址空间中自然对齐。
- extlink:zicbom[] 缓存块管理操作。
- extlink:zicbop[] 缓存块预取操作。
- extlink:zicboz[] 缓存块清零操作。
- ext:zfhmin[] 半精度浮点。
- <<zkt,**Zkt**>> 数据无关执行时延。'''
