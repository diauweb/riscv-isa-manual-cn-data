==== 机器第二陷阱值寄存器（`mtval2`）

`mtval2` 寄存器是一个 MXLEN 位读/写寄存器，格式如 <<mtval2reg>> 所示。当陷入 M 模式时，`mtval2` 写入异常专用的附加信息，与 `mtval` 并列，以协助软件处理陷阱。

[[mtval2reg]]
.机器第二陷阱值寄存器（`mtval2`）。
[bytefield]
----
(defattrs :plain [:plain {:font-family "M+ 1p Fallback" :font-size 24}])
(def row-height 40 )
(def row-header-fn nil)
(def left-margin 30)
(def right-margin 30)
(def boxes-per-row 32)

(draw-box "MXLEN-1" {:span 16 :text-anchor "start" :borders {}})
(draw-box "0" {:span 16 :text-anchor "end" :borders {}})
(draw-box "mtval2" {:span 32})
(draw-box "MXLEN" {:span 32 :borders {}})
----


当客户机页错误陷阱陷入 M 模式时，`mtval2` 写入零或发生错误的客户机物理地址（右移 2 位）。对于其他陷阱，`mtval2` 置零，但未来的标准或扩展可能为其他陷阱重新定义 `mtval2's` 的设置。

若客户机页错误源于第一阶段（VS 阶段）地址转换期间的隐式内存访问，则写入 `mtval2` 的客户机物理地址是发生错误的隐式内存访问的地址。CSR `mtinst` 中提供附加信息以消解此类情况。

否则，对于导致客户机页错误的非对齐加载和存储，`mtval2` 中的非零客户机物理地址对应于由 `mtval` 中虚拟地址所指示的访问的错误部分。对于具有变长指令的系统上的指令客户机页错误，非零的 `mtval2` 对应于由 `mtval` 中虚拟地址所指示的指令的错误部分。

`mtval2` 是一个 *WARL* 寄存器，必须能够保存零，并且可能仅能够保存其他右移 2 位的客户机物理地址的任意子集（若有）。

==== 机器陷阱指令寄存器（`mtinst`）

`mtinst` 寄存器是一个 MXLEN 位读/写寄存器，格式如 <<mtinstreg>> 所示。当陷入 M 模式时，`mtinst` 写入一个值，若非零，则提供关于引发陷阱的指令的信息，以协助软件处理陷阱。在陷阱时可能写入 `mtinst` 的值记录于 <<tinst-vals>>。

