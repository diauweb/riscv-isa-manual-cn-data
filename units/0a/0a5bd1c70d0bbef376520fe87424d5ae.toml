[[two-stage-translation]]
=== 两阶段地址转换

每当当前虚拟化模式 V 为 1 时，两阶段地址转换和保护即生效。对于任何虚拟内存访问，原始虚拟地址在第一阶段由 VS 级地址转换（由 `vsatp` 寄存器控制）转换为_客户机物理地址_。客户机物理地址随后在第二阶段由客户机物理地址转换（由 `hgatp` 寄存器控制）转换为监管者物理地址。这两个阶段也称为 VS 阶段转换和 G 阶段转换。尽管 V=1 时无法选择禁用两阶段地址转换，但通过将相应的 `vsatp` 或 `hgatp` 寄存器置零，任一转换阶段均可被有效禁用。

`vsstatus` 字段 MXR 使仅可执行页可读，但仅覆盖 VS 阶段页保护。在 VS 级置 MXR 不覆盖客户机物理页保护。然而，在 HS 级置 MXR 覆盖 VS 阶段和 G 阶段的仅可执行权限。

当 V=1 时，通常绕过地址转换的内存访问仅受 G 阶段地址转换约束。这包括为支持 VS 阶段地址转换而进行的内存访问，例如读取和写入 VS 级页表。

机器级物理内存保护作用于监管者物理地址，且无论虚拟化模式如何均生效。

[[guest-addr-translation]]
==== 客户机物理地址转换

客户机物理地址到监管者物理地址的映射由 CSR `hgatp` 控制（<<hgatp>>）。

当 `hgatp` 的 MODE 字段所选的地址转换方案为 Bare 时，客户机物理地址不经修改即等于监管者物理地址，且在客户机物理地址到监管者物理地址的平凡转换中不适用内存保护。

当 `hgatp`.MODE 指定 Sv32x4、Sv39x4、Sv48x4 或 Sv57x4 转换方案时，G 阶段地址转换是对通常 Sv32、Sv39、Sv48 或 Sv57 分页虚拟地址转换方案的变体。在每种情况下，入站地址的位宽增加 2 位（到 34、41、50 或 59 位）。为容纳额外的 2 位，根页表（仅根页表）扩大四倍，为 16 KiB 而非通常的 4 KiB。与其更大的尺寸相匹配，根页表还必须对齐到 16 KiB 边界而非通常的 4 KiB 页边界。除已指出的外，Sv32、Sv39、Sv48 或 Sv57 的所有其他方面在 G 阶段转换中不变地采用。非根页表和所有页表项（PTE）具有与 <<sv32>>、<<sv39>>、<<sv48>> 和 <<sv57>> 中所记载相同的格式。

对于 Sv32x4，入站客户机物理地址被划分为虚拟页号（VPN）和页偏移，如 <<sv32x4va>> 所示。此划分与 <<sv32va>> 中所描绘的 Sv32 虚拟地址的划分相同，区别在于 VPN[1] 的高端多 2 位。（注意，已划分的客户机物理地址的各字段也与 Sv32 赋予物理地址的结构（如 <<sv32va>> 所描绘）一一对应。）

