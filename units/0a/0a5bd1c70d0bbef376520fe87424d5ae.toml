zh = '''
====

虚拟机监控器扩展改变 `mstatus` 中修改特权字段 MPRV 的行为。当 MPRV=0 时，转换和保护照常运作。当 MPRV=1 时，显式内存访问被转换和保护，并应用字节序，如同当前虚拟化模式被置为 MPV 且当前名义特权模式被置为 MPP。<<h-mprv>> 列举了这些情况。

[[h-mprv]]
.MPRV 对显式内存访问的转换和保护的影响。
[float="center",align="center",cols="^15,^10,^10,<70",options="header"]
|===
|MPRV |MPV |MPP |效果
|0 |- |- |正常访问；当前特权模式适用。

|1 |0 |0 |U 级访问，仅使用 HS 级转换和保护。

|1 |0 |1 |HS 级访问，仅使用 HS 级转换和保护。

|1 |- |3 |M 级访问，无转换。

|1 |1 |0 |VU 级访问，使用两阶段转换和保护。HS 级 MXR 位使任何可执行页可读。`vsstatus`.MXR 使在 VS 转换阶段标记为可执行的页可读，但仅在客户机物理转换阶段可读时。

|1 |1 |1 |VS 级访问，使用两阶段转换和保护。HS 级 MXR 位使任何可执行页可读。`vsstatus`.MXR 使在 VS 转换阶段标记为可执行的页可读，但仅在客户机物理转换阶段可读时。适用 `vsstatus`.SUM 而非 HS 级 SUM 位。
|===

MPRV 不影响虚拟机加载/存储指令 HLV、HLVX 和 HSV。这些指令的显式加载和存储始终如同 V=1 且名义特权模式为 `hstatus`.SPVP 一样动作，覆盖 MPRV。

`mstatus` 寄存器是 HS 级 `sstatus` 寄存器的超集，但不是 `vsstatus` 的超集。

==== 机器中断委托寄存器（`mideleg`）

当实现了虚拟机监控器扩展时，`mideleg` 的位 10、6 和 2（对应标准 VS 级中断）均为只读 1。此外，若实现了任何客户机外部中断（GEILEN 非零），则 `mideleg` 的位 12（对应监管级客户机外部中断）也为只读 1。VS 级中断和客户机外部中断总是越过 M 模式委托给 HS 模式。

对于 `mideleg` 中为零的位，`hideleg`、`hip` 和 `hie` 中的相应位为只读 0。

==== 机器中断寄存器（`mip` 和 `mie`）

虚拟机监控器扩展为寄存器 `mip` 和 `mie` 提供额外的活动位，用于虚拟机监控器新增的中断。<<hypervisor-mipreg-standard>> 和 <<hypervisor-miereg-standard>> 展示了实现虚拟机监控器扩展时寄存器 `mip` 和 `mie` 的标准部分（第 15:0 位）。

[[hypervisor-mipreg-standard]]
.`mip` 的标准部分（第 15:0 位）。
