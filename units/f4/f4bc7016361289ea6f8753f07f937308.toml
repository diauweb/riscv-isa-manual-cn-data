en = '''
For implementations with both page-based virtual memory and the ext:a[]
standard extension, the LR/SC reservation set must lie completely within
a single base physical page (i.e., a naturally aligned 4 KiB physical-memory
region).'''
zh = '''
对于同时具有基于页的虚拟内存和 ext:a[] 标准扩展的实现，LR/SC 保留集必须完全位于单个基础物理页内（即自然对齐的 4 KiB 物理内存区域）。'''
