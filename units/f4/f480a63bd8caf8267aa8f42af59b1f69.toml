zh = '''
向量扩展在基础标量 RISC-V ISA 之上增加了 32 个向量寄存器和七个非特权 CSR（csr:vstart[]、csr:vxsat[]、csr:vxrm[]、csr:vcsr[]、csr:vtype[]、csr:vl[]、csr:vlenb[]）。'''
