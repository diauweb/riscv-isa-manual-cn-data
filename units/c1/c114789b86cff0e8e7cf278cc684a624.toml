_imm[5] &#8800; 0_ are reserved.#'''
zh = '''
[#norm:slliw_srliw_sraiw_op]#SLLIW、SRLIW 和 SRAIW 是仅限 RV64I 的指令，其定义类似，但操作 32 位值并将其 32 位结果符号扩展到 64 位。# [#norm:slliw_srliw_sraiw_imm5_rsv]##_imm[5] &##8800; 0_ 的 SLLIW、SRLIW 和 SRAIW 编码为保留。#'''
