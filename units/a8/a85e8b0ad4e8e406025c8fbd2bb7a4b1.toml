en = '''
insn:fence[] instructions also order memory reads and writes made by the
hart as observed by memory reads and writes made by an external device.
However, insn:fence[] instructions do not order observations of events made by an external
device using any other signaling mechanism.'''
zh = '''
insn:fence[] 指令还按外部设备所做内存读写观察到的方式，对硬件线程进行的内存读写进行排序。然而，insn:fence[] 指令不排序外部设备使用任何其他信号机制所观察到的事件。'''
