en = '''
The following are expansion options for RVB23U64 as they are not intended to be
made mandatory in future RVB profiles, but are listed as RVA23U64 development
options as they are intended to become mandatory in future RVA profiles.'''
zh = '''
以下为 RVB23U64 的扩展选项，因为它们不打算在未来的 RVB 配置中成为强制要求，但被列为 RVA23U64 的开发选项，因为它们打算在未来的 RVA 配置中成为强制要求。'''
