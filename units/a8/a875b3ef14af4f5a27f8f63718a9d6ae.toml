en = '''
[NOTE]
====
Note that in version 2.2 of the ext:f[] extension, the insn:fmin.s[] and
insn:fmax.s[] instructions were amended to implement the IEEE 754-2019 cite:[ieee754-2019]
`minimumNumber` and `maximumNumber` operations, rather than the IEEE
754-2008 cite:[ieee754-2008] `minNum` and `maxNum` operations. These
operations differ in their handling of signaling NaNs.
===='''
zh = '''
[NOTE]
====
注意，在 ext:f[] 扩展的 2.2 版本中，insn:fmin.s[] 和 insn:fmax.s[] 指令被修改为实现 IEEE 754-2019 cite:[ieee754-2019] 的 `minimumNumber` 和 `maximumNumber` 操作，而不是 IEEE 754-2008 cite:[ieee754-2008] 的 `minNum` 和 `maxNum` 操作。这些操作在处理信号 NaN 方面有所不同。
===='''
