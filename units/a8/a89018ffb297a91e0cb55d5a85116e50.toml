en = '''
The fused multiply-add instructions must set the invalid operation
exception flag when the multiplicands are {inf} and zero, even when the addend is a quiet NaN.'''
zh = '''
当乘数为 {inf} 和零时，融合乘加指令应置位无效操作异常标志，即使加数为静默 NaN。'''
