en = '''
[#norm:Q_flen_128]#The floating-point registers are now extended to hold
either a single, double, or quad-precision floating-point value (FLEN=128).#
The NaN-boxing scheme described in <<nanboxing>> is now extended recursively to
allow a single-precision value to be NaN-boxed inside a double-precision value
which is itself NaN-boxed inside a quad-precision value.'''
zh = '''
[#norm:Q_flen_128]#浮点寄存器现在被扩展为可保存单精度、双精度或四精度浮点值（FLEN=128）。# <<nanboxing>> 中描述的 NaN 装箱方案现在被递归扩展，以允许单精度值 NaN 装箱在双精度值内，而该双精度值本身又 NaN 装箱在四精度值内。'''
