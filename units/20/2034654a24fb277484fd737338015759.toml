en = '''
[float="center",align="center",cols="<23,<61,^10,^10",options="header"]
|===
|Field |Description |Access |Reset
|[[tmexttrigger-hit]] `((hit))`
a|If this bit is implemented, the hardware sets it when this
trigger matches. The trigger's user can set or clear it at any
time. It is used to determine which
trigger(s) matched.  If the bit is not implemented, it is always 0
and writing it has no effect.
a|*WARL*
a|0
|[[tmexttrigger-intctl]] `((intctl))`
a|This optional bit, when set, causes this trigger to fire whenever an attached
interrupt controller signals a trigger.
a|*WARL*
a|0
|[[tmexttrigger-select]] `((select))`
a|Selects any combination of up to 16 TM external trigger inputs
that cause this trigger to fire.
a|*WARL*
a|0
|[[tmexttrigger-action]] `((action))`
a|The action to take when the trigger fires. The values are explained
in xref:tab:action[].
a|*WARL*
a|0
|==='''
zh = '''
[float="center",align="center",cols="<23,<61,^10,^10",options="header"]
|===
|Field |Description |Access |Reset
|[[tmexttrigger-hit]] `((hit))`
a|若实现此位，则硬件在触发器匹配时将其置位。触发器的用户可以随时设置或清除它。它用于确定哪个（些）触发器匹配。若此位未实现，则始终为 0，写入它没有效果。
a|*WARL*
a|0
|[[tmexttrigger-intctl]] `((intctl))`
a|此可选位在置位时使此触发器在连接的中断控制器发出触发信号时触发。
a|*WARL*
a|0
|[[tmexttrigger-select]] `((select))`
a|选择最多 16 个 TM 外部触发输入的任意组合，使此触发器触发。
a|*WARL*
a|0
|[[tmexttrigger-action]] `((action))`
a|触发器触发时要执行的动作。各值的解释见 xref:tab:action[]。
a|*WARL*
a|0
|==='''
