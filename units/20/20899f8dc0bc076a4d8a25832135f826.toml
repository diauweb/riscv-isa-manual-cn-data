在 <<rsw1>>-<<rsw3>> 所示的混合大小 RSW 变体族中，操作规范和公理规范之间存在已知差异。为解决此问题，我们可以选择添加类似以下的新 PPO 规则：如果 _a_ 在程序顺序中先于 _b_，_a_ 和 _b_ 都访问常规主存（而不是 I/O 区域），_a_ 是加载，_b_ 是存储，在 _a_ 和 _b_ 之间存在加载 _m_，存在字节 _x_ 同时被 _a_ 和 _m_ 读取，在 _a_ 和 _m_ 之间没有对 _x_ 的存储，且 _m_ 在 PPO 中先于 _b_，则内存操作 _a_ 在保持的程序顺序中（因而也在全局内存顺序中）先于内存操作 _b_。换句话说，在 herd 语法中，我们可以选择将 `(po-loc & rsw);ppo;[W]` 添加到 PPO。许多实现已经会自然强制执行此排序。因此，即使此规则不是官方的，我们仍建议实现者强制执行它，以确保与未来可能将此规则添加到 RVWMO 的前向兼容性。'''
