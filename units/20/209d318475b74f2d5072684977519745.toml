status = "machine"
en = '''
Description::
This instruction performs a rotate right on the least-significant word
of _rs1_ by the amount in the 5-bit _shamt_ field.
The resulting word value is sign-extended by copying bit 31 to all of
the more-significant bits.'''
zh = '''
描述::
此指令将 _rs1_ 的最低有效字按 5 位 _shamt_ 字段中的量循环右移。
通过将位 31 复制到所有更高有效位，对结果字值进行符号扩展。'''
