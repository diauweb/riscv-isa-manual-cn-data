en = '''
[#norm:Zve64_eew64_nsupport_vmulh]#All Zve* extensions support all vector integer instructions
(<<sec-vector-integer>>), except that the `vmulh` integer multiply
variants that return the high half of the product (`vmulh.vv`,
`vmulh.vx`, `vmulhu.vv`, `vmulhu.vx`, `vmulhsu.vv`, `vmulhsu.vx`) are
not included for EEW=64 in Zve64*.#'''
zh = '''
[#norm:Zve64_eew64_nsupport_vmulh]#所有 Zve* 扩展支持所有向量整数指令（<<sec-vector-integer>>），但返回乘积高半部分的 `vmulh` 整数乘法变体（`vmulh.vv`、`vmulh.vx`、`vmulhu.vv`、`vmulhu.vx`、`vmulhsu.vv`、`vmulhsu.vx`）在 Zve64* 的 EEW=64 中不包括。#'''
