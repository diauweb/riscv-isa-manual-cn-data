status = "machine"
en = '''
[#norm:msip_sz_acc]#A hart's memory-mapped `msip` register is a 32-bit read/write register#,
where [#norm:msip_enc]#bits 31--1 read as zero and bit 0 contains the MSIP bit.#
[#norm:msip_update_max_time]#When the memory-mapped `msip` register changes, it is guaranteed to be
reflected in `mip`.MSIP eventually, but not necessarily immediately.#
[#norm:mip_msip_mie_msie_maybe_rdonly0]#If a system has only one hart, or
if a platform standard supports the delivery of machine-level
interprocessor interrupts through external interrupts (MEI) instead,
then `mip`.MSIP and `mie`.MSIE may both be read-only zeros.#'''
zh = '''
[#norm:msip_sz_acc]##硬件线程的内存映射 `msip` 寄存器是一个 32 位读写寄存器##，其中[#norm:msip_enc]##位 31-1 读为零，位 0 包含 MSIP 位。##[#norm:msip_update_max_time]##当内存映射 `msip` 寄存器变化时，保证最终反映到 `mip`.MSIP 中，但不一定立即反映。##[#norm:mip_msip_mie_msie_maybe_rdonly0]##若系统只有一个硬件线程，或平台标准支持通过外部中断（MEI）递送机器级处理器间中断，则 `mip`.MSIP 和 `mie`.MSIE 可均为只读零。##'''
