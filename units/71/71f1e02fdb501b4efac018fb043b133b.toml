en = '''
[#norm:c-ld_op]#C.LD is an XLEN=64-only instruction that loads a 64-bit value from
memory into register `_rd′_`. It computes an effective
address by adding the _zero_-extended offset, scaled by 8, to the base
address in register `_rs1′_`. It expands to
`ld rd′, offset(rs1′)`.#'''
zh = '''
[#norm:c-ld_op]#C.LD 是仅限 XLEN=64 的指令，从内存加载 64 位值到寄存器 `_rd′_`。它通过将按 8 缩放的__零__扩展偏移量加到寄存器 `_rs1′_` 中的基址上来计算有效地址。它展开为 `ld rd′, offset(rs1′)`。#'''
