en = '''
[NOTE]
====
The ext:f[] extension uses separate `f` registers for floating-point
computation, to reduce register pressure and simplify the provision of
register-file ports for wide superscalars. However, the additional 128 bytes of
architectural state increases the minimal implementation cost. By
eliminating the `f` registers, the ext:zfinx[] extension substantially reduces
the cost of simple RISC-V implementations with floating-point
instruction-set support. ext:zfinx[] also reduces context-switch cost.

In general, software that assumes the presence of the ext:f[] extension is
incompatible with software that assumes the presence of the
ext:zfinx[] extension, and vice versa.
===='''
zh = '''
[NOTE]
====
ext:f[] 扩展使用独立的 `f` 寄存器进行浮点计算，以降低寄存器压力，并简化为宽超标量提供寄存器堆端口。然而，额外的 128 字节架构状态增加了最小实现成本。通过消除 `f` 寄存器，ext:zfinx[] 扩展大幅降低了支持浮点指令集的简单 RISC-V 实现的成本。ext:zfinx[] 还降低上下文切换成本。

一般来说，假定存在 ext:f[] 扩展的软件与假定存在 ext:zfinx[] 扩展的软件不兼容，反之亦然。
===='''
