en = '''
Out-of-order implementations adhering to ext:zkt[] are still free to fuse, crack,
change or even ignore sequences of instructions, so long as the optimizations
are applied deterministically, and not based on operand data.
The guiding principle should be that no information about the data being
operated on should be leaked based on the execution latency.'''
zh = '''
遵守 ext:zkt[] 的乱序实现仍然可以自由地融合、拆分、更改甚至忽略指令序列，只要优化以确定性方式应用，而不基于操作数数据。
指导原则应是：不基于执行延迟泄露有关所操作数据的任何信息。'''
