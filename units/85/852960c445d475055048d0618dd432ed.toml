en = '''
[#norm:pm_per_mode_control]#Pointer masking is controlled separately for different privilege modes.# The subset of supported privilege modes is determined by the set of supported pointer masking extensions. [#norm:pm_auto_apply_active_mode]#Different privilege modes may have different pointer masking settings active simultaneously and the hardware will automatically apply the pointer masking settings of the currently active privilege mode.# [#norm:pm_config_next_higher]#A privilege mode's pointer masking setting is configured by bits in configuration registers of the next-higher privilege mode.#'''
zh = '''
[#norm:pm_per_mode_control]#指针掩码针对不同特权模式分别控制。# 受支持特权模式的子集由受支持的指针掩码扩展集合决定。[#norm:pm_auto_apply_active_mode]#不同特权模式可以同时具有不同的指针掩码设置，硬件将自动应用当前活动特权模式的指针掩码设置。# [#norm:pm_config_next_higher]#某个特权模式的指针掩码设置由下一较高特权模式的配置寄存器中的位来配置。#'''
