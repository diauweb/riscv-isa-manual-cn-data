en = '''
[#norm:V_dependent_F_D]#The V extension depends upon the F and D
extensions, and implements all vector floating-point instructions
(<<sec-vector-float>>) for floating-point operands with EEW=32
or EEW=64 (including widening instructions and conversions between
FP32 and FP64).# [#norm:V_fp_reductions]#Vector single-width floating-point reductions
(<<sec-vector-float-reduce>>) for EEW=32 and EEW=64 are supported as
well as widening reductions from FP32 to FP64.#'''
zh = '''
[#norm:V_dependent_F_D]#V 扩展依赖于 F 和 D 扩展，并为 EEW=32 或 EEW=64 的浮点操作数实现所有向量浮点指令（<<sec-vector-float>>）（包括加宽指令和 FP32 与 FP64 之间的转换）。[#norm:V_fp_reductions]#支持 EEW=32 和 EEW=64 的向量单宽度浮点归约（<<sec-vector-float-reduce>>），以及从 FP32 到 FP64 的加宽归约。#'''
