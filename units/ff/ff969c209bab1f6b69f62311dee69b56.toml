en = '''
[#norm:hgatp_op_hfence_gvma]#Note that writing `hgatp` does not imply any ordering constraints
between page-table updates and subsequent G-stage address translations.#
If the new virtual machine’s guest physical page tables have been
modified, or if a VMID is reused, it may be necessary to execute an
HFENCE.GVMA instruction (see <<hfence.vma>>) before or
after writing `hgatp`.'''
zh = '''
[#norm:hgatp_op_hfence_gvma]#注意，写入 `hgatp` 并不意味着页表更新与后续 G 级地址翻译之间存在任何排序约束。#
如果新虚拟机的客户物理页表已被修改，或者如果 VMID 被重用，则可能需要在写入 `hgatp` 之前或之后执行 HFENCE.GVMA 指令（见 <<hfence.vma>>）。'''
