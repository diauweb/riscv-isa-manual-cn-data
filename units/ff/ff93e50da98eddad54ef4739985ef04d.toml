status = "machine"
en = '''
Upon entry into Debug Mode, the csr::[pelp] bit in csr:dcsr[] is updated with the `ELP`
at the privilege level the hart was previously in, and the `ELP` is set to
`NO_LP_EXPECTED`. When a hart resumes from Debug Mode, if the new privilege mode
is `y`, then `ELP` is set to the value of csr::[pelp] if `__y__LPE` (see <<FCFIACT>>)
is 1; otherwise, it is set to `NO_LP_EXPECTED`.'''
zh = '''
进入调试模式时，csr:dcsr[] 中的 csr::[pelp] 位用硬件线程先前所处特权级的 `ELP` 更新，且 `ELP` 置为 `NO_LP_EXPECTED`。当硬件线程从调试模式恢复时，若新特权模式为 `y`，则当 `__y__LPE`（见 <<FCFIACT>>）为 1 时，`ELP` 置为 csr::[pelp] 的值；否则置为 `NO_LP_EXPECTED`。'''
