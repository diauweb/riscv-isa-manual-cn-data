en = '''
[#norm:exttrap_def]#External traps are traps from a privilege mode enabled for CTR recording to a privilege mode that is not enabled for CTR recording.  The `__x__ctrctl`.__x__TE bits allow M-mode, S-mode, and VS-mode to be enabled for CTR recording separately. When the `__x__ctrctl`.__x__TE bits are clear, external traps are not recorded.# Privileged software running in the target mode of the trap can enable CTR to record external traps into that mode.'''
zh = '''
[#norm:exttrap_def]#外部陷阱是从已使能 CTR 记录的特权模式到未使能 CTR 记录的特权模式的陷阱。`__x__ctrctl`.__x__TE 位允许 M 模式、S 模式和 VS 模式分别使能 CTR 记录。当 `__x__ctrctl`.__x__TE 位清零时，外部陷阱不被记录。# 运行在陷阱目标模式中的特权软件可以使能 CTR 以将外部陷阱记录到该模式。'''
