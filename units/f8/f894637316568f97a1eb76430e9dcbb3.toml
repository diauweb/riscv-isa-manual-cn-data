en = '''
If using `x0` as `src` of insn:c.sdsp[], the entire 64-bit operand is zero, i.e., register `x1` is not accessed.'''
zh = '''
如果使用 `x0` 作为 insn:c.sdsp[] 的 `src`，则整个 64 位操作数为零，即不访问寄存器 `x1`。'''
