en = '''
Non-standard extensions must be listed after all standard extensions, and, like
other multi-letter extensions, must be separated from other multi-letter
extensions by an underscore. If multiple non-standard extensions are listed,
they should be ordered alphabetically.'''
zh = '''
非标准扩展应列在所有标准扩展之后，且与其他多字母扩展一样，与其他多字母扩展之间应以一条下划线分隔。若列出多个非标准扩展，宜按字母顺序排序。'''
