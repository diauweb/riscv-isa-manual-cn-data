en = '''
[#norm:mtval_vaddr_wr_faulting_addr]#If `mtval` is written with a nonzero value when a breakpoint,
address-misaligned, access-fault, page-fault, or hardware-error exception
occurs on an instruction fetch, load, or store, then `mtval` will contain the
faulting virtual address.#'''
zh = '''
[#norm:mtval_vaddr_wr_faulting_addr]##若在取指、加载或存储时发生断点、地址非对齐、访问错误、页错误或硬件错误异常，且 `mtval` 被写入非零值，则 `mtval` 将包含出错虚拟地址。##'''
