en = '''
insn:auipc[] (add upper immediate to `pc`) is used to build `pc`-relative
addresses and uses the U-type format.
[#norm:auipc_op]#insn:auipc[] forms a 32-bit offset from
the U-immediate, filling in the lowest 12 bits with zeros, adds this
offset to the address of the insn:auipc[] instruction, then places the result
in register _rd_.#'''
zh = '''
insn:auipc[]（将高位立即数加到 `pc`）用于构造相对于 `pc` 的地址，并使用 U 型格式。
[#norm:auipc_op]##insn:auipc[] 由 U 立即数形成 32 位偏移，最低 12 位填零，将该偏移加到 insn:auipc[] 指令的地址上，然后将结果放入寄存器 _rd_。##'''
