en = '''
For the purposes of defining the idempotency PMAs, changes in observed
memory ordering created by redundant accesses are not considered a side
effect.'''
zh = '''
为定义幂等性 PMA 之目的，由冗余访问造成的所观察到的内存排序变化不被视为副作用。'''
