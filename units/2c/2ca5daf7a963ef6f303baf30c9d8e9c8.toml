en = '''
[NOTE]
====
Note that in version 2.2 of the F extension, the FMIN.S and FMAX.S
instructions were amended to implement the IEEE 754-2019 cite:[ieee754-2019]
`minimumNumber` and `maximumNumber` operations, rather than the IEEE
754-2008 cite:[ieee754-2008] `minNum` and `maxNum` operations. These
operations differ in their handling of signaling NaNs.
===='''
zh = '''
[NOTE]
====
注意，在 F 扩展的 2.2 版本中，FMIN.S 和 FMAX.S 指令经修改以实现 IEEE 754-2019 cite:[ieee754-2019] 的 `minimumNumber` 和 `maximumNumber` 操作，而不是 IEEE 754-2008 cite:[ieee754-2008] 的 `minNum` 和 `maxNum` 操作。这些操作在处理信号 NaN 方面有所不同。
===='''
