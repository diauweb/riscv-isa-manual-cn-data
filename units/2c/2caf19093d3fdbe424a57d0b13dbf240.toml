en = '''
When XLEN=32, reads of the csr:mcycle[], csr:minstret[], `mhpmcounter__n__`, and `mhpmevent__n__`
CSRs return bits 31-0 of the corresponding register, and writes change only bits 31-0;
[#norm:mcycleh_minstreth_mhpmh_op]#reads of the csr:mcycleh[], csr:minstreth[], `mhpmcounter__n__h`, and `mhpmevent__n__h`
CSRs return bits 63-32 of the corresponding register, and writes change only bits 63-32.#
[#norm:mhpmeventh_presence]#The `mhpmevent__n__h` CSRs are provided only if the ext:sscofpmf[] extension is implemented.#'''
zh = '''
当 XLEN=32 时，读取 csr:mcycle[]、csr:minstret[]、`mhpmcounter__n__` 和 `mhpmevent__n__` CSR 返回相应寄存器的位 31-0，写入仅改变位 31-0；
[#norm:mcycleh_minstreth_mhpmh_op]##读取 csr:mcycleh[]、csr:minstreth[]、`mhpmcounter__n__h` 和 `mhpmevent__n__h` CSR 返回相应寄存器的位 63-32，写入仅改变位 63-32。##
[#norm:mhpmeventh_presence]##`mhpmevent__n__h` CSR 仅在实现了 ext:sscofpmf[] 扩展时提供。##'''
