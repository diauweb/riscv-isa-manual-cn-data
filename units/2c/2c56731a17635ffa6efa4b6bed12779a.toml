en = '''
The insn:froundnx.s[] instruction is defined similarly, but it also sets the
inexact exception flag if the input differs from the rounded result and
is not NaN. insn:froundnx.s[] is encoded like insn:fcvt.s.d[], but with _rs2_=5.'''
zh = '''
insn:froundnx.s[] 指令的定义类似，但如果输入与舍入结果不同且不是 NaN，它还会置位不精确异常标志。insn:froundnx.s[] 的编码与 insn:fcvt.s.d[] 类似，但 _rs2_=5。'''
