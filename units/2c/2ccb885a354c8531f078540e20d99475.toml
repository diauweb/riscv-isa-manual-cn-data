en = '''
New floating-point-to-floating-point conversion instructions are added.
These instructions are defined analogously to the double-precision
floating-point-to-floating-point conversion instructions. [#norm:fcvt-s-h_fcvt-h-s_op]#FCVT.S.H or
FCVT.H.S converts a half-precision floating-point number to a
single-precision floating-point number, or vice-versa, respectively#. [#norm:fcvt-d-h_fcvt-h-d_op]#If
the D extension is present, FCVT.D.H or FCVT.H.D converts a
half-precision floating-point number to a double-precision
floating-point number, or vice-versa, respectively#. [#norm:fcvt-q-h_fcvt-h-q_op]#If the Q extension
is present, FCVT.Q.H or FCVT.H.Q converts a half-precision
floating-point number to a quad-precision floating-point number, or
vice-versa, respectively#.'''
zh = '''
新增浮点到浮点转换指令。这些指令的定义与双精度浮点到浮点转换指令类似。[#norm:fcvt-s-h_fcvt-h-s_op]##FCVT.S.H 或 FCVT.H.S 分别将半精度浮点数转换为单精度浮点数，或反之##。[#norm:fcvt-d-h_fcvt-h-d_op]##若存在 D 扩展，FCVT.D.H 或 FCVT.H.D 分别将半精度浮点数转换为双精度浮点数，或反之##。[#norm:fcvt-q-h_fcvt-h-q_op]##若存在 Q 扩展，FCVT.Q.H 或 FCVT.H.Q 分别将半精度浮点数转换为四精度浮点数，或反之##。'''
