en = '''
<<norm:rv64i_hints_tbl>> lists all RV64I HINT code points. 91% of the
HINT space is reserved for standard HINTs. The remainder of the HINT
space is designated for custom HINTs; no standard HINTs will ever be
defined in this subspace.'''
zh = '''
<<norm:rv64i_hints_tbl>> 列出了所有 RV64I HINT 编码点。91% 的 HINT 空间保留给标准 HINT。HINT 空间的其余部分指定用于自定义 HINT；在此子空间中永远不会定义标准 HINT。'''
