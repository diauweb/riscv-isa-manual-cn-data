en = '''
This instruction pops (loads) the registers in _reg_list_ from stack memory, adjusts the stack pointer by _stack_adj_ and then returns to _ra_.'''
zh = '''
此指令从栈内存弹出（加载）_reg_list_ 中的寄存器，将栈指针调整 _stack_adj_，然后返回 _ra_。'''
