en = '''
[#norm:zbb_orc_b_semantics]#insn:orc.b[] sets the bits of each byte in the result _rd_ to all zeros if no bit within the respective byte of _rs_ is set, or to all ones if any bit within the respective byte of _rs_ is set.#'''
zh = '''
[#norm:zbb_orc_b_semantics]#insn:orc.b[] 在 _rs_ 相应字节内没有任何位置位时，将结果 _rd_ 中每个字节的位设置为全零；在 _rs_ 相应字节内有任何位置位时，设置为全一。#'''
