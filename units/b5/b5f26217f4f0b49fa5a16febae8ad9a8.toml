en = '''
[NOTE]
====
The unconditional jump instructions all use `pc`-relative addressing to
help support position-independent code. The insn:jalr[] instruction was defined
to enable a two-instruction sequence to jump anywhere in a 32-bit
absolute address range. A insn:lui[] instruction can first load _rs1_ with the
upper 20 bits of a target address, then insn:jalr[] can add in the lower bits.
Similarly, insn:auipc[] then insn:jalr[] can jump anywhere in a 32-bit `pc`-relative
address range.

Note that the insn:jalr[] instruction does not treat the 12-bit immediate as
multiples of 2 bytes, unlike the conditional branch instructions. This
avoids one more immediate format in hardware. In practice, most uses of
insn:jalr[] will have either a zero immediate or be paired with a insn:lui[] or insn:auipc[],
so the slight reduction in range is not significant.

Clearing the least-significant bit when calculating the insn:jalr[] target
address both simplifies the hardware slightly and allows the low bit of
function pointers to be used to store auxiliary information. Although
there is potentially a slight loss of error checking in this case, in
practice jumps to an incorrect instruction address will usually quickly
raise an exception.

When used with a base _rs1_=`x0`, insn:jalr[] can be used to
implement a single instruction subroutine call to the lowest 2{nbsp}KiB or highest
2{nbsp}KiB address region from anywhere in the address space, which could be used
to implement fast calls to a small runtime library. Alternatively, an
ABI could dedicate a general-purpose register to point to a library
elsewhere in the address space.
===='''
zh = '''
[NOTE]
====
所有无条件跳转指令均使用 `pc` 相对寻址，以帮助支持位置无关代码。insn:jalr[] 指令的定义使得双指令序列能够跳转到 32 位绝对地址范围内的任何位置。insn:lui[] 指令可首先将目标地址的高 20 位加载到 _rs1_，然后 insn:jalr[] 可加上低位。类似地，insn:auipc[] 后接 insn:jalr[] 可跳转到 32 位 `pc` 相对地址范围内的任何位置。

注意，与条件分支指令不同，insn:jalr[] 指令不将 12 位立即数视为 2 字节的倍数。这在硬件中避免了一种额外的立即数格式。在实践中，大多数 insn:jalr[] 的使用要么立即数为零，要么与 insn:lui[] 或 insn:auipc[] 配对，因此范围的轻微缩减并不显著。

在计算 insn:jalr[] 目标地址时清除最低有效位既可略微简化硬件，也允许使用函数指针的低位存储辅助信息。尽管在这种情况下可能略微损失错误检查，但在实践中，跳转到错误指令地址通常会迅速产生异常。

当基址 _rs1_=`x0` 时，insn:jalr[] 可用于实现从地址空间中任意位置到最低 2{nbsp}KiB 或最高 2{nbsp}KiB 地址区域的单指令子程序调用，这可用于实现对小型运行时库的快速调用。或者，ABI 可专用一个通用寄存器指向地址空间其他位置的库。
===='''
