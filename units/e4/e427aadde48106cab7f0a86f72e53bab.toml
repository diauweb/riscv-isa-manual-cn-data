en = '''
[#norm:vsstatus_mxr_vm]#The `vsstatus` field MXR, which makes execute-only pages readable by explicit loads, only
overrides VS-stage page protection. Setting MXR at VS-level does not
override guest-physical page protections.#
[#norm:sstatus_mxr_vm]#Setting MXR at HS-level,
however, overrides both VS-stage and G-stage execute-only permissions.#'''
zh = '''
[#norm:vsstatus_mxr_vm]#`vsstatus` 字段 MXR（使只执行页可被显式加载读取）仅覆盖 VS 级页保护。在 VS 级设置 MXR 不会覆盖客户物理页保护。# [#norm:sstatus_mxr_vm]#然而，在 HS 级设置 MXR 会同时覆盖 VS 级和 G 级的只执行权限。#'''
