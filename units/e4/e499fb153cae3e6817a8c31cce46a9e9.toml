en = '''
A FENCE instruction may be used to order the memory read access and, if
produced, the memory write access by an `AMOCAS.W/D/Q` instruction.'''
zh = '''
FENCE 指令可用于对 `AMOCAS.W/D/Q` 指令的内存读访问以及（若产生）内存写访问进行排序。'''
