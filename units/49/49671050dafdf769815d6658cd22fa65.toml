en = '''
[#norm:misa_H_op]#The hypervisor extension is enabled by setting bit 7 in the `misa` CSR#,
which corresponds to the letter H. RISC-V harts that implement the
hypervisor extension are encouraged not to hardwire `misa`[7], so that
the extension may be disabled.'''
zh = '''
[#norm:misa_H_op]#虚拟机扩展通过设置 `misa` CSR 中的位 7 来启用#，该位对应字母 H。实现虚拟机扩展的 RISC-V 硬件线程被鼓励不要硬连线 `misa`[7]，以便可以禁用该扩展。'''
