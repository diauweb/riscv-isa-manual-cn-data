en = '''
[#norm:mstatus_fs_vs_warl]#The FS[1:0] and VS[1:0] *WARL* fields#
and the XS[1:0] read-only field are used
to reduce the cost of context save and restore by setting and tracking
the current state of the floating-point unit and any other user-mode
extensions respectively.
[#norm:mstatus_fs_op]#The FS field encodes the status of the
floating-point unit state, including the floating-point registers
`f0`–`f31` and the CSRs `fcsr`, `frm`, and `fflags`.#
[#norm:mstatus_vs_op]#The VS field encodes the status of the
vector extension state, including the vector
registers `v0`–`v31` and the CSRs `vcsr`, `vxrm`, `vxsat`, `vstart`,
`vl`, `vtype`, and `vlenb`.#
[#norm:mstatus_xs_op1]#The XS field encodes the status of
additional user-mode extensions and associated state.#
These fields can be checked by a context switch routine to quickly determine whether a
state save or restore is required. If a save or restore is required,
additional instructions and CSRs are typically required to effect and
optimize the process.'''
zh = '''
[#norm:mstatus_fs_vs_warl]#FS[1:0] 和 VS[1:0] *WARL* 字段#
以及 XS[1:0] 只读字段，用于通过设置和跟踪浮点单元及任何其他用户模式扩展的当前状态，来降低上下文保存和恢复的成本。
[#norm:mstatus_fs_op]#FS 字段编码浮点单元状态的状态，包括浮点寄存器 `f0`–`f31` 以及 CSR `fcsr`、`frm` 和 `fflags`。#
[#norm:mstatus_vs_op]#VS 字段编码向量扩展状态的状态，包括向量寄存器 `v0`–`v31` 以及 CSR `vcsr`、`vxrm`、`vxsat`、`vstart`、`vl`、`vtype` 和 `vlenb`。#
[#norm:mstatus_xs_op1]#XS 字段编码额外用户模式扩展及相关状态的状态。#
上下文切换例程可以检查这些字段，以快速确定是否需要保存或恢复状态。如果需要保存或恢复，通常需要额外的指令和 CSR 来实施和优化该过程。'''
