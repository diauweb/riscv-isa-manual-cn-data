en = '''
[#norm:wfi_resume_reason]#Implementations are permitted to resume execution for any reason, even if an
enabled interrupt has not become pending.
Hence, a legal implementation is to simply implement the WFI instruction as a NOP.#'''
zh = '''
[#norm:wfi_resume_reason]##允许实现因任何原因恢复执行，即使已使能的中断尚未成为挂起。因此，一种合法的实现是简单地将 WFI 指令实现为 NOP。##'''
