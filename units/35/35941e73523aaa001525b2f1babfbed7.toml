en = '''
* [#norm:trap_unexp_hndl_no_rnmi]#When the Smrnmi extension is not implemented, or if the Smrnmi extension is
  implemented and `mnstatus.NMIE` is 0, the hart enters a critical-error state
  without updating any architectural state, including the `pc`. This state
  involves ceasing execution, disabling all interrupts (including NMIs), and
  asserting a `critical-error` signal to the platform.# Whether performance
  counters and timers are updated in the critical-error state is UNSPECIFIED.'''
zh = '''
* [#norm:trap_unexp_hndl_no_rnmi]#当未实现 Smrnmi 扩展，或者实现了 Smrnmi 扩展但 `mnstatus.NMIE` 为 0 时，硬件线程进入严重错误状态，不更新任何架构状态，包括 `pc`。该状态包括停止执行、禁用所有中断（包括 NMI），并向平台断言 `critical-error` 信号。# 在严重错误状态下是否更新性能计数器和定时器是 UNSPECIFIED。'''
