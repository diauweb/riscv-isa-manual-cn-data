en = '''
On a breakpoint exception raised by an EBREAK or C.EBREAK instruction, `stval`
is written with either zero or the virtual address of the instruction.'''
zh = '''
当 EBREAK 或 C.EBREAK 指令引发断点异常时，`stval` 被写入零或该指令的虚拟地址。'''
