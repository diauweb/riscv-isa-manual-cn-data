en = '''
`mnstatus` also holds the NMIE bit. When NMIE=1, non-maskable interrupts
are enabled. When NMIE=0, _all_ interrupts are disabled.'''
zh = '''
`mnstatus` 还包含 NMIE 位。当 NMIE=1 时，不可屏蔽中断被使能。当 NMIE=0 时，_所有_ 中断被禁用。'''
