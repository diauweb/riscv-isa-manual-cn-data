status = "machine"
en = '''
ext:zca[] HINTs are encoded as computational instructions that do not modify
the architectural state, either because _rd_=`x0` (e.g.
`C.ADD _x0_, _t0_`), or because _rd_ is overwritten with a copy of itself
(e.g. `C.ADDI _t0_, 0`).'''
zh = '''
ext:zca[] HINT 编码为不修改
体系结构状态的计算指令，或者因为 _rd_=`x0`（例如
`C.ADD _x0_, _t0_`），或者因为 _rd_ 被其自身的副本覆盖
（例如 `C.ADDI _t0_, 0`）。'''
