en = '''
[#norm:Zbkx_lookup_table_model]#These instructions implement a "`lookup table`" for 4- and 8-bit elements
inside the general purpose registers.#
_rs1_ is used as a vector of N-bit words, and _rs2_ as a vector of N-bit
indices into _rs1_.
[#norm:Zbkx_indexing_behavior]#Each element of the result is formed by using the
corresponding index element from _rs2_ to select an element from _rs1_, or zero if the
index element is out of bounds.#'''
zh = '''
[#norm:Zbkx_lookup_table_model]##这些指令在通用寄存器内为 4 位和 8 位元素实现“查找表”。##
_rs1_ 用作 N 位字的向量，而 _rs2_ 用作指向 _rs1_ 的 N 位索引的向量。
[#norm:Zbkx_indexing_behavior]##结果的每个元素通过使用来自 _rs2_ 的相应索引元素从 _rs1_ 中选择一个元素来形成，如果索引元素越界则为零。##'''
