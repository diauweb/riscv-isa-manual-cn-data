en = '''
Just as for AMOs in the ext:a[] extension, insn:ssamoswap.w[] or insn:ssamoswap.d[] requires that the address
held in `rs1` be naturally aligned to the size of the operand (i.e., eight-byte
aligned for __doublewords__, and four-byte aligned for __words__). The same
exception options apply if the address is not naturally aligned.'''
zh = '''
正如 ext:a[] 扩展中的 AMO 一样，insn:ssamoswap.w[] 或 insn:ssamoswap.d[] 要求 `rs1` 中保存的地址自然对齐到操作数大小（即__双字__为 8 字节对齐，__字__为 4 字节对齐）。如果地址非自然对齐，适用相同的异常选项。'''
