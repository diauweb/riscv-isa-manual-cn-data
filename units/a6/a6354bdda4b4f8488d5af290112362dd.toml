en = '''
[#norm:mstatus_uxl_acc_mxlen64]#When MXLEN=64, if U-mode is not supported, then UXL is read-only zero.
Otherwise, it is a *WARL* field that encodes the current value of UXLEN.#
In particular, [#norm:mstatus_uxl_rdonly_mxlen64]#an implementation may make UXL be a read-only field whose
value always ensures that UXLEN=MXLEN or UXLEN=SXLEN.#'''
zh = '''
[#norm:mstatus_uxl_acc_mxlen64]##当 MXLEN=64 时，若不支持 U 模式，则 UXL 为只读零。否则，它是一个编码 UXLEN 当前值的 *WARL* 字段。##特别是，[#norm:mstatus_uxl_rdonly_mxlen64]##实现可使 UXL 成为只读字段，其值始终确保 UXLEN=MXLEN 或 UXLEN=SXLEN。##'''
