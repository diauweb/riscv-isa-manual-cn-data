en = '''
The entropy source extension defines the csr:seed[] CSR at address `0x015`.
This CSR provides up to 16 physical csr::[entropy] bits that can be used to
seed cryptographic random bit generators.'''
zh = '''
熵源扩展在地址 `0x015` 处定义了 csr:seed[] CSR。
该 CSR 提供最多 16 个物理 csr::[entropy] 位，可用于为密码随机位生成器提供种子。'''
