en = '''
The term _call_ is used to refer to a insn:jal[], insn:jalr[] or
insn:c.jal[] instruction with a link register as destination, i.e., _rd_≠`x0`.
Conventionally, the link register is `x1` or `x5`. A _call_ using insn:jal[] or
insn:c.jal[] is termed a _direct call_. A insn:c.jalr[] expands to
insn:jalr[x1,0(rs1)] and thus it is a call. A call using insn:jalr[] or
insn:c.jalr[] is termed an _indirect call_.'''
zh = '''
术语 _call_ 用于指代以链接寄存器为目的寄存器的 insn:jal[]、insn:jalr[] 或
insn:c.jal[] 指令，即 _rd_≠`x0`。
按照约定，链接寄存器是 `x1` 或 `x5`。使用 insn:jal[] 或
insn:c.jal[] 的 _call_ 称为__直接调用__。insn:c.jalr[] 展开为
insn:jalr[x1,0(rs1)]，因此它是一次调用。使用 insn:jalr[] 或
insn:c.jalr[] 的调用称为__间接调用__。'''
