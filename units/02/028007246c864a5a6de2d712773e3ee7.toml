en = '''
[#norm:pm_ignore_upper_bits]#RISC-V Pointer Masking (PM) is a feature that, when enabled, causes the CPU to ignore the upper bits of the effective address# (these terms will be defined more precisely in the Background section). This allows these bits to be used in whichever way the application chooses. The version of the extension being described here specifically targets **tag checks**: When an address is accessed, the tag stored in the masked bits can be compared against a range-based tag. This is used for dynamic safety checkers such as HWASAN cite:[HWASAN]. [#norm:pm_all_priv_modes]#Such tools can be applied in all privilege modes (U, S, and M).#'''
zh = '''
[#norm:pm_ignore_upper_bits]##RISC-V 指针掩码（PM）是一种特性，使能后会使 CPU 忽略有效地址的高位##（这些术语将在背景一节中更精确地定义）。这允许应用以任意方式使用这些位。此处描述的扩展版本专门针对 **标签检查**：访问地址时，可将掩码位中存储的标签与基于范围的标签进行比较。这用于 HWASAN cite:[HWASAN] 等动态安全检查器。[#norm:pm_all_priv_modes]##此类工具可在所有特权模式（U、S 和 M）中应用。##'''
