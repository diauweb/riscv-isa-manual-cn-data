en = '''
[#norm:c-lw_op]#C.LW loads a 32-bit value from memory into register
`_rd′_`. It computes an effective address by adding the
_zero_-extended offset, scaled by 4, to the base address in register
`_rs1′_`. It expands to `lw rd′, offset(rs1′)`.#'''
zh = '''
[#norm:c-lw_op]#C.LW 从内存加载 32 位值到寄存器 `_rd′_`。它通过将按 4 缩放的__零__扩展偏移量加到寄存器 `_rs1′_` 中的基址上来计算有效地址。它展开为 `lw rd′, offset(rs1′)`。#'''
