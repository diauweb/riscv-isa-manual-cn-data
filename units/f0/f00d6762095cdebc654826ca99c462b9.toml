en = '''
[#norm:nmi_mcause_impl_def]#The values written to `mcause` on an NMI are implementation-defined.#
[#norm:nmi_mcause_restrictions]#The high Interrupt bit of `mcause` should be set to indicate
that this was an interrupt. An Exception Code of 0 is reserved to mean "`unknown
cause`" and implementations that do not distinguish sources of NMIs via
the `mcause` register should return 0 in the Exception Code.#'''
zh = '''
[#norm:nmi_mcause_impl_def]#在 NMI 时写入 `mcause` 的值是实现定义的。#
[#norm:nmi_mcause_restrictions]#`mcause` 的高 Interrupt 位应被置位，以指示这是一次中断。Exception Code 为 0 保留用于表示“unknown cause”，不通过 `mcause` 寄存器区分 NMI 来源的实现应在 Exception Code 中返回 0。#'''
