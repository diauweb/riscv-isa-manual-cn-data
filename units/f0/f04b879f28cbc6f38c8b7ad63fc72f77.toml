en = '''
When a double-width floating-point result is written to `x0`, the entire write
takes no effect. For RV32 with ext:zdinx[], writing a double-precision result to
`x0` does not cause `x1` to be written.'''
zh = '''
当双宽度浮点结果写入 `x0` 时，整个写入不生效。对于带 ext:zdinx[] 的 RV32，将双精度结果写入 `x0` 不会导致写入 `x1`。'''
