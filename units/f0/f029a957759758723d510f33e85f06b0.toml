en = '''
The Zkr extension adds the `SSEED` and `USEED` fields to the `mseccfg` CSR to
control access to the `seed` CSR from U, S, or HS modes (see Privileged ISA
specification).'''
zh = '''
Zkr 扩展向 `mseccfg` CSR 添加 `SSEED` 和 `USEED` 字段，
以控制从 U、S 或 HS 模式对 `seed` CSR 的访问（见特权 ISA
规范）。'''
