en = '''
[#norm:Zimop_mop-r_op]#The Zimop extension defines 32 MOP instructions named MOP.R.__n__, where
__n__ is an integer between 0 and 31, inclusive.
Unless redefined by another extension, these instructions simply write 0 to
`x[rd]`.#  Their encoding allows future extensions to define them to read `x[rs1]`,
as well as write `x[rd]`.'''
zh = '''
[#norm:Zimop_mop-r_op]#Zimop 扩展定义了 32 条名为 MOP.R.__n__ 的 MOP 指令，其中 __n__ 为 0 到 31（含）之间的整数。除非被其他扩展重新定义，这些指令仅向 `x[rd]` 写入 0。# 其编码允许未来的扩展将它们定义为读取 `x[rs1]`，并写入 `x[rd]`。'''
