en = '''
insn:auipc[] (add upper immediate to `pc`) uses the same opcode as RV32I. insn:auipc[]
is used to build `pc`-relative addresses and uses the U-type format.
[#norm:auipc_op_rv64i]#insn:auipc[] forms a 32-bit offset from the U-immediate, filling in the lowest
12 bits with zeros, sign-extends the result to 64 bits, adds it to the
address of the insn:auipc[] instruction, then places the result in register _rd_.#'''
zh = '''
insn:auipc[]（将高位立即数加到 `pc`）使用与 RV32I 相同的操作码。insn:auipc[] 用于构建 `pc` 相对地址，并使用 U 型格式。
[#norm:auipc_op_rv64i]##insn:auipc[] 由 U 立即数构成 32 位偏移，最低 12 位填零，将结果符号扩展至 64 位，将其加到 insn:auipc[] 指令的地址上，然后将结果放入寄存器 _rd_。##'''
