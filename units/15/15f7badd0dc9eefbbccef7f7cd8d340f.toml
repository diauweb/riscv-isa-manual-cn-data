en = '''
[NOTE]
====
Because insn:fence.i[] only orders stores with a hart's own instruction fetches,
application code should only rely upon insn:fence.i[] if the application thread
will not be migrated to a different hart. The EEI can provide mechanisms for
efficient multiprocessor instruction-stream synchronization.
===='''
zh = '''
[NOTE]
====
由于 insn:fence.i[] 仅对硬件线程自身的指令取指进行存储排序，因此只有当应用程序线程不会被迁移到其他硬件线程时，应用代码才应依赖 insn:fence.i[]。EEI 可以提供高效的多处理器指令流同步机制。
===='''
