en = '''
Bits 1:0 of a transformed standard instruction will be binary `01` if
the trapping instruction is compressed and `11` if not.'''
zh = '''
如果导致陷阱的指令是压缩指令，则变换后的标准指令的位 1:0 将为二进制 `01`，否则为 `11`。'''
