en = '''
Note that load and load-reserved instructions generate load exceptions,
whereas store, store-conditional, and AMO instructions generate
store/AMO exceptions.'''
zh = '''
注意，加载和加载保留指令产生加载异常，而存储、存储条件和 AMO 指令产生存储/AMO 异常。'''
