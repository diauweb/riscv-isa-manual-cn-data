en = '''
[#norm:c-j_op]#C.J performs an unconditional control transfer. The offset is
sign-extended and added to the `pc` to form the jump target address. C.J
can therefore target a {pm}2 KiB range. C.J expands to
`jal x0, offset`.#'''
zh = '''
[#norm:c-j_op]#C.J 执行一次无条件控制转移。偏移量被符号扩展并加到 `pc` 上以形成跳转目标地址。因此 C.J 可以访问 {pm}2 KiB 的范围。C.J 扩展为 `jal x0, offset`。#'''
