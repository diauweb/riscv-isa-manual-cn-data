status = "machine"
en = '''
Guest physical addresses (GPAs) are 2-bit wider than the corresponding virtual
address translation modes, resulting in additional address translation schemes
Sv32x4, Sv39x4, Sv48x4, and Sv57x4 for translating guest physical addresses to
supervisor physical addresses. When running with virtualization in VS/VU mode
with csr:vsatp[mode]=Bare, this means that those qty:2[bits] may be subject to
pointer masking, depending on csr:hgatp[mode] and csr:senvcfg[pmm] or csr:henvcfg[pmm] (for
VU/VS mode). If csr:vsatp[mode]{ne}Bare, this issue does *not* apply.
Those qty:2[bits] may likewise be subject to pointer masking according to
csr:hstatus[hupmm] for explicit memory accesses made by `HLV.\*` or `HSV.*`
instructions in U-mode as though in VU-mode.'''
zh = '''
客户机物理地址（GPA）比对应虚拟地址转换模式宽 2 位，从而产生用于将客户机物理地址转换为监管物理地址的附加地址转换方案 Sv32x4、Sv39x4、Sv48x4 和 Sv57x4。当在 VS/VU 模式中运行虚拟化且 csr:vsatp[mode]=Bare 时，这意味着这 qty:2[bits] 可能受指针掩码影响，具体取决于 csr:hgatp[mode] 和 csr:senvcfg[pmm] 或 csr:henvcfg[pmm]（对于 VU/VS 模式）。若 csr:vsatp[mode]{ne}Bare，则此问题*不*适用。对于 U 模式中 `HLV.\*` 或 `HSV.*` 指令如同在 VU 模式中所做的显式内存访问，这 qty:2[bits] 同样可能根据 csr:hstatus[hupmm] 受指针掩码影响。'''
