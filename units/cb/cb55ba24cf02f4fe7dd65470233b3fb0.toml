en = '''
[#norm:mcounterinhibit_op2]#When the CY, IR, or HPM__n__ bit in the `mcountinhibit` register is clear,
the `mcycle`, `minstret`, or `mhpmcountern` register increments as usual.
When the CY, IR, or HPM__n__ bit is set, the corresponding counter does
not increment.#'''
zh = '''
[#norm:mcounterinhibit_op2]##当 `mcountinhibit` 寄存器中的 CY、IR 或 HPM__n__ 位为 0 时，`mcycle`、`minstret` 或 `mhpmcountern` 寄存器按正常方式递增。当 CY、IR 或 HPM__n__ 位被置位时，相应计数器不递增。##'''
