en = '''
While it was not the intention of IEEE 754-2008 to have FP16 be an arithmetic
format, it is supported by the standard. Even though IEEE 754 WG recognized that
FP16 was gaining popularity, the working group decided to hold off on making it
a basic format in IEEE 754-2019. This means that an IEEE 754-2019 compliant
implementation of binary floating point, which needs to support at least one
basic format, cannot support only FP16 -- it needs to support at least one of
binary32, binary64, and binary128.'''
zh = '''
虽然 IEEE 754-2008 的本意并不是让 FP16 成为一种算术格式，但该标准仍支持它。尽管 IEEE 754 工作组认识到 FP16 正日益流行，但工作组决定暂不在 IEEE 754-2019 中将其设为基本格式。这意味着，符合 IEEE 754-2019 的二进制浮点实现（需要支持至少一种基本格式）不能仅支持 FP16——它需要支持 binary32、binary64 和 binary128 中的至少一种。'''
