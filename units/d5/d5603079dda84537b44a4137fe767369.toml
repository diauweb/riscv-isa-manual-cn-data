en = '''
Because overflow is ignored when summing `htimedelta` and `time`, large
values of `htimedelta` may be used to represent negative time offsets.'''
zh = '''
由于对 `htimedelta` 和 `time` 求和时忽略上溢，因此可使用较大的 `htimedelta` 值来表示负时间偏移。'''
