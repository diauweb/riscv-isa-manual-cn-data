en = '''
[#norm:Zilsd_RVWMO_exc_misaligned]#For the purposes of RVWMO and exception handling, insn:ld[] and insn:sd[] instructions are
considered to be misaligned loads and stores#, with one additional constraint:
[#norm:Zilsd_align4_two_4byte]#an insn:ld[] or insn:sd[] instruction whose effective address is a multiple of 4 gives rise
to two 4-byte memory operations.#'''
zh = '''
[#norm:Zilsd_RVWMO_exc_misaligned]#就 RVWMO 和异常处理而言，insn:ld[] 和 insn:sd[] 指令被视为非对齐的加载和存储#，并附加一条约束：
[#norm:Zilsd_align4_two_4byte]#有效地址为 4 的倍数的 insn:ld[] 或 insn:sd[] 指令会产生两次 4 字节内存操作。#'''
