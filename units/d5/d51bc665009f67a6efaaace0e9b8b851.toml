en = '''
All instructions that are microarchitectural HINTs in RV32I (see
<<rv32>>) are also HINTs in RV64I.#
(((RV64I, HINT)))
The additional computational instructions in RV64I expand both the
standard and custom HINT encoding spaces.'''
