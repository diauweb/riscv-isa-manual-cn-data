en = '''
The term _indirect jump_ is used to refer to a insn:jalr[] instruction with _rd_=`x0`
and where the _rs1_ is not `x1` or `x5` (i.e., not a return). A insn:c.jr[]
instruction where _rs1_ is not `x1` or `x5` (i.e., not a return) is an
indirect jump.'''
zh = '''
术语_间接跳转_用于指代 _rd_=`x0` 且 _rs1_ 不是 `x1` 或 `x5`（即非返回）的 insn:jalr[] 指令。_rs1_ 不是 `x1` 或 `x5`（即非返回）的 insn:c.jr[] 指令是间接跳转。'''
