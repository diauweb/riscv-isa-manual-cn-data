en = '''
[#norm:mstatus_sd_acc]#The csr::[sd] bit is a read-only bit# that
[#norm:mstatus_sd_summary_op]#summarizes whether either the csr::[fs], csr::[vs],
or csr::[xs] fields signal the presence of some dirty state that will require
saving extended user context to memory.#
[#norm:mstatus_sd_rdonly0]#If csr::[fs], csr::[vs], and csr::[xs] are all read-only zero, then csr::[sd] is also always zero.#'''
