en = '''
This chapter describes the ext:zfh[] standard extension for _half-precision_
floating-point, which adds computational instructions compliant with the IEEE
754-2008 arithmetic standard's binary16 format and operations. The ext:zfh[] extension
depends on the ext:f[] extension. The NaN-boxing scheme described in <<nanboxing>> is
extended to allow a half-precision value to be NaN-boxed inside a
single-precision value (which may be recursively NaN-boxed inside a double- or
quad-precision value when the ext:d[] or ext:q[] extension is present).'''
zh = '''
本章描述用于__半精度__浮点的 ext:zfh[] 标准扩展，它添加了符合 IEEE 754-2008 算术标准 binary16 格式和操作的计算指令。ext:zfh[] 扩展依赖于 ext:f[] 扩展。<<nanboxing>> 中描述的 NaN 装箱方案被扩展为允许半精度值 NaN 装箱在单精度值内（当存在 ext:d[] 或 ext:q[] 扩展时，该单精度值可以递归地 NaN 装箱在双精度或四精度值内）。'''
