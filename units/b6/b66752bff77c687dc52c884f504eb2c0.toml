en = '''
[#norm:ctr_ccounter_reset]#The CtrCycleCounter is reset on writes to `__x__ctrctl`, and on execution of SCTRCLR, to ensure that any accumulated cycle counts do not persist across a context switch.#'''
zh = '''
[#norm:ctr_ccounter_reset]#CtrCycleCounter 在写入 `__x__ctrctl` 时以及在执行 SCTRCLR 时复位，以确保任何累积的周期计数不会跨上下文切换持续存在。#'''
