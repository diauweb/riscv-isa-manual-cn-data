en = '''
The implemented number and width of these additional counters, and the
set of events they count, are platform-specific. Accessing an
unimplemented counter may cause an illegal-instruction exception or may
return a constant value. If the configuration used to select the events
counted by a counter is misconfigured, the counter may return a constant
value.'''
zh = '''
这些额外计数器的实现数量和宽度以及它们所计数的事件集合都是平台特定的。访问未实现的计数器可能引起非法指令异常，也可能返回常量值。如果用于选择计数器所计数事件的配置有误，计数器可能返回常量值。'''
