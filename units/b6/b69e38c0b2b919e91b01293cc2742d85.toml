en = '''
[#norm:c-jalr_op]#C.JALR (jump and link register) performs the same operation as C.JR, but
additionally writes the address of the instruction following the jump
(`pc`+2) to the link register, `x1`. C.JALR expands to
`jalr x1, 0(rs1)`.#
[#norm:c-jalr_ebreak]#C.JALR is valid only when
_rs1_≠`x0`; the code point with
_rs1_=`x0` corresponds to the C.EBREAK
instruction.#'''
zh = '''
[#norm:c-jalr_op]##C.JALR（跳转并链接寄存器）执行与 C.JR 相同的操作，但此外还将跳转之后指令的地址（`pc`+2）写入链接寄存器 `x1`。C.JALR 展开为 `jalr x1, 0(rs1)`。##
[#norm:c-jalr_ebreak]##C.JALR 仅在 _rs1_≠`x0` 时有效；_rs1_=`x0` 的编码点对应于 C.EBREAK 指令。##'''
