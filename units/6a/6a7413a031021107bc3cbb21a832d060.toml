status = "machine"
en = '''
[NOTE]
====
Implementations with S-mode but without the ext:f[] extension are permitted,
but not required, to make the csr::[fs] field be read-only zero. Some such
implementations will choose _not_ to have the csr::[fs] field be read-only
zero, so as to enable emulation of the ext:f[] extension for both S-mode and
U-mode via invisible traps into M-mode.
===='''
zh = '''
[NOTE]
====
允许但不要求具有 S 模式而无 ext:f[] 扩展的实现将 csr::[fs] 字段设为只读零。某些此类实现会选择__不__将 csr::[fs] 字段设为只读零，以便通过陷入 M 模式的不可见陷阱，为 S 模式和 U 模式模拟 ext:f[] 扩展。
===='''
