<<hgatp-mode>> 展示了当 HSXLEN=32 和 HSXLEN=64 时 MODE 字段的编码。当 MODE=Bare 时，客户机物理地址等于监管者物理地址，且除 <<pmp>> 中所述的物理内存保护方案外，对客户机虚拟机没有进一步的内存保护。在此情况下，`hgatp` 中其余字段必须置零。

当 HSXLEN=32 时，MODE 的唯一其他有效设置为 Sv32x4，它是对通常 Sv32 分页虚拟内存方案的修改，扩展以支持 34 位客户机物理地址。当 HSXLEN=64 时，模式 Sv39x4、Sv48x4 和 Sv57x4 被定义为 Sv39、Sv48 和 Sv57 分页虚拟内存方案的修改。所有这些分页虚拟内存方案在 <<guest-addr-translation>> 中描述。

当 HSXLEN=64 时，其余 MODE 设置保留供未来使用，并可能为 `hgatp` 中的其他字段定义不同的解释。

[[hgatp-mode]]
.`hgatp` MODE 字段的编码。
[%autowidth,float="center",align="center",cols="^,^,<",options="header"]
|===
3+|HSXLEN=32
|值 |名称 |描述
|0 +
1
|Bare +
Sv32x4
|无转换或保护。 +
基于页的 34 位虚拟寻址（Sv32 的 2 位扩展）。
3+s|HSXLEN=64
|值 |名称 |描述
|0 +
1-7 +
8 +
9 +
10 +
11-15
|Bare +
— +
Sv39x4 +
Sv48x4 +
Sv57x4 +
—
|无转换或保护。 +
_保留_ +
基于页的 41 位虚拟寻址（Sv39 的 2 位扩展）。 +
基于页的 50 位虚拟寻址（Sv48 的 2 位扩展）。 +
基于页的 59 位虚拟寻址（Sv57 的 2 位扩展）。 +
_保留_
|===

当 HSXLEN=64 时，实现不要求支持所有已定义的 MODE 设置。

以不受支持的 MODE 值写入 `hgatp` 不会像 `satp` 那样被忽略。相反，`hgatp` 的字段在如此指示时以常规方式为 *WARL*。

如 <<guest-addr-translation>> 所述，对于分页虚拟内存方案（Sv32x4、Sv39x4、Sv48x4 和 Sv57x4），根页表为 16 KiB，且必须对齐到 16 KiB 边界。在这些模式下，`hgatp` 中物理页号（PPN）的最低两位始终读为 0。仅支持已定义的分页虚拟内存方案和/或 Bare 的实现可将 PPN[1:0] 设为只读 0。

VMID 位数未规定，且可为零。已实现的 VMID 位数称为_VMIDLEN_，可通过向 VMID 字段的每个位位置写 1，然后从 `hgatp` 读回值以查看 VMID 字段中哪些位位置保持为 1 来确定。VMID 的最低有效位首先实现：也就是说，若 VMIDLEN > 0，则 VMID[VMIDLEN-1:0] 可写。VMIDLEN 的最大值称为 VMIDMAX，对于 Sv32x4 为 7，对于 Sv39x4、Sv48x4 和 Sv57x4 为 14。

就地址转换算法而言，`hgatp` 寄存器被视为_活动_，_除非_有效特权模式为 U 且 `hstatus`.HU=0。

[NOTE]
