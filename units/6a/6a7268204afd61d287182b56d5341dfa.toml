==== 虚拟机监控器陷阱指令寄存器（`htinst`）

`htinst` 寄存器是一个 HSXLEN 位读/写寄存器，格式如 <<htinstreg>> 所示。当陷入 HS 模式时，`htinst` 写入一个值，若非零，则提供关于引发陷阱的指令的信息，以协助软件处理陷阱。在陷阱时可能写入 `htinst` 的值记录于 <<tinst-vals>>。

[[htinstreg]]
.虚拟机监控器陷阱指令寄存器（`htinst`）。
