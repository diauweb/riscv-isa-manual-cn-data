(draw-box "HSXLEN" {:span 32 :borders {}})
----

`htinst` 是一个 *WARL* 寄存器，仅需要能够保存实现在陷阱时可能自动写入的值。

[[hgatp]]
==== 虚拟机监控器客户机地址转换和保护寄存器（`hgatp`）

`hgatp` 寄存器是一个 HSXLEN 位读/写寄存器，当 HSXLEN=32 时格式如 <<rv32hgatp>> 所示，当 HSXLEN=64 时格式如 <<rv64hgatp>> 所示，控制 G 阶段地址转换和保护，即客户机虚拟地址两阶段转换的第二阶段（见 <<two-stage-translation>>）。与 CSR `satp` 类似，此寄存器保存客户机物理根页表的物理页号（PPN）；虚拟机标识符（VMID），便于按虚拟机进行地址转换屏障；以及 MODE 字段，为客户机物理地址选择地址转换方案。当 `mstatus`.TVM=1 时，在 HS 模式下执行时尝试读取或写入 `hgatp` 将引发非法指令异常。

