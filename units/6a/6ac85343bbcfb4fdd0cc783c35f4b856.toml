en = '''
The pointer alignment in bits must be no smaller than MXLEN:
i.e., if MXLEN is
latexmath:[$8\times n$], then `mconfigptr`[latexmath:[$\log_2n$]-1:0]
must be zero.'''
zh = '''
指针的位对齐不得小于 MXLEN：即，若 MXLEN 为 latexmath:[$8\times n$]，则 `mconfigptr`[latexmath:[$\log_2n$]-1:0] 必须为零。'''
