en = '''
.Currently allocated RISC-V supervisor-level CSR addresses
[%autowidth,float="center",align="center",cols="<,<,<,<",options="header"]
|===
|Number |Privilege |Name |Description
4+^|Supervisor Trap Setup

|`0x100` |SRW |csr:sstatus[]    |Supervisor status register
|`0x104` |SRW |csr:sie[]        |Supervisor interrupt-enable register
|`0x105` |SRW |csr:stvec[]      |Supervisor trap handler base address
|`0x106` |SRW |csr:scounteren[] |Supervisor counter enable

4+^|Supervisor Configuration

|`0x10A` |SRW |csr:senvcfg[] |Supervisor environment configuration register

4+^|Supervisor Counter Setup

|`0x120` |SRW |csr:scountinhibit[] |Supervisor counter-inhibit register

4+^|Supervisor Trap Handling

|`0x140` |SRW |csr:sscratch[]  |Supervisor scratch register
|`0x141` |SRW |csr:sepc[]      |Supervisor exception program counter
|`0x142` |SRW |csr:scause[]    |Supervisor trap cause
|`0x143` |SRW |csr:stval[]     |Supervisor trap value
|`0x144` |SRW |csr:sip[]       |Supervisor interrupt pending
|`0xDA0` |SRO |csr:scountovf[] |Supervisor count overflow

4+^|Supervisor Indirect

|`0x150` |SRW |csr:siselect[] |Supervisor indirect register select
|`0x151` |SRW |csr:sireg[]    |Supervisor indirect register alias
|`0x152` |SRW |csr:sireg2[]   |Supervisor indirect register alias 2
|`0x153` |SRW |csr:sireg3[]   |Supervisor indirect register alias 3
|`0x155` |SRW |csr:sireg4[]   |Supervisor indirect register alias 4
|`0x156` |SRW |csr:sireg5[]   |Supervisor indirect register alias 5
|`0x157` |SRW |csr:sireg6[]   |Supervisor indirect register alias 6

4+^|Supervisor Protection and Translation

|`0x180` |SRW |csr:satp[] |Supervisor address translation and protection

4+^|Supervisor Timer Compare

|`0x14D` |SRW |csr:stimecmp[]  |Supervisor timer compare
|`0x15D` |SRW |csr:stimecmph[] |Upper qty:32[bits] of csr:stimecmp[], RV32 only

4+^|Debug/Trace Registers

|`0x5A8` |SRW |csr:scontext[] |Supervisor-mode context register

4+^|Supervisor Resource Management Configuration

|`0x181` |SRW |csr:srmcfg[] |Supervisor Resource Management Configuration

4+^|Supervisor State Enable Registers

|`0x10C` |SRW |csr:sstateen0[] |Supervisor State Enable 0 Register
|`0x10D` |SRW |csr:sstateen1[] |Supervisor State Enable 1 Register
|`0x10E` |SRW |csr:sstateen2[] |Supervisor State Enable 2 Register
|`0x10F` |SRW |csr:sstateen3[] |Supervisor State Enable 3 Register

4+^|Supervisor Control Transfer Records Configuration

|`0x14E` |SRW |csr:sctrctl[]    |Supervisor Control Transfer Records Control Register
|`0x14F` |SRW |csr:sctrstatus[] |Supervisor Control Transfer Records Status Register
|`0x15F` |SRW |csr:sctrdepth[]  |Supervisor Control Transfer Records Depth Register

