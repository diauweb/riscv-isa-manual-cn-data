en = '''
The csr:cycle[] and csr:instret[] counters serve to support user mode self-profiling usages, wherein a user can read the counter(s) twice and compute the delta(s) to evaluate user software performance and behavior.  By default, these counters are not filtered by privilege mode, and thus they continue to increment while traps (e.g., page faults or interrupts) to more privileged code are handled.  This causes two problems:'''
zh = '''
csr:cycle[] 和 csr:instret[] 计数器用于支持用户模式自剖析（self-profiling）用途，其中用户可以读取计数器两次并计算差值，以评估用户软件的性能和行为。默认情况下，这些计数器不按特权模式进行过滤，因此当处理陷入（例如缺页异常或中断）到更高特权级代码时，它们会继续递增。这会导致两个问题：'''
