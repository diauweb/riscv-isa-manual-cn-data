en = '''
[#norm:mip_mtip_mie_mtie_op]#Bits csr:mip[mtip] and csr:mie[mtie] are the interrupt-pending and
interrupt-enable bits for machine timer interrupts.#
[#norm:mip_mtip_rdonly]#csr::[mtip] is read-only in the csr:mip[] register, and is cleared by writing to
the memory-mapped machine-mode timer compare register.#'''
zh = '''
[#norm:mip_mtip_mie_mtie_op]#位 csr:mip[mtip] 和 csr:mie[mtie] 是机器定时器中断的中断挂起位和中断使能位。#
[#norm:mip_mtip_rdonly]#csr::[mtip] 在 csr:mip[] 寄存器中为只读，通过写入内存映射的机器模式定时器比较寄存器来清除。#'''
