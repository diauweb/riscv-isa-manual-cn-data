en = '''
If the Shtvala extension is implemented, `htval` must be written with the
faulting guest physical address in all circumstances permitted by the ISA.'''
zh = '''
若实现了 Shtvala 扩展，则在 ISA 允许的所有情况下，都应将引发故障的客户机物理地址写入 `htval`。'''
