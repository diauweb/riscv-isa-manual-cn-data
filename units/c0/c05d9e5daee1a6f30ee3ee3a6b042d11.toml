en = '''
[#norm:menvcfg_adue_fence]#After changing `menvcfg`.ADUE, executing an SFENCE.VMA instruction with
_rs1_=`x0` and _rs2_=`x0` suffices to synchronize address-translation caches
with respect to the altered interpretation of page-table entries' A/D bits.#
See <<hyp-mm-fences>> for additional synchronization requirements when the
hypervisor extension is implemented.'''
zh = '''
[#norm:menvcfg_adue_fence]#在改变 `menvcfg`.ADUE 之后，执行一条 _rs1_=`x0` 且 _rs2_=`x0` 的 SFENCE.VMA 指令，就足以使地址转换缓存相对于对页表项 A/D 位解释的改变进行同步。# 当实现了 hypervisor 扩展时，有关额外的同步要求，见 <<hyp-mm-fences>>。'''
