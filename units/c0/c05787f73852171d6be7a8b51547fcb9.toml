en = '''
[#norm:mstatus_sd_acc]#The SD bit is a read-only bit# that
[#norm:mstatus_sd_op1]#summarizes whether either the FS, VS,
or XS fields signal the presence of some dirty state that will require
saving extended user context to memory.#
[#norm:mstatus_sd_rdonly0]#If FS, XS, and VS are all read-only zero, then SD is also always zero.#'''
zh = '''
[#norm:mstatus_sd_acc]#SD 位是一个只读位#，[#norm:mstatus_sd_op1]#用于汇总 FS、VS 或 XS 字段中是否有任何一个指示存在某些脏状态，从而需要将扩展用户上下文保存到内存。#
[#norm:mstatus_sd_rdonly0]#如果 FS、XS 和 VS 全部为只读零，则 SD 也始终为零。#'''
