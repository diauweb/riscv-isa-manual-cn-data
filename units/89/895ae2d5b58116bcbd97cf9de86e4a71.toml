en = '''
[#norm:hpmcounter_op_sz_mode]#The Zihpm extension comprises up to 29 additional unprivileged 64-bit
hardware performance counters, `hpmcounter3-hpmcounter31`.# [#norm:hpm_counter_op_sz_mode_xlen32]#When
XLEN=32, the upper 32 bits of these performance counters are accessible
via additional CSRs `hpmcounter3h- hpmcounter31h`.# [#norm:hpm_counter_op_sz_mode_dependency]#The Zihpm extension
depends on the Zicsr extension.#'''
zh = '''
[#norm:hpmcounter_op_sz_mode]##Zihpm 扩展包含多达 29 个额外的非特权 64 位硬件性能计数器 `hpmcounter3-hpmcounter31`。## [#norm:hpm_counter_op_sz_mode_xlen32]##当 XLEN=32 时，这些性能计数器的高 32 位可通过额外的 CSR `hpmcounter3h- hpmcounter31h` 访问。## [#norm:hpm_counter_op_sz_mode_dependency]##Zihpm 扩展依赖于 Zicsr 扩展。##'''
