----

A synchronous trap that has been delegated to HS-mode (using `medeleg`)
is further delegated to VS-mode if V=1 before the trap and the
corresponding `hedeleg` bit is set. Each bit of `hedeleg` shall be
either writable or read-only zero. Many bits of `hedeleg` are required
specifically to be writable or zero, as enumerated in
<<hedeleg-bits>>. Bit 0, corresponding to
instruction address misaligned exceptions, must be writable if
IALIGN=32.

[NOTE]
===='''
zh = '''
====

VSBE 位是一个 *WARL* 字段，控制从 VS 模式所做显式内存访问的字节序。若 VSBE=0，则从 VS 模式所做的显式加载和存储内存访问为小端序；若 VSBE=1，则为大端序。VSBE 还控制对 VS 级内存管理数据结构（如页表）的所有隐式访问的字节序。实现可使 VSBE 成为只读字段，始终指定与 HS 模式相同的字节序。

==== 虚拟机监控器陷阱委托寄存器（`hedeleg` 和 `hideleg`）

寄存器 `hedeleg` 是一个 64 位读/写寄存器，格式如 <<hedelegreg>> 所示。寄存器 `hideleg` 是一个 HSXLEN 位读/写寄存器，格式如 <<hidelegreg>> 所示。默认情况下，任何特权级的所有陷阱都在 M 模式中处理，尽管 M 模式通常使用 `medeleg` 和 `mideleg` CSR 将一些陷阱委托给 HS 模式。`hedeleg` 和 `hideleg` CSR 允许将这些陷阱进一步委托给 VS 模式客户机；其布局与 `medeleg` 和 `mideleg` 相同。

