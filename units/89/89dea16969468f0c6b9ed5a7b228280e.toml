(draw-box "HSXLEN" {:span 32 :borders {}})
----

使用 `medeleg` 委托给 HS 模式的同步陷阱，若在陷阱之前 V=1 且相应的 `hedeleg` 位被置位，则进一步委托给 VS 模式。`hedeleg` 的每一位应为可写或只读 0。`hedeleg` 的许多位被特别要求为可写或为零，如 <<hedeleg-bits>> 所列举。位 0 对应指令地址非对齐异常，若 IALIGN=32 则必须可写。

[NOTE]
