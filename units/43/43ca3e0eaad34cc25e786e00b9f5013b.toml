en = '''
For the purposes of RVWMO and exception handling, C.LD[SP] and C.SD[SP] instructions are
considered to be misaligned loads and stores, with one additional constraint:
a C.LD[SP] or C.SD[SP] instruction whose effective address is a multiple of 4 gives rise
to two 4-byte memory operations.'''
zh = '''
就 RVWMO 和异常处理而言，C.LD[SP] 和 C.SD[SP] 指令
被视为非对齐加载和存储，并附加一项约束：
有效地址为 4 的倍数的 C.LD[SP] 或 C.SD[SP] 指令会产生
两次 4 字节存储器操作。'''
