en = '''
The ext:zmmul[] extension implements the multiplication subset of the M
extension. It adds all of the instructions defined in
extlink:m[], namely: MUL, MULH, MULHU,
MULHSU, and (for RV64 only) MULW. The encodings are identical to those
of the corresponding M-extension instructions.
ext:m[] implies ext:zmmul[].
(((MUL, Zmmul)))'''
zh = '''
ext:zmmul[] 扩展实现了 M 扩展的乘法子集。它添加了 extlink:m[] 中定义的所有指令，即：MUL、MULH、MULHU、MULHSU 以及（仅 RV64）MULW。其编码与相应的 M 扩展指令相同。ext:m[] 蕴含 ext:zmmul[]。
(((MUL, Zmmul)))'''
