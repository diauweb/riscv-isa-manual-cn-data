==== Overlapping-Address Orderings (<<overlapping-ordering, Rules 1-3>>)

[NOTE]
===='''
zh = '''
====

进展公理确保最小向前进展保证。它确保来自一个硬件线程的存储最终将在有限时间内对其他硬件线程可见，并且来自其他硬件线程的加载最终能够读取这些值（或其后续值）。没有这条规则，例如，自旋锁就可能在某个值上无限自旋，即使另一个硬件线程的存储正在等待解锁该自旋锁。

进展公理不打算对 RISC-V 实现中的硬件线程施加任何其他公平性、延迟或服务质量概念。任何更强的公平性概念由 ISA 其余部分和/或平台和/或设备来定义和实现。

向前进展公理在几乎所有情况下都会被任何标准缓存一致性协议自然满足。具有非一致性缓存的实现可能必须提供某种其他机制，以确保所有存储（或其后续值）最终对所有硬件线程可见。

