zh = '''
.当前已分配的 RISC-V 监管级 CSR 地址
[%autowidth,float="center",align="center",cols="<,<,<,<",options="header"]
|===
|编号 |权限 |名称 |描述
4+^|监管级陷阱设置

|`0x100` |SRW |csr:sstatus[]    |监管级状态寄存器
|`0x104` |SRW |csr:sie[]        |监管级中断使能寄存器
|`0x105` |SRW |csr:stvec[]      |监管级陷阱处理程序基址
|`0x106` |SRW |csr:scounteren[] |监管级计数器使能
|`0x114` |SRW |csr:sieh[]       |csr:sie[] 的高 qty:32[bits]，仅 RV32

4+^|监管级配置

|`0x10A` |SRW |csr:senvcfg[] |监管级环境配置寄存器

4+^|监管级计数器设置

|`0x120` |SRW |csr:scountinhibit[] |监管级计数器抑制寄存器

4+^|监管级陷阱处理

|`0x140` |SRW |csr:sscratch[]  |监管级暂存寄存器
|`0x141` |SRW |csr:sepc[]      |监管级异常程序计数器
|`0x142` |SRW |csr:scause[]    |监管级陷阱原因
|`0x143` |SRW |csr:stval[]     |监管级陷阱值
|`0x144` |SRW |csr:sip[]       |监管级中断挂起
|`0x154` |SRW |csr:siph[]      |csr:sip[] 的高 qty:32[bits]，仅 RV32
|`0x15C` |SRW |csr:stopei[]    |监管级最高外部中断
|`0xDA0` |SRO |csr:scountovf[] |监管级计数溢出
|`0xDB0` |SRO |csr:stopi[]     |监管级最高中断

4+^|监管级间接

|`0x150` |SRW |csr:siselect[] |监管级间接寄存器选择
|`0x151` |SRW |csr:sireg[]    |监管级间接寄存器别名
|`0x152` |SRW |csr:sireg2[]   |监管级间接寄存器别名 2
|`0x153` |SRW |csr:sireg3[]   |监管级间接寄存器别名 3
|`0x155` |SRW |csr:sireg4[]   |监管级间接寄存器别名 4
|`0x156` |SRW |csr:sireg5[]   |监管级间接寄存器别名 5
|`0x157` |SRW |csr:sireg6[]   |监管级间接寄存器别名 6

4+^|监管级保护与转换

|`0x180` |SRW |csr:satp[] |监管级地址转换与保护

4+^|监管级定时器比较

|`0x14D` |SRW |csr:stimecmp[]  |监管级定时器比较
|`0x15D` |SRW |csr:stimecmph[] |csr:stimecmp[] 的高 qty:32[bits]，仅 RV32

4+^|调试/跟踪寄存器

|`0x5A8` |SRW |csr:scontext[] |监管模式上下文寄存器

4+^|监管级资源管理配置

|`0x181` |SRW |csr:srmcfg[] |监管级资源管理配置

4+^|监管级状态使能寄存器

|`0x10C` |SRW |csr:sstateen0[] |监管级状态使能 0 寄存器
|`0x10D` |SRW |csr:sstateen1[] |监管级状态使能 1 寄存器
|`0x10E` |SRW |csr:sstateen2[] |监管级状态使能 2 寄存器
|`0x10F` |SRW |csr:sstateen3[] |监管级状态使能 3 寄存器

4+^|监管级控制转移记录配置

|`0x14E` |SRW |csr:sctrctl[]    |监管级控制转移记录控制寄存器
|`0x14F` |SRW |csr:sctrstatus[] |监管级控制转移记录状态寄存器
|`0x15F` |SRW |csr:sctrdepth[]  |监管级控制转移记录深度寄存器

