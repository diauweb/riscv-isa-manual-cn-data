|`0x140` |SRW |csr:sscratch[]  |Supervisor scratch register
|`0x141` |SRW |csr:sepc[]      |Supervisor exception program counter
|`0x142` |SRW |csr:scause[]    |Supervisor trap cause
|`0x143` |SRW |csr:stval[]     |Supervisor trap value
|`0x144` |SRW |csr:sip[]       |Supervisor interrupt pending
|`0x154` |SRW |csr:siph[]      |Upper qty:32[bits] of csr:sip[], RV32 only
|`0x15C` |SRW |csr:stopei[]    |Supervisor top external interrupt
|`0xDA0` |SRO |csr:scountovf[] |Supervisor count overflow
|`0xDB0` |SRO |csr:stopi[]     |Supervisor top interrupt

4+^|Supervisor Indirect

|`0x150` |SRW |csr:siselect[] |Supervisor indirect register select
|`0x151` |SRW |csr:sireg[]    |Supervisor indirect register alias
|`0x152` |SRW |csr:sireg2[]   |Supervisor indirect register alias 2
|`0x153` |SRW |csr:sireg3[]   |Supervisor indirect register alias 3
|`0x155` |SRW |csr:sireg4[]   |Supervisor indirect register alias 4
|`0x156` |SRW |csr:sireg5[]   |Supervisor indirect register alias 5
|`0x157` |SRW |csr:sireg6[]   |Supervisor indirect register alias 6

4+^|Supervisor Protection and Translation

|`0x180` |SRW |csr:satp[] |Supervisor address translation and protection

4+^|Supervisor Timer Compare

|`0x14D` |SRW |csr:stimecmp[]  |Supervisor timer compare
|`0x15D` |SRW |csr:stimecmph[] |Upper qty:32[bits] of csr:stimecmp[], RV32 only

4+^|Debug/Trace Registers

|`0x5A8` |SRW |csr:scontext[] |Supervisor-mode context register

