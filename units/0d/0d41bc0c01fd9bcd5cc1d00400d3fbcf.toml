en = '''
Shifts by a constant are encoded as a specialization of the I-type
format. The operand to be shifted is in _rs1_, and the shift amount is
encoded in the lower 5 bits of the I-immediate field. The right-shift
type is encoded in bit 30.
[#norm:slli_op]#insn:slli[] is a logical left shift (zeros are shifted into the lower bits);#
[#norm:srli_op]#insn:srli[] is a logical right shift (zeros are shifted into the upper bits);# and
[#norm:srai_op]#insn:srai[] is an arithmetic right shift (the original sign bit is copied into the vacated upper bits).#'''
zh = '''
按常量移位被编码为 I 型格式的一种特化形式。被移位的操作数在 _rs1_ 中，移位量编码在 I 立即数字段的低 5 位中。右移类型编码在第 30 位。
[#norm:slli_op]#insn:slli[] 是逻辑左移（零移入低位）；#
[#norm:srli_op]#insn:srli[] 是逻辑右移（零移入高位）；# 并且
[#norm:srai_op]#insn:srai[] 是算术右移（原始符号位复制到空出的高位）。#'''
