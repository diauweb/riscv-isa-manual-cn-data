en = '''
The pointer alignment in bits must be no smaller than MXLEN:
i.e., if MXLEN is
8{times}__n__, then `mconfigptr`[log~2n~-1:0]
must be zero.'''
zh = '''
指针的位对齐不得小于 MXLEN：即，如果 MXLEN 为 8{times}__n__，则 `mconfigptr`[log~2n~-1:0] 必须为零。'''
