en = '''
[NOTE]
====
[[cas]]
[source,asm]
.Sample code for compare-and-swap function using LR/SC.
        # a0 holds address of memory location
        # a1 holds expected value
        # a2 holds desired value
        # a0 holds return value, 0 if successful, !0 otherwise
    cas:
        lr.w t0, (a0)        # Load original value.
        bne t0, a1, fail     # Doesn't match, so fail.
        sc.w t0, a2, (a0)    # Try to update.
        bnez t0, cas         # Retry if store-conditional failed.
        li a0, 0             # Set return to success.
        jr ra                # Return.
    fail:
        li a0, 1             # Set return to failure.
        jr ra                # Return.

LR/SC can be used to construct lock-free data structures. An example
using LR/SC to implement a compare-and-swap function is shown in
<<cas>>. If inlined, compare-and-swap functionality need only take four instructions.
===='''
zh = '''
[NOTE]
====
[[cas]]
[source,asm]
.使用 LR/SC 的比较并交换函数示例代码。
        # a0 保存内存位置的地址
        # a1 保存期望值
        # a2 保存期望写入的值
        # a0 保存返回值，成功为 0，否则为 !0
    cas:
        lr.w t0, (a0)        # 加载原始值。
        bne t0, a1, fail     # 不匹配，因此失败。
        sc.w t0, a2, (a0)    # 尝试更新。
        bnez t0, cas         # 若条件存储失败则重试。
        li a0, 0             # 将返回值设为成功。
        jr ra                # 返回。
    fail:
        li a0, 1             # 将返回值设为失败。
        jr ra                # 返回。

LR/SC 可用于构建无锁数据结构。<<cas>> 中展示了使用 LR/SC 实现比较并交换函数的示例。若内联展开，比较并交换功能只需四条指令。
===='''
