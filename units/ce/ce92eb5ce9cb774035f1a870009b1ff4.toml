en = '''
An optional extension may comprise many individually named and
ratified extensions but a profile option requires that all constituent
extensions are present.  In particular, unless explicitly listed as a
profile option, individual extensions are not by themselves a profile
option even when required as part of a profile option.  For example,
the ext:zbkb[] extension is not by itself a profile option even though it is a
required component of the ext:zkn[] option.'''
zh = '''
一个可选扩展可能由许多单独命名并已批准的扩展组成，但配置文件选项要求所有组成扩展都存在。特别地，除非明确列为配置文件选项，否则单个扩展本身并不构成配置文件选项，即使它是某个配置文件选项的必需组成部分。例如，ext:zbkb[] 扩展本身不是配置文件选项，尽管它是 ext:zkn[] 选项的必需组成部分。'''
