en = '''
The RISC-V International ISA extension ratification process ensures that all
processor vendors have agreed to the specification of a standard extension if
present.  However, by themselves, the ISA extension specifications do not
guarantee that a certain set of standard extensions will be present in all
implementations.'''
zh = '''
RISC-V International 的 ISA 扩展批准流程确保所有处理器供应商在标准扩展存在时已就该扩展的规范达成一致。然而，ISA 扩展规范本身并不保证某一组标准扩展会出现在所有实现中。'''
