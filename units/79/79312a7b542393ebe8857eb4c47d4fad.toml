en = '''
csr::[mbe] controls whether non-instruction-fetch memory accesses made from
M-mode (assuming csr:mstatus[mprv]=0) are little-endian (csr::[mbe]=0) or
big-endian (csr::[mbe]=1).'''
zh = '''
csr::[mbe] 控制从 M 模式发起的非取指内存访问（假设 csr:mstatus[mprv]=0）是小端序（csr::[mbe]=0）还是大端序（csr::[mbe]=1）。'''
