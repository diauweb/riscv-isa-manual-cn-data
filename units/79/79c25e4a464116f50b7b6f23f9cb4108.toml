en = '''
Traps on `vmsbf.m` are always reported with a `vstart` of 0.  The
`vmsbf` instruction will raise an illegal instruction exception if
`vstart` is non-zero.'''
zh = '''
`vmsbf.m` 上的陷阱始终以 `vstart` 为 0 报告。如果 `vstart` 非零，`vmsbf` 指令将引发非法指令异常。'''
