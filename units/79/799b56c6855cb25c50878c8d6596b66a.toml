en = '''
New floating-point-to-floating-point conversion instructions are added.
These instructions are defined analogously to the double-precision
floating-point-to-floating-point conversion instructions. [#norm:fcvt-s-q_fcvt-q-s_op]#insn:fcvt.s.q[] or
insn:fcvt.q.s[] converts a quad-precision floating-point number to a
single-precision floating-point number, or vice-versa, respectively#.
[#norm:fcvt-d-q_fcvt-q-d_op]#insn:fcvt.d.q[] or insn:fcvt.q.d[] converts a quad-precision floating-point number to
a double-precision floating-point number, or vice-versa, respectively#.'''
zh = '''
新增浮点到浮点转换指令。这些指令的定义与双精度浮点到浮点转换指令类似。[#norm:fcvt-s-q_fcvt-q-s_op]##insn:fcvt.s.q[] 或 insn:fcvt.q.s[] 分别将四精度浮点数转换为单精度浮点数，或反之。## [#norm:fcvt-d-q_fcvt-q-d_op]##insn:fcvt.d.q[] 或 insn:fcvt.q.d[] 分别将四精度浮点数转换为双精度浮点数，或反之。##'''
