en = '''
Complex atomic memory operations on a single memory word or doubleword
are performed with the load-reserved (LR) and store-conditional (SC)
instructions. [#norm:lr_w_op]#LR.W loads a word from the address in _rs1_, places the
sign-extended value in _rd_, and registers a _reservation set_—a set of
bytes that subsumes the bytes in the addressed word.# [#norm:sc_w_success]#SC.W conditionally
writes a word in _rs2_ to the address in _rs1_: the SC.W succeeds only
if the reservation is still valid and the reservation set contains the
bytes being written. If the SC.W succeeds, the instruction writes the
word in _rs2_ to memory, and it writes zero to _rd_.# [#norm:sc_w_failure]#If the SC.W fails,
the instruction does not write to memory, and it writes a nonzero value
to _rd_.#
[#norm:sc_retire_permission]#No SC.W instruction shall retire unless it passes memory permission checks,#
[#norm:sc_failed_side_effects]#but it is UNSPECIFIED whether any side effects of implicit address translation
and protection memory accesses (such as setting a page-table entry D bit)
occur on a failed SC.W.#
[#norm:sc_failed_as_store]#For the purposes of memory protection, a failed SC.W may be
treated like a store.#
[#norm:sc_reservation_invalidate]#Regardless of success or failure, executing an
SC.W instruction invalidates any reservation held by this hart.# [#norm:lr_sc_rv64]#LR.D and
SC.D act analogously on doublewords and are only available on RV64. For
RV64, LR.W and SC.W sign-extend the value placed in _rd_.#'''
zh = '''
对单个内存字或双字的复杂原子内存操作通过加载保留（LR）和条件存储（SC）指令完成。[#norm:lr_w_op]#LR.W 从 _rs1_ 中的地址加载一个字，将符号扩展后的值放入 _rd_，并登记一个__保留集__——一个包含所寻址字中各字节的字节集合。# [#norm:sc_w_success]#SC.W 有条件地将 _rs2_ 中的一个字写入 _rs1_ 中的地址：仅当保留仍然有效且保留集包含正在写入的字节时，SC.W 才会成功。如果 SC.W 成功，该指令将 _rs2_ 中的字写入内存，并向 _rd_ 写入零。# [#norm:sc_w_failure]#如果 SC.W 失败，该指令不写入内存，并向 _rd_ 写入一个非零值。#
[#norm:sc_retire_permission]#任何 SC.W 指令都不得在未通过内存权限检查的情况下退休，#
[#norm:sc_failed_side_effects]#但失败的 SC.W 是否产生隐式地址转换与保护性内存访问的副作用（例如设置页表项 D 位）是未指定的。#
[#norm:sc_failed_as_store]#就内存保护而言，失败的 SC.W 可以像存储一样处理。#
[#norm:sc_reservation_invalidate]#无论成功还是失败，执行 SC.W 指令都会使该硬件线程持有的任何保留失效。# [#norm:lr_sc_rv64]#LR.D 和 SC.D 对双字的作用类似，且仅在 RV64 上可用。对于 RV64，LR.W 和 SC.W 会对放入 _rd_ 的值进行符号扩展。#'''
