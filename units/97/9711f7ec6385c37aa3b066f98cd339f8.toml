en = '''
Compare-and-swap (CAS) provides an easy and typically faster way to perform
thread synchronization operations when supported as a hardware instruction. CAS
is typically used by lock-free and wait-free algorithms. This extension defines
CAS instructions to operate on 32-bit, 64-bit, and 128-bit (RV64 only) data
values. The ext:zacas[] extension depends upon the ext:zaamo[] extension.'''
zh = '''
比较并交换（CAS）在作为硬件指令支持时，提供了一种简单且通常更快的执行线程同步操作的方法。CAS 通常被无锁（lock-free）和无等待（wait-free）算法使用。本扩展定义了用于对 32 位、64 位和 128 位（仅 RV64）数据值进行操作的 CAS 指令。ext:zacas[] 扩展依赖于 ext:zaamo[] 扩展。'''
