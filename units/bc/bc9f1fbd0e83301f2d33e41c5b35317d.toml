en = '''
All multi-letter extensions, including those with the ext:z[] prefix, must be
separated from other multi-letter extensions by an underscore: for example,
RV32IMACZicsr_Zifencei.'''
zh = '''
所有多字母扩展（包括带 ext:z[] 前缀的扩展）与其他多字母扩展之间都应以一条下划线分隔：例如，RV32IMACZicsr_Zifencei。'''
