en = '''
[#norm:pmp_region_granularity_g]#Although the PMP mechanism supports regions as small as four bytes,
platforms may specify coarser PMP regions. In general, the PMP grain is
2^G+2^ bytes and must be the same across all PMP regions.#
[#norm:pmp_na4_select_restriction]#When G {ge} 1, the NA4 mode is not selectable.# [#norm:pmp_napot_addr_read_mask]#When
G {ge} 2 and pmpcfg~i~.A[1] is set,
i.e. the mode is NAPOT, then bits pmpaddr~i~[G-2:0]
read as all ones.# [#norm:pmp_tor_off_addr_read_mask]#When G {ge} 1 and
pmpcfg~i~.A[1] is clear, i.e. the mode is OFF or TOR,
then bits pmpaddr~i~[G-1:0] read as all zeros. Bits
pmpaddr~i~[G-1:0] do not affect the TOR address-matching logic.#
[#norm:pmp_addr_retention_on_mode_change]#Although changing pmpcfg~i~.A[1] affects the value
read from pmpaddr~i~, it does not affect the
underlying value stored in that register—in particular,
pmpaddr~i~[G-1] retains its original value when
pmpcfg~i~.A is changed from NAPOT to TOR/OFF then
back to NAPOT.#'''
zh = '''
[#norm:pmp_region_granularity_g]##尽管 PMP 机制支持小至四字节的区域，平台可指定更粗粒度的 PMP 区域。通常，PMP 粒度为 2^G+2^ 字节，且在全部 PMP 区域中必须相同。##
[#norm:pmp_na4_select_restriction]##当 G {ge} 1 时，NA4 模式不可选。## [#norm:pmp_napot_addr_read_mask]##当 G {ge} 2 且 pmpcfg~i~.A[1] 被置位，即模式为 NAPOT 时，位 pmpaddr~i~[G-2:0] 读取为全 1。## [#norm:pmp_tor_off_addr_read_mask]##当 G {ge} 1 且 pmpcfg~i~.A[1] 为 0，即模式为 OFF 或 TOR 时，则位 pmpaddr~i~[G-1:0] 读取为全 0。位 pmpaddr~i~[G-1:0] 不影响 TOR 地址匹配逻辑。##
[#norm:pmp_addr_retention_on_mode_change]##尽管更改 pmpcfg~i~.A[1] 会影响从 pmpaddr~i~ 读取的值，但它不影响该寄存器中存储的底层值——特别是，当 pmpcfg~i~.A 从 NAPOT 更改为 TOR/OFF 再回到 NAPOT 时，pmpaddr~i~[G-1] 保留其原始值。##'''
