en = '''
FMV.X.Q and FMV.Q.X instructions are not provided in RV32 or RV64, so
quad-precision bit patterns must be moved to the integer registers via
memory.'''
zh = '''
RV32 或 RV64 中未提供 FMV.X.Q 和 FMV.Q.X 指令，因此四精度位模式必须通过内存移动到整数寄存器。'''
