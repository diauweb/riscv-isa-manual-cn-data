en = '''
A insn:fence[] instruction may be used to order the memory read access and, if
produced, the memory write access by an insn:amocas.w/d/q[] instruction.'''
zh = '''
可使用 insn:fence[] 指令对 insn:amocas.w/d/q[] 指令的内存读访问以及（若产生）内存写访问进行排序。'''
