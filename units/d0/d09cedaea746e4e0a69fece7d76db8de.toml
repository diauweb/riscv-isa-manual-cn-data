en = '''
[#norm:D_flen_64]#The D extension widens the 32 floating-point registers,
`f0-f31`, to 64 bits (FLEN=64 in <<fprs>>)#. The `f` registers can now hold
either 32-bit or 64-bit floating-point values as described below in
<<nanboxing>>.'''
zh = '''
[#norm:D_flen_64]#D 扩展将 32 个浮点寄存器 `f0-f31` 加宽到 64 位（在 <<fprs>> 中 FLEN=64）#。`f` 寄存器现在可以保存 32 位或 64 位浮点值，如下文 <<nanboxing>> 所述。'''
