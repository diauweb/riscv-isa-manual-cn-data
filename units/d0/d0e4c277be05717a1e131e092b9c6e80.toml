注意，写入 `hgatp` 不意味着页表更新与随后的 G 阶段地址转换之间存在任何排序约束。若新虚拟机的客户机物理页表已被修改，或若某个 VMID 被重用，则可能需要在写入 `hgatp` 之前或之后执行 HFENCE.GVMA 指令（见 <<hfence.vma>>）。

==== 虚拟监管者状态寄存器（`vsstatus`）

