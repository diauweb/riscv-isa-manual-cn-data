UXL 字段控制 VU 模式的有效 XLEN，它可能与 VS 模式的 XLEN（VSXLEN）不同。当 VSXLEN=32 时，UXL 字段不存在，且 VU 模式 XLEN=32。当 VSXLEN=64 时，UXL 是一个 *WARL* 字段，其编码与 `misa` 的 MXL 字段相同，如 <<misabase>> 所示。特别地，实现可使 UXL 成为 `hstatus` 字段 VSXL 的只读副本，强制 VU 模式 XLEN=VSXLEN。

若将 VSXLEN 从 32 改为更宽的宽度，且字段 UXL 未被限制为单个值，则其取值对应于不超过新 VSXLEN 的最宽受支持宽度。

当 V=1 时，`vsstatus`.FS 和 HS 级 `sstatus`.FS 均生效。当任一字段为 0（关）时尝试执行浮点指令将引发非法指令异常。当 V=1 时修改浮点状态会使两个字段均置为 3（脏）。

[NOTE]
