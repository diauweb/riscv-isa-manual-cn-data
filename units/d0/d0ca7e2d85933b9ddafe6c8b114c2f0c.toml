en = '''
insn:flh[] and insn:fsh[] do not modify the bits being transferred; in particular, the
payloads of non-canonical NaNs are preserved. insn:flh[] NaN-boxes the result
written to _rd_, whereas insn:fsh[] ignores all but the lower 16 bits in _rs2_.'''
zh = '''
insn:flh[] 和 insn:fsh[] 不修改被传输的位；特别是，非规范 NaN 的载荷得以保留。insn:flh[] 对写入 _rd_ 的结果进行 NaN 装箱，而 insn:fsh[] 忽略 _rs2_ 中除低 16 位之外的所有位。'''
