en = '''
Memory writes to the jump vector table require an instruction barrier (insn:fence.i[]) to guarantee that they are visible to the instruction fetch.'''
zh = '''
对跳转向量表的存储器写入需要指令屏障（insn:fence.i[]）以保证其对指令取指可见。'''
