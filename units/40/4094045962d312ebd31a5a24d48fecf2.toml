en = '''
New floating-point-to-floating-point conversion instructions are added.
These instructions are defined analogously to the double-precision
floating-point-to-floating-point conversion instructions.
[#norm:fcvt-s-h_fcvt-h-s_op]#insn:fcvt.s.h[] or insn:fcvt.h.s[] converts a half-precision floating-point number to a single-precision floating-point number, or vice-versa, respectively#.
[#norm:fcvt-d-h_fcvt-h-d_op]#If the ext:d[] extension is present, insn:fcvt.d.h[] or insn:fcvt.h.d[] converts a half-precision floating-point number to a double-precision floating-point number, or vice-versa, respectively#.
[#norm:fcvt-q-h_fcvt-h-q_op]#If the ext:q[] extension is present, insn:fcvt.q.h[] or insn:fcvt.h.q[] converts a half-precision floating-point number to a quad-precision floating-point number, or vice-versa, respectively#.'''
zh = '''
新增浮点到浮点转换指令。这些指令的定义与双精度浮点到浮点转换指令类似。
[#norm:fcvt-s-h_fcvt-h-s_op]##insn:fcvt.s.h[] 或 insn:fcvt.h.s[] 分别将半精度浮点数转换为单精度浮点数，或反之。##
[#norm:fcvt-d-h_fcvt-h-d_op]##若存在 ext:d[] 扩展，insn:fcvt.d.h[] 或 insn:fcvt.h.d[] 分别将半精度浮点数转换为双精度浮点数，或反之。##
[#norm:fcvt-q-h_fcvt-h-q_op]##若存在 ext:q[] 扩展，insn:fcvt.q.h[] 或 insn:fcvt.h.q[] 分别将半精度浮点数转换为四精度浮点数，或反之。##'''
