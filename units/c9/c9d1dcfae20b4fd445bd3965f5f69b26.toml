en = '''
insn:lui[] (load upper immediate) is used to build 32-bit constants and uses the U-type format.
[#norm:lui_op]#insn:lui[] places the 32-bit U-immediate value into the
destination register _rd_, filling in the lowest 12 bits with zeros.#'''
zh = '''
insn:lui[]（load upper immediate，加载高位立即数）用于构建 32 位常量，并使用 U 型格式。
[#norm:lui_op]#insn:lui[] 将 32 位 U 立即数值放入目的寄存器 _rd_，最低 12 位填充为零。#'''
