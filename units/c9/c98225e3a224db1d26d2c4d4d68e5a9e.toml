en = '''
If the result of the comparison between `mtime` and `mtimecmp` changes, it is
guaranteed to be reflected in MTIP eventually, but not necessarily
immediately.'''
zh = '''
若 `mtime` 与 `mtimecmp` 的比较结果发生变化，保证最终会反映在 MTIP 中，但不一定立即反映。'''
