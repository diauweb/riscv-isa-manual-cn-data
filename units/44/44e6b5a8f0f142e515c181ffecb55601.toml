en = '''
If DXLEN >= 64, then this register provides access to the low bits of
each field defined in {csr-textra64}. Writes to this register will clear
the high bits of the corresponding fields in {csr-textra64}.'''
zh = '''
如果 DXLEN >= 64，则此寄存器提供对 {csr-textra64} 中定义的每个字段低位的访问。对此寄存器的写入将清除 {csr-textra64} 中对应字段的高位。'''
