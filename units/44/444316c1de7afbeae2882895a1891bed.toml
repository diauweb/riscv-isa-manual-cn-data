en = '''
A RISC-V hart has a single byte-addressable address space of 2^XLEN^ bytes for
all memory accesses, where a byte is qty:8[bits]. The memory address space is
circular, so that the byte at address 2^XLEN^−1 is adjacent to the byte at
address zero. Accordingly, memory address computations done by the hardware
ignore overflow and instead wrap around modulo 2^XLEN^.'''
zh = '''
RISC-V hart 对所有内存访问具有一个 2^XLEN^ 字节的单一按字节寻址地址空间，其中一个字节为 qty:8[bits]。内存地址空间是循环的，因此地址 2^XLEN^−1 处的字节与地址零处的字节相邻。相应地，硬件进行的内存地址计算忽略溢出，而是按模 2^XLEN^ 回绕。'''
