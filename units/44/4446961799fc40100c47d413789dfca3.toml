en = '''
The ext:zfhmin[] extension includes the following instructions from the
ext:zfh[] extension: insn:flh[], insn:fsh[], insn:fmv.x.h[], insn:fmv.h.x[],
insn:fcvt.s.h[], and insn:fcvt.h.s[]. If the ext:d[] extension is present, the
insn:fcvt.d.h[] and insn:fcvt.h.d[] instructions are also included. If the
ext:q[] extension is present, the insn:fcvt.q.h[] and
insn:fcvt.h.q[] instructions are additionally included.'''
zh = '''
ext:zfhmin[] 扩展包含 ext:zfh[] 扩展中的以下指令：insn:flh[]、insn:fsh[]、insn:fmv.x.h[]、insn:fmv.h.x[]、insn:fcvt.s.h[] 和 insn:fcvt.h.s[]。若存在 ext:d[] 扩展，则还包括 insn:fcvt.d.h[] 和 insn:fcvt.h.d[] 指令。若存在 ext:q[] 扩展，则还额外包括 insn:fcvt.q.h[] 和 insn:fcvt.h.q[] 指令。'''
