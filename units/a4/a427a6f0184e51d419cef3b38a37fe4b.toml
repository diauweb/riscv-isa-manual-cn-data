en = '''
If the value held in _rs1_ is not a valid virtual address, then the
SFENCE.VMA instruction has no effect. No exception is raised in this
case.'''
zh = '''
若 _rs1_ 中保存的值不是有效虚拟地址，则 SFENCE.VMA 指令无效。在这种情况下不引发异常。'''
