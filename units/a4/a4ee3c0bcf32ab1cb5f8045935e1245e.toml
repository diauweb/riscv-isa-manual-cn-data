en = '''
The data vector register group has EEW=SEW, EMUL=LMUL, while the index
vector register group has EEW encoded in the instruction with
EMUL=(EEW/SEW)*LMUL.'''
zh = '''
数据向量寄存器组具有 EEW=SEW、EMUL=LMUL，而索引向量寄存器组具有指令中编码的 EEW 和 EMUL=(EEW/SEW)*LMUL。'''
