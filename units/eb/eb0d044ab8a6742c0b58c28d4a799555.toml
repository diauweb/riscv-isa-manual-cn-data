en = '''
[#norm:senvcfg_cbcfe]#The Zicbom extension adds the `CBCFE` (Cache Block Clean and Flush instruction
Enable) field to `senvcfg` to control execution of the `CBO.CLEAN` and
`CBO.FLUSH` instructions in U-mode.# [#norm:senvcfg_cbcfe_umode_op]#Execution of these instructions in U-mode is
enabled only if execution of these instructions is enabled for use in S-mode and
`CBCFE` is set to 1; otherwise, an illegal-instruction exception is raised.# [#norm:senvcfg_cbcfe_rdonly0]#When
the Zicbom extension is not implemented, `CBCFE` is read-only zero.#'''
zh = '''
[#norm:senvcfg_cbcfe]#Zicbom 扩展向 `senvcfg` 添加了 `CBCFE`（Cache Block Clean and Flush instruction Enable，缓存块清理和刷新指令使能）字段，以控制 U 模式下 `CBO.CLEAN` 和 `CBO.FLUSH` 指令的执行。# [#norm:senvcfg_cbcfe_umode_op]#只有当这些指令的执行在 S 模式下被使能并且 `CBCFE` 置为 1 时，才使能这些指令在 U 模式下的执行；否则引发非法指令异常。# [#norm:senvcfg_cbcfe_rdonly0]#当未实现 Zicbom 扩展时，`CBCFE` 为只读零。#'''
