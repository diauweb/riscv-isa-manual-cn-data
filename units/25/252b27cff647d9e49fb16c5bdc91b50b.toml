en = '''
[#norm:seed_entropy_unique]#Each returned `seed[15:0]` = `entropy` value represents unique randomness
when `OPST`=`ES16` (`seed[31:30]` = `10`), even if its numerical value is
the same as that of a previously polled `entropy` value.# The implementation
requirements of `entropy` bits are defined in <<crypto_scalar_es_req>>.
[#norm:seed_entropy_zero_non_es16]#When `OPST` is not `ES16`, `entropy` must be set to 0.#
An implementation may safely set reserved and custom bits to zeros.'''
zh = '''
[#norm:seed_entropy_unique]##当 `OPST`=`ES16`（`seed[31:30]` = `10`）时，每个返回的 `seed[15:0]` = `entropy` 值都代表唯一的随机性，即使其数值与先前轮询到的 `entropy` 值相同。## `entropy` 位的实现要求定义于 <<crypto_scalar_es_req>>。
[#norm:seed_entropy_zero_non_es16]##当 `OPST` 不为 `ES16` 时，`entropy` 应置为 0。##
实现可安全地将保留位和自定义位设为零。'''
