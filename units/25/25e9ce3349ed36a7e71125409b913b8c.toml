zh = '''
NOTE: Sha、Shcounterenw、Shvstvala、Shtvala、Shvstvecd、Shvsatpa 和 Shgatpa 是新扩展名称。Sha 在 RVA22S64 获批后引入，但获批文本要求：若包含可选的 H 扩展，则 Sha 的所有组成扩展均为必需。因此，提供 Sha 选项具有同等效果。'''
