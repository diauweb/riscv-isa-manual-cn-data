包括开发工具和已移植的应用程序，这些都可以在研究和教学中加以利用。
其他好处包括存在大量文档和教程示例。然而，我们在研究和教学中使用商业指令集的经验是，
这些好处在实践中较小，并不能抵消其缺点：'''
