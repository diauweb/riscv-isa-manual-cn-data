en = '''
[#norm:Sv57_sxlen_va_sz]#This section describes a simple paged virtual-memory system designed for
RV64 systems, which supports
57-bit virtual address spaces.#
Sv57 is intended for systems for which a 48-bit virtual address space is
insufficient. It closely follows the design of Sv48, simply adding an
additional level of page table, and so this chapter only details the
differences between the two schemes.'''
zh = '''
[#norm:Sv57_sxlen_va_sz]#本节描述一种为 RV64 系统设计的简单分页虚拟内存系统，它支持 57 位虚拟地址空间。# Sv57 面向 48 位虚拟地址空间不足的系统。它紧密遵循 Sv48 的设计，只是增加了一级页表，因此本章仅详述两种方案之间的差异。'''
