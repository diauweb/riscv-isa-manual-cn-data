en = '''
[#norm:m_mode_perf_monitoring]#M-mode includes a basic hardware performance-monitoring facility.#
[#norm:mcycle_op]#The `mcycle` CSR counts the number of clock cycles executed by the processor
core on which the hart is running.#
[#norm:minstret_op]#The `minstret` CSR counts the number of instructions the hart has retired.#
[#norm:mcycle_minstret_sz]#The `mcycle` and `minstret` registers have 64-bit precision on all RV32 and RV64 harts.#'''
zh = '''
[#norm:m_mode_perf_monitoring]##M 模式包含基本的硬件性能监测设施。##[#norm:mcycle_op]##`mcycle` CSR 统计硬件线程所运行的处理器核执行的时钟周期数。##[#norm:minstret_op]##`minstret` CSR 统计硬件线程已退休的指令数。##[#norm:mcycle_minstret_sz]##`mcycle` 和 `minstret` 寄存器在所有 RV32 和 RV64 硬件线程上具有 64 位精度。##'''
