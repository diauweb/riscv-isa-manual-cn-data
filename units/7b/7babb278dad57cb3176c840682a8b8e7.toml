en = '''
When `ELP` is set to `LP_EXPECTED`, if the next instruction in the instruction
stream is not 4-byte aligned, or is not insn:lpad[], or if the landing pad label
encoded in insn:lpad[] is not zero and does not match the expected landing pad label
in bits 31:12 of the `x7` register, then a software-check exception (cause=18)
with `__x__tval` set to "`landing pad fault (code=2)`" is raised else the `ELP` is
updated to `NO_LP_EXPECTED`.'''
zh = '''
当 `ELP` 置为 `LP_EXPECTED` 时，如果指令流中的下一条指令不是 4 字节对齐的、或者不是 insn:lpad[]，或者如果 insn:lpad[] 中编码的着陆垫标签不为零且与 `x7` 寄存器位 31:12 中的期望着陆垫标签不匹配，则触发软件检查异常（cause=18），且 `__x__tval` 置为“landing pad fault (code=2)”；否则将 `ELP` 更新为 `NO_LP_EXPECTED`。'''
