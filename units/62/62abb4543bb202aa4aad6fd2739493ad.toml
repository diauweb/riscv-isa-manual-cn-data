en = '''
[#norm:c-ebreak_op]#Debuggers can use the `C.EBREAK` instruction, which expands to `ebreak`,
to cause control to be transferred back to the debugging environment.
`C.EBREAK` shares the opcode with the `C.ADD` instruction, but with _rd_ and
_rs2_ both zero, thus can also use the `CR` format.#'''
zh = '''
[#norm:c-ebreak_op]##调试器可以使用 `C.EBREAK` 指令（它展开为 `ebreak`）使控制权转移回调试环境。`C.EBREAK` 与 `C.ADD` 指令共享操作码，但 _rd_ 和 _rs2_ 均为零，因此也可以使用 `CR` 格式。##'''
