en = '''
[#norm:pm_family_extensions]#Pointer masking refers to a number of separate extensions, all of which are privileged.# This approach is used to capture optionality of pointer masking features. Profiles and implementations may choose to support an arbitrary subset of these extensions and must define valid ranges for their corresponding values of PMLEN.'''
zh = '''
[#norm:pm_family_extensions]#指针掩码指的是一组独立的扩展，它们全部都是特权级扩展。# 这种方法用于体现指针掩码特性的可选性。配置文件和实现可以选择支持这些扩展的任意子集，并且必须为 PMLEN 的对应值定义有效范围。'''
