en = '''
An example code sequence for a critical section guarded by a
test-and-test-and-set (TTAS) spinlock is shown in the following listing. Note
that the first AMO is marked _aq_ to order the lock acquisition before the
critical section, and the second AMO is marked _rl_ to order the critical
section before the lock relinquishment. We recommend the use of this AMO swap
idiom for both lock acquire and release to simplify the implementation of
speculative lock elision cite:[Rajwar:2001:SLE].'''
zh = '''
下面的代码清单给出一个用于由测试-测试-设置（TTAS）自旋锁保护的临界区的示例代码序列。注意，第 1 个 AMO 标记为 _aq_，以使锁获取排在临界区之前；第 2 个 AMO 标记为 _rl_，以使临界区排在释放锁之前。宜将这种 AMO 交换惯用法用于锁获取和释放，以简化推测锁消除的实现 cite:[Rajwar:2001:SLE]。'''
