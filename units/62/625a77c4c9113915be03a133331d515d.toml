en = '''
Default exception handling, as defined in IEEE 754-2008, is a simple and
effective approach to producing results in exceptional cases. For the coder to
be able to see what has happened, and take further action if needed, BF16
instructions set floating-point exception flags the same way as all other
floating-point instructions in RISC-V.'''
zh = '''
IEEE 754-2008 中定义的默认异常处理是在异常情况下产生结果的一种简单而有效的方法。为使编码者能够看到发生了什么并在需要时采取进一步措施，BF16 指令以与 RISC-V 中所有其他浮点指令相同的方式设置浮点异常标志。'''
