en = '''
[#norm:c-srli_op]#C.SRLI is a CB-format instruction that performs a logical right shift of
the value in register _rd′_ then writes the result to
_rd′_. The shift amount is encoded in the _shamt_ field.
C.SRLI expands into `srli rd′, rd′, shamt`.#'''
zh = '''
[#norm:c-srli_op]#C.SRLI 是一条 CB 格式指令，对寄存器 _rd′_ 中的值执行逻辑右移，然后将结果写入 _rd′_。移位量编码在 _shamt_ 字段中。C.SRLI 扩展为 `srli rd′, rd′, shamt`。#'''
