en = '''
[NOTE]
====
The AMOs were designed to implement the C11 and C++11 memory models
efficiently. Although the insn:fence[r,rw] instruction suffices to implement
the _acquire_ operation and insn:fence[rw,w] suffices to implement _release_,
both imply additional unnecessary ordering as compared to AMOs with the
corresponding _aq_ or _rl_ bit set.
===='''
zh = '''
[NOTE]
====
AMO 的设计目标是高效实现 C11 和 C++11 内存模型。尽管 insn:fence[r,rw] 指令足以实现__获取__操作，insn:fence[rw,w] 足以实现__释放__，但与置位相应 _aq_ 或 _rl_ 位的 AMO 相比，两者都隐含了额外不必要的排序。
===='''
