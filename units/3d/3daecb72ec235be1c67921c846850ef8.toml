translatable = true
status = "machine"
en = '''
[#norm:hedeleg_op]#A synchronous trap that has been delegated to HS-mode (using `medeleg`)
is further delegated to VS-mode if V=1 before the trap and the
corresponding `hedeleg` bit is set.#
[#norm:hedeleg_acc]#Each bit of `hedeleg` shall be
either writable or read-only zero.# [#norm:hedeleg_bits_required]#Many bits of `hedeleg` are required
specifically to be writable or zero, as enumerated in
<<hedeleg-bits>>.# [#norm:hedeleg_bit0_ialign32]#Bit 0, corresponding to
instruction address-misaligned exceptions, must be writable if
IALIGN=32.#'''
zh = '''
[#norm:hedeleg_op]#已委托给 HS-mode（使用 `medeleg`）的同步陷阱，如果陷阱之前 V=1 且相应的 `hedeleg` 位被置位，则进一步委托给 VS-mode。#
[#norm:hedeleg_acc]#`hedeleg` 的每一位应可写或为只读零。# [#norm:hedeleg_bits_required]#`hedeleg` 的许多位被专门要求为可写或零，如 <<hedeleg-bits>> 中所列举。# [#norm:hedeleg_bit0_ialign32]#位 0（对应指令地址未对齐异常）在 IALIGN=32 时必须可写。#'''
