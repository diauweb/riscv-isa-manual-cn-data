en = '''
[#norm:Zcmop_op]#This section defines the "Zcmop" extension, which defines eight 16-bit MOP
instructions named C.MOP.__n__, where __n__ is an odd integer between 1 and
15, inclusive.#  [#norm:Zcmop_enc]#C.MOP.__n__ is encoded in the reserved encoding space
corresponding to C.LUI x__n__, 0, as shown in <<norm:c-mop_enc>>.#
[#norm:Zcmop_instr_write]#Unlike the MOPs defined in the Zimop extension, the C.MOP.__n__ instructions
are defined to _not_ write any register.#
Their encoding allows future extensions to define them to read register
`x[__n__]`.'''
zh = '''
[#norm:Zcmop_op]##本节定义“Zcmop”扩展，它定义了八条 16 位 MOP
指令，名为 C.MOP.__n__，其中 __n__ 为 1 至 15（含）之间的奇数。##  [#norm:Zcmop_enc]##C.MOP.__n__ 编码在对应 C.LUI x__n__, 0 的保留编码空间中，
如 <<norm:c-mop_enc>> 所示。##
[#norm:Zcmop_instr_write]##与 Zimop 扩展中定义的 MOP 不同，C.MOP.__n__ 指令
被定义为**不**写入任何寄存器。##
其编码允许未来的扩展将它们定义为读取寄存器
`x[__n__]`。'''
