en = '''
Even though the requirement is defined in terms of 128-bit full entropy
blocks, we recommend 256-bit security. This can be accomplished by using
at least 512 csr::[entropy] bits to initialize a DRBG that has 256-bit security.'''
zh = '''
尽管要求是以 128 位完全熵块来定义的，但我们建议 256 位安全性。这可以通过使用至少 512 个 csr::[entropy] 位来初始化具有 256 位安全性的 DRBG 来实现。'''
