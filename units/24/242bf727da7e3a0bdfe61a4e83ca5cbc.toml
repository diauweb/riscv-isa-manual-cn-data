en = '''
* [#norm:zicfiss_m_menvcfg_sse]#If the privilege mode is less than M and csr:menvcfg[sse] is 0, an
  illegal-instruction exception is raised.#
* [#norm:zicfiss_u_senvcfg_sse]#Otherwise, if in U-mode and csr:senvcfg[sse] is 0, an illegal-instruction
  exception is raised.#
* [#norm:zicfiss_vs_henvcfg_sse]#Otherwise, if in VS-mode and csr:henvcfg[sse] is 0, a virtual-instruction
  exception is raised.#
* [#norm:zicfiss_vu_henvcfg_senvcfg_sse]#Otherwise, if in VU-mode and either csr:henvcfg[sse] or csr:senvcfg[sse] is 0,
  a virtual-instruction exception is raised.#
* [#norm:zicfiss_sse_access]#Otherwise, the access is allowed.#'''
zh = '''
* [#norm:zicfiss_m_menvcfg_sse]#如果特权模式低于 M 且 csr:menvcfg[sse] 为 0，则引发非法指令异常。#
* [#norm:zicfiss_u_senvcfg_sse]#否则，如果处于 U 模式且 csr:senvcfg[sse] 为 0，则引发非法指令异常。#
* [#norm:zicfiss_vs_henvcfg_sse]#否则，如果处于 VS 模式且 csr:henvcfg[sse] 为 0，则引发虚拟指令异常。#
* [#norm:zicfiss_vu_henvcfg_senvcfg_sse]#否则，如果处于 VU 模式且 csr:henvcfg[sse] 或 csr:senvcfg[sse] 为 0，则引发虚拟指令异常。#
* [#norm:zicfiss_sse_access]#否则，允许该访问。#'''
