en = '''
When executed in VS-mode (i.e., V=1), SRET sets the privilege mode
according to <<norm:H_trap_vs_spp_tbl>>, in `vsstatus` sets SPP=0,
SIE=SPIE, and SPIE=1, and lastly sets `pc`=`vsepc`.'''
zh = '''
当在 VS-mode 中执行（即 V=1）时，SRET 根据 <<norm:H_trap_vs_spp_tbl>> 设置特权模式，在 `vsstatus` 中设置 SPP=0、SIE=SPIE 和 SPIE=1，最后设置 `pc`=`vsepc`。'''
