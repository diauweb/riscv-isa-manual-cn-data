en = '''
Floating-point operations that produce _w_ < XLEN-bit
results fill bits XLEN-1: _w_ with copies of bit _w_-1 (the sign bit).'''
zh = '''
产生 _w_ < XLEN 位结果的浮点操作使用位 _w_-1（符号位）的副本填充位 XLEN-1: _w_。'''
