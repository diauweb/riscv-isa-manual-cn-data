en = '''
[#norm:xret_clr_lr_resv]#If the A extension is supported, the __x__RET instruction is allowed to
clear any outstanding LR address reservation but is not required to.#
Trap handlers should explicitly clear the reservation if required (e.g.,
by using a dummy SC) before executing the __x__RET.'''
zh = '''
[#norm:xret_clr_lr_resv]#若支持 A 扩展，则允许 __x__RET 指令清除任何未完成的 LR 地址预留，但并不要求如此。# 若需要，陷阱处理程序应在执行 __x__RET 之前显式清除预留（例如通过使用一次哑 SC）。'''
