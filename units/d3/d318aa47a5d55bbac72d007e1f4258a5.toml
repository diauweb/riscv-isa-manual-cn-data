en = '''
[NOTE]
====
The tracking of `ELP` and the requirement for a landing pad instruction
at the target of indirect call and jump enables a processor implementation to
significantly reduce or to prevent speculation to non-landing-pad instructions.
Constraining speculation using this technique, greatly reduces the gadget space
and increases the difficulty of using techniques such as branch-target-injection,
also known as Spectre cite:[spectre] variant 2, which use speculative execution to leak data
through side channels.

The insn:lpad[] requires a 4-byte alignment to address the concatenation of two
instructions insn:a[] and insn:b[] accidentally forming an unintended landing pad in the
program. For example, consider a 32-bit instruction where the bytes 3 and 2 have
a pattern of `?017h` (for example, the immediate fields of a insn:lui[], insn:auipc[], or
a insn:jal[] instruction), followed by a 16-bit or a 32-bit instruction. When
patterns that can accidentally form a valid landing pad are detected, the
assembler or linker can force instruction insn:a[] to be aligned to a 4-byte
boundary to force the unintended insn:lpad[] pattern to become misaligned, and thus
not a valid landing pad, or may use an alternate register allocation to prevent
the accidental landing pad.
===='''
zh = '''
[NOTE]
====
对 `ELP` 的跟踪以及在间接调用和跳转目标处要求着陆垫指令，使处理器实现能够显著减少或防止推测执行到非着陆垫指令。使用这种技术约束推测执行，大大减少了 gadget 空间，并增加了使用分支目标注入（也称为 Spectre cite:[spectre] 变体 2）等技术的难度，这些技术利用推测执行通过侧信道泄露数据。

insn:lpad[] 要求 4 字节对齐，以应对两条指令 insn:a[] 和 insn:b[] 意外拼接在程序中形成非预期着陆垫的情况。例如，考虑一条 32 位指令，其字节 3 和 2 具有 `?017h` 的模式（例如，insn:lui[]、insn:auipc[] 或 insn:jal[] 指令的立即数字段），后跟一条 16 位或 32 位指令。当检测到可能意外形成有效着陆垫的模式时，汇编器或链接器可以强制指令 insn:a[] 对齐到 4 字节边界，以强制非预期的 insn:lpad[] 模式变为未对齐，从而不是有效着陆垫，或者可以使用替代寄存器分配来防止意外着陆垫。
===='''
