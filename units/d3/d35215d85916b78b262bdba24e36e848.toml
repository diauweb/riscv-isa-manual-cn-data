en = '''
A bit in `hie` shall be writable if the corresponding interrupt can ever
become pending in `hip`. Bits of `hie` that are not writable shall be
read-only zero.'''
zh = '''
若相应中断可在 `hip` 中变为待决，则 `hie` 中的某位应可写。`hie` 中不可写的位应为只读零。'''
