en = '''
The ext:zcmt[] extension adds table-jump instructions, which improve code density
when procedures have many call sites.
It also adds the csr:jvt[] CSR.
The csr:jvt[] CSR requires a state enable if Smstateen is implemented. See
<<csrs-jvt>> for details.'''
zh = '''
ext:zcmt[] 扩展增加表跳转指令，当过程具有许多调用点时，
这些指令可提高代码密度。
它还增加 csr:jvt[] CSR。
如果实现了 Smstateen，则 csr:jvt[] CSR 需要状态使能。详情
见 <<csrs-jvt>>。'''
