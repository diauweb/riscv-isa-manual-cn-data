en = '''
[#norm:c-slli_op]#C.SLLI is a CI-format instruction that performs a logical left shift of
the value in register _rd_ then writes the result to _rd_. The shift
amount is encoded in the _shamt_ field.
C.SLLI expands into `slli rd, rd, shamt[5:0]`.#'''
zh = '''
[#norm:c-slli_op]#C.SLLI 是一条 CI 格式指令，对寄存器 _rd_ 中的值执行逻辑左移，然后将结果写入 _rd_。移位量编码在 _shamt_ 字段中。C.SLLI 扩展为 `slli rd, rd, shamt[5:0]`。#'''
