en = '''
[#norm:mip_msip_mie_msie_op]#Bits csr:mip[msip] and csr:mie[msie] are the interrupt-pending and
interrupt-enable bits for machine-level software interrupts.#
[#norm:mip_msip_rdonly]#csr::[msip] is read-only in csr:mip[], and is written by accesses to memory-mapped control
registers, which are used to provide machine-level interprocessor interrupts.#'''
zh = '''
[#norm:mip_msip_mie_msie_op]#位 csr:mip[msip] 和 csr:mie[msie] 是机器级软件中断的中断挂起位和中断使能位。#
[#norm:mip_msip_rdonly]#csr::[msip] 在 csr:mip[] 中为只读，通过对内存映射控制寄存器的访问写入，这些寄存器用于提供机器级处理器间中断。#'''
