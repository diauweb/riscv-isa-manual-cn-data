en = '''
[#norm:henvcfg_stce]#The Sstc extension adds the `STCE` (STimecmp Enable) bit to `henvcfg` CSR.# [#norm:henvcfg_stce_rdonly0]#When
the Sstc extension is not implemented, `STCE` is read-only zero.# [#norm:henvcfg_stce_op]#The `STCE` bit
enables `vstimecmp` for VS-mode when set to one.# [#norm:henvcfg_stce_zero_op]#When `STCE` bit in `henvcfg` is
zero, an attempt to access `stimecmp` (really `vstimecmp`) when V=1 raises a
virtual-instruction exception, and `VSTIP` in `hip` reverts to its defined behavior
as if this extension is not implemented.#'''
zh = '''
[#norm:henvcfg_stce]#Sstc 扩展向 `henvcfg` CSR 添加了 `STCE`（STimecmp Enable，STimecmp 使能）位。# [#norm:henvcfg_stce_rdonly0]#当未实现 Sstc 扩展时，`STCE` 为只读零。# [#norm:henvcfg_stce_op]#`STCE` 位被设置为 1 时为 VS-mode 启用 `vstimecmp`。# [#norm:henvcfg_stce_zero_op]#当 `henvcfg` 中的 `STCE` 位为零时，在 V=1 时尝试访问 `stimecmp`（实际上是 `vstimecmp`）会引发虚拟指令异常，且 `hip` 中的 `VSTIP` 恢复到其已定义的行为，如同未实现此扩展。#'''
