en = '''
The `vstimecmp` CSR is a 64-bit register and has 64-bit precision on all RV32
and RV64 systems. In RV32 only, accesses to the `vstimecmp` CSR access the low
32 bits, while accesses to the `vstimecmph` CSR access the high 32 bits of
`vstimecmp`.'''
zh = '''
`vstimecmp` CSR 是 64 位寄存器，在所有 RV32 和 RV64 系统上具有 64 位精度。仅在 RV32 中，对 `vstimecmp` CSR 的访问访问低 32 位，而对 `vstimecmph` CSR 的访问访问 `vstimecmp` 的高 32 位。'''
