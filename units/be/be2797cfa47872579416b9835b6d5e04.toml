[[hinterruptregs]]
==== 虚拟机监控器中断寄存器（`hvip`、`hip` 和 `hie`）

寄存器 `hvip` 是一个 HSXLEN 位读/写寄存器，虚拟机监控器可写入以指示发给 VS 模式的虚拟中断。`hvip` 中不可写的位为只读 0。

[[hvipreg]]
.虚拟机监控器虚拟中断挂起寄存器（`hvip`）。
[bytefield]
----
