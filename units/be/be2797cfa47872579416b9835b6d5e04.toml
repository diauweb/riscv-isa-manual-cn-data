====

当 XLEN=32 时，`hedelegh` 是一个 32 位读/写寄存器，别名 `hedeleg` 的第 63:32 位。当 XLEN=64 时，寄存器 `hedelegh` 不存在。

使用 `mideleg` 委托给 HS 模式的中断，若相应的 `hideleg` 位被置位，则进一步委托给 VS 模式。在 `hideleg` 的第 15:0 位中，位 10、6 和 2（对应标准 VS 级中断）为可写，位 12、9、5 和 1（对应标准 S 级中断）为只读 0。

当虚拟监管者外部中断（代码 10）被委托给 VS 模式时，机器会自动将其转换为 VS 模式的监管者外部中断（代码 9），包括在中断陷阱时写入 `vscause` 的值。类似地，虚拟监管者定时器中断（6）被转换为 VS 模式的监管者定时器中断（5），虚拟监管者软件中断（2）被转换为 VS 模式的监管者软件中断（1）。对于平台中断原因（代码 16 及以上），可能会或可能不会进行类似的转换。

