en = '''
[#norm:asidlen]#The number of ASID bits is UNSPECIFIED and may be zero.# The number of implemented
ASID bits, termed _ASIDLEN_, may be determined by writing one to every
bit position in the ASID field, then reading back the value in `satp` to
see which bit positions in the ASID field hold a one. [#norm:asid_lsb_first]#The
least-significant bits of ASID are implemented first: that is, if
ASIDLEN > 0, ASID[ASIDLEN-1:0] is writable.# [#norm:asidmax]#The maximal
value of ASIDLEN, termed ASIDMAX, is 9 for Sv32 or 16 for Sv39, Sv48,
and Sv57.#'''
zh = '''
[#norm:asidlen]##ASID 位数未作规定，且可为零。## 已实现的 ASID 位数称为 _ASIDLEN_，可通过向 ASID 字段中的每个位位置写入 1，然后读回 `satp` 中的值以查看 ASID 字段中哪些位位置保持为 1 来确定。 [#norm:asid_lsb_first]##ASID 的最低有效位最先实现：即若 ASIDLEN > 0，则 ASID[ASIDLEN-1:0] 可写。## [#norm:asidmax]##ASIDLEN 的最大值称为 ASIDMAX，对于 Sv32 为 9，对于 Sv39、Sv48 和 Sv57 为 16。##'''
