en = '''
In the RISC-V psABI, the vector registers `v0`-`v31` are all caller-saved.
The `vl` and `vtype` CSRs are also caller-saved.'''
zh = '''
在 RISC-V psABI 中，向量寄存器 `v0`-`v31` 均为调用者保存（caller-saved）。`vl` 和 `vtype` CSR 同样为调用者保存。'''
