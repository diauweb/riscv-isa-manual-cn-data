[[tinst-vals]]
==== `mtinst` 或 `htinst` 的变换后指令或伪指令

在任何陷入 M 模式或 HS 模式时，以下值之一被自动写入相应的陷阱指令 CSR `mtinst` 或 `htinst`：

* 零；
* 引发陷阱指令的变换；
* 定制值（仅当引发陷阱的指令为非标准时允许）；或
* 特殊伪指令。

除需要伪指令值（后述）时外，写入 `mtinst` 或 `htinst` 的值可始终为零，表示硬件未在该寄存器中为此特定陷阱提供信息。

[NOTE]
