若一条指令可能引发多个同步异常，<<HSyncExcPrio>> 的递减优先级顺序指示接收并在 `mcause` 或 `scause` 中报告哪个异常。

==== 陷阱进入

当陷阱在 HS 模式或 U 模式中发生时，它前往 M 模式，除非由 `medeleg` 或 `mideleg` 委托，此时它前往 HS 模式。当陷阱在 VS 模式或 VU 模式中发生时，它前往 M 模式，除非由 `medeleg` 或 `mideleg` 委托，此时它前往 HS 模式，除非由 `hedeleg` 或 `hideleg` 进一步委托，此时它前往 VS 模式。

当陷阱陷入 M 模式时，虚拟化模式 V 被置为 0，`mstatus`（或 `mstatush`）中的字段 MPV 和 MPP 按 <<h-mpp>> 设置。陷入 M 模式还会写入 `mstatus`/`mstatush` 中的字段 GVA、MPIE 和 MIE，并写入 CSR `mepc`、`mcause`、`mtval`、`mtval2` 和 `mtinst`。

[[h-mpp]]
