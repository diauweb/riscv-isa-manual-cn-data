当陷阱陷入 HS 模式时，虚拟化模式 V 被置为 0，`hstatus`.SPV 和 `sstatus`.SPP 按 <<h-spp>> 设置。若陷阱之前 V 为 1，则 `hstatus` 中的字段 SPVP 与 `sstatus`.SPP 设置相同；否则 SPVP 保持不变。陷入 HS 模式还会写入 `hstatus` 中的字段 GVA、`sstatus` 中的字段 SPIE 和 SIE，以及 CSR `sepc`、`scause`、`stval`、`htval` 和 `htinst`。

