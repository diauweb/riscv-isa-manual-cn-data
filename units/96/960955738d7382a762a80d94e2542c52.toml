One use-case is string-processing functions, such as `strlen` and `strcpy`, which can use insn:orc.b[] to test for the terminating zero byte by counting the set bits in leading non-zero bytes in a word.'''
zh = '''
一个用例是字符串处理函数，例如 `strlen` 和 `strcpy`，它们可以使用 insn:orc.b[] 通过统计字中前导非零字节的置位来检测终止零字节。'''
