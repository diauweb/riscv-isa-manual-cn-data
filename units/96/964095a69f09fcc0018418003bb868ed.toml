en = '''
[#norm:Zawrs_virtual_instr_excp]#When executing in VS- or VU-mode, if the csr::[vtw] bit is set in csr:hstatus[], the
csr::[tw] bit in csr:mstatus[] is clear, and the insn:wrs.nto[] does not complete within an
implementation-specific bounded time limit, the insn:wrs.nto[] instruction will cause
a virtual-instruction exception.#'''
zh = '''
[#norm:Zawrs_virtual_instr_excp]#在 VS 或 VU 模式下执行时，如果 csr:hstatus[] 中的 csr::[vtw] 位被置位、csr:mstatus[] 中的 csr::[tw] 位为 0，且 insn:wrs.nto[] 未在实现特定的有界时间限制内完成，则 insn:wrs.nto[] 指令将导致虚拟指令异常。#'''
