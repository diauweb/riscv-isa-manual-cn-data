en = '''
We proposed that the scalar cryptographic extension _reuse_ a
subset of the instructions from the Bitmanip extensions ext:zba[], ext:zbb[], and ext:zbc[] directly.
Specifically, this would mean that
a core implementing
_either_
the scalar cryptographic extensions,
_or_
the ext:zba[], ext:zbb[], and ext:zbc[],
_or_
both,
would be required to implement these instructions.'''
zh = '''
我们提议标量密码学扩展从位操作扩展 ext:zba[]、ext:zbb[] 和 ext:zbc[] 中直接 __复用__ 一部分指令。具体而言，这意味着实现标量密码学扩展、或实现 ext:zba[]、ext:zbb[] 和 ext:zbc[]、或二者都实现的核，都需要实现这些指令。'''
