en = '''
Attempts to execute any vector instruction, or to access the vector
CSRs, raise an illegal-instruction exception when csr:mstatus[vs] is
set to Off.'''
zh = '''
当 csr:mstatus[vs] 设置为 Off 时，尝试执行任何向量指令或访问向量 CSR 会引发非法指令异常。'''
