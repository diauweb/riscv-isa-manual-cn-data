en = '''
. Prefix *RV* for RISC-V.
. A specific profile family name string.  Currently a single letter (*I*, *A*,
or *B*), but later profiles may have longer family name strings.
. A numeric string giving the first complete calendar year for which
the profile is ratified, represented as number of years after year
2000, i.e., *20* for profiles built on specifications ratified during 2019.
The year string will be longer than two digits in the next century.
. A privilege mode (*U*, *S*, *M*).  Hypervisor support is treated as an option.
. A base ISA XLEN specifier (*32*, *64*).'''
zh = '''
. 前缀 *RV*，表示 RISC-V。
. 特定的配置文件族名称字符串。目前为单个字母（*I*、*A* 或 *B*），但后续配置文件可能具有更长的族名称字符串。
. 一个数字字符串，给出该配置文件获得批准的第一个完整日历年，以 2000 年之后的年数表示，即对于基于 2019 年批准规范构建的配置文件为 *20*。在下个世纪，年份字符串将长于两位数字。
. 特权模式（*U*、*S*、*M*）。虚拟机管理程序支持被视为一个选项。
. 基础 ISA XLEN 说明符（*32*、*64*）。'''
