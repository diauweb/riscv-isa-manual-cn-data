en = '''
* [#norm:rvwmo_ppo_overlap]#Overlapping-Address Orderings#:
. [#norm:rvwmo_ppo_overlap1]#_b_ is a store, and _a_ and _b_ access overlapping memory addresses#
. [#norm:rvwmo_ppo_overlap2]#_a_ and _b_ are loads, _x_ is a byte read by both _a_ and
_b_, there is no store to _x_ between _a_ and _b_ in program order, and _a_ and _b_ return values for _x_
written by different memory operations#
. [#norm:rvwmo_ppo_overlap3]#_a_ is generated by an AMO or SC instruction, _b_ is a load, and
_b_ returns a value written by _a_#
* [#norm:rvwmo_ppo_sync]#Explicit Synchronization#:
[start=4]
. [#norm:rvwmo_ppo_sync1]#There is a insn:fence[] instruction that orders _a_ before _b_#
. [#norm:rvwmo_ppo_sync2]#_a_ has an acquire annotation annotation#
. [#norm:rvwmo_ppo_sync3]#_b_ has a release annotation#
. [#norm:rvwmo_ppo_sync4]#_a_ and _b_ both have RCsc annotations#
. [#norm:rvwmo_ppo_sync5]#_a_ is paired with _b_#
* [#norm:rvwmo_ppo_dep]#Syntactic Dependencies#:
[start=9]
. [#norm:rvwmo_ppo_dep1]#_b_ has a syntactic address dependency on _a_#
. [#norm:rvwmo_ppo_dep2]#_b_ has a syntactic data dependency on _a_#
. [#norm:rvwmo_ppo_dep3]#_b_ is a store, and _b_ has a syntactic control dependency on _a_#
* [#norm:rvwmo_ppo_pipe]#Pipeline Dependencies#:
[start=12]
. [#norm:rvwmo_ppo_pipe1]#_b_ is a load, and there exists some store _m_ between _a_ and _b_
in program order such that _m_ has an address or data dependency on _a_,
and _b_ returns a value written by _m_#
. [#norm:rvwmo_ppo_pipe2]#_b_ is a store, and there exists some instruction _m_ between _a_
and _b_ in program order such that _m_ has an address dependency on _a_#'''
zh = '''
* [#norm:rvwmo_ppo_overlap]##重叠地址排序##：
. [#norm:rvwmo_ppo_overlap1]##_b_ 是存储，并且 _a_ 和 _b_ 访问重叠的内存地址##
. [#norm:rvwmo_ppo_overlap2]##_a_ 和 _b_ 是加载，_x_ 是 _a_ 和 _b_ 都读取的一个字节，在程序顺序中 _a_ 和 _b_ 之间没有对 _x_ 的存储，并且 _a_ 和 _b_ 为 _x_ 返回由不同内存操作写入的值##
. [#norm:rvwmo_ppo_overlap3]##_a_ 由 AMO 或 SC 指令生成，_b_ 是加载，并且 _b_ 返回由 _a_ 写入的值##
* [#norm:rvwmo_ppo_sync]##显式同步##：
[start=4]
. [#norm:rvwmo_ppo_sync1]##存在一条将 _a_ 排在 _b_ 之前的 insn:fence[] 指令##
. [#norm:rvwmo_ppo_sync2]##_a_ 具有获取标注标注##
. [#norm:rvwmo_ppo_sync3]##_b_ 具有释放标注##
. [#norm:rvwmo_ppo_sync4]##_a_ 和 _b_ 都具有 RCsc 标注##
. [#norm:rvwmo_ppo_sync5]##_a_ 与 _b_ 配对##
* [#norm:rvwmo_ppo_dep]##语法依赖##：
[start=9]
. [#norm:rvwmo_ppo_dep1]##_b_ 对 _a_ 具有语法地址依赖##
. [#norm:rvwmo_ppo_dep2]##_b_ 对 _a_ 具有语法数据依赖##
. [#norm:rvwmo_ppo_dep3]##_b_ 是存储，并且 _b_ 对 _a_ 具有语法控制依赖##
* [#norm:rvwmo_ppo_pipe]##流水线依赖##：
[start=12]
. [#norm:rvwmo_ppo_pipe1]##_b_ 是加载，并且在程序顺序中 _a_ 和 _b_ 之间存在某个存储 _m_，使得 _m_ 对 _a_ 具有地址依赖或数据依赖，并且 _b_ 返回由 _m_ 写入的值##
. [#norm:rvwmo_ppo_pipe2]##_b_ 是存储，并且在程序顺序中 _a_ 和 _b_ 之间存在某条指令 _m_，使得 _m_ 对 _a_ 具有地址依赖##'''
