en = '''
[NOTE]
====
[[norm:fence-tso_ordering_rw_rw_ok]]
Because insn:fence[RW,RW] imposes a superset of the orderings that
insn:fence.tso[] imposes, it is correct to ignore the _fm_ field and implement insn:fence.tso[] as
insn:fence[RW,RW].
===='''
zh = '''
[NOTE]
====
[[norm:fence-tso_ordering_rw_rw_ok]]
由于 insn:fence[RW,RW] 施加的排序是 insn:fence.tso[] 所施加排序的超集，因此忽略 _fm_ 字段并将 insn:fence.tso[] 实现为 insn:fence[RW,RW] 是正确的。
===='''
