en = '''
* [#norm:constrained_lrsc_loop_size]#The loop comprises only an LR/SC sequence and code to retry the
sequence in the case of failure, and must comprise at most 16
instructions placed sequentially in memory.#
* [#norm:constrained_lrsc_instruction_set]#An LR/SC sequence begins with an LR instruction and ends with an SC
instruction. The dynamic code executed between the LR and SC
instructions can only contain instructions from the base ''I''
instruction set, excluding loads, stores, backward jumps, taken backward
branches, JALR, FENCE, and SYSTEM instructions.#
[#norm:constrained_lrsc_compressed_allowed]#Compressed forms of the aforementioned ''I'' instructions in the
C (hence Zca) and Zcb extensions are also permitted.#
* [#norm:constrained_lrsc_retry_code]#The code to retry a failing LR/SC sequence can contain backwards jumps
and/or branches to repeat the LR/SC sequence, but otherwise has the same
constraint as the code between the LR and SC.#
* [#norm:lrsc_eventuality_region]#The LR and SC addresses must lie within a memory region with the
_LR/SC eventuality_ property. The execution environment is responsible
for communicating which regions have this property.#
* [#norm:lrsc_same_address_and_size]#The SC must be to the same effective address and of the same data size
as the latest LR executed by the same hart.#'''
zh = '''
* [#norm:constrained_lrsc_loop_size]#该循环仅由 LR/SC 序列以及在失败情况下重试该序列的代码组成，并且必须至多包含 16 条顺序放置在内存中的指令。#
* [#norm:constrained_lrsc_instruction_set]#LR/SC 序列以 LR 指令开始并以 SC 指令结束。在 LR 与 SC 指令之间执行的动态代码只能包含来自基础 "I" 指令集的指令，不包括加载、存储、向后跳转、采用的后向分支、JALR、FENCE 和 SYSTEM 指令。#
[#norm:constrained_lrsc_compressed_allowed]#C（因此也包括 Zca）和 Zcb 扩展中上述 "I" 指令的压缩形式也是允许的。#
* [#norm:constrained_lrsc_retry_code]#用于重试失败的 LR/SC 序列的代码可以包含向后跳转和/或分支以重复该 LR/SC 序列，但在其他方面与 LR 和 SC 之间的代码具有相同的约束。#
* [#norm:lrsc_eventuality_region]#LR 和 SC 地址必须位于具有 _LR/SC 最终成功_（LR/SC eventuality）属性的内存区域内。执行环境负责说明哪些区域具有此属性。#
* [#norm:lrsc_same_address_and_size]#SC 必须针对与该硬件线程最近执行的 LR 相同的有效地址和相同的数据大小。#'''
