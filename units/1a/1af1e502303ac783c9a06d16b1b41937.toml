en = '''
* *ATB* - Advanced Trace Bus, a protocol described in ARM document IHI0032B;
* *E-Trace* - Abbreviation for Efficient Trace for RISC-V, <<chap:trace>>;
* *PIB* - Pin Interface Block, a parallel or serial off-chip trace port feeding into a trace probe, as defined in the RISC-V Trace Control Interface Specification, <<chap:tci>>;
* *N-Trace* - Abbreviation for RISC-V N-Trace (Nexus-based Trace) Specification, <<chap:ntrace>>
* *Trace Encoder* - Hardware module that accepts execution information from a hart and generates a stream of trace packets;
* *TFP* - Trace Formatter protocol, a trace framing protocol described in ARM document IHI0029E.  Also adopted by MIPI as Trace Wrapper Protocol (TWP);
* *TWP* - See *TFP*.'''
zh = '''
* *ATB* - 高级跟踪总线（Advanced Trace Bus），ARM 文档 IHI0032B 中描述的协议；
* *E-Trace* - Efficient Trace for RISC-V 的缩写，见 <<chap:trace>>；
* *PIB* - 引脚接口块（Pin Interface Block），一种馈入跟踪探针的并行或串行片外跟踪端口，按 RISC-V 跟踪控制接口规范中定义，见 <<chap:tci>>；
* *N-Trace* - RISC-V N-Trace（基于 Nexus 的跟踪）规范的缩写，见 <<chap:ntrace>>；
* 跟踪编码器 - 从硬件线程接收执行信息并生成跟踪数据包流的硬件模块；
* *TFP* - 跟踪格式化器协议（Trace Formatter protocol），ARM 文档 IHI0029E 中描述的跟踪成帧协议。也被 MIPI 采纳为跟踪包装协议（Trace Wrapper Protocol，TWP）；
* *TWP* - 见 *TFP*。'''
