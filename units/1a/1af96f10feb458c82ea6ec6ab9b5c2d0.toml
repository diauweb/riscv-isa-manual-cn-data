en = '''
This chapter describes the scalar integer extensions.
Most of these extensions are accordingly named with the prefix ext:zi[],
with the exception of the integer multiplication and division extensions,
which are named ext:m[] or prefixed with ext:zm[].'''
zh = '''
本章介绍标量整数扩展。其中大多数扩展相应地以 ext:zi[] 为前缀命名，整数乘法和除法扩展除外，它们命名为 ext:m[] 或以 ext:zm[] 为前缀。'''
