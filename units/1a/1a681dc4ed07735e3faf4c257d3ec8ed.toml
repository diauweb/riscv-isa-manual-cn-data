en = '''
The entropy requirement is satisfied if 128 bits of _full entropy_ can be
obtained from each 256-bit (16{times}16-bit) successful, but possibly
non-consecutive csr::[entropy] (ES16) output sequence using a vetted conditioning
algorithm such as a cryptographic hash (See Section 3.1.5.1.1, SP 800-90B
cite:[TuBaKe:18]). In practice, a min-entropy rate of 0.75 or larger is
required for this.'''
zh = '''
若使用经审核的调节算法（如密码杂凑，见 SP 800-90B cite:[TuBaKe:18] 第 3.1.5.1.1 节），能从每个 256 位（16{times}16 位）成功但可能不连续的 csr::[entropy]（ES16）输出序列中获得 128 位__完全熵__，则满足熵要求。实践中，这要求最小熵率为 0.75 或更大。'''
