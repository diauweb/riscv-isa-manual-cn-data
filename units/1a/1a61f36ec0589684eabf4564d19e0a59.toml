en = '''
This chapter defines the ext:zfinx[] extension (pronounced "`z-f-in-x`")
that provides instructions similar to those in the standard
floating-point ext:f[] extension for single-precision floating-point
instructions but which operate on the `x` registers instead of the `f`
registers. This chapter also defines the ext:zdinx[], ext:zhinx[], and
ext:zhinxmin[] extensions that provide similar instructions for other
floating-point precisions.'''
zh = '''
本章定义 ext:zfinx[] 扩展（发音为“z-f-in-x”），它提供与标准浮点 ext:f[] 扩展中单精度浮点指令类似的指令，但这些指令操作 `x` 寄存器而不是 `f` 寄存器。本章还定义 ext:zdinx[]、ext:zhinx[] 和 ext:zhinxmin[] 扩展，它们为其他浮点精度提供类似指令。'''
