translatable = true
status = "machine"
en = '''
[#norm:smepmp_no_mml_limit]#Without the Smepmp extension, it is not possible for a PMP rule to be *enforced* only on non-Machine modes and *denied* on Machine mode, in order to allow access to a memory region solely by less-privileged modes.# [#norm:smepmp_no_mml_behavior]#It is only possible to have a *locked* rule that will be *enforced* on all modes, or a rule that will be *enforced* on non-Machine modes and be *ignored* by Machine mode.# [#norm:smepmp_machine_unlimited]#So for any physical memory region which is not protected with a Locked rule, Machine mode has unlimited access, including the ability to execute it.#'''
zh = '''
[#norm:smepmp_no_mml_limit]#在没有 Smepmp 扩展的情况下，PMP 规则不可能只对非机器模式**强制执行**而对机器模式**拒绝**，以便仅允许低特权模式访问某个内存区域。# [#norm:smepmp_no_mml_behavior]#只能有对所有模式都**强制执行**的**锁定**规则，或者对非机器模式**强制执行**而被机器模式**忽略**的规则。# [#norm:smepmp_machine_unlimited]#因此，对于任何未受锁定规则保护的物理内存区域，机器模式具有不受限制的访问权限，包括执行它的能力。#'''
