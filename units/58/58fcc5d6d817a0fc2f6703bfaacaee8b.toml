en = '''
[#norm:Zvfh_dependent_Zve32f_Zfhmin]#The ext:zvfh[] extension depends on the extlink:zve32f[] and extlink:zfhmin[] extensions.#
NOTE: Requiring basic scalar half-precision support makes ext:zvfh[]'s
vector-scalar instructions substantially more useful.
We considered requiring more complete scalar half-precision support, but we
reasoned that, for many half-precision vector workloads, performing the scalar
computation in single-precision will suffice.'''
zh = '''
[#norm:Zvfh_dependent_Zve32f_Zfhmin]#ext:zvfh[] 扩展依赖于 extlink:zve32f[] 和 extlink:zfhmin[] 扩展。#
NOTE: 要求基本标量半精度支持使 ext:zvfh[] 的向量-标量指令更有用。我们考虑过要求更完整的标量半精度支持，但认为对于许多半精度向量工作负载，以单精度执行标量计算就足够了。'''
