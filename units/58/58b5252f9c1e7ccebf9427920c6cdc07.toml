en = '''
How fields are organized and accessed (e.g packet based or memory
mapped) is outside the scope of this chapter. If a memory mapped
approach is adopted,
<<register-map,the register map>> from the RISC-V Trace Control
Interface Specification should be used.'''
zh = '''
字段的组织和访问方式（例如基于包或内存映射）不在本章范围内。如果采用内存映射方式，应使用《RISC-V 跟踪控制接口规范》中的 <<register-map,寄存器映射>>。'''
