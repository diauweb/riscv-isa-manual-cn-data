en = '''
Attempts to execute any vector instruction, or to access the vector
CSRs, raise an illegal-instruction exception when `mstatus.VS` is
set to Off.'''
zh = '''
当 `mstatus.VS` 设置为 Off 时，任何执行向量指令或访问向量 CSR 的尝试都会引发非法指令异常。'''
