en = '''
In FIPS 140-3 / SP 800-90 classification, an RBG2(P) construction is a
cryptographically secure RBG with continuous access to a physical entropy
source (`seed`) and output generated by a fully seeded, secure DRBG.
The entropy source can also be used to build RBG3
full entropy sources cite:[BaKeMc:25]. The concatenation of output words
corresponds to the `Get_entropy_bitstring` function.'''
zh = '''
在 FIPS 140-3 / SP 800-90 分类中，RBG2(P) 构造是一种密码安全的 RBG，可持续访问物理熵源（`seed`），其输出由完全播种的安全 DRBG 生成。
熵源也可用于构建 RBG3 完全熵源 cite:[BaKeMc:25]。输出字的串联对应于 `Get_entropy_bitstring` 函数。'''
