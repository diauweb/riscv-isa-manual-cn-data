en = '''
[#norm:mip_mtip_mie_mtie_op]#Bits `mip`.MTIP and `mie`.MTIE are the interrupt-pending and
interrupt-enable bits for machine timer interrupts.#
[#norm:mip_mtip_rdonly]#MTIP is read-only in the `mip` register, and is cleared by writing to
the memory-mapped machine-mode timer compare register.#'''
zh = '''
[#norm:mip_mtip_mie_mtie_op]##`mip`.MTIP 和 `mie`.MTIE 位是机器定时器中断的中断挂起位和中断使能位。##[#norm:mip_mtip_rdonly]##MTIP 在 `mip` 寄存器中为只读，通过写入内存映射的机器模式定时器比较寄存器来清零。##'''
