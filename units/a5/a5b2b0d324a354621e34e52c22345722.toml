en = '''
[#norm:ssp_op]#The csr:ssp[] CSR is an unprivileged read-write (URW) CSR that reads and writes
`XLEN` low order bits of the shadow stack pointer.# [#norm:ssp_addr]#The CSR address is
0x011.# [#norm:ssp_sz]#There is no high CSR defined as the csr:ssp[] is always as wide as the `XLEN`
of the current privilege mode.# [#norm:ssp_field_1_0]#The bits 1:0 of csr:ssp[] are read-only zero. If the
UXLEN or SXLEN may never be 32, then the bit 2 is also read-only zero.#'''
zh = '''
[#norm:ssp_op]#csr:ssp[] CSR 是一个非特权读写（URW）CSR，用于读写影子栈指针的低 `XLEN` 位。# [#norm:ssp_addr]#该 CSR 地址为 0x011。# [#norm:ssp_sz]#由于 csr:ssp[] 始终与当前特权模式的 `XLEN` 等宽，因此没有定义高位 CSR。# [#norm:ssp_field_1_0]#csr:ssp[] 的第 1:0 位为只读零。如果 UXLEN 或 SXLEN 永远不会是 32，则第 2 位也为只读零。#'''
