en = '''
The floating-point CSR, csr:fcsr[], is a 32-bit read/write register
that selects the dynamic rounding mode for floating-point arithmetic
operations and holds the accrued exception flags, as shown in <<fcsr>>.'''
zh = '''
浮点 CSR csr:fcsr[] 是一个 32 位可读写寄存器，它选择浮点算术操作的动态舍入模式，并保存累积异常标志，如 <<fcsr>> 所示。'''
