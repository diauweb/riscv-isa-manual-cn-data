en = '''
The V extension includes the `vmulh` integer multiply
variants that return the high half of the product (`vmulh.vv`,
`vmulh.vx`, `vmulhu.vv`, `vmulhu.vx`, `vmulhsu.vv`, `vmulhsu.vx`) with EEW=64.'''
zh = '''
V 扩展包含返回乘积高半部分的 `vmulh` 整数乘法变体（`vmulh.vv`、`vmulh.vx`、`vmulhu.vv`、`vmulhu.vx`、`vmulhsu.vv`、`vmulhsu.vx`），且 EEW=64。'''
