en = '''
The CSR numbers for `vstimecmp` / `vstimecmph` are 0x24D / 0x25D (within
the Virtual Supervisor Registers block of CSRs, and mirroring the CSR numbers
for stimecmp/stimecmph).'''
zh = '''
`vstimecmp` / `vstimecmph` 的 CSR 编号为 0x24D / 0x25D（位于 CSR 的虚拟监管寄存器块内，并与 stimecmp/stimecmph 的 CSR 编号相对应）。'''
