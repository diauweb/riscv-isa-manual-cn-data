en = '''
For _implicit_ accesses to supervisor-level memory management data
structures, such as page tables, S-mode endianness always applies and
UBE is ignored.'''
zh = '''
对于对监管级内存管理数据结构（例如页表）的__隐式__访问，始终应用 S 模式端序，UBE 被忽略。'''
