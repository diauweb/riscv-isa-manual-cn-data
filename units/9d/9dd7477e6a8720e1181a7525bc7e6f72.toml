en = '''
NOTE: Access to the entropy source (ext:zkr[]) in a system is usually
carefully controlled.  While the design supports unprivileged access
to the entropy source, this is unlikely to be commonly used in an
application processor, and so ext:zkr[] was not added as a profile option.
This also means the roll-up ext:zk[] was not added as a profile option.'''
zh = '''
注意：系统中对熵源（ext:zkr[]）的访问通常受到严格控制。虽然该设计支持对熵源的非特权访问，但这在应用处理器中不太可能被普遍使用，因此 ext:zkr[] 未作为配置档选项加入。这也意味着汇总扩展 ext:zk[] 未作为配置档选项加入。'''
