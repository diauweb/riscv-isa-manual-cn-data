en = '''
[#norm:c-fld_op]#C.FLD is an RV32DC/RV64DC-only instruction that loads a double-precision
floating-point value from memory into floating-point register
`_rd′_`. It computes an effective address by adding the
_zero_-extended offset, scaled by 8, to the base address in register
`_rs1′_`. It expands to
`fld rd′, offset(rs1′)`.#'''
zh = '''
[#norm:c-fld_op]#C.FLD 是仅限 RV32DC/RV64DC 的指令，从内存加载双精度浮点值到浮点寄存器 `_rd′_`。它通过将按 8 缩放的__零__扩展偏移量加到寄存器 `_rs1′_` 中的基址上来计算有效地址。它展开为 `fld rd′, offset(rs1′)`。#'''
