en = '''
NOTE: Mandating Zkt enables portable libraries for safe basic cryptographic
operations. It is expected that application processors will naturally have this
property and so implementation cost is low, if not zero, in most systems that
would support RVA22.'''
zh = '''
注意：强制要求 Zkt 可为安全的基础密码操作提供可移植库。预计应用处理器将天然具备此属性，因此在大多数支持 RVA22 的系统中，实现成本很低，甚至为零。'''
