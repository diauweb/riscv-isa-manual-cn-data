en = '''
The insn:jal[] and insn:jalr[] instructions will generate an
instruction-address-misaligned exception if the target address is not
aligned to a four-byte boundary.'''
zh = '''
若目标地址未对齐到 4 字节边界，insn:jal[] 和 insn:jalr[] 指令将产生指令地址非对齐异常。'''
