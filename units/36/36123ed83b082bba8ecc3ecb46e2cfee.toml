en = '''
NOTE: While the insn:pause[] instruction is a HINT can be implemented as a
insn:nop[] and hence trivially supported by hardware implementers, its
inclusion in the mandatory extension list signifies that software
should use the instruction whenever it would make sense and that
implementors are expected to exploit this information to optimize
hardware execution.'''
zh = '''
NOTE: 虽然 insn:pause[] 指令是一个 HINT，可实现为 insn:nop[]，因而硬件实现者可轻松支持，但将其纳入强制扩展列表意味着软件应在合理的情况下使用该指令，并且实现者应利用该信息来优化硬件执行。'''
