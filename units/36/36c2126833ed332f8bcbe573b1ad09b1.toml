status = "machine"
en = '''
[#norm:hip_vstip_op]#A virtual supervisor timer interrupt becomes pending, as reflected in the
csr::[vstip] bit in the csr:hip[] register, whenever (csr:time[] + csr:htimedelta[]), truncated
to qty:64[bits], contains a value greater than or equal to csr:vstimecmp[], treating
the values as unsigned integers.#
[#norm:hip_vstip_clear]#If the result of this comparison changes, it is guaranteed to be reflected in
csr::[vstip] eventually, but not necessarily immediately.
The interrupt remains posted until csr:vstimecmp[] becomes greater than (csr:time[] + csr:htimedelta[]),
typically as a result of writing csr:vstimecmp[].#
[#norm:hip_vstip_enable]#The interrupt will be taken based on the standard interrupt enable and
delegation rules while V=1.#'''
zh = '''
[#norm:hip_vstip_op]#每当（csr:time[] + csr:htimedelta[]）截断到 qty:64[位] 后包含大于或等于 csr:vstimecmp[] 的值（将值视为无符号整数）时，虚拟监管定时器中断变为待处理，如 csr:hip[] 寄存器中的 csr::[vstip] 位所示。#
[#norm:hip_vstip_clear]#如果此比较结果发生变化，保证最终会反映在 csr::[vstip] 中，但不一定立即反映。该中断保持挂起，直到 csr:vstimecmp[] 变得大于（csr:time[] + csr:htimedelta[]），通常是由于写入 csr:vstimecmp[]。#
[#norm:hip_vstip_enable]#当 V=1 时，该中断将根据标准中断使能和委托规则被采用。#'''
