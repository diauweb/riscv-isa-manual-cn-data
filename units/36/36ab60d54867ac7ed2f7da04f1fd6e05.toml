en = '''
See extlink:zbkb[] for details of these instructions.
These instructions are useful inside hash functions, block ciphers and
for implementing software based side-channel countermeasures like masking.
The insn:andn[] instruction is also useful for constant time word-select
in systems without the ternary Bitmanip insn:cmov[] instruction.'''
zh = '''
见 extlink:zbkb[] 了解这些指令的详细信息。这些指令在杂凑函数、分组密码以及实现基于软件的侧信道对策（如掩码）时很有用。在没有三目位操作 insn:cmov[] 指令的系统中，insn:andn[] 指令还可用于常量时间字选择。'''
