en = '''
For the csr:instret[] counter, most instructions do not affect mode transitions, so for those the behavior is clear: [#norm:instret_non_inhibited]#instructions that retire in a non-inhibited mode increment csr:instret[], and instructions that retire in an inhibited mode do not.#
There are two types of instructions that can affect a privilege mode change: instructions that cause synchronous exceptions to a more privileged mode, and xRET instructions that return to a less privileged mode. [#norm:instret_exception]#The former are not considered to retire, and hence do not increment csr:instret[].# [#norm:instret_xret]#The latter do retire, and should increment csr:instret[] only if the originating privilege mode is not inhibited.#'''
zh = '''
对于 csr:instret[] 计数器，大多数指令不影响模式转换，因此其行为是明确的：[#norm:instret_non_inhibited]#在未被禁止的模式下退休的指令递增 csr:instret[]，在被禁止的模式下退休的指令不递增。#
有两类指令可能影响特权模式改变：导致同步异常进入更高特权模式的指令，以及返回到较低特权模式的 xRET 指令。[#norm:instret_exception]#前者不被视为退休，因此不递增 csr:instret[]。# [#norm:instret_xret]#后者确实退休，并且仅当发起时的特权模式未被禁止时才应递增 csr:instret[]。#'''
