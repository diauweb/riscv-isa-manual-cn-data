en = '''
[NOTE]
====
[#norm:rvwmo_only_mainmem]#This chapter defines the memory model for regular main memory
operations. The interaction of the memory model with I/O memory,
instruction fetches (extlink:ziccif[]), insn:fence.i[], page-table walks, and insn:sfence.vma[] is not
(yet) formalized.# Some or all of the above may be formalized in a future
revision of this specification.

[#norm:rvwmo_excludes_overlap_widths]#Memory consistency models supporting overlapping
memory accesses of different widths simultaneously remain an active area of academic
research and are not yet fully understood. The specifics of how memory
accesses of different sizes interact under RVWMO are specified to the
best of our current abilities#, but they are subject to revision should
new issues be uncovered.
===='''
zh = '''
[NOTE]
====
[#norm:rvwmo_only_mainmem]##本章定义常规主存操作的内存模型。内存模型与 I/O 内存、取指（extlink:ziccif[]）、insn:fence.i[]、页表遍历以及 insn:sfence.vma[] 的交互尚未形式化。##上述部分或全部内容可能在本规范的未来修订版中形式化。

[#norm:rvwmo_excludes_overlap_widths]##同时支持不同宽度重叠内存访问的内存一致性模型仍是学术研究的活跃领域，尚未得到完全理解。RVWMO 下不同大小的内存访问如何交互的具体细节，已按当前能力所及予以规定##，但若发现新问题，这些细节可能会修订。
===='''
