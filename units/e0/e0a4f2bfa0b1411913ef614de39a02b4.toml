en = '''
This chapter describes the scalar integer extensions.
Most of these extensions are accordingly named with the prefix "Zi",
with the exception of the integer multiplication and division extensions,
which are named "M" or prefixed with "Zm".'''
zh = '''
本章描述标量整数扩展。这些扩展大多相应地以 "Zi" 为前缀命名，但整数乘法和除法扩展除外，它们命名为 "M" 或以 "Zm" 为前缀。'''
