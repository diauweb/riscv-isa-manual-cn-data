en = '''
<<norm:csr_addr_alloc_tbl>> also indicates the convention to
allocate CSR addresses between standard and custom uses. The CSR
addresses designated for custom uses will not be redefined by future
standard extensions.'''
zh = '''
<<norm:csr_addr_alloc_tbl>> 还指示了在标准用途与自定义用途之间分配 CSR 地址的约定。指定用于自定义用途的 CSR 地址将不会被未来的标准扩展重新定义。'''
