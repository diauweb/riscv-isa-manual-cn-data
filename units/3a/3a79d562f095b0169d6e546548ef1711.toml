en = '''
[#norm:pma_rsrv_levels]#For _LR/SC_, there are three levels of support indicating combinations
of the reservability and eventuality properties: _RsrvNone_,
_RsrvNonEventual_, and _RsrvEventual_. RsrvNone indicates that no LR/SC
operations are supported (the location is non-reservable).
RsrvNonEventual indicates that the operations are supported (the
location is reservable), but without the eventual success guarantee
described in the unprivileged ISA specification. RsrvEventual indicates
that the operations are supported and provide the eventual success guarantee.#'''
zh = '''
[#norm:pma_rsrv_levels]#对于 _LR/SC_，有三个支持级别，指示可预留性和最终成功性这两种属性的组合：_RsrvNone_、_RsrvNonEventual_ 和 _RsrvEventual_。RsrvNone 指示不支持任何 LR/SC 操作（该位置不可预留）。RsrvNonEventual 指示支持这些操作（该位置可预留），但没有非特权 ISA 规范中所述的最终成功保证。RsrvEventual 指示支持这些操作并提供最终成功保证。#'''
