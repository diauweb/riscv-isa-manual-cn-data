en = '''
The software-check exception due to the instruction not being an
insn:lpad[] instruction when `ELP` is `LP_EXPECTED` or a software-check
exception caused by the insn:lpad[] instruction itself leads to a trap being
delivered to the same or to a higher privilege mode.'''
zh = '''
当 `ELP` 为 `LP_EXPECTED` 时，由于该指令不是
insn:lpad[] 指令而引起的软件检查异常，或由 insn:lpad[] 指令本身引起的软件检查异常，都会导致陷阱被递送到同一或更高的特权模式。'''
