en = '''
[#norm:mstateen-bit-63_op]#For each `mstateen` CSR, bit 63 is defined to control access to the
matching `sstateen` and `hstateen` CSRs.# That is, bit 63 of `mstateen0` controls
access to `sstateen0` and `hstateen0`; bit 63 of `mstateen1` controls access to
`sstateen1` and `hstateen1`; etc. [#norm:hstateen-bit-63_op]#Likewise, bit 63 of each `hstateen`
correspondingly controls access to the matching `sstateen` CSR.#'''
zh = '''
[#norm:mstateen-bit-63_op]#对于每个 `mstateen` CSR，第 63 位被定义为控制对匹配的 `sstateen` 和 `hstateen` CSR 的访问。# 也就是说，`mstateen0` 的第 63 位控制对 `sstateen0` 和 `hstateen0` 的访问；`mstateen1` 的第 63 位控制对 `sstateen1` 和 `hstateen1` 的访问；依此类推。 [#norm:hstateen-bit-63_op]#同样，每个 `hstateen` 的第 63 位相应地控制对匹配的 `sstateen` CSR 的访问。#'''
