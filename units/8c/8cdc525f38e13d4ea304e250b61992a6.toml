en = '''
[#norm:Ssqosid_srmcfg_register_size]#The `srmcfg` register is an SXLEN-bit read/write register used to configure a
Resource Control ID (`RCID`) and a Monitoring Counter ID (`MCID`). Both `RCID`
and `MCID` are WARL fields.#  The register is formatted as shown in <<norm:srmcfg_enc_img>>
when SXLEN=64 and <<SRMCFG32>> when SXLEN=32.'''
zh = '''
[#norm:Ssqosid_srmcfg_register_size]##`srmcfg` 寄存器是 SXLEN 位可读写寄存器，用于配置资源控制 ID（`RCID`）和监控计数器 ID（`MCID`）。`RCID` 和 `MCID` 均为 WARL 字段。## 当 SXLEN=64 时，该寄存器的格式如 <<norm:srmcfg_enc_img>> 所示；当 SXLEN=32 时，格式如 <<SRMCFG32>> 所示。'''
