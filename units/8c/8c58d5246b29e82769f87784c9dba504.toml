en = '''
[float="center",align="center",cols="<23,<61,^10,^10",options="header"]
|===
|Field |Description |Access |Reset
|[[mcontrol6-uncertain]] `((uncertain))`
a|If implemented, the TM updates this field every time the trigger
fires.

0 (certain): The trigger that fired satisfied the configured conditions, or
this bit is not implemented.


1 (uncertain): The trigger that fired might not have perfectly satisfied the
configured conditions. Due to the implementation the hardware
cannot be certain.
a|*WARL*
a|0
|[[mcontrol6-vs]] `((vs))`
a|When set, enable this trigger in VS-mode.
This bit is hard-wired to 0 if the hart does not support
virtualization mode.
a|*WARL*
a|0
|[[mcontrol6-vu]] `((vu))`
a|When set, enable this trigger in VU-mode.
This bit is hard-wired to 0 if the hart does not support
virtualization mode.
a|*WARL*
a|0
|[[mcontrol6-hit0]] `((hit0))`
a|If they are implemented, {mcontrol6-hit1} (MSB) and
{mcontrol6-hit0} (LSB) combine into a single 2-bit field.
The TM updates this field when the trigger fires. After the debugger
has seen the update, it will normally write 0 to this field so it
can see future changes.

If either of the bits is not implemented, the unimplemented bits
will be read-only 0.

0 (false): The trigger did not fire.


1 (before): The trigger fired before the instruction that matched it was
retired, but after all preceding instructions are retired. This
explicitly allows for instructions to be partially executed, as
described in xref:multistate[].

`xepc` or {csr-dpc} (depending on {mcontrol6-action}) must be set
to the virtual address of the instruction that matched.


2 (after): The trigger fired after the instruction that triggered and at least
one additional instruction were retired.
`xepc` or {csr-dpc} (depending on {mcontrol6-action}) must be set
to the virtual address of the next instruction that must be executed
to preserve the program flow.


3 (immediately after): The trigger fired just after the instruction that triggered it was
retired, but before any subsequent instructions were executed.
`xepc` or {csr-dpc} (depending on {mcontrol6-action}) must be set
to the virtual address of the next instruction that must be executed
to preserve the program flow.

If the instruction performed multiple memory accesses, all of them
have been completed.
a|*WARL*
a|0
|[[mcontrol6-select]] `((select))`
a|This bit determines the contents of the XLEN-bit compare values.

0 (address): There is at least one compare value and it contains the lowest
virtual address of the access.
In addition, it is recommended that there are additional compare
values for the other accessed virtual addresses.
(E.g. on a 32-bit read from 0x4000, the lowest address is 0x4000
and the other addresses are 0x4001, 0x4002, and 0x4003.)


1 (data): There is exactly one compare value and it contains the data
value loaded or stored, or the instruction executed.
Any bits beyond the size of the data access will contain 0.
a|*WARL*
a|0
|[[mcontrol6-size]] `((size))`
a|

0 (any): The trigger will attempt to match against an access of any size.
The behavior is only well-defined if {mcontrol6-select}=0, or if the
access size is XLEN.


1 (8bit): The trigger will only match against 8-bit memory accesses.


2 (16bit): The trigger will only match against 16-bit memory accesses or
execution of 16-bit instructions.


3 (32bit): The trigger will only match against 32-bit memory accesses or
execution of 32-bit instructions.


4 (48bit): The trigger will only match against execution of 48-bit instructions.


5 (64bit): The trigger will only match against 64-bit memory accesses or
execution of 64-bit instructions.


6 (128bit): The trigger will only match against 128-bit memory accesses or
execution of 128-bit instructions.

An implementation must support the value of 0, but all other values
are optional. When an implementation supports address triggers
({mcontrol6-select}=0), it is recommended that those triggers
support every access size that the hart supports, as well as for
every instruction size that the hart supports.

Implementations such as RV32D or RV64V are able to perform loads
and stores that are wider than XLEN. Custom extensions may also
support instructions that are wider than XLEN. Because
{csr-tdata2} is of size XLEN, there is a known limitation that
data value triggers ({mcontrol6-select}=1) can only be supported
for access sizes up to XLEN bits.  When an implementation supports
data value triggers ({mcontrol6-select}=1), it is recommended
that those triggers support every access size up to XLEN that the
hart supports, as well as for every instruction length up to XLEN
that the hart supports.
a|*WARL*
a|0
|[[mcontrol6-action]] `((action))`
a|The action to take when the trigger fires. The values are explained
in xref:tab:action[].
a|*WARL*
a|0
|[[mcontrol6-chain]] `((chain))`
a|

0 (disabled): When this trigger matches, the configured action is taken.


1 (enabled): While this trigger does not match, it prevents the trigger with
the next index from matching.

A trigger chain starts on the first trigger with `chain`=1 after
a trigger with `chain`=0, or simply on the first trigger if that
has `chain`=1. It ends on the first trigger after that which has
`chain`=0. This final trigger is part of the chain. The action
on all but the final trigger is ignored.  The action on that final
trigger will be taken if and only if all the triggers in the chain
match at the same time.

Debuggers should not terminate a chain with a trigger with a
different type. It is undefined when exactly such a chain fires.

Because {mcontrol6-chain} affects the next trigger, hardware must zero it in
writes to {csr-mcontrol6} that set {tdata1-dmode} to 0 if the next trigger has
{tdata1-dmode} of 1.
In addition hardware should ignore writes to {csr-mcontrol6} that set
{tdata1-dmode} to 1 if the previous trigger has both {tdata1-dmode} of 0 and
{mcontrol6-chain} of 1. Debuggers must avoid the latter case by checking
{mcontrol6-chain} on the previous trigger if they're writing {csr-mcontrol6}.

Implementations that wish to limit the maximum length of a trigger
chain (e.g. to meet timing requirements) may do so by zeroing
{mcontrol6-chain} in writes to {csr-mcontrol6} that would make the chain too long.
a|*WARL*
a|0
|[[mcontrol6-match]] `((match))`
a|

0 (equal): Matches when any compare value equals {csr-tdata2}.


1 (napot): Matches when the top `M` bits of any compare value match the top
`M` bits of {csr-tdata2}.
`M` is `XLEN-1` minus the index of the least-significant bit
containing 0 in {csr-tdata2}.
{csr-tdata2} is *WARL* and if bits `maskmax6-1:0` are written with all
ones then bit `maskmax6-1` will be set to 0 while the values of bits `maskmax6-2:0`
are UNSPECIFIED.
Legal values for {csr-tdata2} require M + `maskmax6` ≥ `XLEN` and `M` > 0.
See above for how to determine maskmax6.


2 (ge): Matches when any compare value is greater than (unsigned) or
equal to {csr-tdata2}.


3 (lt): Matches when any compare value is less than (unsigned)
{csr-tdata2}.


4 (mask low): Matches when `XLEN/2-1:0` of any compare value
equals `XLEN/2-1:0` of {csr-tdata2} after
`XLEN/2-1:0` of the compare value is ANDed with
`XLEN-1:XLEN/2` of {csr-tdata2}.


5 (mask high): Matches when `XLEN-1:XLEN/2` of any compare
value equals `XLEN/2-1:0` of {csr-tdata2} after
`XLEN-1:XLEN/2` of the compare value is ANDed with
`XLEN-1:XLEN/2` of {csr-tdata2}.


8 (not equal): Matches when {mcontrol6-match} `=0` would not match.


9 (not napot): Matches when {mcontrol6-match} `=1` would not match.


12 (not mask low): Matches when {mcontrol6-match} `=4` would not match.


13 (not mask high): Matches when {mcontrol6-match} `=5` would not match.

Other values are reserved for future use.

All comparisons only look at the lower XLEN (in the current mode)
bits of the compare values and of {csr-tdata2}.
When {mcontrol6-select}=1 and access size is N, this is further
reduced, and comparisons only look at the lower N bits of the
compare values and of {csr-tdata2}.
a|*WARL*
a|0
|[[mcontrol6-m]] `((m))`
a|When set, enable this trigger in M-mode.
a|*WARL*
a|0
|[[mcontrol6-uncertainen]] `((uncertainen))`
a|

0 (disabled): This trigger will only match if the hardware can perfectly
evaluate it.


1 (enabled): This trigger will match if it's possible that it would match if
the Trigger Module had perfect information about the operations
being performed.
a|*WARL*
a|0
|[[mcontrol6-s]] `((s))`
a|When set, enable this trigger in S/HS-mode.
This bit is hard-wired to 0 if the hart does not support
S-mode.
a|*WARL*
a|0
|[[mcontrol6-u]] `((u))`
a|When set, enable this trigger in U-mode.
This bit is hard-wired to 0 if the hart does not support
U-mode.
a|*WARL*
a|0
|[[mcontrol6-execute]] `((execute))`
a|When set, the trigger fires on the virtual address or opcode of an
instruction that is executed.
a|*WARL*
a|0
|[[mcontrol6-store]] `((store))`
a|When set, the trigger fires on the virtual address or data of any
store.
a|*WARL*
a|0
|[[mcontrol6-load]] `((load))`
a|When set, the trigger fires on the virtual address or data of any
load.
a|*WARL*
a|0
|==='''
zh = '''
[float="center",align="center",cols="<23,<61,^10,^10",options="header"]
|===
|Field |Description |Access |Reset
|[[mcontrol6-uncertain]] `((uncertain))`
a|若实现，TM 在每次触发器触发时更新此字段。

0（确定）：已触发的触发器满足了配置的条件，或者此位未实现。


1（不确定）：已触发的触发器可能未完全满足配置的条件。由于实现原因，硬件无法确定。
a|*WARL*
a|0
|[[mcontrol6-vs]] `((vs))`
a|置位时，在 VS 模式使能此触发器。
若硬件线程不支持虚拟化模式，则此位硬连线为 0。
a|*WARL*
a|0
|[[mcontrol6-vu]] `((vu))`
a|置位时，在 VU 模式使能此触发器。
若硬件线程不支持虚拟化模式，则此位硬连线为 0。
a|*WARL*
a|0
|[[mcontrol6-hit0]] `((hit0))`
a|若实现，{mcontrol6-hit1}（MSB）和 {mcontrol6-hit0}（LSB）组合成一个 2 位字段。
TM 在触发器触发时更新此字段。调试器看到更新后，通常会向此字段写 0，以便能看到后续变化。

若其中任一位未实现，未实现的位只读为 0。

0（假）：触发器未触发。


1（之前）：触发器在匹配它的指令退休之前触发，但在所有前面的指令退休之后。这明确允许指令部分执行，如 xref:multistate[] 所述。

必须将 `xepc` 或 {csr-dpc}（取决于 {mcontrol6-action}）设置为匹配指令的虚拟地址。


2（之后）：触发器在触发它的指令以及至少一条附加指令退休之后触发。
必须将 `xepc` 或 {csr-dpc}（取决于 {mcontrol6-action}）设置为为保持程序流而必须执行的下一条指令的虚拟地址。


3（紧随其后）：触发器在触发它的指令刚退休之后触发，但在任何后续指令执行之前。
必须将 `xepc` 或 {csr-dpc}（取决于 {mcontrol6-action}）设置为为保持程序流而必须执行的下一条指令的虚拟地址。

若该指令执行了多次内存访问，则所有这些访问都已完成。
a|*WARL*
a|0
|[[mcontrol6-select]] `((select))`
a|此位决定 XLEN 位比较值的内容。

0（地址）：至少有一个比较值，其中包含访问的最低虚拟地址。
此外，建议为其他被访问的虚拟地址提供额外的比较值。
（例如，对于从 0x4000 开始的 32 位读，最低地址为 0x4000，其他地址为 0x4001、0x4002 和 0x4003。）


1（数据）：恰好有一个比较值，其中包含加载或存储的数据值，或执行的指令。
超出数据访问大小的任何位都包含 0。
a|*WARL*
a|0
|[[mcontrol6-size]] `((size))`
a|

0（任意）：触发器将尝试匹配任意大小的访问。
仅当 {mcontrol6-select}=0，或访问大小为 XLEN 时，行为才有良好定义。


1（8 位）：触发器将只匹配 8 位内存访问。


2（16 位）：触发器将只匹配 16 位内存访问或 16 位指令的执行。


3（32 位）：触发器将只匹配 32 位内存访问或 32 位指令的执行。


4（48 位）：触发器将只匹配 48 位指令的执行。


5（64 位）：触发器将只匹配 64 位内存访问或 64 位指令的执行。


6（128 位）：触发器将只匹配 128 位内存访问或 128 位指令的执行。

实现必须支持值 0，但所有其他值都是可选的。当实现支持地址触发器（{mcontrol6-select}=0）时，建议这些触发器支持该硬件线程支持的所有访问大小，以及该硬件线程支持的所有指令大小。

诸如 RV32D 或 RV64V 的实现能够执行比 XLEN 更宽的加载和存储。自定义扩展也可能支持比 XLEN 更宽的指令。由于 {csr-tdata2} 的大小为 XLEN，已知存在这样的限制：数据值触发器（{mcontrol6-select}=1）只能支持最大到 XLEN 位的访问大小。当实现支持数据值触发器（{mcontrol6-select}=1）时，建议这些触发器支持该硬件线程支持的所有不超过 XLEN 的访问大小，以及该硬件线程支持的所有不超过 XLEN 的指令长度。
a|*WARL*
a|0
|[[mcontrol6-action]] `((action))`
a|触发器触发时要执行的动作。各值的解释见 xref:tab:action[]。
a|*WARL*
a|0
|[[mcontrol6-chain]] `((chain))`
a|

0（禁用）：当此触发器匹配时，采取配置的动作。


1（启用）：当此触发器不匹配时，它阻止下一个索引的触发器匹配。

触发器链开始于 `chain`=0 的触发器之后的第一个 `chain`=1 的触发器，或者如果第一个触发器就有 `chain`=1，则直接开始于该触发器。它结束于其后第一个 `chain`=0 的触发器。这最后一个触发器是链的一部分。除最后一个触发器外，所有触发器上的动作都被忽略。当且仅当链中所有触发器同时匹配时，才会采取最后一个触发器上的动作。

调试器不应用不同类型的触发器终止链。此类链确切的触发时机未定义。

由于 {mcontrol6-chain} 会影响下一个触发器，若下一个触发器具有 {tdata1-dmode} 为 1，则在对 {csr-mcontrol6} 的写入中将 {tdata1-dmode} 设为 0 时，硬件必须将其清零。
此外，若前一个触发器同时具有 {tdata1-dmode} 为 0 和 {mcontrol6-chain} 为 1，则硬件应忽略将对 {csr-mcontrol6} 中 {tdata1-dmode} 设为 1 的写入。调试器在写 {csr-mcontrol6} 时，必须通过检查前一个触发器上的 {mcontrol6-chain} 来避免后一种情况。

希望限制触发器链最大长度（例如为满足时序要求）的实现，可以在会使链过长的对 {csr-mcontrol6} 的写入中将 {mcontrol6-chain} 清零。
a|*WARL*
a|0
|[[mcontrol6-match]] `((match))`
a|

0（相等）：当任一比较值等于 {csr-tdata2} 时匹配。


1（napot）：当任一比较值的高 `M` 位与 {csr-tdata2} 的高 `M` 位匹配时匹配。
`M` 等于 `XLEN-1` 减去 {csr-tdata2} 中包含 0 的最低有效位的索引。
{csr-tdata2} 是 *WARL* 的，若位 `maskmax6-1:0` 全写为 1，则位 `maskmax6-1` 将被设为 0，而位 `maskmax6-2:0` 的值是 UNSPECIFIED。
{csr-tdata2} 的合法值要求 M + `maskmax6` ≥ `XLEN` 且 `M` > 0。
关于如何确定 maskmax6，见上文。


2（ge）：当任一比较值大于（无符号）或等于 {csr-tdata2} 时匹配。


3（lt）：当任一比较值小于（无符号）{csr-tdata2} 时匹配。


4（低位掩码）：当任一比较值的 `XLEN/2-1:0` 在将比较值的 `XLEN/2-1:0` 与 {csr-tdata2} 的 `XLEN-1:XLEN/2` 进行 AND 运算后，等于 {csr-tdata2} 的 `XLEN/2-1:0` 时匹配。


5（高位掩码）：当任一比较值的 `XLEN-1:XLEN/2` 在将比较值的 `XLEN-1:XLEN/2` 与 {csr-tdata2} 的 `XLEN-1:XLEN/2` 进行 AND 运算后，等于 {csr-tdata2} 的 `XLEN/2-1:0` 时匹配。


8（不等）：当 {mcontrol6-match} `=0` 不匹配时匹配。


9（非 napot）：当 {mcontrol6-match} `=1` 不匹配时匹配。


12（非低位掩码）：当 {mcontrol6-match} `=4` 不匹配时匹配。


13（非高位掩码）：当 {mcontrol6-match} `=5` 不匹配时匹配。

其他值保留供未来使用。

所有比较只查看比较值和 {csr-tdata2} 的低 XLEN 位（在当前模式下）。
当 {mcontrol6-select}=1 且访问大小为 N 时，这一范围进一步缩小，比较只查看比较值和 {csr-tdata2} 的低 N 位。
a|*WARL*
a|0
|[[mcontrol6-m]] `((m))`
a|置位时，在 M 模式使能此触发器。
a|*WARL*
a|0
|[[mcontrol6-uncertainen]] `((uncertainen))`
a|

0（禁用）：此触发器仅在硬件能完美判定它时才匹配。


1（启用）：如果当 Trigger Module 对正在执行的操作具有完美信息时此触发器有可能匹配，则它会匹配。
a|*WARL*
a|0
|[[mcontrol6-s]] `((s))`
a|置位时，在 S/HS 模式使能此触发器。
若硬件线程不支持 S 模式，则此位硬连线为 0。
a|*WARL*
a|0
|[[mcontrol6-u]] `((u))`
a|置位时，在 U 模式使能此触发器。
若硬件线程不支持 U 模式，则此位硬连线为 0。
a|*WARL*
a|0
|[[mcontrol6-execute]] `((execute))`
a|置位时，触发器在被执行指令的虚拟地址或操作码上触发。
a|*WARL*
a|0
|[[mcontrol6-store]] `((store))`
a|置位时，触发器在任意存储的虚拟地址或数据上触发。
a|*WARL*
a|0
|[[mcontrol6-load]] `((load))`
a|置位时，触发器在任意加载的虚拟地址或数据上触发。
a|*WARL*
a|0
|==='''
