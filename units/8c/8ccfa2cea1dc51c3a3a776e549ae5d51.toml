整数标量读/写指令在标量 `x` 寄存器与 EMUL = ceil(EEW/VLEN) 的向量寄存器组的元素 0 之间传输单个值。[#norm:vmv-x-s_vmv-s-x_ignorelmul]#这些指令忽略 LMUL；EMUL 计算为 ceil(EEW/VLEN)。#'''
