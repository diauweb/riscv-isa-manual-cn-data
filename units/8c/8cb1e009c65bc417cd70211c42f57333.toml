====
=== 大小写敏感性

ISA 命名字符串不区分大小写。

=== 基本整数 ISA

RISC-V ISA 字符串以 RV32I、RV32E、RV64I 或 RV64E 之一开头，表示基本整数 ISA 支持的地址空间大小（以位为单位）。

=== 指令集扩展名称

标准 ISA 扩展使用由单个字母组成的名称。例如，整数基础的前四个标准扩展是：表示整数乘除法的 "M"，表示原子内存指令的 "A"，表示单精度浮点指令的 "F"，以及表示双精度浮点指令的 "D"。任何 RISC-V 指令集变体都可以通过将基本整数前缀与所包含扩展的名称连接来简洁描述，例如 "RV64IMAFD"。

我们还定义了缩写 "G" 来表示 "IMAFDZicsr_Zifencei" 基础与扩展，因为它旨在代表我们的标准通用 ISA。

RISC-V ISA 的标准扩展被赋予其他保留字母，例如 "Q" 表示四精度浮点，或 "C" 表示 16 位压缩指令格式。

一些 ISA 扩展依赖于其他扩展的存在，例如 "D" 依赖于 "F"，而 "F" 依赖于 "Zicsr"。这些依赖关系可以隐含在 ISA 名称中：例如，RV32IF 等价于 RV32IFZicsr，RV32ID 等价于 RV32IFD 和 RV32IFDZicsr。

=== 下划线

可以使用下划线 "_" 分隔 ISA 扩展，以提高可读性并提供消歧，例如 "RV32I2_M2_A2"。

=== 附加标准非特权扩展名称

标准非特权扩展也可以通过使用单个 "Z" 后跟字母数字名称来命名。名称必须以字母字符结尾。如果最后一个字母是 "p"，则倒数第二个字母不能为数字。例如，"Zifencei" 命名了 <<zifencei>> 中描述的取指栅栏扩展。

"Z" 后的第一个字母按惯例表示最密切相关的字母扩展类别，即 IMAFDQLCBKJTPVH。例如，对于附加浮点指令的 "Zfa" 扩展，字母 "f" 表示该扩展与 "F" 标准扩展相关。如果命名多个 "Z" 扩展，则应首先按类别排序，然后在类别内按字母顺序排序——例如 "Zicsr_Zifencei_Ztso"。

所有多字母扩展，包括带 "Z" 前缀的扩展，都必须用下划线与其他多字母扩展分隔，例如 "RV32IMACZicsr_Zifencei"。

=== 监管级指令集扩展名称

扩展监管级虚拟内存架构的标准扩展以字母 "Sv" 为前缀，后跟字母数字名称。扩展监管级架构的其他标准扩展以字母 "Ss" 为前缀，后跟字母数字名称。名称必须以字母字符结尾。如果最后一个字母是 "p"，则倒数第二个字母不能为数字。这些扩展在第二卷中进一步定义。

扩展 "sv32"、"sv39"、"sv48" 和 "sv59" 是在禁止扩展名称以数字结尾的规则建立之前定义的。

标准监管级扩展应列在标准非特权扩展之后，并且像其他多字母扩展一样，必须用下划线与其他多字母扩展分隔。如果列出多个监管级扩展，则应按字母顺序排序。

=== 虚拟机监控器级指令集扩展名称

扩展虚拟机监控器级架构的标准扩展以字母 "Sh" 为前缀。如果列出多个虚拟机监控器级扩展，则应按字母顺序排序。

NOTE: 许多对虚拟机监控器级架构的增强更自然地定义为监管级扩展，遵循上一节描述的方案。"Sh" 前缀用于少数没有监管程序可见效果的虚拟机监控器级扩展。

=== 机器级指令集扩展名称

标准机器级指令集扩展以字母 "Sm" 为前缀。

标准机器级扩展应列在标准较低特权扩展之后，并且像其他多字母扩展一样，必须用下划线与其他多字母扩展分隔。如果列出多个机器级扩展，则应按字母顺序排序。

=== 非标准扩展名称

非标准扩展通过使用单个 "X" 后跟字母数字名称来命名。名称必须以字母字符结尾。如果最后一个字母是 "p"，则倒数第二个字母不能为数字。例如，"Xhwacha" 命名了 Hwacha 向量取指 ISA 扩展。

非标准扩展必须列在所有标准扩展之后，并且像其他多字母扩展一样，必须用下划线与其他多字母扩展分隔。例如，具有非标准扩展 Argle 和 Bargle 的 ISA 可以命名为 "RV64IZifencei_Xargle_Xbargle"。

如果列出多个非标准扩展，则应按字母顺序排序。像其他多字母扩展一样，它们应使用下划线与其他多字母扩展分隔。

=== 版本号

认识到指令集可能随时间扩展或改变，我们在扩展名称后编码扩展版本号。版本号分为主版本号和次版本号，用 "p" 分隔。如果次版本号为 "0"，则版本字符串中可以省略 "p0"。为避免歧义，任何扩展名称不得以数字或数字后面的 "p" 结尾。

由于用于打包 SIMD 的 "P" 扩展可能与版本号中的小数点混淆，如果它跟在另一个带版本号的扩展之后，则必须在其前面加下划线。例如，"rv32i2p2" 表示 RV32I 的 2.2 版，而 "rv32i2_p2" 表示 RV32I 的 2.0 版以及 P 扩展的 2.0 版。

主版本号的变化意味着失去向后兼容性，而仅次版本号的变化必须向后兼容。例如，本手册 1.0 版中定义的原始 64 位标准 ISA 可以完整写为 "RV64I1p0M1p0A1p0F1p0D1p0"，更简洁地写为 "RV64I1M1A1F1D1"。

我们在第二版中引入了版本编号方案。因此，我们将标准扩展的默认版本定义为当时存在的版本，例如 "RV32I" 等价于 "RV32I2"。

=== 子集命名约定

<<isanametable>> 总结了标准化扩展名称。该表还定义了扩展名称在名称字符串中必须出现的规范顺序，表中从上到下表示名称字符串中从先到后，例如 RV32IMACV 合法，而 RV32IMAVC 不合法。

[[isanametable]]
.标准 ISA 扩展名称。
[%autowidth,float="center",align="center",cols="<,^,^",options="header",]
|===
|子集 |名称 |隐含

|基本 ISA | |

|整数 |I |

|精简整数 |E |

3+|*标准非特权扩展*

|整数乘除法 |M |Zmmul

|原子操作 |A |

