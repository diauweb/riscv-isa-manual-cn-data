en = '''
This chapter describes the D standard extension for _double-precision_
floating-point, which adds computational instructions compliant with the IEEE
754-2008 arithmetic standard's binary64 format and operations. The D extension
depends on the F extension.
(((double-precision, floating point)))
(((floating point, double precision)))'''
