en = '''
`mseccfg` is a 64-bit read/write register, formatted as shown in <<mseccfg>>,
that controls security features. It exists if any extension that adds a field
to `mseccfg` is implemented. Otherwise, it is reserved.'''
zh = '''
`mseccfg` 是一个 64 位读写寄存器，格式如 <<mseccfg>> 所示，控制安全特性。若实现了任何向 `mseccfg` 添加字段的扩展，则该寄存器存在。否则，该寄存器为保留。'''
