en = '''
If U-mode is not supported, csr::[ube] is read-only 0. Otherwise, UBE controls
whether explicit load and store memory accesses made from U-mode are
little-endian (csr::[ube]=0) or big-endian (csr::[ube]=1).'''
zh = '''
若不支持 U 模式，则 csr::[ube] 为只读 0。否则，UBE 控制从 U 模式发起的显式加载和存储内存访问是小端序（csr::[ube]=0）还是大端序（csr::[ube]=1）。'''
