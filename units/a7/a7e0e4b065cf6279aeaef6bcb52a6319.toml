kind = "paragraph"
translatable = true
status = "machine"
en = '''
[#norm:misa_mxl_op_isa]#The csr::[mxl] (Machine XLEN) field encodes the native base integer ISA width as
shown in <<norm:misa_mxl_enc>>.#
[#norm:misa_mxl_acc]#The csr::[mxl] field is read-only.#
[#norm:misa_mxl_op_nz]#If csr:misa[] is nonzero, the
csr::[mxl] field indicates the effective XLEN in M-mode, a constant termed _MXLEN_.#
[#norm:xlen_le_mxlen]#XLEN is never greater than MXLEN, but XLEN might be smaller than MXLEN in
less-privileged modes.#'''
zh = '''
[#norm:misa_mxl_op_isa]#csr::[mxl]（Machine XLEN，机器 XLEN）字段编码原生基本整数 ISA 宽度，如 <<norm:misa_mxl_enc>> 所示。#
[#norm:misa_mxl_acc]#csr::[mxl] 字段为只读。#
[#norm:misa_mxl_op_nz]#如果 csr:misa[] 非零，则 csr::[mxl] 字段指示 M 模式下的有效 XLEN，这是一个称为 _MXLEN_ 的常量。#
[#norm:xlen_le_mxlen]#XLEN 永远不会大于 MXLEN，但在特权级较低的模式下 XLEN 可能小于 MXLEN。#'''
