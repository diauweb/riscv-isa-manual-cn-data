en = '''
[#norm:stateen_implicit_state_update]#When a `stateen` CSR prevents access to state for a privilege mode, attempting to
execute in that privilege mode an instruction that _implicitly_ updates the
state without reading it may or may not raise an illegal-instruction or virtual-instruction
exception.# Such cases must be disambiguated by being explicitly
specified one way or the other.'''
zh = '''
[#norm:stateen_implicit_state_update]#当某个 `stateen` CSR 阻止某个特权模式访问某状态时，在该特权模式下尝试执行一条__隐式__更新该状态而不读取它的指令，可能会也可能不会引发非法指令异常或虚拟指令异常。# 此类情况必须通过明确指定为其中一种方式来消除歧义。'''
