en = '''
[#norm:mstatus_sxl_uxl_warl_op]#For RV64 harts, the SXL and UXL fields are *WARL* fields that control the
value of XLEN for S-mode and U-mode, respectively.#
[#norm:mstatus_sxl_uxl_enc]#The encoding of these fields is the same as the MXL field of `misa`, shown in <<norm:misa_mxl_enc>>.#
[#norm:sxlen_uxlen]#The effective XLEN in S-mode and U-mode are termed _SXLEN_ and _UXLEN_, respectively.#'''
zh = '''
[#norm:mstatus_sxl_uxl_warl_op]##对于 RV64 硬件线程，SXL 和 UXL 字段是 *WARL* 字段，分别控制 S 模式和 U 模式的 XLEN 值。##[#norm:mstatus_sxl_uxl_enc]##这些字段的编码与 `misa` 的 MXL 字段相同，如 <<norm:misa_mxl_enc>> 所示。##[#norm:sxlen_uxlen]##S 模式和 U 模式下的有效 XLEN 分别称为 __SXLEN__ 和 __UXLEN__。##'''
