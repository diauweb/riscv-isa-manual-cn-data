en = '''
[#norm:pause_op]#The PAUSE instruction is a HINT that indicates the current hart's rate
of instruction retirement should be temporarily reduced or paused. The
duration of its effect must be bounded and may be zero.#
(((PAUSE, HINT)))
(((HINT, PAUSE)))'''
zh = '''
[#norm:pause_op]#PAUSE 指令是一条 HINT，指示当前硬件线程的指令退休速率应被暂时降低或暂停。其生效持续时间必须有界，且可以为零。#
(((PAUSE, HINT)))
(((HINT, PAUSE)))'''
