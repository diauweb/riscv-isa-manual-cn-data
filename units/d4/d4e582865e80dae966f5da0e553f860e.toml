translatable = true
status = "machine"
en = '''
When a guest-page-fault trap is taken into M-mode, csr:mtval2[] is written
with either zero or the guest physical address that faulted, shifted
right by qty:2[bits]. For other traps, csr:mtval2[] is set to zero, but a future
standard or extension may redefine csr:mtval2[]'s setting for other traps.'''
zh = '''
当客户机页错误陷阱进入 M 模式时，csr:mtval2[] 被写入零或触发错误的客户机物理地址右移 qty:2[bits] 后的值。对于其他陷阱，csr:mtval2[] 置零，但未来标准或扩展可能重新定义 csr:mtval2[] 对其他陷阱的设置。'''
