en = '''
<<fsxsstates>> shows all the possible state
transitions for the csr::[fs], csr::[vs], or csr::[xs] status bits. Note that the standard
floating-point and vector extensions do not support user-mode
unconfigure or disable/enable instructions.'''
zh = '''
<<fsxsstates>> 展示了 csr::[fs]、csr::[vs] 或 csr::[xs] 状态位的所有可能状态转换。注意，标准浮点扩展和向量扩展不支持用户模式的取消配置或禁用/使能指令。'''
