en = '''
This chapter introduces a base set of CMO ISA extensions that operate
specifically on cache blocks or the memory locations corresponding to a cache
block; these are known as _cache-block operation_ (CBO) instructions. Each
of the above classes of instructions represents an extension in this
specification:'''
zh = '''
本章介绍一组基础的 CMO ISA 扩展，它们专门作用于缓存块或与缓存块对应的内存位置；这些指令称为__缓存块操作__（CBO）指令。上述每一类指令在本规范中都代表一个扩展：'''
