en = '''
For base ISAs with XLEN{ge}64, CSR instructions can access
the full 64-bit CSRs directly. In particular, the insn:rdcycle[], insn:rdtime[], and
insn:rdinstret[] pseudoinstructions read the full 64 bits of the csr:cycle[],
csr:time[], and csr:instret[] counters.'''
zh = '''
对于 XLEN{ge}64 的基础 ISA，CSR 指令可直接访问完整的 64 位 CSR。特别地，insn:rdcycle[]、insn:rdtime[] 和 insn:rdinstret[] 伪指令读取 csr:cycle[]、csr:time[] 和 csr:instret[] 计数器的全部 64 位。'''
