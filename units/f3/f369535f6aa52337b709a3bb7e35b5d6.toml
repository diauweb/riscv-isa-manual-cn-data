en = '''
For RV64 only, if the ext:q[] extension is implemented, the insn:fmvp.q.x[] instruction
moves a quad-precision number from a pair of integer
registers into a floating-point register. Integer registers _rs1_ and
_rs2_ supply bits 63:0 and 127:64, respectively; the result is written
to floating-point register _rd_. insn:fmvp.q.x[] is encoded in the OP-FP major
opcode with _funct3_=0 and _funct7_=1011011.'''
zh = '''
仅对于 RV64，若实现了 ext:q[] 扩展，insn:fmvp.q.x[] 指令将四精度数从一对整数寄存器移动到浮点寄存器。整数寄存器 _rs1_ 和 _rs2_ 分别提供位 63:0 和 127:64；结果写入浮点寄存器 _rd_。insn:fmvp.q.x[] 在 OP-FP 主操作码中编码，_funct3_=0 且 _funct7_=1011011。'''
