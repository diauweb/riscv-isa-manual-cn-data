en = '''
[#norm:ctrsource_op]#The `ctrsource` register contains the source program counter, which is the `pc` of the recorded control transfer instruction, or the epc of the recorded trap.#  [#norm:ctrsource_ctrtarget_ctrdata_Vbit]#The valid (V) bit is set by the hardware when a transfer is recorded in the selected CTR buffer entry, and implies that data in `ctrsource`, `ctrtarget`, and `ctrdata` is valid for this entry.#'''
zh = '''
[#norm:ctrsource_op]#`ctrsource` 寄存器包含源程序计数器，即已记录控制转移指令的 `pc`，或已记录陷阱的 epc。#  [#norm:ctrsource_ctrtarget_ctrdata_Vbit]#当在所选 CTR 缓冲区条目中记录转移时，硬件设置有效（V）位，并且该位意味着此条目的 `ctrsource`、`ctrtarget` 和 `ctrdata` 中的数据有效。#'''
