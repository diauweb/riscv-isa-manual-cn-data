en = '''
The floating-point unit state is always initialized, saved, and restored
using standard instructions (ext:f[], ext:d[], and/or ext:q[]), and privileged code must
be aware of FLEN to determine the appropriate space to reserve for each
`f` register.'''
zh = '''
浮点单元状态始终使用标准指令（ext:f[]、ext:d[] 和/或 ext:q[]）进行初始化、保存和恢复，特权代码必须了解 FLEN，以确定为每个 `f` 寄存器保留的适当空间。'''
