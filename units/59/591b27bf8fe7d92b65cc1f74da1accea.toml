en = '''
Standard unprivileged extensions can also be named by using a single ext:z[]
followed by an alphanumeric name. The name must end with an alphabetical
character. The second letter from the end cannot be numeric if the last letter
is `p`. For example, extlink:zifencei[] names the instruction-fetch fence
extension.'''
zh = '''
标准非特权扩展也可以使用单个 ext:z[]
后跟字母数字名称来命名。名称必须以字母字符结尾。如果最后一个字母
是 `p`，则倒数第二个字母不能是数字。例如，extlink:zifencei[] 命名了取指屏障
扩展。'''
