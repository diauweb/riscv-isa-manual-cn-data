en = '''
When the fault-only-first instruction takes a trap due to an
interrupt, implementations should not reduce `vl` and should instead
set a `vstart` value.'''
zh = '''
当仅首错指令因中断而接受陷阱时，实现宜不减小 `vl`，而应改为设置 `vstart` 值。'''
