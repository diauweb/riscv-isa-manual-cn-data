en = '''
[#norm:m_mode_perf_monitoring]#M-mode includes a basic hardware performance-monitoring facility.#
[#norm:mcycle_op]#The csr:mcycle[] CSR counts the number of clock cycles executed by the processor
core on which the hart is running.#
[#norm:minstret_op]#The csr:minstret[] CSR counts the number of instructions the hart has retired.#
[#norm:mcycle_minstret_sz]#The csr:mcycle[] and csr:minstret[] registers have 64-bit precision on all RV32 and RV64 harts.#'''
zh = '''
[#norm:m_mode_perf_monitoring]#M 模式包含一个基本的硬件性能监视设施。#
[#norm:mcycle_op]#csr:mcycle[] CSR 统计硬件线程所运行的处理器核心已执行的时钟周期数。#
[#norm:minstret_op]#csr:minstret[] CSR 统计硬件线程已退休的指令数。#
[#norm:mcycle_minstret_sz]#在所有 RV32 和 RV64 硬件线程上，csr:mcycle[] 和 csr:minstret[] 寄存器都具有 64 位精度。#'''
