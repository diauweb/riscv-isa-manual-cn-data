en = '''
[#norm:m-mode-mandatory]#All hardware implementations must provide M-mode#, as this is the only
mode that has unfettered access to the whole machine. The simplest
RISC-V implementations may provide only M-mode, though this will provide
no protection against incorrect or malicious application code.'''
zh = '''
[#norm:m-mode-mandatory]#所有硬件实现都必须提供 M 模式#，因为这是唯一能够不受限制地访问整个机器的模式。最简单的 RISC-V 实现可以只提供 M 模式，尽管这不会提供针对错误或恶意应用代码的保护。'''
