en = '''
Description::
This instruction returns _rs1_ with a single bit set at the index specified in _shamt_.
The index is read from the lower log2(XLEN) bits of _shamt_.
[#norm:bseti_shamt_rsv_rv32]#For RV32, the encodings corresponding to _shamt[5]_=1 are reserved.#'''
zh = '''
描述::
此指令返回 _rs1_，其中在 _shamt_ 指定的索引处设置单个位。
索引从 _shamt_ 的低 log2(XLEN) 位读取。
[#norm:bseti_shamt_rsv_rv32]#对于 RV32，对应于 _shamt[5]_=1 的编码保留。#'''
