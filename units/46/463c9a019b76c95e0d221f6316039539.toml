en = '''
[#norm:c-mv_op]#C.MV copies the value in register _rs2_ into register _rd_. C.MV expands
into `add rd, x0, rs2`.#
[#norm:c-mv_jr]#C.MV is valid only when
_rs2_≠`x0`; the code points with _rs2_=`x0` correspond to the C.JR instruction.#
[#norm:c-mv_hint]#The code points with _rs2_≠`x0` and _rd_=`x0` are HINTs.#'''
zh = '''
[#norm:c-mv_op]##C.MV 将寄存器 _rs2_ 中的值复制到寄存器 _rd_。C.MV 展开为 `add rd, x0, rs2`。##
[#norm:c-mv_jr]##C.MV 仅在 _rs2_≠`x0` 时有效；_rs2_=`x0` 的编码点对应于 C.JR 指令。##
[#norm:c-mv_hint]##_rs2_≠`x0` 且 _rd_=`x0` 的编码点为 HINT。##'''
