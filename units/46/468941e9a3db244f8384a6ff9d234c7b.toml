en = '''
ext:zca[] HINTs do not necessarily expand to their RVI HINT counterparts. For
example, `C.ADD` _x0_, _a0_ might not encode the same HINT as
`ADD` _x0_, _x0_, _a0_.'''
zh = '''
ext:zca[] HINT 不一定展开为其 RVI HINT 对应项。例如，
`C.ADD` _x0_, _a0_ 可能不会编码与
`ADD` _x0_, _x0_, _a0_ 相同的 HINT。'''
