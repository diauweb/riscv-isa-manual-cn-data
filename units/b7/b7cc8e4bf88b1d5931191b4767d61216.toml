en = '''
[#norm:mip_ssip_mie_ssie_op]#If supervisor mode is implemented, bits `mip`.SSIP and `mie`.SSIE are
the interrupt-pending and interrupt-enable bits for supervisor-level software interrupts.#
[#norm:mip_ssip_acc]#SSIP is writable in `mip`# and [#norm:mip_ssip_intr_ctrl]#may also be set to 1
by a platform-specific interrupt controller.#'''
zh = '''
[#norm:mip_ssip_mie_ssie_op]#若实现了监管模式，则 `mip`.SSIP 和 `mie`.SSIE 位是监管级软件中断的中断挂起位和中断使能位。# [#norm:mip_ssip_acc]#SSIP 在 `mip` 中可写#，并且 [#norm:mip_ssip_intr_ctrl]#也可以由平台特定的中断控制器置为 1。#'''
