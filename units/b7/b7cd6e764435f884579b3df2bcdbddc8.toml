en = '''
.Instruction Type (*itype*) encoding
[%autowidth,align="center",float="center",cols="<,<",options="header"]
|===
| *Value* | *Description*
| 0 |Final instruction in the block is none of the other named *itype*
codes
|1 | Exception. An exception that traps occurred following the final
retired instruction in the block
|2 | Interrupt. An interrupt that traps occurred following the final
retired instruction in the block
|3 | Exception or interrupt return
|4 | Nontaken branch
|5 | Taken branch
|6 | Uninferable jump if _itype_width_p_ is 3, reserved otherwise
|7 | reserved
|8 | Uninferable call
|9 | Inferrable call
|10 | Uninferable jump
|11 | Inferrable jump
|12 | Co-routine swap
|13 | Return
|14 | Other uninferable jump
|15 | Other inferable jump
|==='''
zh = '''
.指令类型（*itype*）编码
[%autowidth,align="center",float="center",cols="<,<",options="header"]
|===
| *值* | *描述*
| 0 |块中的最后一条指令不是其他已命名 *itype* 代码中的任何一种
|1 | 异常。在块中最后退休指令之后发生了导致陷阱的异常
|2 | 中断。在块中最后退休指令之后发生了导致陷阱的中断
|3 | 异常或中断返回
|4 | 未发生转移的分支
|5 | 发生转移的分支
|6 | 若 _itype_width_p_ 为 3，则为不可推断跳转；否则保留
|7 | 保留
|8 | 不可推断调用
|9 | 可推断调用
|10 | 不可推断跳转
|11 | 可推断跳转
|12 | 协程交换
|13 | 返回
|14 | 其他不可推断跳转
|15 | 其他可推断跳转
|==='''
