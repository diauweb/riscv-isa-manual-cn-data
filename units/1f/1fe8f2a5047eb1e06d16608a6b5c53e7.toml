en = '''
[#norm:menvcfg_dte_op]#The Ssdbltrp extension adds the double-trap-enable (`DTE`) field in `menvcfg`.
When `menvcfg.DTE` is zero, the implementation behaves as though Ssdbltrp is not
implemented.# [#norm:menvcfg_dte_sdt_rdonly0]#When Ssdbltrp is not implemented `sstatus.SDT`, `vsstatus.SDT`, and
`henvcfg.DTE` bits are read-only zero.#'''
zh = '''
[#norm:menvcfg_dte_op]##Ssdbltrp 扩展在 `menvcfg` 中添加双陷阱使能（`DTE`）字段。当 `menvcfg.DTE` 为零时，实现的行为如同未实现 Ssdbltrp。## [#norm:menvcfg_dte_sdt_rdonly0]##当未实现 Ssdbltrp 时，`sstatus.SDT`、`vsstatus.SDT` 和 `henvcfg.DTE` 位为只读零。##'''
