en = '''
The PTE format for Sv48 is shown in <<sv48pte>>.
Bits 63-54 and 9-0 have the same meaning as for Sv39. Any level of PTE
may be a leaf PTE, so in addition to 4 KiB pages, Sv48 supports 2 MiB _megapages_,
1 GiB _gigapages_, and 512 GiB _terapages_, each of which must be virtually and
physically aligned to a boundary equal to its size. A page-fault
exception is raised if the physical address is insufficiently aligned.'''
zh = '''
Sv48 的 PTE 格式如 <<sv48pte>> 所示。
位 63-54 和 9-0 的含义与 Sv39 相同。任何级别的 PTE
都可以是叶 PTE，因此除了 4 KiB 页之外，Sv48 还支持 2 MiB 的__兆页__、
1 GiB 的__吉页__和 512 GiB 的__太页__，它们各自必须在虚拟和
物理上对齐到等于其大小的边界。如果物理地址对齐不足，
则引发页错误异常。'''
