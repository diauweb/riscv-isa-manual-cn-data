en = '''
Standard extensions that extend the supervisor-level virtual-memory architecture
are prefixed with the letters ext:sv[], followed by an alphanumeric name. Other
standard extensions that extend the supervisor-level architecture are prefixed
with the letters ext:ss[], followed by an alphanumeric name. The name must end
with an alphabetical character. The second letter from the end cannot be numeric
if the last letter is `p`. These extensions are further defined in
<<vol:priv,Volume II>>.'''
zh = '''
扩展监管级虚拟内存架构的标准扩展以字母 ext:sv[] 为前缀，
后跟字母数字名称。扩展监管级架构的其他标准扩展以
字母 ext:ss[] 为前缀，后跟字母数字名称。名称必须以字母字符结尾。
如果最后一个字母是 `p`，则倒数第二个字母不能是数字。
这些扩展在 <<vol:priv,第二卷>> 中有进一步定义。'''
