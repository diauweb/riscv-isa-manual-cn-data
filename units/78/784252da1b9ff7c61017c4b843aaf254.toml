en = '''
[#norm:ctr_custom_bits]#Any custom CTR extension must be associated with a non-zero value within the designated custom bits in `__x__ctrctl`.  When the custom bits hold a non-zero value that enables a custom extension, the extension may alter standard CTR behavior, and may define new custom status fields within `sctrstatus` or the CTR <<_entry_registers, Entry Registers>>.  All custom status fields, and standard status fields whose behavior is altered by the custom extension, must revert to standard behavior when the custom bits hold zero.  This includes read-only 0 behavior for any bits undefined by any implemented standard extensions.#'''
zh = '''
[#norm:ctr_custom_bits]#任何自定义 CTR 扩展都必须与 `__x__ctrctl` 中指定自定义位的非零值相关联。当自定义位持有启用某个自定义扩展的非零值时，该扩展可以改变标准 CTR 行为，并可以在 `sctrstatus` 或 CTR <<_entry_registers, Entry Registers>> 中定义新的自定义状态字段。所有自定义状态字段，以及行为被自定义扩展改变的标准状态字段，在自定义位为零时必须恢复为标准行为。这包括任何未由任何已实现标准扩展定义的位的只读 0 行为。#'''
