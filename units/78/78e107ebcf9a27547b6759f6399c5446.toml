en = '''
As described in <<sec:mstatus>>, the
csr:mstatus[] field csr::[fs] is hardwired to 0 if the ext:zfinx[] extension is
implemented, and csr::[fs] no longer affects the trapping behavior of
floating-point instructions or csr:fcsr[] accesses.'''
zh = '''
如 <<sec:mstatus>> 所述，若实现了 ext:zfinx[] 扩展，则 csr:mstatus[] 的 csr::[fs] 字段硬连线为 0，且 csr::[fs] 不再影响浮点指令或 csr:fcsr[] 访问的陷入行为。'''
