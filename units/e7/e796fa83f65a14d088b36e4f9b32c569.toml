en = '''
This register provides R/W access to a 32-bit portion of the
hart array mask register (see xref:hartarraymask[]).
The position of the window is determined by {dm-hawindowsel}. I.e. bit 0
refers to hart {dm-hawindowsel} × 32, while bit 31 refers to hart
{dm-hawindowsel} × 32 + 31.'''
zh = '''
此寄存器提供对硬件线程数组掩码寄存器（参见 xref:hartarraymask[]）的 32 位部分的 R/W 访问。窗口的位置由 {dm-hawindowsel} 确定。即第 0 位指硬件线程 {dm-hawindowsel} × 32，第 31 位指硬件线程 {dm-hawindowsel} × 32 + 31。'''
