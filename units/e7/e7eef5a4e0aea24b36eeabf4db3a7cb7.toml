en = '''
The ext:zdinx[] variants of these ext:d[]-extension instructions have the same
semantics, except that whenever such an instruction would have accessed
an `f` register, it instead accesses the `x` register with the same
number.'''
zh = '''
这些 ext:d[] 扩展指令的 ext:zdinx[] 变体具有相同语义，不同之处在于，每当此类指令原本会访问 `f` 寄存器时，它改为访问编号相同的 `x` 寄存器。'''
