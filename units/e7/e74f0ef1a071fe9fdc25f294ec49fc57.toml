en = '''
The ext:zabha[] extension addresses these limitations by adding support for _byte_ and
_halfword_ atomic memory operations to the RISC-V Unprivileged ISA. The ext:zabha[]
extension depends upon the ext:zaamo[] standard extension.'''
zh = '''
ext:zabha[] 扩展通过向 RISC-V 非特权 ISA 增加对__字节__和__半字__原子内存操作的支持，解决了这些限制。ext:zabha[] 扩展依赖于 ext:zaamo[] 标准扩展。'''
