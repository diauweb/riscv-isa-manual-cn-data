en = '''
Regardless of endianness, the lower-numbered register holds the low-order bits
of double-width floating-point operands, and the higher-numbered register holds
the high-order bits. For RV32 with ext:zdinx[], bits 31:0 of a double-precision
operand might be held in register `x14`, with bits 63:32 of that operand held in
`x15`, for instance.'''
zh = '''
无论字节序如何，编号较低的寄存器保存双宽度浮点操作数的低位，编号较高的寄存器保存高位。例如，对于带 ext:zdinx[] 的 RV32，双精度操作数的位 31:0 可能保存在寄存器 `x14` 中，而该操作数的位 63:32 保存在 `x15` 中。'''
