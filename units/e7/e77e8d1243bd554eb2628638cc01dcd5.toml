en = '''
[#norm:stimecmp_stimecmph_sz_acc]#The `stimecmp` CSR is a 64-bit register and
has 64-bit precision on all RV32 and RV64 systems.
In RV32 only, accesses to the `stimecmp` CSR access the low 32 bits,
while accesses to the `stimecmph` CSR access the high 32 bits of `stimecmp`.#'''
zh = '''
[#norm:stimecmp_stimecmph_sz_acc]##`stimecmp` CSR 是一个 64 位寄存器，在所有 RV32 和 RV64 系统上都具有 64 位精度。仅在 RV32 中，对 `stimecmp` CSR 的访问访问低 32 位，而对 `stimecmph` CSR 的访问访问 `stimecmp` 的高 32 位。##'''
