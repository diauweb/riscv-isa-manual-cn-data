en = '''
[NOTE]
====
Among instructions in RV32GC and RV64GC, the following are exceptions to the
rule that an aligned memory instruction gives rise to exactly one memory
operation:

* An unsuccessful insn:sc[] instruction does not give rise to any memory operations.
* Floating-point load and store instructions that access more than XLEN bits
  (e.g., insn:fld[] and insn:fsd[] in RV32) may each give rise to multiple memory operations.

ISA extensions such as the ext:v[] extension may
give rise to multiple memory operations.
However, the memory model for these extensions has not yet been formalized.
===='''
zh = '''
[NOTE]
====
在 RV32GC 和 RV64GC 的指令中，以下情况是对“对齐内存指令恰好产生一个内存操作”这一规则的例外：

* 不成功的 insn:sc[] 指令不产生任何内存操作。
* 访问多于 XLEN 位的浮点加载和存储指令（例如 RV32 中的 insn:fld[] 和 insn:fsd[]）均可能分别产生多个内存操作。

诸如 ext:v[] 扩展之类的 ISA 扩展可能产生多个内存操作。
然而，这些扩展的内存模型尚未形式化。
===='''
