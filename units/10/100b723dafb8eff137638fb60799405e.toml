en = '''
[#norm:c-flw_op]#C.FLW is an RV32FC-only instruction that loads a single-precision
floating-point value from memory into floating-point register
`_rd′_`. It computes an effective address by adding the
_zero_-extended offset, scaled by 4, to the base address in register
`_rs1′_`. It expands to
`flw rd′, offset(rs1′)`.#'''
zh = '''
[#norm:c-flw_op]##C.FLW 是仅用于 RV32FC 的指令，它从内存加载单精度浮点值到浮点寄存器 `_rd′_`。它通过将按 4 缩放的__零__扩展偏移加到寄存器 `_rs1′_` 中的基址上来计算有效地址。它展开为 `flw rd′, offset(rs1′)`。##'''
