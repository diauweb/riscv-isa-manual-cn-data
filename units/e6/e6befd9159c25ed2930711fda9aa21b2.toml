en = '''
The insn:fence[] mode field _fm_ defines the semantics of the insn:fence[] instruction.
[#norm:fence_op]#A insn:fence[] (with _fm_=`0000`) orders all memory operations in its predecessor set
before all memory operations in its successor set.#'''
zh = '''
insn:fence[] 模式字段 _fm_ 定义 insn:fence[] 指令的语义。
[#norm:fence_op]#insn:fence[]（_fm_=`0000`）将其前驱集合中的所有内存操作排序在其后继集合中的所有内存操作之前。#'''
