en = '''
This non-normative interface is not intended to be used as a source of
randomness or for other production use.
We define the semantics for single bit for this interface, csr:mnoise[][31],
which is named csr::[noise_test], which will affect the behavior of csr:seed[]
if implemented.'''
zh = '''
此非规范性接口不打算用作随机性来源或其他生产用途。
我们为该接口定义单个位的语义，csr:mnoise[][31]，命名为 csr::[noise_test]，如果实现，它将影响 csr:seed[] 的行为。'''
