en = '''
[#norm:medeleg_mideleg_mandatory_S_mode]#In harts with S-mode, the `medeleg` and `mideleg` registers must
exist#, and [#norm:medeleg_mideleg_op2]#setting a bit in `medeleg` or `mideleg` will delegate the
corresponding trap, when occurring in S-mode or U-mode, to the S-mode
trap handler.#
[#norm:medeleg_mideleg_omit_wo_S_mode]#In harts without S-mode, the `medeleg` and `mideleg` registers should not exist.#'''
zh = '''
[#norm:medeleg_mideleg_mandatory_S_mode]#在具有 S 模式的硬件线程中，`medeleg` 和 `mideleg` 寄存器必须存在#，并且 [#norm:medeleg_mideleg_op2]#在 `medeleg` 或 `mideleg` 中置位某位，会将相应的陷阱（在 S 模式或 U 模式中发生时）委托给 S 模式陷阱处理程序。# [#norm:medeleg_mideleg_omit_wo_S_mode]#在不具有 S 模式的硬件线程中，`medeleg` 和 `mideleg` 寄存器不应存在。#'''
