en = '''
The `hgatp` register is considered _active_ for the purposes of the
address-translation algorithm _unless_ the effective privilege mode is U
and `hstatus`.HU=0.'''
zh = '''
就地址翻译算法而言，`hgatp` 寄存器被视为__活动__，__除非__有效特权模式为 U 且 `hstatus`.HU=0。'''
