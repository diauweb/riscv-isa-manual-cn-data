en = '''
When the H extension is also implemented, access to the `seed` CSR from an
HS-qualified instruction leads to a virtual-instruction exception in VS and
VU modes; all other types of accesses raise an illegal-instruction exception.'''
zh = '''
当还实现了 H 扩展时，从 HS 限定指令对 `seed` CSR 的访问在 VS 和 VU 模式下会导致虚拟指令异常；所有其他类型的访问都会引发非法指令异常。'''
