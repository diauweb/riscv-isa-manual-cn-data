en = '''
NOTE: ext:zifencei[] is mandated as it is the only standard way to support
instruction-cache coherence in RVB23 application processors.  A new
instruction-cache coherence mechanism, ext:ziccid[],
might be added as an option in the future.'''
zh = '''
NOTE: ext:zifencei[] 被强制要求，因为它是 RVB23 应用处理器中支持指令缓存一致性的唯一标准方式。未来可能会将新的指令缓存一致性机制 ext:ziccid[] 作为选项添加。'''
