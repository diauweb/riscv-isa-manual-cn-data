en = '''
RISC-V provides several vector extensions that add vector registers of
implementation-defined length and instructions that operate on those
registers, mostly in SIMD fashion.
The extlink:zve32x[] extension is the base vector extension, providing
the architectural state and the operations on 8-, 16-, and 32-bit
integer and fixed-point types.
The extlink:zve64x[] extension includes the ext:zve32x[] functionality
and adds support for 64-bit integers.
The extlink:zve32f[] extension includes the ext:zve32x[] functionality
and adds single-precision floating-point support.
The extlink:zve64f[] extension is the union of
ext:zve64x[] and ext:zve32f[].
The extlink:zve64d[] extension extends ext:zve64f[] by adding
double-precision floating-point support.'''
zh = '''
RISC-V 提供了若干向量扩展，这些扩展增加了长度为实现定义的向量寄存器和对这些寄存器进行操作的指令，大多采用 SIMD 方式。extlink:zve32x[] 扩展是基础向量扩展，提供架构状态以及对 8 位、16 位和 32 位整数和定点类型的操作。extlink:zve64x[] 扩展包括 ext:zve32x[] 功能并增加对 64 位整数的支持。extlink:zve32f[] 扩展包括 ext:zve32x[] 功能并增加单精度浮点支持。extlink:zve64f[] 扩展是 ext:zve64x[] 和 ext:zve32f[] 的并集。extlink:zve64d[] 扩展通过增加双精度浮点支持来扩展 ext:zve64f[]。'''
