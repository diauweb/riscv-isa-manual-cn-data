en = '''
[#norm:medeleg_enc_txt]#csr:medeleg[] has a bit position allocated for every synchronous exception
shown in <<norm:mcause_exccode_enc_img>>, with the index of the
bit position equal to the value returned in the csr:mcause[] register#
(i.e., setting bit 8 allows user-mode environment calls to be delegated to a
lower-privilege trap handler).'''
zh = '''
[#norm:medeleg_enc_txt]#csr:medeleg[] 为 <<norm:mcause_exccode_enc_img>> 中所示的每个同步异常分配了一个位位置，位位置的索引等于 csr:mcause[] 寄存器中返回的值#（即，设置位 8 允许将用户模式环境调用委托给较低特权陷阱处理程序）。'''
