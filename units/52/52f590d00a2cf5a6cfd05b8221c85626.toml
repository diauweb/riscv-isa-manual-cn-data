en = '''
The global memory order is defined over the primitive load and store
operations generated by memory instructions. It is then subject to the
constraints defined in the rest of this chapter.
Any execution satisfying all of the memory model
constraints is a legal execution (as far as the memory model is concerned).'''
zh = '''
全局内存顺序是在内存指令生成的原始加载和存储操作上定义的。然后它受本章其余部分所定义的约束的限制。任何满足所有内存模型约束的执行都是合法的执行（就内存模型而言）。'''
