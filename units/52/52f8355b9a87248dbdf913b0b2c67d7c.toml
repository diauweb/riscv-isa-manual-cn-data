en = '''
[#norm:senvcfg_cbie]#The Zicbom extension adds the `CBIE` (Cache Block Invalidate instruction Enable)
WARL field to `senvcfg` to control execution of the `CBO.INVAL` instruction in
U-mode.# [#norm:senvcfg_cbie_rsv]#The encoding `0b10` is reserved.# [#norm:senvcfg_cbie_rdonly0]#When the Zicbom extension is not
implemented, `CBIE` is read-only zero.# [#norm:senvcfg_cbie_umode_op]#Execution of `CBO.INVAL` in U-mode is
enabled only if execution of the instruction is enabled for use in S-mode and
`CBIE` is set to `0b01` or `0b11`; otherwise, an illegal-instruction exception is
raised.#'''
zh = '''
[#norm:senvcfg_cbie]##Zicbom 扩展向 `senvcfg` 添加了 `CBIE`（Cache Block Invalidate instruction Enable，缓存块使无效指令使能）WARL 字段，以控制在 U 模式下执行 `CBO.INVAL` 指令。## [#norm:senvcfg_cbie_rsv]##编码 `0b10` 为保留。## [#norm:senvcfg_cbie_rdonly0]##当未实现 Zicbom 扩展时，`CBIE` 为只读零。## [#norm:senvcfg_cbie_umode_op]##仅当该指令被使能用于 S 模式且 `CBIE` 被置为 `0b01` 或 `0b11` 时，才允许在 U 模式下执行 `CBO.INVAL`；否则引发非法指令异常。##'''
