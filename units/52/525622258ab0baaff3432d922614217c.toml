[#norm:counter_inhibited_behavior]#The fundamental behavior of csr:cycle[] and csr:instret[] is modified in that counting does not occur while executing in an inhibited privilege mode.#
Further, the following defines how transitions between a non-inhibited privilege mode and an inhibited privilege mode are counted.'''
