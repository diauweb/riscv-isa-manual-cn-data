en = '''
This chapter describes the ext:q[] standard extension for _quad-precision_
floating-point, which adds computational instructions compliant with the IEEE
754-2008 arithmetic standard's binary128 format and operations. The ext:q[] extension
depends on the ext:d[] extension.'''
zh = '''
本章描述用于 _四精度_ 浮点的 ext:q[] 标准扩展，它增加符合 IEEE 754-2008 算术标准 binary128 格式和操作的计算指令。ext:q[] 扩展依赖 ext:d[] 扩展。'''
