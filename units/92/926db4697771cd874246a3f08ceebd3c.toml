en = '''
In order for shared RISC-V self-certification scripts (and drivers) to
accommodate the test interface in a secure fashion, we suggest that it is
implemented as a custom, M-mode only CSR, denoted here as csr:mnoise[].'''
zh = '''
为了使共享的 RISC-V 自认证脚本（和驱动程序）能够以安全的方式容纳测试接口，我们建议将其实现为自定义的、仅 M 模式的 CSR，此处记为 csr:mnoise[]。'''
