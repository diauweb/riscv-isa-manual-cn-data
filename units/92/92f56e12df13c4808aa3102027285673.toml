en = '''
[#norm:c-beqz_op]#C.BEQZ performs conditional control transfers. The offset is
sign-extended and added to the `pc` to form the branch target address.
It can therefore target a {pm}256 B range. C.BEQZ takes the
branch if the value in register _rs1′_ is zero. It
expands to `beq rs1′, x0, offset`.#'''
zh = '''
[#norm:c-beqz_op]#C.BEQZ 执行条件控制转移。偏移量被符号扩展并加到 `pc` 上以形成分支目标地址。因此它可以访问 {pm}256 B 的范围。如果寄存器 _rs1′_ 中的值为零，C.BEQZ 则进行分支。它扩展为 `beq rs1′, x0, offset`。#'''
