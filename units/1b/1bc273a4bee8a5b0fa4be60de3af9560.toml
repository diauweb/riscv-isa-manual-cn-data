en = '''
[#norm:Zihpm_op_sz_mode_acc_count]#RISC-V ISAs provide a set of up to thirty-two 64-bit performance
counters and timers# that are [#norm:Zihpm_op_sz_mode_acc_priv]#accessible via unprivileged XLEN-bit
read-only CSR registers `0xC00`–`0xC1F`# ([#norm:Zihpm_op_sz_mode_acc_xlen32]#when XLEN=32, the upper 32 bits
are accessed via CSR registers `0xC80`–`0xC9F`#). [#norm:Zihpm_op_sz_mode_acc_partition]#These counters are
divided between the ext:zicntr[] and extlink:zihpm[] extensions.#'''
zh = '''
[#norm:Zihpm_op_sz_mode_acc_count]#RISC-V ISA 提供了一组最多 32 个 64 位性能计数器和定时器#，它们 [#norm:Zihpm_op_sz_mode_acc_priv]#可通过非特权的 XLEN 位只读 CSR 寄存器 `0xC00`–`0xC1F` 访问#（[#norm:Zihpm_op_sz_mode_acc_xlen32]#当 XLEN=32 时，高 32 位通过 CSR 寄存器 `0xC80`–`0xC9F` 访问#）。[#norm:Zihpm_op_sz_mode_acc_partition]#这些计数器划分在 ext:zicntr[] 和 extlink:zihpm[] 扩展中。#'''
