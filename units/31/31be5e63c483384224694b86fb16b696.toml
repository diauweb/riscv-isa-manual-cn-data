en = '''
If S-mode is implemented, the set of legal values that the csr::[uxl] field may
assume excludes those that would cause UXLEN to be greater than SXLEN.'''
zh = '''
如果实现了 S 模式，则 csr::[uxl] 字段可取的合法值集合排除那些会导致 UXLEN 大于 SXLEN 的值。'''
