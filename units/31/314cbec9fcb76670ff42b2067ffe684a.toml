en = '''
Control-flow integrity (CFI) capabilities help defend against Return-Oriented
Programming (ROP) and Call/Jump-Oriented Programming (COP/JOP) style
control-flow subversion attacks. The ext:zicfiss[] and ext:zicfilp[] extensions provide
backward-edge and forward-edge CFI respectively. Please see <<unpriv-cfi>> for further
details on these CFI capabilities and the associated Unprivileged ISA.'''
zh = '''
控制流完整性（CFI）能力有助于防御面向返回编程（ROP）以及面向调用/跳转编程（COP/JOP）风格的控制流颠覆攻击。ext:zicfiss[] 和 ext:zicfilp[] 扩展分别提供后向边和前向边 CFI。有关这些 CFI 能力及相关非特权 ISA 的更多细节，请参见 <<unpriv-cfi>>。'''
