en = '''
[#norm:Svnapot_pte_n]#In Sv39, Sv48, and Sv57, when a PTE has
N=1, the PTE represents a translation that is part
of a range of contiguous virtual-to-physical translations with the same
values for PTE bits 5–0.#
[#norm:Svnapot_range_napot]#Such ranges must be of a naturally aligned
power-of-2 (NAPOT) granularity larger than the base page size#.'''
zh = '''
[#norm:Svnapot_pte_n]##在 Sv39、Sv48 和 Sv57 中，当 PTE 具有 N=1 时，该 PTE 表示一项转换，它属于一组连续的虚拟地址到物理地址转换，这些转换的 PTE 位 5–0 值相同。##
[#norm:Svnapot_range_napot]##此类范围的粒度应为自然对齐的 2 的幂（NAPOT），且大于基础页大小##。'''
