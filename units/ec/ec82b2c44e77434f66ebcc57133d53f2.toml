en = '''
NOTE: Many augmentations to the hypervisor-level architecture are more naturally
defined as supervisor-level extensions, following the scheme described in the
previous section. The ext:sh[] prefix is used by the few hypervisor-level
extensions that have no supervisor-visible effects.'''
zh = '''
NOTE: 对虚拟机监控器级架构的许多增强，按上一节所述的方案定义为监管级扩展更为自然。ext:sh[] 前缀用于少数不具有监管级可见效果的虚拟机监控器级扩展。'''
