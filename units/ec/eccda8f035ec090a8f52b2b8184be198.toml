en = '''
[#norm:mtval_sz_acc]#The `mtval` register is an MXLEN-bit read-write register formatted as
shown in <<norm:mtval_enc_img>>#.
[#norm:mtval_op]#When a trap is taken into M-mode,
`mtval` is either set to zero or written with exception-specific
information to assist software in handling the trap. Otherwise, `mtval`
is never written by the implementation, though it may be explicitly
written by software.#
[#norm:mtval_per_exc_behavior]#The hardware platform will specify which exceptions
must set `mtval` informatively, which may unconditionally set it to
zero, and which may exhibit either behavior, depending on the underlying event
that caused the exception.#
[#norm:mtval_rdonly0]#If the hardware platform specifies that no exceptions set `mtval`
to a nonzero value, then `mtval` is read-only zero.#'''
zh = '''
[#norm:mtval_sz_acc]#`mtval` 寄存器是一个 MXLEN 位读写寄存器，格式如 <<norm:mtval_enc_img>> 所示#。[#norm:mtval_op]#当陷入 M 模式时，`mtval` 要么被设为零，要么被写入异常特定的信息，以协助软件处理该陷阱。除此之外，`mtval` 绝不会由实现写入，但软件可以显式写入它。# [#norm:mtval_per_exc_behavior]#硬件平台将规定哪些异常必须以信息性方式设置 `mtval`，哪些可以无条件将其设为零，以及哪些可能表现出这两种行为之一（取决于引起该异常的底层事件）。# [#norm:mtval_rdonly0]#若硬件平台规定没有任何异常会将 `mtval` 设为非零值，则 `mtval` 为只读零。#'''
