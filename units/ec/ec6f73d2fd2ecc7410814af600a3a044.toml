en = '''
The ext:zicfilp[] extension, when enabled, determines if an indirect call or an
indirect jump must land on a landing pad, as specified in <<IND_CALL_JMP>>. If
`is_lp_expected` is 1, then the hart updates the `ELP` to `LP_EXPECTED`.'''
zh = '''
ext:zicfilp[] 扩展在启用时确定间接调用或间接跳转是否必须落在着陆垫上，如 <<IND_CALL_JMP>> 所规定。如果 `is_lp_expected` 为 1，则硬件线程将 `ELP` 更新为 `LP_EXPECTED`。'''
