en = '''
Data trace supports up to four data access types: load, store, atomic
and CSR. Support for both atomic and CSR accesses are independently
optional.'''
zh = '''
数据跟踪支持最多四种数据访问类型：加载、存储、原子操作和 CSR。对原子操作和 CSR 访问的支持分别独立可选。'''
