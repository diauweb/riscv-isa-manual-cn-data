en = '''
The insn:fminm.s[] and insn:fmaxm.s[] instructions are defined like the insn:fmin.s[] and
insn:fmax.s[] instructions, except that if either input is NaN, the result is
the canonical NaN.'''
zh = '''
insn:fminm.s[] 和 insn:fmaxm.s[] 指令的定义与 insn:fmin.s[] 和 insn:fmax.s[] 指令类似，不同之处在于如果任一输入为 NaN，则结果为规范 NaN。'''
