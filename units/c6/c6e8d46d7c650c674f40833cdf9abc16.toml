en = '''
The `mnepc` CSR is an MXLEN-bit read-write register which on entry to
the NMI trap handler holds the PC of the instruction that took the
interrupt.'''
zh = '''
`mnepc` CSR 是一个 MXLEN 位可读写寄存器，在进入 NMI 陷阱处理程序时保存发生该中断的指令的 PC。'''
