en = '''
[#norm:csrfld:misa:extensions:dependencies]#If an ISA feature _x_ depends on an ISA feature _y_, then attempting to
enable feature _x_ but disable feature _y_ results in both features
being disabled.#
For example, setting "F"=0 and "D"=1 results in both "F" and "D" being cleared.
Similarly, setting "U"=0 and "S"=1" results in both "U" and "S" being cleared.'''
zh = '''
[#norm:csrfld:misa:extensions:dependencies]#如果 ISA 特性 _x_ 依赖于 ISA 特性 _y_，那么尝试启用特性 _x_ 而禁用特性 _y_ 会导致两个特性都被禁用。#
例如，设置 "F"=0 和 "D"=1 会导致 "F" 和 "D" 都被清除。同样，设置 "U"=0 和 "S"=1 会导致 "U" 和 "S" 都被清除。'''
