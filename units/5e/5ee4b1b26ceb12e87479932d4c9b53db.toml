en = '''
[#norm:misa_extensions_enc_txt]#The Extensions field encodes the presence of the standard extensions,
with a single bit per letter of the alphabet (bit 0 encodes presence of
extension ext:a[] , bit 1 encodes presence of extension ext:b[], through to
bit 25 which encodes ext:z[]).#
[#norm:misa_i_op]#The csr::[i] bit will be set for the RV32I and RV64I base ISAs#,
and [#norm:misa_e_op]#the csr::[e] bit will be set for RV32E and RV64E.#
[#norm:misa_extensions_warl_op]#The Extensions field is a *WARL* field that can contain writable bits where the
implementation allows the supported ISA to be modified.#
[#norm:misa_extensions_rst1]#At reset, the Extensions field shall contain the maximal set of supported extensions,
and csr::[i] shall be selected over csr::[e] if both are available.#'''
zh = '''
[#norm:misa_extensions_enc_txt]##Extensions 字段编码标准扩展的存在情况，字母表中每个字母对应一位（位 0 编码扩展 ext:a[] 的存在，位 1 编码扩展 ext:b[] 的存在，直至位 25 编码 ext:z[]）。##[#norm:misa_i_op]##对于 RV32I 和 RV64I 基础 ISA，csr::[i] 位将被置位##，并且[#norm:misa_e_op]##对于 RV32E 和 RV64E，csr::[e] 位将被置位。##[#norm:misa_extensions_warl_op]##Extensions 字段是一个 *WARL* 字段，可包含可写位，此时实现允许修改所支持的 ISA。##[#norm:misa_extensions_rst1]##复位时，Extensions 字段应包含所支持扩展的最大集合，且若 csr::[i] 和 csr::[e] 均可用，则应选择 csr::[i] 而非 csr::[e]。##'''
