en = '''
The stated goal is that OpenSSL, BoringSSL (Android), the Linux Kernel,
and similar trusted software will not have directly observable
timing side channels when compiled and running on a ext:zkt[]-enabled RISC-V target.
The ext:zkt[] extension explicitly states many of the common latency assumptions
made by cryptography developers.'''
zh = '''
所述目标是，OpenSSL、BoringSSL (Android)、Linux 内核及类似可信软件在启用 ext:zkt[] 的 RISC-V 目标上编译和运行时，不会具有可直接观察的定时侧信道。ext:zkt[] 扩展明确说明了密码学开发者做出的许多常见延迟假设。'''
