en = '''
When not implemented (e.g., in virtual machines), csr:mnoise[] can permanently
read zero (`0x00000000`) and ignore writes.
When available, but csr::[noise_test]=0, csr:mnoise[] can return a
nonzero constant (e.g. `0x00000001`) but no noise samples.'''
zh = '''
当未实现时（例如在虚拟机中），csr:mnoise[] 可永久读为零（`0x00000000`）并忽略写。当可用但 csr::[noise_test]=0 时，csr:mnoise[] 可返回非零常量（例如 `0x00000001`），但不返回噪声样本。'''
