en = '''
A RISC-V hart has a single byte-addressable address space of
2^XLEN^ bytes for all memory accesses. A _word_ of
memory is defined as qty:32[bits] (qty:4[bytes]). Correspondingly, a _halfword_ is qty:16[bits] (qty:2[bytes]), a
_doubleword_ is qty:64[bits] (qty:8[bytes]), and a _quadword_ is qty:128[bits] (qty:16[bytes]). The memory address space is
circular, so that the byte at address 2^XLEN^−1 is
adjacent to the byte at address zero. Accordingly, memory address
computations done by the hardware ignore overflow and instead wrap
around modulo 2^XLEN^.'''
zh = '''
RISC-V hart 对所有内存访问具有一个 2^XLEN^ 字节的单一按字节寻址地址空间。一个内存__字__定义为 qty:32[bits]（qty:4[bytes]）。相应地，__半字__为 qty:16[bits]（qty:2[bytes]），__双字__为 qty:64[bits]（qty:8[bytes]），__四字__为 qty:128[bits]（qty:16[bytes]）。内存地址空间是循环的，因此地址 2^XLEN^−1 处的字节与地址零处的字节相邻。相应地，硬件进行的内存地址计算忽略溢出，而是按模 2^XLEN^ 回绕。'''
