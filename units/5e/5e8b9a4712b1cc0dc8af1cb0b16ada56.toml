en = '''
The value in `vsew` sets the dynamic _selected_ _element_ _width_
(SEW).  By default, a vector register is viewed as being divided into
VLEN/SEW elements.'''
zh = '''
`vsew` 中的值设置动态__所选元素宽度__（SEW）。默认情况下，向量寄存器被视为划分为 VLEN/SEW 个元素。'''
