en = '''
[#norm:m_level_high_priv_only_mandatory]#The machine level has the highest privileges and
is the only mandatory privilege level for a RISC-V hardware platform.# Code run in machine-mode
(M-mode) is usually inherently trusted, as it has low-level access to
the machine implementation. M-mode can be used to manage secure
execution environments on RISC-V. User-mode (U-mode) and supervisor-mode
(S-mode) are intended for conventional application and operating system
usage respectively.'''
zh = '''
[#norm:m_level_high_priv_only_mandatory]##机器级具有最高特权，并且是 RISC-V 硬件平台唯一必需的特权级。## 在机器模式（M 模式）下运行的代码通常本质上可信，因为它对机器实现具有低层访问权限。M 模式可用于管理 RISC-V 上的安全执行环境。用户模式（U 模式）和监管模式（S 模式）分别用于常规应用和操作系统用途。'''
