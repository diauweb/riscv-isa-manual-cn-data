en = '''
[NOTE]
====
The insn:system[] instructions are defined to allow simpler implementations to
always trap to a single software trap handler. More sophisticated
implementations might execute more of each system instruction in
hardware.
===='''
zh = '''
[NOTE]
====
insn:system[] 指令的定义允许较简单的实现总是陷入单个软件陷阱处理程序。更复杂的实现可能在硬件中执行更多每种系统指令。
===='''
