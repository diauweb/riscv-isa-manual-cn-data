unit_id = "1c3812ca708d2f0c6d4deb4e5149a0a1"
kind = "list"
translatable = true
status = "machine"
en = '''
* Numerous additions and improvements to the commentary sections.
* Change configuration string proposal to be use a search process that
supports various formats including Device Tree String and flattened
Device Tree.
* Made csr:misa[] optionally writable to support modifying base and
supported ISA extensions. CSR address of csr:misa[] changed.
* Added description of debug mode and debug CSRs.
* Added a hardware performance monitoring scheme. Simplified the
handling of existing hardware counters, removing privileged versions of
the counters and the corresponding delta registers.
* Fixed description of csr::[spie] in presence of user-level interrupts.'''
zh = '''
* 对评注部分进行了大量增补和改进。
* 将配置字符串提案改为使用支持多种格式（包括设备树字符串和扁平化设备树）的搜索过程。
* 使 csr:misa[] 可选可写，以支持修改基础 ISA 和受支持的 ISA 扩展。csr:misa[] 的 CSR 地址已更改。
* 增加了调试模式和调试 CSR 的描述。
* 增加了硬件性能监控方案。简化了现有硬件计数器的处理，移除了计数器的特权版本及相应的增量寄存器。
* 修复了存在用户级中断时 csr::[spie] 的描述。'''
