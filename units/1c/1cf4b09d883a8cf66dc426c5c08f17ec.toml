en = '''
Floating-point compare instructions (insn:feq.s[], insn:flt.s[], insn:fle.s[]) perform the
specified comparison between floating-point registers
(_rs1_ = _rs2_, _rs1_ < _rs2_,
_rs1_ {le} _rs2_) writing 1 to the integer register _rd_ if the
condition holds, and 0 otherwise.'''
zh = '''
浮点比较指令（insn:feq.s[]、insn:flt.s[]、insn:fle.s[]）在浮点寄存器之间执行指定比较（_rs1_ = _rs2_、_rs1_ < _rs2_、_rs1_ {le} _rs2_），若条件成立则将 1 写入整数寄存器 _rd_，否则写入 0。'''
