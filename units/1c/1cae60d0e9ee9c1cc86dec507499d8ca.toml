en = '''
This chapter describes the _scalar_ cryptography
extension for RISC-V.
[#norm:Zk_scalar_xreg_op]#All instructions described herein use the general-purpose `x`
registers, and obey the 2-read-1-write register access constraint.#
These instructions are designed to be lightweight and suitable
for 32- and 64-bit base architectures; from embedded IoT class
cores to large, application class cores which do not implement a
vector unit.'''
zh = '''
本章描述 RISC-V 的 _标量_ 密码学扩展。
[#norm:Zk_scalar_xreg_op]#本文所述的所有指令均使用通用 `x` 寄存器，并遵守 2 读 1 写的寄存器访问约束。#
这些指令旨在轻量且适用于 32 位和 64 位基础架构；从嵌入式 IoT 级核心到未实现向量单元的大型应用级核心。'''
