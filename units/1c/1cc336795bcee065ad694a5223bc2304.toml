status = "machine"
en = '''
* 32-bit Zicfiss instructions will revert to their behavior as defined by Zimop.
* 16-bit Zicfiss instructions will revert to their behavior as defined by Zcmop.
* The `pte.xwr=0b010` encoding in VS-stage page tables becomes reserved.
* The `senvcfg.SSE` field is read-only zero.
* When `menvcfg.SSE` is one, `SSAMOSWAP.W/D` raises a virtual-instruction
  exception.'''
zh = '''
* 32 位 Zicfiss 指令将恢复为 Zimop 所定义的行为。
* 16 位 Zicfiss 指令将恢复为 Zcmop 所定义的行为。
* VS 级页表中的 `pte.xwr=0b010` 编码变为保留。
* `senvcfg.SSE` 字段为只读零。
* 当 `menvcfg.SSE` 为 1 时，`SSAMOSWAP.W/D` 引发虚拟指令异常。'''
