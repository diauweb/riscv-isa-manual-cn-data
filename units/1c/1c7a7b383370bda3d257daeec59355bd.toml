en = '''
[#norm:hpm_platform_specific_impl]#The implemented number and width of these additional counters, and the
set of events they count, are platform-specific.# [#norm:hpm_unimplemented_counter_access]#Accessing an
unimplemented counter may cause an illegal-instruction exception or may
return a constant value.# [#norm:hpm_misconfigured_event_behavior]#If the configuration used to select the events
counted by a counter is misconfigured, the counter may return a constant
value.#'''
