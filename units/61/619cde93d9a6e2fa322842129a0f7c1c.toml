en = '''
Only `x1` and `x5` registers are supported as `rs1` for insn:sspopchk[].
ext:zicfiss[] provides a 16-bit version of the insn:sspopchk[x5] using the
ext:zcmop[] defined ext:c.mop.5[] encoding. The insn:c.sspopchk[x5] expands to
insn:sspopchk[x5].'''
zh = '''
insn:sspopchk[] 仅支持 `x1` 和 `x5` 寄存器作为 `rs1`。
ext:zicfiss[] 使用 ext:zcmop[] 定义的 ext:c.mop.5[] 编码提供 insn:sspopchk[x5] 的 16 位版本。insn:c.sspopchk[x5] 展开为
insn:sspopchk[x5]。'''
