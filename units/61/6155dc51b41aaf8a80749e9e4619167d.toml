en = '''
- <<Sscofpmf,**Sscofpmf**>> count overflow and mode-based filtering.

- <<sec:pm-exts,**Ssnpm**>> Pointer masking, with `senvcfg.PMM` and
  `henvcfg.PMM` supporting, at minimum, settings PMLEN=0 and PMLEN=7.

- <<ssu64xl,**Ssu64xl**>> `sstatus.UXL` must be capable of holding the value 2
  (i.e., UXLEN=64 must be supported).'''
zh = '''
- <<Sscofpmf,**Sscofpmf**>> 计数上溢和基于模式的过滤。

- <<sec:pm-exts,**Ssnpm**>> 指针掩码，且 `senvcfg.PMM` 和 `henvcfg.PMM` 至少支持 PMLEN=0 和 PMLEN=7 设置。

- <<ssu64xl,**Ssu64xl**>> `sstatus.UXL` 应能保存值 2（即应支持 UXLEN=64）。'''
