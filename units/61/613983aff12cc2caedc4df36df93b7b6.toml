en = '''
[#norm:c-sd_op]#C.SD is an XLEN=64-only instruction that stores a 64-bit value in
register `_rs2′_` to memory. It computes an effective
address by adding the _zero_-extended offset, scaled by 8, to the base
address in register `_rs1′_`. It expands to
`sd rs2′, offset(rs1′)`.#'''
zh = '''
[#norm:c-sd_op]#C.SD 是仅限 XLEN=64 的指令，将寄存器 `_rs2′_` 中的 64 位值存储到内存。它通过将按 8 缩放的__零__扩展偏移量加到寄存器 `_rs1′_` 中的基址上来计算有效地址。它展开为 `sd rs2′, offset(rs1′)`。#'''
