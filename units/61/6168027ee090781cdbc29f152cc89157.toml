en = '''
The MSB represents the predicted outcome, the LSB the most recent actual
outcome. The prediction must fail twice for the predicted value to
change.'''
zh = '''
MSB 表示预测结果，LSB 表示最近一次实际结果。预测必须连续失败两次，预测值才会改变。'''
