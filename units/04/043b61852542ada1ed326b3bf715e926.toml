en = '''
New floating-point-to-integer and integer-to-floating-point conversion
instructions are added. These instructions are defined analogously to
the double-precision-to-integer and integer-to-double-precision
conversion instructions.
[#norm:fcvt-w-q_fcvt-l-q_op]#insn:fcvt.w.q[] or insn:fcvt.l.q[] converts a quad-precision floating-point number to a signed 32-bit or 64-bit integer, respectively#.
[#norm:fcvt-q-w_fcvt-q-l_op]#insn:fcvt.q.w[] or insn:fcvt.q.l[] converts a 32-bit or 64-bit signed integer, respectively, into a quad-precision floating-point number#.
[#norm:fcvt-wu-q_fcvt-lu-q_fcvt-q-wu_fcvt-q-lu_op]#insn:fcvt.wu.q[], insn:fcvt.lu.q[], insn:fcvt.q.wu[], and insn:fcvt.q.lu[] variants convert to or from unsigned integer values#.
[#norm:fcvt_long_quad_rv64_only]#insn:fcvt.l.q[], insn:fcvt.lu.q[], insn:fcvt.q.l[], and insn:fcvt.q.lu[] are RV64-only instructions#.
[#norm:fcvt_int_quad_valid_input]#The range of valid inputs for insn:fcvt.w.q[], insn:fcvt.wu.q[], insn:fcvt.l.q[], and insn:fcvt.lu.q[] and the behavior for invalid inputs are the same as for insn:fcvt.w.s[], insn:fcvt.wu.s[], insn:fcvt.l.s[], and insn:fcvt.lu.s[]#.
Note insn:fcvt.q.l[] and insn:fcvt.q.lu[] always produce an exact result and are unaffected by rounding mode.'''
zh = '''
新增浮点到整数和整数到浮点的转换指令。这些指令的定义与双精度到整数和整数到双精度的转换指令类似。
[#norm:fcvt-w-q_fcvt-l-q_op]##insn:fcvt.w.q[] 或 insn:fcvt.l.q[] 分别将四精度浮点数转换为有符号 32 位或 64 位整数。##
[#norm:fcvt-q-w_fcvt-q-l_op]##insn:fcvt.q.w[] 或 insn:fcvt.q.l[] 分别将 32 位或 64 位有符号整数转换为四精度浮点数。##
[#norm:fcvt-wu-q_fcvt-lu-q_fcvt-q-wu_fcvt-q-lu_op]##insn:fcvt.wu.q[]、insn:fcvt.lu.q[]、insn:fcvt.q.wu[] 和 insn:fcvt.q.lu[] 变体转换为无符号整数值或从无符号整数值转换。##
[#norm:fcvt_long_quad_rv64_only]##insn:fcvt.l.q[]、insn:fcvt.lu.q[]、insn:fcvt.q.l[] 和 insn:fcvt.q.lu[] 是仅 RV64 指令。##
[#norm:fcvt_int_quad_valid_input]##insn:fcvt.w.q[]、insn:fcvt.wu.q[]、insn:fcvt.l.q[] 和 insn:fcvt.lu.q[] 的有效输入范围以及无效输入行为与 insn:fcvt.w.s[]、insn:fcvt.wu.s[]、insn:fcvt.l.s[] 和 insn:fcvt.lu.s[] 相同。##
注意，insn:fcvt.q.l[] 和 insn:fcvt.q.lu[] 始终产生精确结果，且不受舍入模式影响。'''
