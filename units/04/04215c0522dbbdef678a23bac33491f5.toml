en = '''
This chapter defines the ext:zimop[] extension, which introduces the concept of
instructions that _may be operations_ (MOPs).  MOPs are initially defined to
simply write zero to `x[rd]`, but are designed to be redefined by later
extensions to perform some other action.
The ext:zimop[] extension defines an encoding space for 40 MOPs.'''
zh = '''
本章定义 ext:zimop[] 扩展，该扩展引入了__可能为操作__（MOP）的指令概念。MOP 最初定义为仅向 `x[rd]` 写入零，但其设计允许后续扩展将其重新定义为执行其他动作。ext:zimop[] 扩展为 40 个 MOP 定义了一个编码空间。'''
