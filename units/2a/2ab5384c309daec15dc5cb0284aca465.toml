en = '''
[NOTE]
====
The base width can be quickly ascertained using branches on the sign of
the returned csr:misa[] value, and possibly a shift left by one and a second
branch on the sign. These checks can be written in assembly code without
knowing the register width (MXLEN) of the hart. The base width is
given by __MXLEN=2^MXL+4^__.

The base width can also be found if csr:misa[] is zero, by placing the
immediate 2 in a register, then shifting the register left by 31 bits.
If zero, the hart is RV32, else it is RV64.
===='''
zh = '''
[NOTE]
====
通过根据返回的 csr:misa[] 值的符号进行分支，并可能再左移一位并再次根据符号进行分支，可以快速确定基本宽度。这些检查可以在不知道硬件线程寄存器宽度（MXLEN）的情况下用汇编代码编写。基本宽度由 __MXLEN=2^MXL+4^__ 给出。

如果 csr:misa[] 为零，也可以通过将立即数 2 放入寄存器，然后将该寄存器左移 31 位来求得基本宽度。如果结果为零，则硬件线程为 RV32，否则为 RV64。
===='''
