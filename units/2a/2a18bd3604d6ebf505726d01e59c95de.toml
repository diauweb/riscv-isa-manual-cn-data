en = '''
A shadow stack pop operation is defined as an XLEN wide read from the
current top of the shadow stack followed by an increment of the csr:ssp[] by
XLEN/8.'''
zh = '''
影子栈弹出操作定义为：从影子栈当前栈顶执行一次 XLEN 宽读取，然后将 csr:ssp[] 增加 XLEN/8。'''
