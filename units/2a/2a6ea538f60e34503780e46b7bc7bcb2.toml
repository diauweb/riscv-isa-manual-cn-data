en = '''
[#norm:c-sub_op]#`C.SUB` subtracts the value in register _rs2′_ from the
value in register _rd′_, then writes the result to
register _rd′_. `C.SUB` expands into
`sub rd′, rd′, rs2′`.#'''
zh = '''
[#norm:c-sub_op]#`C.SUB` 从寄存器 _rd′_ 中的值减去寄存器 _rs2′_ 中的值，然后将结果写入寄存器 _rd′_。`C.SUB` 展开为 `sub rd′, rd′, rs2′`。#'''
