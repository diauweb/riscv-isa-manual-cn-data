en = '''
* **Sspm**: [#norm:sspm_definition]#An extension that indicates that there is pointer-masking support available in supervisor mode, with some facility provided in the supervisor execution environment to control pointer masking.#
* **Supm**: [#norm:supm_definition]#An extension that indicates that there is pointer-masking support available in user mode, with some facility provided in the application execution environment to control pointer masking.#'''
zh = '''
* **Sspm**：[#norm:sspm_definition]#一个扩展，指示监管模式中提供指针掩码支持，并且监管执行环境中提供某种机制来控制指针掩码。#
* **Supm**：[#norm:supm_definition]#一个扩展，指示用户模式中提供指针掩码支持，并且应用执行环境中提供某种机制来控制指针掩码。#'''
