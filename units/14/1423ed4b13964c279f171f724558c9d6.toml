zh = '''
* **Sspm**: [#norm:sspm_definition]##该扩展表示监管模式中有可用的指针掩码支持，并且监管执行环境中提供了某种设施来控制指针掩码。##
* **Supm**: [#norm:supm_definition]##该扩展表示用户模式中有可用的指针掩码支持，并且应用执行环境中提供了某种设施来控制指针掩码。##'''
