en = '''
[#norm:satp_bare_rsv_custom]#When SXLEN=32, the `satp` encodings corresponding to MODE=Bare and
ASID[8:7]=3 are designated for custom use, whereas the encodings
corresponding to MODE=Bare and ASID[8:7]≠3 are reserved
for future standard use. When SXLEN=64, all `satp` encodings
corresponding to MODE=Bare are reserved for future standard use.#'''
zh = '''
[#norm:satp_bare_rsv_custom]##当 SXLEN=32 时，对应 MODE=Bare 且 ASID[8:7]=3 的 `satp` 编码指定供自定义使用，而对应 MODE=Bare 且 ASID[8:7]≠3 的编码保留供未来标准使用。当 SXLEN=64 时，所有对应 MODE=Bare 的 `satp` 编码均保留供未来标准使用。##'''
