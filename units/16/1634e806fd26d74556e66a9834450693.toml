en = '''
[#norm:Zve32x_Zve64x_nsupport_freg]#All Zve* extensions support all vector permutation instructions
(<<sec-vector-permute>>), except that Zve32x and Zve64x
do not include those with floating-point operands, and Zve64f does not include those
with EEW=64 floating-point operands.#'''
zh = '''
[#norm:Zve32x_Zve64x_nsupport_freg]#所有 Zve* 扩展支持所有向量排列指令（<<sec-vector-permute>>），但 Zve32x 和 Zve64x 不包括带浮点操作数的那些，Zve64f 不包括 EEW=64 浮点操作数的那些。#'''
