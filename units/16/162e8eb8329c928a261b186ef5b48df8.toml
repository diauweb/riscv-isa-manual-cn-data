en = '''
For RV64 only, if the ext:q[] extension is implemented, the insn:fmvh.x.q[] instruction
moves bits 127:64 of floating-point register _rs1_ into
integer register _rd_. It is encoded in the OP-FP major opcode with
_funct3_=0, _rs2_=1, and _funct7_=1110011.'''
zh = '''
仅对于 RV64，若实现了 ext:q[] 扩展，insn:fmvh.x.q[] 指令将浮点寄存器 _rs1_ 的位 127:64 移动到整数寄存器 _rd_。它在 OP-FP 主操作码中编码，_funct3_=0、_rs2_=1 且 _funct7_=1110011。'''
