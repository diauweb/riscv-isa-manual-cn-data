en = '''
If the ext:d[] extension is implemented, insn:fli.d[] performs the analogous
operation, but loads a double-precision value into floating-point
register _rd_. Note that entry 1 (corresponding to the minimum positive
normal value) has a numerically different value for double-precision
than for single-precision. insn:fli.d[] is encoded like insn:fli.s[], but with
_fmt_=D.'''
zh = '''
如果实现了 ext:d[] 扩展，insn:fli.d[] 执行类似的操作，但将双精度值加载到浮点寄存器 _rd_ 中。注意，条目 1（对应于最小正规格化值）在双精度下的数值与单精度不同。insn:fli.d[] 的编码与 insn:fli.s[] 类似，但 _fmt_=D。'''
