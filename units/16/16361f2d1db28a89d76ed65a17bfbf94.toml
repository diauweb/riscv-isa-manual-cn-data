en = '''
The assembler pseudoinstruction to read a CSR, insn:csrr[rd,csr], is
encoded as insn:csrrs[rd,csr,x0]. The assembler pseudoinstruction to write
a CSR, insn:csrw[csr,rs1], is encoded as insn:csrrw[x0,csr,rs1], while
insn:csrwi[csr,uimm], is encoded as insn:csrrwi[x0,csr,uimm].'''
zh = '''
读取 CSR 的汇编伪指令 insn:csrr[rd,csr] 编码为 insn:csrrs[rd,csr,x0]。写入 CSR 的汇编伪指令 insn:csrw[csr,rs1] 编码为 insn:csrrw[x0,csr,rs1]，而 insn:csrwi[csr,uimm] 编码为 insn:csrrwi[x0,csr,uimm]。'''
