en = '''
The `USEED` and `SSEED` fields of the `mseccfg` CSR must have defined
reset values. The system must not allow them to be in an undefined state
after reset.'''
zh = '''
`mseccfg` CSR 的 `USEED` 和 `SSEED` 字段必须具有已定义的复位值。系统不得允许它们在复位后处于未定义状态。'''
