en = '''
A _word_ of memory is defined as qty:32[bits] (qty:4[bytes]). Correspondingly,
a _halfword_ is qty:16[bits] (qty:2[bytes]), a _doubleword_ is qty:64[bits]
(qty:8[bytes]), and a _quadword_ is qty:128[bits] (qty:16[bytes]). Furthermore,
a _nibble_ is qty:4[bits]. This specification uses the binary prefixes as
defined in IEC 80000-13:2008. For instance, qty:1[KiB] is qty:1024[bytes].'''
zh = '''
内存的__字__定义为 qty:32[bits]（qty:4[bytes]）。相应地，__半字__为 qty:16[bits]（qty:2[bytes]），__双字__为 qty:64[bits]（qty:8[bytes]），__四字__为 qty:128[bits]（qty:16[bytes]）。此外，__半字节__为 qty:4[bits]。本规范使用 IEC 80000-13:2008 定义的二进制前缀。例如，qty:1[KiB] 为 qty:1024[bytes]。'''
