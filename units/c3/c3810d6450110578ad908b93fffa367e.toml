en = '''
When a standard extension is disabled by clearing its bit in csr:misa[], the
instructions and CSRs defined or modified by the extension revert to
their defined or reserved behaviors as if the extension is not
implemented.'''
zh = '''
当通过清除 csr:misa[] 中某标准扩展的位来禁用该扩展时，该扩展所定义或修改的指令和 CSR 将恢复为其已定义或保留的行为，就如同该扩展未实现一样。'''
