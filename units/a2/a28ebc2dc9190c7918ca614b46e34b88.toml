en = '''
The Efficient Trace for RISC-V (E-Trace) standard in <<chap:trace>> defines packet payloads for instruction and data trace but does not fully define how this should be encapsulated into fully formed packets for transport, nor how instruction and data trace should be differentiated.  <<packets>> gives some illustrative examples but this is insufficiently detailed and informative only.'''
zh = '''
<<chap:trace>> 中的 RISC-V 高效跟踪（Efficient Trace for RISC-V，E-Trace）标准定义了指令跟踪和数据跟踪的数据包有效载荷，但未完全定义应如何将其封装为用于传输的完整数据包，也未定义应如何区分指令跟踪和数据跟踪。<<packets>> 给出了一些示例性示例，但这些示例不够详细，仅供参考。'''
