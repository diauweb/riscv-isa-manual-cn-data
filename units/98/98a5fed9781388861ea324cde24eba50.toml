en = '''
When FP16 (officially called binary16) was first introduced by IEEE 754-2008,
it was just an interchange format. It was intended as a space/bandwidth efficient
encoding that would be used to transfer information. This is in line with the Zfhmin
extension.'''
zh = '''
当 FP16（正式名称为 binary16）最初由 IEEE 754-2008 引入时，它只是一种交换格式。它旨在作为一种节省空间和带宽的编码，用于传输信息。这与 Zfhmin 扩展一致。'''
