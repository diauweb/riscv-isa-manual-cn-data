en = '''
[#norm:zalasr_builds_on_amo]#The ext:zalasr[] extension builds on the atomic support provided by the ext:zaamo[], ext:zalrsc[] and ext:zabha[] extensions by providing additional atomic operations, although it can be implemented independently of them.#
All of the AMO operations in ext:zaamo[] and ext:zabha[] are read-modify-write operations that both load and store.
The ext:zalrsc[] extension provides operations that are only loads or stores.
However, since it is designed to perform an atomic operation on a single memory word or doubleword, the loads and stores provided by ext:zalrsc[] are designed to be paired.
The load-reserved implies that a future store-conditional will follow while store-conditional requires that there was a previous load-reserved without other intervening loads or stores.
Therefore, the ext:zalrsc[] extension does not provide a general atomic and ordered load or store.'''
zh = '''
[#norm:zalasr_builds_on_amo]#ext:zalasr[] 扩展建立在 ext:zaamo[]、ext:zalrsc[] 和 ext:zabha[] 扩展所提供的原子支持之上，通过提供额外的原子操作，尽管它可以独立于这些扩展实现。#
ext:zaamo[] 和 ext:zabha[] 中的所有 AMO 操作都是既加载又存储的读-改-写操作。
ext:zalrsc[] 扩展提供仅为加载或仅为存储的操作。
然而，由于它被设计为在单个内存字或双字上执行原子操作，ext:zalrsc[] 提供的加载和存储被设计为成对出现。
加载保留意味着后续会有一个存储条件，而存储条件要求此前存在一个加载保留且其间没有其他加载或存储。
因此，ext:zalrsc[] 扩展并不提供通用的原子且有序的加载或存储。'''
