en = '''
If halt is requested while `wfi` is executing, then the hart must leave
the stalled state, completing this instruction's execution, and then
enter Debug Mode.'''
zh = '''
如果在 `wfi` 正在执行时请求停止，则硬件线程必须离开停顿状态，完成该指令的执行，然后进入调试模式。'''
