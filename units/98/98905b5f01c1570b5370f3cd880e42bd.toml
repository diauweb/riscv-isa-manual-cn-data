en = '''
[#norm:hints_enc]#Most RV32I HINTs are encoded as integer computational instructions with
_rd_=`x0`. The other RV32I HINTs are encoded as FENCE instructions with
a null predecessor or successor set and with _fm_=0.#'''
zh = '''
[#norm:hints_enc]#大多数 RV32I HINT 编码为 _rd_=`x0` 的整数计算指令。其他 RV32I HINT 编码为前驱或后继集合为空且 _fm_=0 的 FENCE 指令。#'''
