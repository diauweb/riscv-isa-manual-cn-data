en = '''
Multiple contexts may have different jump vector tables. JVT may be switched between them without an instruction barrier
if the tables have not been updated in memory since the last insn:fence.i[].'''
zh = '''
多个上下文可以具有不同的跳转向量表。如果自上次 insn:fence.i[] 以来内存中的表未被更新，则可以在它们之间切换 JVT 而无需指令屏障。'''
