en = '''
Encodings with bits [15:0] all zeros are defined as illegal
instructions. These instructions are considered to be of minimal length:
qty:16[bits] if any 16-bit instruction-set extension is present, otherwise
qty:32[bits]. The encoding with bits [ILEN-1:0] all ones is also illegal; this
instruction is considered to be ILEN bits long.'''
zh = '''
位 [15:0] 全为零的编码定义为非法指令。这些指令被视为具有最小长度：如果存在任何 16 位指令集扩展，则为 qty:16[bits]；否则为 qty:32[bits]。位 [ILEN-1:0] 全为一的编码也是非法指令；该指令被视为长度为 ILEN 位。'''
