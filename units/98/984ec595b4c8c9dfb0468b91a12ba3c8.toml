en = '''
[#norm:Zicntr_rdcycle_op]#The insn:rdcycle[] pseudoinstruction reads the low
XLEN bits of the csr:cycle[] CSR which holds a count of the number of clock
cycles executed by the processor core on which the hart is running from an
arbitrary start time in the past.#
[#norm:Zicntr_rdcycleh_op]#insn:rdcycleh[] is only present when XLEN=32 and reads bits 63-32
of the same cycle counter.# The underlying 64-bit counter should never
overflow in practice. The rate at which the cycle counter advances will
depend on the implementation and operating environment. The execution
environment should provide a means to determine the current rate
(cycles/second) at which the cycle counter is incrementing.'''
zh = '''
[#norm:Zicntr_rdcycle_op]#insn:rdcycle[] 伪指令读取 csr:cycle[] CSR 的低 XLEN 位，该 CSR 保存硬件线程所在处理器核心自过去某个任意起始时间以来所执行时钟周期数的计数。#
[#norm:Zicntr_rdcycleh_op]#insn:rdcycleh[] 仅在 XLEN=32 时存在，读取同一周期计数器的第 63-32 位。# 底层的 64 位计数器在实践中绝不应溢出。周期计数器递增的速率取决于实现和运行环境。执行环境应提供一种方法来确定周期计数器当前递增的速率（周期/秒）。'''
