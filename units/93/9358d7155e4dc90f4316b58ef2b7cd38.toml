en = '''
A insn:fence.i[] instruction orders all explicit memory accesses and instruction fetches that precede
the insn:fence.i[] in program order before all instruction fetches that follow
the insn:fence.i[] in program order.'''
zh = '''
insn:fence.i[] 指令将程序顺序中位于该 insn:fence.i[] 之前的所有显式内存访问和指令取指，排在程序顺序中位于该 insn:fence.i[] 之后的所有指令取指之前。'''
