en = '''
Additionally, for the purposes of PMP and PMA checks, the access size of a CMO
instruction equals the size of the cache block accessed by the instruction.'''
zh = '''
此外，就 PMP 和 PMA 检查而言，CMO 指令的访问大小等于该指令所访问缓存块的大小。'''
