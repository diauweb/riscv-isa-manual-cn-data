en = '''
This instruction is similar to insn:vfncvt.f.f.w[] which converts a
floating-point value in a 2*SEW-width format into an SEW-width format.
However, here the SEW-width format is limited to BF16.'''
zh = '''
该指令类似于 insn:vfncvt.f.f.w[]，后者将 2*SEW 宽格式的浮点值转换为 SEW 宽格式。然而，此处 SEW 宽格式限于 BF16。'''
