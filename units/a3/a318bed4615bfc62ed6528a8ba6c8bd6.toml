en = '''
<<norm:rv32i_hints_tbl>> lists all RV32I HINT code points. 91% of the
HINT space is reserved for standard HINTs. The remainder of the HINT
space is designated for custom HINTs: no standard HINTs will ever be
defined in this subspace.'''
zh = '''
<<norm:rv32i_hints_tbl>> 列出了所有 RV32I HINT 编码点。HINT 空间的 91% 保留给标准 HINT。HINT 空间的其余部分指定用于自定义 HINT：该子空间中绝不会定义任何标准 HINT。'''
