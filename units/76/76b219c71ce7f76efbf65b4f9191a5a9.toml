en = '''
The behavior of other input and output bits is largely left to the vendor
(as they depend on the technical details of the physical entropy source),
as is the address of the custom csr:mnoise[] CSR. Other contents and behavior of the
CSR only can be interpreted in the context of csr:mvendorid[], csr:marchid[], and
csr:mimpid[] CSR identifiers.'''
zh = '''
其他输入和输出比特的行为主要留给供应商（因为它们取决于物理熵源的技术细节），自定义 csr:mnoise[] CSR 的地址也是如此。该 CSR 的其他内容和行为只能结合 csr:mvendorid[]、csr:marchid[] 和 csr:mimpid[] CSR 标识符来解释。'''
