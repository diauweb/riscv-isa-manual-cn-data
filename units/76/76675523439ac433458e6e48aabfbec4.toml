en = '''
Just as for AMOs in the ext:a[] extension, insn:ssamoswap.w[] or insn:ssamoswap.d[] requires that the address
held in `rs1` be naturally aligned to the size of the operand (i.e., 8-byte
aligned for doublewords, and 4-byte aligned for words). The same
exception options apply if the address is not naturally aligned.'''
zh = '''
与 ext:a[] 扩展中的 AMO 一样，insn:ssamoswap.w[] 或 insn:ssamoswap.d[] 要求 `rs1` 中持有的地址按操作数大小自然对齐（即双字为 8 字节对齐，字为 4 字节对齐）。如果地址不是自然对齐的，则适用相同的异常选项。'''
