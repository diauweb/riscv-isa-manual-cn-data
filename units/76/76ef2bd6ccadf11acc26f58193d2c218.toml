en = '''
[#norm:mstatus_sxl_acc_mxlen64]#When MXLEN=64, if S-mode is not supported, then csr::[sxl] is read-only zero.
Otherwise, it is a *WARL* field that encodes the current value of SXLEN.#
In particular, [#norm:mstatus_sxl_rdonly_mxlen64]#an implementation may make csr::[sxl] be a read-only field whose
value always ensures that SXLEN=MXLEN.#'''
zh = '''
[#norm:mstatus_sxl_acc_mxlen64]#当 MXLEN=64 时，如果不支持 S 模式，则 csr::[sxl] 为只读零。否则，它是一个 *WARL* 字段，编码 SXLEN 的当前值。#
特别地，[#norm:mstatus_sxl_rdonly_mxlen64]#实现可以将 csr::[sxl] 设为只读字段，其值始终确保 SXLEN=MXLEN。#'''
