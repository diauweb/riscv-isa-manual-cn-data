en = '''
[#norm:mstatus_tw_warl]#The TW (Timeout Wait) bit is a *WARL* field that supports intercepting the WFI
instruction (see <<wfi>>).#
[#norm:mstatus_tw_op]#When TW=0, the WFI
instruction may execute in modes less privileged than M when not prevented for
some other reason. When TW=1, then if WFI is executed in any
less-privileged mode, and it does not complete within an
implementation-specific, bounded time limit, the WFI instruction causes
an illegal-instruction exception.#
[#norm:mstatus_tw_always_illegal]#An implementation may have WFI always
raise an illegal-instruction exception in modes less privileged than M when
TW=1, even if there are pending globally-disabled interrupts when the
instruction is executed.#
[#norm:mstatus_tw_acc]#TW is read-only 0 when there are no modes less privileged than M;
otherwise, it must be writable.#'''
zh = '''
[#norm:mstatus_tw_warl]#TW（Timeout Wait，超时等待）位是一个 *WARL* 字段，支持拦截 WFI 指令（见 <<wfi>>）。#
[#norm:mstatus_tw_op]#当 TW=0 时，WFI 指令可以在特权级低于 M 的模式中执行（前提是未因其他原因被阻止）。当 TW=1 时，如果在任何特权级较低的模式中执行 WFI，且该指令未在实现特定的有界时间限制内完成，则 WFI 指令引发非法指令异常。#
[#norm:mstatus_tw_always_illegal]#当 TW=1 时，实现在特权级低于 M 的模式中可以让 WFI 始终引发非法指令异常，即使执行该指令时存在挂起的全局禁用中断。#
[#norm:mstatus_tw_acc]#当不存在特权级低于 M 的模式时，TW 为只读 0；否则，它必须可写。#'''
