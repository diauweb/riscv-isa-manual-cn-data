en = '''
The 2-bit floating-point format field _fmt_ is encoded as shown in
<<norm:fp_fmt_enc>>. It is set to _S_ (00) for all instructions in the ext:f[] extension.'''
zh = '''
2 位浮点格式字段 _fmt_ 的编码如 <<norm:fp_fmt_enc>> 所示。对于 ext:f[] 扩展中的所有指令，它被设置为 _S_（00）。
.Format field encoding.
[%autowidth,float="center",align="center",cols="^,^,<",options="header",]
|===
|_fmt_ 字段 |助记符 |含义
|00 |S |32 位单精度
|01 |D |64 位双精度
|10 |H |16 位半精度
|11 |Q |128 位四精度
|===
所有执行舍入的浮点操作都可以使用 _rm_ 字段选择舍入模式，其编码如 <<norm:dyn_round_enc>> 所示。'''
