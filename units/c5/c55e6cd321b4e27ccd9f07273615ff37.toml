When a trap is taken into privilege mode `x`, the `__x__PELP` is set to `ELP`
and `ELP` is set to `NO_LP_EXPECTED`.'''
zh = '''
当陷阱进入特权模式 `x` 时，`__x__PELP` 置为 `ELP`，且 `ELP` 置为 `NO_LP_EXPECTED`。'''
