en = '''
Main memory regions always support read and write of all access widths
required by the attached devices, and can specify whether instruction
fetch is supported.'''
zh = '''
主内存区域总是支持所连接设备要求的所有访问宽度的读和写，并且可以指定是否支持指令取指。'''
