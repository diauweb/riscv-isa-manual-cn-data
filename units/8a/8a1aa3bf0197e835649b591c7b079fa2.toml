en = '''
[#norm:zalasr_def]#The ext:zalasr[] extension provides load-acquire and store-release instructions in RISC-V.
These can be important for high performance designs by enabling finer-grained synchronization than is possible with fences alone, by providing a unidirectional fence.#
Load-acquire and store-release are widely used in language-level memory models:
both the Java and {cpp} memory models make use of acquire-release semantics, and {cpp}'s `atomic` provides primitives that are meant to map directly to load-acquire and store-release instructions.'''
zh = '''
[#norm:zalasr_def]#ext:zalasr[] 扩展在 RISC-V 中提供加载-获取和存储-释放指令。
这些指令通过提供单向栅栏，能够实现比仅使用栅栏更细粒度的同步，因而对于高性能设计可能很重要。#
加载-获取和存储-释放广泛用于语言级内存模型：Java 和 {cpp} 内存模型都使用获取-释放语义，并且 {cpp} 的 `atomic` 提供了旨在直接映射到加载-获取和存储-释放指令的原语。'''
