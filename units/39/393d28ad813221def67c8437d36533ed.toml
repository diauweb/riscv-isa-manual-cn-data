[float="center",align="center",cols="<23,<61,^10,^10",options="header"]
|===
|字段 |说明 |访问 |复位
|[[sbcs-sbversion]] `((sbversion))`
a|

0（旧版）：系统总线接口符合本规范早于 2018 年 1 月 1 日的主线草案。


1（1.0）：系统总线接口符合本规范的此版本。

其他值保留供未来版本使用。
a|*R*
a|1
|[[sbcs-sbbusyerror]] `((sbbusyerror))`
a|当调试器在读取进行期间尝试读取数据，或当调试器在已有访问正在进行（{sbcs-sbbusy} 置位）时发起新访问时置位。它保持置位，直到调试器显式清零。

在此字段置位期间，调试模块不能再发起任何系统总线访问。
a|*R/W1C*
a|0
|[[sbcs-sbbusy]] `((sbbusy))`
a|为 1 时表示系统总线管理器忙。（系统总线本身是否忙与之相关，但并不相同。）此位在因任何原因请求读或写时立即变高，并直到访问完全完成后才变低。

在 {sbcs-sbbusy} 为高时写 {dm-sbcs} 会导致未定义行为。调试器必须在读到 {sbcs-sbbusy} 为 0 之前不得写 {dm-sbcs}。
a|*R*
a|0
|[[sbcs-sbreadonaddr]] `((sbreadonaddr))`
a|当为 1 时，每次写 {dm-sbaddress0} 都会自动在新地址处触发一次系统总线读。
a|*R/W*
a|0
|[[sbcs-sbaccess]] `((sbaccess))`
a|选择用于系统总线访问的访问尺寸。

0（8 位）：8 位


1（16 位）：16 位


2（32 位）：32 位


3（64 位）：64 位


4（128 位）：128 位

若 DM 启动总线访问时 {sbcs-sbaccess} 为不支持的值，则不执行该访问，并将 {sbcs-sberror} 设为 4。
a|*R/W*
a|2
|[[sbcs-sbautoincrement]] `((sbautoincrement))`
a|当为 1 时，每次系统总线访问后，`sbaddress` 增加 {sbcs-sbaccess} 所选的访问尺寸（以字节计）。
a|*R/W*
a|0
|[[sbcs-sbreadondata]] `((sbreadondata))`
a|当为 1 时，每次从 {dm-sbdata0} 读取都会在（可能自动递增的）地址处自动触发一次系统总线读。
a|*R/W*
a|0
|[[sbcs-sberror]] `((sberror))`
a|当调试模块的系统总线管理器遇到错误时，此字段被置位。此字段中的位保持置位，直到通过向它们写 1 而清零。在此字段非零期间，调试模块不能再发起任何系统总线访问。

实现可对任何错误情况报告 ``Other''（7）。

0（无）：无总线错误。


1（超时）：发生超时。


2（地址）：访问了错误地址。


3（对齐）：发生对齐错误。


4（尺寸）：请求了不支持尺寸的访问。


7（其他）：其他。
a|*R/W1C*
a|0
|[[sbcs-sbasize]] `((sbasize))`
a|系统总线地址的宽度，以位计。（0 表示不支持总线访问。）
a|*R*
a|预设
|[[sbcs-sbaccess128]] `((sbaccess128))`
a|当支持 128 位系统总线访问时为 1。
a|*R*
a|预设
|[[sbcs-sbaccess64]] `((sbaccess64))`
a|当支持 64 位系统总线访问时为 1。
a|*R*
a|预设
|[[sbcs-sbaccess32]] `((sbaccess32))`
a|当支持 32 位系统总线访问时为 1。
a|*R*
a|预设
|[[sbcs-sbaccess16]] `((sbaccess16))`
a|当支持 16 位系统总线访问时为 1。
a|*R*
a|预设
|[[sbcs-sbaccess8]] `((sbaccess8))`
a|当支持 8 位系统总线访问时为 1。
a|*R*
a|预设
|==='''
