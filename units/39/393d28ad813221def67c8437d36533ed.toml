[float="center",align="center",cols="<23,<61,^10,^10",options="header"]
|===
|Field |Description |Access |Reset
|[[sbcs-sbversion]] `((sbversion))`
a|

0 (legacy): The System Bus interface conforms to mainline drafts of this
spec older than 1 January, 2018.


1 (1.0): The System Bus interface conforms to this version of the spec.

Other values are reserved for future versions.
a|*R*
a|1
|[[sbcs-sbbusyerror]] `((sbbusyerror))`
a|Set when the debugger attempts to read data while a read is in
progress, or when the debugger initiates a new access while one is
already in progress (while {sbcs-sbbusy} is set). It remains set until
it's explicitly cleared by the debugger.

While this field is set, no more system bus accesses can be
initiated by the Debug Module.
a|*R/W1C*
a|0
|[[sbcs-sbbusy]] `((sbbusy))`
a|When 1, indicates the system bus manager is busy. (Whether the
system bus itself is busy is related, but not the same thing.) This
bit goes high immediately when a read or write is requested for any
reason, and does not go low until the access is fully completed.

Writes to {dm-sbcs} while {sbcs-sbbusy} is high result in undefined
behavior.  A debugger must not write to {dm-sbcs} until it reads
{sbcs-sbbusy} as 0.
a|*R*
a|0
|[[sbcs-sbreadonaddr]] `((sbreadonaddr))`
a|When 1, every write to {dm-sbaddress0} automatically triggers a
system bus read at the new address.
a|*R/W*
a|0
|[[sbcs-sbaccess]] `((sbaccess))`
a|Select the access size to use for system bus accesses.

0 (8bit): 8-bit


1 (16bit): 16-bit


2 (32bit): 32-bit


3 (64bit): 64-bit


4 (128bit): 128-bit

If {sbcs-sbaccess} has an unsupported value when the DM starts a bus
access, the access is not performed and {sbcs-sberror} is set to 4.
a|*R/W*
a|2
|[[sbcs-sbautoincrement]] `((sbautoincrement))`
a|When 1, `sbaddress` is incremented by the access size (in
bytes) selected in {sbcs-sbaccess} after every system bus access.
a|*R/W*
a|0
|[[sbcs-sbreadondata]] `((sbreadondata))`
a|When 1, every read from {dm-sbdata0} automatically triggers a
system bus read at the (possibly auto-incremented) address.
a|*R/W*
a|0
|[[sbcs-sberror]] `((sberror))`
a|When the Debug Module's system bus
manager encounters an error, this field gets set. The bits in this
field remain set until they are cleared by writing 1 to them.
While this field is non-zero, no more system bus accesses can be
initiated by the Debug Module.

An implementation may report ``Other'' (7) for any error condition.

0 (none): There was no bus error.


1 (timeout): There was a timeout.


2 (address): A bad address was accessed.


3 (alignment): There was an alignment error.


4 (size): An access of unsupported size was requested.


7 (other): Other.
a|*R/W1C*
a|0
|[[sbcs-sbasize]] `((sbasize))`
a|Width of system bus addresses in bits. (0 indicates there is no bus
access support.)
a|*R*
a|Preset
|[[sbcs-sbaccess128]] `((sbaccess128))`
a|1 when 128-bit system bus accesses are supported.
a|*R*
a|Preset
|[[sbcs-sbaccess64]] `((sbaccess64))`
a|1 when 64-bit system bus accesses are supported.
a|*R*
a|Preset
|[[sbcs-sbaccess32]] `((sbaccess32))`
a|1 when 32-bit system bus accesses are supported.
a|*R*
a|Preset
|[[sbcs-sbaccess16]] `((sbaccess16))`
a|1 when 16-bit system bus accesses are supported.
a|*R*
a|Preset
|[[sbcs-sbaccess8]] `((sbaccess8))`
a|1 when 8-bit system bus accesses are supported.
a|*R*
a|Preset
|==='''
