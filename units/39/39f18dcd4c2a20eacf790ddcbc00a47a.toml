en = '''
[float="center",align="center",cols="<23,<61,^10,^10",options="header"]
|===
|Field |Description |Access |Reset
|[[mcontrol-maskmax]] `((maskmax))`
a|Specifies the largest naturally aligned powers-of-two (NAPOT) range
supported by the hardware when {mcontrol-match} is 1. The value is the
logarithm base 2 of the number of bytes in that range.
A value of 0 indicates {mcontrol-match} 1 is not supported.
A value of 63 corresponds to the maximum NAPOT range, which is
2^63^ bytes in size.
a|*R*
a|Preset
|[[mcontrol-sizehi]] `((sizehi))`
a|This field only exists when XLEN is at least 64.
It contains the 2 high bits of the access size. The low bits
come from {mcontrol-sizelo}. See {mcontrol-sizelo} for how this
is used.
a|*WARL*
a|0
|[[mcontrol-hit]] `((hit))`
a|If this bit is implemented then it must become set when this
trigger fires and may become set when this trigger matches.
The trigger's user can set or clear it at any
time. It is used to determine which
trigger(s) matched.  If the bit is not implemented, it is always 0
and writing it has no effect.
a|*WARL*
a|0
|[[mcontrol-select]] `((select))`
a|This bit determines the contents of the XLEN-bit compare values.

0 (address): There is at least one compare value and it contains the lowest
virtual address of the access.
It is recommended that there are additional compare values for
the other accessed virtual addresses.
(E.g. on a 32-bit read from 0x4000, the lowest address is 0x4000
and the other addresses are 0x4001, 0x4002, and 0x4003.)


1 (data): There is exactly one compare value and it contains the data
value loaded or stored, or the instruction executed.
Any bits beyond the size of the data access will contain 0.
a|*WARL*
a|0
|[[mcontrol-timing]] `((timing))`
a|

0 (before): The action for this trigger will be taken just before the
instruction that triggered it is retired, but after all preceding
instructions are retired. `xepc` or {csr-dpc} (depending
on {mcontrol-action}) must be set to the virtual address of the
instruction that matched.

If this is combined with {mcontrol-load} and
{mcontrol-select}=1 then a memory access will be
performed (including any side effects of performing such an access) even
though the load will not update its destination register. Debuggers
should consider this when setting such breakpoints on, for example,
memory-mapped I/O addresses.

If an instruction matches this trigger and the instruction performs
multiple memory accesses, it is UNSPECIFIED which memory accesses
have completed before the trigger fires.


1 (after): The action for this trigger will be taken after the instruction
that triggered it is retired. It should be taken before the next
instruction is retired, but it is better to implement triggers imprecisely
than to not implement them at all.  `xepc` or
{csr-dpc} (depending on {mcontrol-action}) must be set to
the virtual address of the next instruction that must be executed to
preserve the program flow.

Most hardware will only implement one timing or the other, possibly
dependent on {mcontrol-select}, {mcontrol-execute},
{mcontrol-load}, and {mcontrol-store}. This bit
primarily exists for the hardware to communicate to the debugger
what will happen. Hardware may implement the bit fully writable, in
which case the debugger has a little more control.

Data load triggers with {mcontrol-timing} of 0 will result in the same load
happening again when the debugger lets the hart run. For data load
triggers, debuggers must first attempt to set the breakpoint with
{mcontrol-timing} of 1.

If a trigger with {mcontrol-timing} of 0 matches, it is
implementation-dependent whether that prevents a trigger with
{mcontrol-timing} of 1 matching as well.
a|*WARL*
a|0
|[[mcontrol-sizelo]] `((sizelo))`
a|This field contains the 2 low bits of the access size. The high bits come
from {mcontrol-sizehi}. The combined value is interpreted as follows:

0 (any): The trigger will attempt to match against an access of any size.
The behavior is only well-defined if {mcontrol-select}=0, or if the access
size is XLEN.


1 (8bit): The trigger will only match against 8-bit memory accesses.


2 (16bit): The trigger will only match against 16-bit memory accesses or
execution of 16-bit instructions.


3 (32bit): The trigger will only match against 32-bit memory accesses or
execution of 32-bit instructions.


4 (48bit): The trigger will only match against execution of 48-bit instructions.


5 (64bit): The trigger will only match against 64-bit memory accesses or
execution of 64-bit instructions.


6 (80bit): The trigger will only match against execution of 80-bit instructions.


7 (96bit): The trigger will only match against execution of 96-bit instructions.


8 (112bit): The trigger will only match against execution of 112-bit instructions.


9 (128bit): The trigger will only match against 128-bit memory accesses or
execution of 128-bit instructions.

An implementation must support the value of 0, but all other values
are optional. When an implementation supports address triggers
({mcontrol-select}=0), it is recommended that those triggers
support every access size that the hart supports, as well as for
every instruction size that the hart supports.

Implementations such as RV32D or RV64V are able to perform loads
and stores that are wider than XLEN. Custom extensions may also
support instructions that are wider than XLEN. Because
{csr-tdata2} is of size XLEN, there is a known limitation that
data value triggers ({mcontrol-select}=1) can only be supported
for access sizes up to XLEN bits.  When an implementation supports
data value triggers ({mcontrol-select}=1), it is recommended
that those triggers support every access size up to XLEN that the
hart supports, as well as for every instruction length up to XLEN
that the hart supports.
a|*WARL*
a|0
|[[mcontrol-action]] `((action))`
a|The action to take when the trigger fires. The values are explained
in xref:tab:action[].
a|*WARL*
a|0
|[[mcontrol-chain]] `((chain))`
a|

0 (disabled): When this trigger matches, the configured action is taken.


1 (enabled): While this trigger does not match, it prevents the trigger with
the next index from matching.

A trigger chain starts on the first trigger with `chain`=1 after
a trigger with `chain`=0, or simply on the first trigger if that
has `chain`=1. It ends on the first trigger after that which has
`chain`=0. This final trigger is part of the chain. The action
on all but the final trigger is ignored.  The action on that final
trigger will be taken if and only if all the triggers in the chain
match at the same time.

Debuggers should not terminate a chain with a trigger with a
different type. It is undefined when exactly such a chain fires.

Because {mcontrol-chain} affects the next trigger, hardware must zero it in
writes to {csr-mcontrol} that set {tdata1-dmode} to 0 if the next trigger has
{tdata1-dmode} of 1.
In addition hardware should ignore writes to {csr-mcontrol} that set
{tdata1-dmode} to 1 if the previous trigger has both {tdata1-dmode} of 0 and
{mcontrol-chain} of 1. Debuggers must avoid the latter case by checking
{mcontrol-chain} on the previous trigger if they're writing {csr-mcontrol}.

Implementations that wish to limit the maximum length of a trigger
chain (e.g. to meet timing requirements) may do so by zeroing
{mcontrol-chain} in writes to {csr-mcontrol} that would make the chain too long.
a|*WARL*
a|0
|[[mcontrol-match]] `((match))`
a|

0 (equal): Matches when any compare value equals {csr-tdata2}.


1 (napot): Matches when the top `M` bits of any compare value match the top
`M` bits of {csr-tdata2}.
`M` is `XLEN-1` minus the index of the least-significant
bit containing 0 in {csr-tdata2}. Debuggers should only write values
to {csr-tdata2} such that `M` + {mcontrol-maskmax} ≥ `XLEN`
and `M` > 0, otherwise it's undefined on what conditions the
trigger will match.


2 (ge): Matches when any compare value is greater than (unsigned) or
equal to {csr-tdata2}.


3 (lt): Matches when any compare value is less than (unsigned)
{csr-tdata2}.


4 (mask low): Matches when `XLEN/2-1:0` of any compare value
equals `XLEN/2-1:0` of {csr-tdata2} after
`XLEN/2-1:0` of the compare value is ANDed with
`XLEN-1:XLEN/2` of {csr-tdata2}.


5 (mask high): Matches when `XLEN-1:XLEN/2` of any compare
value equals `XLEN/2-1:0` of {csr-tdata2} after
`XLEN-1:XLEN/2` of the compare value is ANDed with
`XLEN-1:XLEN/2` of {csr-tdata2}.


8 (not equal): Matches when {mcontrol-match}=0 would not match.


9 (not napot): Matches when {mcontrol-match}=1 would not match.


12 (not mask low): Matches when {mcontrol-match}=4 would not match.


13 (not mask high): Matches when {mcontrol-match}=5 would not match.

Other values are reserved for future use.

All comparisons only look at the lower XLEN (in the current mode)
bits of the compare values and of {csr-tdata2}.
When {mcontrol-select}=1 and access size is N, this is further
reduced, and comparisons only look at the lower N bits of the
compare values and of {csr-tdata2}.
a|*WARL*
a|0
|[[mcontrol-m]] `((m))`
a|When set, enable this trigger in M-mode.
a|*WARL*
a|0
|[[mcontrol-s]] `((s))`
a|When set, enable this trigger in S/HS-mode.
This bit is hard-wired to 0 if the hart does not support
S-mode.
a|*WARL*
a|0
|[[mcontrol-u]] `((u))`
a|When set, enable this trigger in U-mode.
This bit is hard-wired to 0 if the hart does not support
U-mode.
a|*WARL*
a|0
|[[mcontrol-execute]] `((execute))`
a|When set, the trigger fires on the virtual address or opcode of an
instruction that is executed.
a|*WARL*
a|0
|[[mcontrol-store]] `((store))`
a|When set, the trigger fires on the virtual address or data of any
store.
a|*WARL*
a|0
|[[mcontrol-load]] `((load))`
a|When set, the trigger fires on the virtual address or data of any
load.
a|*WARL*
a|0
|==='''
zh = '''
[float="center",align="center",cols="<23,<61,^10,^10",options="header"]
|===
|字段 |描述 |访问 |复位
|[[mcontrol-maskmax]] `((maskmax))`
a|指定当 {mcontrol-match} 为 1 时硬件支持的最大自然对齐的 2 的幂（NAPOT）范围。该值是此范围字节数的以 2 为底的对数。值 0 表示不支持 {mcontrol-match} 1。值 63 对应于最大 NAPOT 范围，其大小为 2^63^ 字节。
a|*R*
a|预设
|[[mcontrol-sizehi]] `((sizehi))`
a|此字段仅在 XLEN 至少为 64 时存在。它包含访问大小的高 2 位。低位来自 {mcontrol-sizelo}。其用法参见 {mcontrol-sizelo}。
a|*WARL*
a|0
|[[mcontrol-hit]] `((hit))`
a|如果实现了此位，则当此触发器触发时它必须置位，并且当此触发器匹配时它可以置位。触发器的用户可以随时设置或清除它。它用于确定哪个（些）触发器匹配。如果未实现该位，则它始终为 0，写入它无效果。
a|*WARL*
a|0
|[[mcontrol-select]] `((select))`
a|此位确定 XLEN 位比较值的内容。

0（address）：至少有一个比较值，它包含访问的最低虚拟地址。建议为其他被访问的虚拟地址提供附加比较值。（例如，在从 0x4000 进行 32 位读取时，最低地址是 0x4000，其他地址是 0x4001、0x4002 和 0x4003。）


1（data）：恰好有一个比较值，它包含加载或存储的数据值，或执行的指令。超出数据访问大小的任何位将包含 0。
a|*WARL*
a|0
|[[mcontrol-timing]] `((timing))`
a|

0（before）：此触发器的动作将在触发它的指令退休之前、但在所有先前指令退休之后采取。`xepc` 或 {csr-dpc}（取决于 {mcontrol-action}）必须设置为匹配指令的虚拟地址。

如果这与 {mcontrol-load} 和 {mcontrol-select}=1 组合，则将执行内存访问（包括执行此类访问的任何副作用），即使加载不会更新其目标寄存器。在例如内存映射 I/O 地址上设置此类断点时，调试器应考虑这一点。

如果一条指令匹配此触发器并且该指令执行多个内存访问，则哪些内存访问在触发器触发之前完成是未规定的。


1（after）：此触发器的动作将在触发它的指令退休之后采取。它应在下一条指令退休之前采取，但实现不精确的触发器总比完全不实现它们好。`xepc` 或 {csr-dpc}（取决于 {mcontrol-action}）必须设置为为保持程序流而必须执行的下一条指令的虚拟地址。

大多数硬件只会实现一种时序或另一种，可能取决于 {mcontrol-select}、{mcontrol-execute}、{mcontrol-load} 和 {mcontrol-store}。此位主要存在是为了让硬件告诉调试器将发生什么。硬件可以将该位实现为完全可写，在这种情况下调试器有稍多控制权。

{mcontrol-timing} 为 0 的数据加载触发器将导致当调试器让硬件线程运行时相同加载再次发生。对于数据加载触发器，调试器必须首先尝试使用 {mcontrol-timing} 为 1 设置断点。

如果 {mcontrol-timing} 为 0 的触发器匹配，则是否也阻止 {mcontrol-timing} 为 1 的触发器匹配取决于实现。
a|*WARL*
a|0
|[[mcontrol-sizelo]] `((sizelo))`
a|此字段包含访问大小的低 2 位。高位来自 {mcontrol-sizehi}。组合值解释如下：

0（any）：触发器将尝试匹配任意大小的访问。仅当 {mcontrol-select}=0，或访问大小为 XLEN 时，行为才有明确定义。


1（8bit）：触发器将仅匹配 8 位内存访问。


2（16bit）：触发器将仅匹配 16 位内存访问或 16 位指令执行。


3（32bit）：触发器将仅匹配 32 位内存访问或 32 位指令执行。


4（48bit）：触发器将仅匹配 48 位指令执行。


5（64bit）：触发器将仅匹配 64 位内存访问或 64 位指令执行。


6（80bit）：触发器将仅匹配 80 位指令执行。


7（96bit）：触发器将仅匹配 96 位指令执行。


8（112bit）：触发器将仅匹配 112 位指令执行。


9（128bit）：触发器将仅匹配 128 位内存访问或 128 位指令执行。

实现必须支持值 0，但所有其他值都是可选的。当实现支持地址触发器（{mcontrol-select}=0）时，建议这些触发器支持硬件线程支持的所有访问大小，以及硬件线程支持的所有指令大小。

诸如 RV32D 或 RV64V 的实现能够执行宽于 XLEN 的加载和存储。自定义扩展也可能支持宽于 XLEN 的指令。由于 {csr-tdata2} 的大小为 XLEN，存在一个已知限制：数据值触发器（{mcontrol-select}=1）只能支持最大到 XLEN 位的访问大小。当实现支持数据值触发器（{mcontrol-select}=1）时，建议这些触发器支持硬件线程支持的最大到 XLEN 的所有访问大小，以及硬件线程支持的最大到 XLEN 的所有指令长度。
a|*WARL*
a|0
|[[mcontrol-action]] `((action))`
a|触发器触发时要采取的动作。这些值在 xref:tab:action[] 中解释。
a|*WARL*
a|0
|[[mcontrol-chain]] `((chain))`
a|

0（disabled）：当此触发器匹配时，采取配置的动作。


1（enabled）：当此触发器不匹配时，它阻止下一个索引的触发器匹配。

触发器链从具有 `chain`=0 的触发器之后的第一个具有 `chain`=1 的触发器开始，或者如果第一个触发器具有 `chain`=1，则直接从这个第一个触发器开始。它在之后第一个具有 `chain`=0 的触发器结束。最后这个触发器是链的一部分。除最后触发器外，所有触发器上的动作被忽略。当且仅当链中所有触发器同时匹配时，才会采取最后触发器上的动作。

调试器不应使用不同类型的触发器终止链。这种链究竟何时触发是未定义的。

由于 {mcontrol-chain} 影响下一个触发器，如果下一个触发器的 {tdata1-dmode} 为 1，则硬件在写入 {csr-mcontrol} 并将 {tdata1-dmode} 设置为 0 时必须将其清零。此外，如果前一个触发器同时具有 {tdata1-dmode} 为 0 和 {mcontrol-chain} 为 1，则硬件应忽略将 {tdata1-dmode} 设置为 1 的对 {csr-mcontrol} 的写入。如果调试器正在写入 {csr-mcontrol}，则必须通过检查前一个触发器的 {mcontrol-chain} 来避免后一种情况。

希望限制触发器链最大长度（例如为满足时序要求）的实现，可以在写入 {csr-mcontrol} 时将会使链过长的 {mcontrol-chain} 清零。
a|*WARL*
a|0
|[[mcontrol-match]] `((match))`
a|

0（equal）：当任何比较值等于 {csr-tdata2} 时匹配。


1（napot）：当任何比较值的高 `M` 位与 {csr-tdata2} 的高 `M` 位匹配时匹配。
`M` 为 `XLEN-1` 减去 {csr-tdata2} 中包含 0 的最低有效位的索引。调试器只应向 {csr-tdata2} 写入使 `M` + {mcontrol-maskmax} ≥ `XLEN` 且 `M` > 0 的值，否则触发器在什么条件下匹配是未定义的。


2（ge）：当任何比较值大于（无符号）或等于 {csr-tdata2} 时匹配。


3（lt）：当任何比较值小于（无符号）{csr-tdata2} 时匹配。


4（mask low）：当任何比较值的 `XLEN/2-1:0` 在将比较值的 `XLEN/2-1:0` 与 {csr-tdata2} 的 `XLEN-1:XLEN/2` 进行 AND 后，等于 {csr-tdata2} 的 `XLEN/2-1:0` 时匹配。


5（mask high）：当任何比较值的 `XLEN-1:XLEN/2` 在将比较值的 `XLEN-1:XLEN/2` 与 {csr-tdata2} 的 `XLEN-1:XLEN/2` 进行 AND 后，等于 {csr-tdata2} 的 `XLEN/2-1:0` 时匹配。


8（not equal）：当 {mcontrol-match}=0 不会匹配时匹配。


9（not napot）：当 {mcontrol-match}=1 不会匹配时匹配。


12（not mask low）：当 {mcontrol-match}=4 不会匹配时匹配。


13（not mask high）：当 {mcontrol-match}=5 不会匹配时匹配。

其他值保留供将来使用。

所有比较仅查看比较值和 {csr-tdata2} 的低 XLEN（当前模式中）位。当 {mcontrol-select}=1 且访问大小为 N 时，这进一步缩小，比较仅查看比较值和 {csr-tdata2} 的低 N 位。
a|*WARL*
a|0
|[[mcontrol-m]] `((m))`
a|置位时，在 M 模式中使能此触发器。
a|*WARL*
a|0
|[[mcontrol-s]] `((s))`
a|置位时，在 S/HS 模式中使能此触发器。如果硬件线程不支持 S 模式，则此位硬连线为 0。
a|*WARL*
a|0
|[[mcontrol-u]] `((u))`
a|置位时，在 U 模式中使能此触发器。如果硬件线程不支持 U 模式，则此位硬连线为 0。
a|*WARL*
a|0
|[[mcontrol-execute]] `((execute))`
a|置位时，触发器在执行指令的虚拟地址或操作码上触发。
a|*WARL*
a|0
|[[mcontrol-store]] `((store))`
a|置位时，触发器在任何存储的虚拟地址或数据上触发。
a|*WARL*
a|0
|[[mcontrol-load]] `((load))`
a|置位时，触发器在任何加载的虚拟地址或数据上触发。
a|*WARL*
a|0
|==='''
