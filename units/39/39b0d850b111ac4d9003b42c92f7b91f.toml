en = '''
[#norm:mstatus_tsr_warl]#The csr::[tsr] (Trap insn:sret[]) bit is a *WARL* field that supports intercepting the
supervisor exception return instruction, insn:sret[].#
[#norm:mstatus_tsr_op]#When csr::[tsr]=1, attempts to
execute insn:sret[] while executing in S-mode will raise an illegal-instruction
exception. When csr::[tsr]=0, this operation is permitted in S-mode.#
[#norm:mstatus_tsr_acc]#csr::[tsr] is read-only 0 when S-mode is not supported;
otherwise, it must be writable.#'''
zh = '''
[#norm:mstatus_tsr_warl]##csr::[tsr]（Trap insn:sret[]）位是一个 *WARL* 字段，支持拦截监管异常返回指令 insn:sret[]。##[#norm:mstatus_tsr_op]##当 csr::[tsr]=1 时，在 S 模式下执行时试图执行 insn:sret[] 将引发非法指令异常。当 csr::[tsr]=0 时，该操作在 S 模式下被允许。##[#norm:mstatus_tsr_acc]##当不支持 S 模式时，csr::[tsr] 为只读 0；否则，它应为可写。##'''
