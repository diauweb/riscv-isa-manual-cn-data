en = '''
NOTE: Mandating ext:zkt[] enables portable libraries for safe basic cryptographic
operations. It is expected that application processors will naturally have this
property and so implementation cost is low, if not zero, in most systems that
would support RVA22.'''
zh = '''
NOTE: 强制要求 ext:zkt[] 可支持用于安全基础密码操作的可移植库。预期应用处理器天然具有该属性，因此在大多数将支持 RVA22 的系统中，实现成本较低，甚至可能为零。'''
