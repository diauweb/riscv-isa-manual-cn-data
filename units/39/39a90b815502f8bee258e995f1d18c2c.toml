en = '''
- <<svvptc,**Svvptc**>> Transitions from invalid to valid PTEs will be visible in
   bounded time without an explicit memory-management fence.

- <<sec:pm-exts,**Sspm**>> Supervisor-mode pointer masking, with the supervisor execution
   environment providing a means to select PMLEN=0 and PMLEN=7 at minimum.'''
zh = '''
- <<svvptc,**Svvptc**>> 从无效 PTE 到有效 PTE 的转换将在有界时间内可见，无需显式内存管理屏障。

- <<sec:pm-exts,**Sspm**>> 监管模式指针掩码，其中监管模式执行环境至少提供选择 PMLEN=0 和 PMLEN=7 的手段。'''
