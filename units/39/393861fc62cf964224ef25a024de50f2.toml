en = '''
New floating-point-to-integer and integer-to-floating-point conversion
instructions are added. These instructions are defined analogously to
the single-precision-to-integer and integer-to-single-precision
conversion instructions.
[#norm:fcvt-w-h_fcvt-l-h_op]#insn:fcvt.w.h[] or insn:fcvt.l.h[] converts a half-precision floating-point number to a signed 32-bit or 64-bit integer, respectively#.
[#norm:fcvt-h-w_fcvt-h-l_op]#insn:fcvt.h.w[] or insn:fcvt.h.l[] converts a 32-bit or 64-bit signed integer, respectively, into a half-precision floating-point number#.
[#norm:fcvt-wu-h_fcvt-lu-h_fcvt-h-wu_fcvt-h-lu_op]#insn:fcvt.wu.h[], insn:fcvt.lu.h[], insn:fcvt.h.wu[], and insn:fcvt.h.lu[] variants convert to or from unsigned integer values#.
[#norm:fcvt_long_half_rv64_only]#insn:fcvt.l.h[], insn:fcvt.lu.h[], insn:fcvt.h.l[], and insn:fcvt.h.lu[] are RV64-only instructions.#'''
zh = '''
新增了浮点到整数以及整数到浮点的转换指令。这些指令的定义与单精度到整数以及整数到单精度的转换指令类似。
[#norm:fcvt-w-h_fcvt-l-h_op]#insn:fcvt.w.h[] 或 insn:fcvt.l.h[] 分别将半精度浮点数转换为有符号 32 位或 64 位整数#。
[#norm:fcvt-h-w_fcvt-h-l_op]#insn:fcvt.h.w[] 或 insn:fcvt.h.l[] 分别将 32 位或 64 位有符号整数转换为半精度浮点数#。
[#norm:fcvt-wu-h_fcvt-lu-h_fcvt-h-wu_fcvt-h-lu_op]#insn:fcvt.wu.h[]、insn:fcvt.lu.h[]、insn:fcvt.h.wu[] 和 insn:fcvt.h.lu[] 变体用于与无符号整数值相互转换#。
[#norm:fcvt_long_half_rv64_only]#insn:fcvt.l.h[]、insn:fcvt.lu.h[]、insn:fcvt.h.l[] 和 insn:fcvt.h.lu[] 是仅适用于 RV64 的指令。#'''
