en = '''
The insn:fli.s[] instruction loads one of 32 single-precision floating-point
constants, encoded in the _rs1_ field, into floating-point register
_rd_. The correspondence of _rs1_ field values and single-precision
floating-point values is shown in <<tab:flis>>. insn:fli.s[] is encoded
like insn:fmv.w.x[], but with _rs2_=1.'''
zh = '''
insn:fli.s[] 指令将 32 个单精度浮点常量之一（编码在 _rs1_ 字段中）加载到浮点寄存器 _rd_ 中。_rs1_ 字段值与单精度浮点值的对应关系见 <<tab:flis>>。insn:fli.s[] 的编码与 insn:fmv.w.x[] 类似，但 _rs2_=1。'''
