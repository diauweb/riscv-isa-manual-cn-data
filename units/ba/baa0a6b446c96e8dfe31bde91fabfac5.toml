en = '''
[#norm:misa_inc_ialign]#Writing `misa` may increase IALIGN, e.g., by disabling the
ext:c[] extension. If an instruction that would write `misa` increases IALIGN,
and the subsequent instruction's address is not IALIGN-bit aligned, the
write to `misa` is suppressed, leaving `misa` unchanged.#'''
zh = '''
[#norm:misa_inc_ialign]#写入 `misa` 可能增大 IALIGN，例如通过禁用 ext:c[] 扩展。如果一条将要写入 `misa` 的指令增大了 IALIGN，而后续指令的地址不是 IALIGN 位对齐的，则该 `misa` 写入被抑制，`misa` 保持不变。#'''
