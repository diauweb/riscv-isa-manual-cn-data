en = '''
In the `.vv` and `.xv` forms of the `vrgather[ei16]` instructions,
the values in `vs1` and `rs1` are used for control and therefore are exempt from DIEL.'''
zh = '''
在 `vrgather[ei16]` 指令的 `.vv` 和 `.xv` 形式中，
`vs1` 和 `rs1` 中的值用于控制，因此不受 DIEL 约束。'''
