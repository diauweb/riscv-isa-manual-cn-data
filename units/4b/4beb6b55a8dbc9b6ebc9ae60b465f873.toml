en = '''
RISC-V base instruction formats. Each immediate subfield is labeled with the bit position (_imm[x]_) in the immediate value being produced, rather than the bit position within the instruction's immediate field as is usually done.'''
zh = '''
RISC-V 基础指令格式。每个立即数子字段标注的是所生成立即数值中的位位置（_imm[x]_），而不是像通常那样标注该字段在指令立即数字段内的位位置。'''
