en = '''
Each bit in this read-only register indicates whether one specific hart
is halted or not. Unavailable/nonexistent harts are not considered to
be halted.'''
zh = '''
此只读寄存器中的每一位指示某个特定硬件线程是否停机。不可用/不存在的硬件线程不视为已停机。'''
