en = '''
The `stvec` register is an SXLEN-bit read/write register that holds trap
vector configuration, consisting of a vector base address (BASE) and a
vector mode (MODE).'''
zh = '''
`stvec` 寄存器是一个 SXLEN 位读/写寄存器，保存陷阱向量配置，由向量基地址（BASE）和向量模式（MODE）组成。'''
