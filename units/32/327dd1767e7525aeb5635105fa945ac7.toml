en = '''
The status bits csr:seed[][31:30] = csr::[opst] may be `ES16` (10),
indicating successful polling, or one of three entropy polling failure
statuses `BIST` (00), `WAIT` (01), or `DEAD` (11), discussed below.'''
zh = '''
状态位 csr:seed[][31:30] = csr::[opst] 可能为 `ES16` (10)，表示轮询成功，或者为下文讨论的三种熵轮询失败状态之一：`BIST` (00)、`WAIT` (01) 或 `DEAD` (11)。'''
