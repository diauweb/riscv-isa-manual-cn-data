en = '''
* <<msg2_ProgTraceSync,ProgTraceSync>> (start of trace)
** SYNC=3 (Exit from Debug Mode), I-CNT=0 (nothing executed as we are starting)
** F-ADDR=0x80 (encoding starting address 0x100)
* <<msg2_ProgTraceSync,ProgramTraceSync>> (I-CNT overflown to 9 at an address 0x112)
** SYNC=4 (Sequential Instruction Counter), *I-CNT=9* (see note below)
** F-ADDR=0x89 (encoding address 0x112)
* <<msg2_ProgTraceCorrelation,ProgTraceCorrelation>> (describes <0x112..0x11C> range)
** EVCODE=0 (Entry into Debug Mode), CDF=0 (only I-CNT field follows)
** *I-CNT=5* (see note below)'''
zh = '''
* <<msg2_ProgTraceSync,ProgTraceSync>>（跟踪开始）
** SYNC=3（退出调试模式），I-CNT=0（因为我们刚开始，未执行任何内容）
** F-ADDR=0x80（编码起始地址 0x100）
* <<msg2_ProgTraceSync,ProgramTraceSync>>（I-CNT 在地址 0x112 处溢出到 9）
** SYNC=4（Sequential Instruction Counter），*I-CNT=9*（见下面注释）
** F-ADDR=0x89（编码地址 0x112）
* <<msg2_ProgTraceCorrelation,ProgTraceCorrelation>>（描述 <0x112..0x11C> 范围）
** EVCODE=0（进入调试模式），CDF=0（仅随后是 I-CNT 字段）
** *I-CNT=5*（见下面注释）'''
