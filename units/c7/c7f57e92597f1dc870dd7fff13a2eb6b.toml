====

==== 客户机页错误

客户机页错误陷阱可在 CSR `medeleg` 的控制下从 M 模式委托给 HS 模式，但不能委托给其他特权模式。发生客户机页错误时，CSR `mtval` 或 `stval` 照常写入发生错误的客户机虚拟地址，`mtval2` 或 `htval` 写入零或发生错误的客户机物理地址（右移 2 位）。CSR `mtinst` 或 `htinst` 还可写入关于发生错误的指令或访问的其他原因的信息，如 <<tinst-vals>> 所述。

当取指或非对齐内存访问跨页边界时，涉及两个不同的地址转换。在此类情况下发生客户机页错误时，写入 `mtval`/`stval` 的发生错误的虚拟地址与常规页错误所要求的相同。因此，若该页边界处的字节属于被访问字节，则发生错误的虚拟地址可能是高于指令原始虚拟地址的页边界地址。

当客户机页错误并非因 VS 阶段地址转换的隐式内存访问引起时，写入 `mtval2`/`htval` 的非零客户机物理地址应对应于写入 `mtval`/`stval` 的确切虚拟地址。

[[hyp-mm-fences]]
==== 内存管理屏障

SFENCE.VMA 指令的行为受当前虚拟化模式 V 影响。当 V=0 时，虚拟地址参数为 HS 级虚拟地址，ASID 参数为 HS 级 ASID。该指令仅将发往 HS 级地址转换结构的存储与随后的 HS 级地址转换排序。

当 V=1 时，SFENCE.VMA 的虚拟地址参数为当前虚拟机内的客户机虚拟地址，ASID 参数为当前虚拟机内的 VS 级 ASID。当前虚拟机由 CSR `hgatp` 的 VMID 字段标识，有效 ASID 可视为该 VMID 与 VS 级 ASID 的组合。SFENCE.VMA 指令仅将发往 VS 级地址转换结构的存储与同一虚拟机的随后 VS 阶段地址转换排序，即仅当 `hgatp`.VMID 与执行 SFENCE.VMA 时相同时。

虚拟机监控器指令 HFENCE.VVMA 和 HFENCE.GVMA 提供附加的内存管理屏障，以补充 SFENCE.VMA。这些指令在 <<hfence.vma>> 中描述。

<<pmp-vmem>> 讨论了物理内存保护（PMP）与基于页的地址转换之间的交集。其中指出，当 PMP 设置的修改影响持有页表的物理内存或页表所指向的物理内存时，M 模式软件应将 PMP 设置与虚拟内存系统同步。对于 HS 级地址转换，这通过在写入 PMP CSR 之后在 M 模式下执行 __rs1__=`x0` 且 __rs2__=`x0` 的 SFENCE.VMA 指令来完成。还需要与 G 阶段和 VS 阶段数据结构同步。执行 __rs1__=`x0` 且 __rs2__=`x0` 的 HFENCE.GVMA 指令足以冲刷所有已缓存与最终转换后的监管者物理地址相对应的 PMP 设置的 G 阶段或 VS 阶段地址转换缓存项。不需要 HFENCE.VVMA 指令。

类似地，若更改了 `menvcfg` 中 PBMTE 位的设置，则 __rs1__=`x0` 且 __rs2__=`x0` 的 HFENCE.GVMA 指令足以就 G 阶段和 VS 阶段 PTE 的 PBMT 字段的更改后解释进行同步。

相反，若更改了 `henvcfg` 中的 PBMTE 位，则执行 __rs1__=`x0` 且 __rs2__=`x0` 的 HFENCE.VVMA 足以就当前活动 VMID 的 VS 阶段 PTE 的 PBMT 字段的更改后解释进行同步。

NOTE: 未提供将 `vsatp` 和 `hgatp` 原子地一起更改的机制。因此，为防止推测执行导致一个客户机的 VS 阶段转换被缓存在另一个客户机的 VMID 下，世界切换代码宜先将 `vsatp` 置零，然后交换 `hgatp`，最后写入新的 `vsatp` 值。类似地，若 `henvcfg`.PBMTE 需要世界切换，则宜在将 `vsatp` 置零之后、写入新 `vsatp` 值之前切换，从而免除执行 HFENCE.VVMA 指令的需要。

