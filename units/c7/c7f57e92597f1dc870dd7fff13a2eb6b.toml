==== 陷阱原因代码

虚拟机监控器扩展增补了陷阱原因编码。<<hcauses>> 列出了实现虚拟机监控器扩展时可能的 M 模式和 HS 模式陷阱原因代码。为 VS 级中断（中断 2、6、10）、监管级客户机外部中断（中断 12）、虚拟指令异常（异常 22）和客户机页错误（异常 20、21、23）新增了代码。此外，来自 VS 模式的环境调用被赋予原因 10，而来自 HS 模式或 S 模式的环境调用照常使用原因 9。

