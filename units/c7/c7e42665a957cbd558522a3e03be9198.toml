如表中所示，同步异常仅对于由显式内存访问（来自加载、存储和 AMO 指令）引起的异常，可将引发陷阱指令的标准变换写入陷阱指令寄存器。因此，标准变换目前仅针对这些内存访问指令定义。若标准指令发生同步陷阱而尚未为其定义变换，则陷阱指令寄存器应写入零（或在某些情况下写入特殊伪指令值）。

对于非压缩指令且为 LB、LBU、LH、LHU、LW、LWU、LD、FLW、FLD、FLQ 或 FLH 之一的标准加载指令，变换后指令格式如 <<transformedloadinst>> 所示。

[[transformedloadinst]]
.变换后的非压缩加载指令（LB、LBU、LH、LHU、LW、LWU、LD、FLW、FLD、FLQ 或 FLH）。字段 funct3、rd 和 opcode 与引发陷阱的加载指令相同。
[wavedrom, ,svg]
....
{reg: [
  {bits: 7, name: 'opcode', type: 8, attr: ['7']},
  {bits: 5, name: 'rd', type: 2, attr: ['5']},
  {bits: 3, name: 'funct3', type: 8, attr: ['3']},
  {bits: 5, name: 'Addr. Offset', type: 4, attr: ['5']},
  {bits: 5, name: '0', type: 4, attr: ['5']},
  {bits: 7, name: '0', type: 8, attr: ['7']},
], config: {bits: 32}}
....

对于非压缩指令且为 SB、SH、SW、SD、FSW、FSD、FSQ 或 FSH 之一的标准存储指令，变换后指令格式如 <<transformedstoreinst>> 所示。

[[transformedstoreinst]]
.变换后的非压缩存储指令（SB、SH、SW、SD、FSW、FSD、FSQ 或 FSH）。字段 rs2、funct3 和 opcode 与引发陷阱的存储指令相同。
[wavedrom, ,svg]
....
{reg: [
  {bits: 7, name: 'opcode', type: 8, attr: ['7']},
  {bits: 5, name: '0', type: 2, attr: ['5']},
  {bits: 3, name: 'funct3', type: 8, attr: ['3']},
  {bits: 5, name: 'Addr. Offset', type: 4, attr: ['5']},
  {bits: 5, name: 'rs2', type: 4, attr: ['5']},
  {bits: 7, name: '0', type: 8, attr: ['7']},
], config: {bits: 32}}
....

对于标准原子指令（加载保留、存储条件或 AMO 指令），变换后指令格式如 <<transformedatomicinst>> 所示。

[[transformedatomicinst]]
.变换后的原子指令（加载保留、存储条件或 AMO 指令）。除第 19:15 位 Addr. Offset 外，所有字段与引发陷阱的指令相同。
[wavedrom, ,svg]
....
{reg: [
  {bits: 7, name: 'opcode', type: 8, attr: ['7']},
  {bits: 5, name: 'rd', type: 2, attr: ['5']},
  {bits: 3, name: 'funct3', type: 8, attr: ['3']},
  {bits: 5, name: 'Addr. Offset', type: 4, attr: ['5']},
  {bits: 5, name: 'rs2',type: 4, attr: ['5']},
  {bits: 1, name: 'rl',type: 4, attr: ['1']},
  {bits: 1, name: 'aq',type: 4, attr: ['1']},
  {bits: 5, name: 'funct5', type: 8, attr: ['5']},
], config: {bits: 32}}
....

对于标准虚拟机加载/存储指令（HLV、HLVX 或 HSV），变换后指令格式如 <<transformedvmaccessinst>> 所示。

[[transformedvmaccessinst]]
.变换后的虚拟机加载/存储指令（HLV、HLVX、HSV）。除第 19:15 位 Addr. Offset 外，所有字段与引发陷阱的指令相同
[wavedrom, ,svg]
....
{reg: [
  {bits: 7, name: 'opcode', type: 8, attr: ['7']},
  {bits: 5, name: 'rd', type: 2, attr: ['5']},
  {bits: 3, name: 'funct3', type: 8, attr: ['3']},
  {bits: 5, name: 'Addr. Offset', type: 4, attr: ['5']},
  {bits: 5, name: 'rs2', type: 4, attr: ['5']},
  {bits: 7, name: 'funct7', type: 8, attr: ['7']},
], config: {bits: 32}}
....

在上述所有变换后指令中，替换指令第 19:15 位 rs1 字段的 Addr. Offset 字段是发生错误的虚拟地址（写入 `mtval` 或 `stval`）与原始虚拟地址之间的正差。此差仅在非对齐内存访问时可为非零。还注意，对于基本加载和存储，变换将指令的立即偏移字段替换为零。

对于标准压缩指令（16 位大小），按如下方式找到变换后指令：

. 将压缩指令展开为其 32 位等效形式。
. 变换该 32 位等效指令。
. 将第 1 位替换为 `0`。

若引发陷阱的指令为压缩指令，则变换后标准指令的第 1:0 位为二进制 `01`；若非压缩，则为 `11`。
[NOTE]
