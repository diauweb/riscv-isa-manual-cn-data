unit_id = "c7778e0a0ce5fa9f1d81cc9201d1aa1e"
kind = "paragraph"
translatable = true
status = "machine"
en = '''
The `hstatus` fields VTSR, VTW, and VTVM are defined analogously to the
`mstatus` fields TSR, TW, and TVM, but affect execution only in VS-mode,
and cause virtual-instruction exceptions instead of illegal-instruction
exceptions.
[#norm:hstatus_vtsr_op]#When VTSR=1, an attempt in VS-mode to execute SRET raises a
virtual-instruction exception.#
[#norm:hstatus_vtw_op]#When VTW=1 (and assuming `mstatus`.TW=0),
an attempt in VS-mode to execute WFI raises a virtual-instruction
exception if the WFI does not complete within an
implementation-specific, bounded time limit.# [#norm:vtw_virtinstr]#An implementation may have
WFI always raise a virtual-instruction exception in VS-mode when VTW=1
(and `mstatus`.TW=0), even if there are pending globally-disabled
interrupts when the instruction is executed.#
[#norm:hstatus_vtvm_op]#When VTVM=1, an attempt in
VS-mode to execute SFENCE.VMA or SINVAL.VMA or to access CSR `satp`
raises a virtual-instruction exception.#'''
zh = '''
`hstatus` 字段 VTSR、VTW 和 VTVM 的定义类似于 `mstatus` 字段 TSR、TW 和 TVM，但仅在 VS-mode 中影响执行，并引发虚拟指令异常而非非法指令异常。
[#norm:hstatus_vtsr_op]#当 VTSR=1 时，在 VS-mode 中尝试执行 SRET 会引发虚拟指令异常。#
[#norm:hstatus_vtw_op]#当 VTW=1（并假设 `mstatus`.TW=0）时，如果 WFI 未在实现特定的有界时间限制内完成，则在 VS-mode 中尝试执行 WFI 会引发虚拟指令异常。#[#norm:vtw_virtinstr]#当 VTW=1（且 `mstatus`.TW=0）时，实现可以使 WFI 在 VS-mode 中始终引发虚拟指令异常，即使执行该指令时有待处理的全局禁用中断。#
[#norm:hstatus_vtvm_op]#当 VTVM=1 时，在 VS-mode 中尝试执行 SFENCE.VMA 或 SINVAL.VMA 或访问 CSR `satp` 会引发虚拟指令异常。#'''
