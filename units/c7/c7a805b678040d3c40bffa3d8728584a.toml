en = '''
- <<mstandard,**M**>> Integer multiplication and division.
- <<chap:a,**A**>> Atomic instructions.
- <<single-float,**F**>> Single-precision floating-point instructions.
- <<chap:d,**D**>> Double-precision floating-point instructions.
- <<compressed,**C**>> Compressed instructions.
- <<bits,**B**>> Bit-manipulation instructions.
- <<csrinsts,**Zicsr**>>  CSR instructions.  These are implied by presence of F.
- <<zicntr,**Zicntr**>> Base counters and timers.
- <<zihpm,**Zihpm**>> Hardware performance counters.
- <<ziccif,**Ziccif**>> Main memory regions with both the cacheability and
  coherence PMAs must support instruction fetch, and any instruction
  fetches of naturally aligned power-of-2 sizes up to min(ILEN,XLEN)
  (i.e., 32 bits for RVA23) are atomic.
- <<ziccrse,**Ziccrse**>> Main memory regions with both the cacheability and
  coherence PMAs must support RsrvEventual.
- <<ziccamoa,**Ziccamoa**>> Main memory regions with both the cacheability and
  coherence PMAs must support all atomics in the Zaamo extension.
- <<zicclsm,**Zicclsm**>> Misaligned loads and stores to main memory regions
  with both the cacheability and coherence PMAs must be supported.
- <<za64rs,**Za64rs**>> Reservation sets are contiguous, naturally aligned, and
  a maximum of 64 bytes.
- <<zihintpause,**Zihintpause**>> Pause hint.
- <<zic64b,**Zic64b**>> Cache blocks must be 64 bytes in size, naturally aligned
  in the address space.
- <<cmo,**Zicbom**>> Cache-block management instructions.
- <<cmo,**Zicbop**>> Cache-block prefetch instructions.
- <<cmo,**Zicboz**>> Cache-Block Zero Instructions.
- <<zfhmin,**Zfhmin**>> Half-precision floating-point.
- <<zkt,**Zkt**>> Data-independent execution latency.'''
zh = '''
- <<mstandard,**M**>> 整数乘法和除法。
- <<chap:a,**A**>> 原子指令。
- <<single-float,**F**>> 单精度浮点指令。
- <<chap:d,**D**>> 双精度浮点指令。
- <<compressed,**C**>> 压缩指令。
- <<bits,**B**>> 位操作指令。
- <<csrinsts,**Zicsr**>>  CSR 指令。这些由 F 的存在隐含。
- <<zicntr,**Zicntr**>> 基础计数器和定时器。
- <<zihpm,**Zihpm**>> 硬件性能计数器。
- <<ziccif,**Ziccif**>> 同时具有可缓存性和一致性 PMA 的主内存区域必须支持指令取指，并且任何自然对齐的、大小不超过 min(ILEN,XLEN)（即 RVA23 中为 32 位）的 2 的幂次大小的指令取指都是原子的。
- <<ziccrse,**Ziccrse**>> 同时具有可缓存性和一致性 PMA 的主内存区域必须支持 RsrvEventual。
- <<ziccamoa,**Ziccamoa**>> 同时具有可缓存性和一致性 PMA 的主内存区域必须支持 Zaamo 扩展中的所有原子操作。
- <<zicclsm,**Zicclsm**>> 必须支持对同时具有可缓存性和一致性 PMA 的主内存区域进行非对齐加载和存储。
- <<za64rs,**Za64rs**>> 预留集是连续的、自然对齐的，且最大为 64 字节。
- <<zihintpause,**Zihintpause**>> 暂停提示。
- <<zic64b,**Zic64b**>> 缓存块大小必须为 64 字节，且在地址空间中自然对齐。
- <<cmo,**Zicbom**>> 缓存块管理指令。
- <<cmo,**Zicbop**>> 缓存块预取指令。
- <<cmo,**Zicboz**>> 缓存块清零指令。
- <<zfhmin,**Zfhmin**>> 半精度浮点。
- <<zkt,**Zkt**>> 数据无关执行延迟。'''
