en = '''
Just as for AMOs in the A extension, [#norm:Zacas_amocas_rs1_addr_alignment]#`AMOCAS.W/D/Q` requires that the address
held in `rs1` be naturally aligned to the size of the operand (i.e., 16-byte
aligned for _quadwords_, eight-byte aligned for _doublewords_, and four-byte
aligned for _words_).# And the same exception options apply if the address
is not naturally aligned.'''
zh = '''
正如 A 扩展中的 AMO 一样，[#norm:Zacas_amocas_rs1_addr_alignment]##`AMOCAS.W/D/Q` 要求 `rs1` 中持有的地址按操作数大小自然对齐（即，__四字__为 16 字节对齐，__双字__为八字节对齐，__字__为四字节对齐）。## 若地址不是自然对齐，则适用同样的异常选项。'''
