en = '''
The assembly _offset_ operand may be omitted. If it isn't then any expression
that computes the offset shall evaluate to zero.'''
zh = '''
汇编 _offset_ 操作数可以省略。如果不省略，则任何计算该偏移的表达式都应求值为零。'''
