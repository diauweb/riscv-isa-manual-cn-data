en = '''
[#norm:pmp_granularity_param]#The granularity of PMP access control settings are platform-specific,
but the standard PMP encoding supports regions as small as four bytes.#
[#norm:pmp_mmode_only_regions]#Certain regions’ privileges can be hardwired—for example, some regions
might only ever be visible in machine mode but in no lower-privilege
layers.#'''
