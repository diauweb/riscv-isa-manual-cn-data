translatable = true
status = "machine"
en = '''
[#norm:trap_del_S-mode]#When a trap is delegated to S-mode#,
[#norm:trap_del_S_mode_op]#the `scause` register is written
with the trap cause; the `sepc` register is written with the virtual
address of the instruction that took the trap; the `stval` register is
written with an exception-specific datum; the SPP field of `mstatus` is
written with the active privilege mode at the time of the trap; the SPIE
field of `mstatus` is written with the value of the SIE field at the
time of the trap; and the SIE field of `mstatus` is cleared.#
[#norm:trap_del_S_mode_no_M_mode]#The `mcause`, `mepc`, and `mtval` registers and the MPP and MPIE fields of
`mstatus` are not written.#'''
zh = '''
[#norm:trap_del_S-mode]##当陷阱被委托给 S 模式时##，
[#norm:trap_del_S_mode_op]##`scause` 寄存器被写入陷阱原因；`sepc` 寄存器被写入发生陷阱的指令的虚拟地址；`stval` 寄存器被写入异常特定的数据；`mstatus` 的 SPP 字段被写入陷阱发生时的活动特权模式；`mstatus` 的 SPIE 字段被写入陷阱发生时 SIE 字段的值；且 `mstatus` 的 SIE 字段被清零。##
[#norm:trap_del_S_mode_no_M_mode]##`mcause`、`mepc` 和 `mtval` 寄存器以及 `mstatus` 的 MPP 和 MPIE 字段不被写入。##'''
