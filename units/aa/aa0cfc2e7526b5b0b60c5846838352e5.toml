en = '''
[#norm:vslidedown_op_src]#The start index (_OFFSET_) for the source can be either specified
using an unsigned integer in the `x` register specified by `rs1`, or a
5-bit immediate, zero-extended to XLEN bits.
If XLEN > SEW, _OFFSET_ is _not_ truncated to SEW bits.#'''
zh = '''
[#norm:vslidedown_op_src]#源的起始索引（_OFFSET_）可使用 `rs1` 指定的 `x` 寄存器中的无符号整数指定，或使用零扩展到 XLEN 位的 5 位立即数指定。如果 XLEN > SEW，则 _OFFSET_ _不_ 截断到 SEW 位。#'''
