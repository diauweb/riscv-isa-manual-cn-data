en = '''
The ext:zcmp[] extension adds instructions that substantially reduce the
static code size of procedure prologues and epilogues.
The instructions it adds are collectively referred to as insn:push[]/insn:pop[]:'''
zh = '''
ext:zcmp[] 扩展增加了可大幅减小过程序言和尾声静态代码大小的指令。它所增加的指令统称为 insn:push[]/insn:pop[]：'''
