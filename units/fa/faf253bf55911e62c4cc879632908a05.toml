en = '''
[NOTE]
====
Instructions that cause synchronous exceptions, including ECALL and
EBREAK, are not considered to retire and hence do not increment the
`instret` CSR.
===='''
zh = '''
[NOTE]
====
导致同步异常的指令（包括 ECALL 和 EBREAK）不被视为退休，因此不会使 `instret` CSR 递增。
===='''
