en = '''
Bits `mip`.MSIP and `mie`.MSIE are the interrupt-pending and
interrupt-enable bits for machine-level software interrupts. MSIP is
read-only in `mip`, and is written by accesses to memory-mapped control
registers, which are used to provide machine-level
interprocessor interrupts.
A hart's memory-mapped `msip` register is a 32-bit read/write register,
where bits 31--1 read as zero and bit 0 contains the MSIP bit.
When the memory-mapped `msip` register changes, it is guaranteed to be
reflected in `mip`.MSIP eventually, but not necessarily immediately.
If a system has only one hart, or
if a platform standard supports the delivery of machine-level
interprocessor interrupts through external interrupts (MEI) instead,
then `mip`.MSIP and `mie`.MSIE may both be read-only zeros.'''
zh = '''
位 `mip`.MSIP 和 `mie`.MSIE 是机器级软件中断的中断挂起位和中断使能位。MSIP 在 `mip` 中为只读，通过对内存映射控制寄存器的访问来写入，这些寄存器用于提供机器级处理器间中断。硬件线程的内存映射 `msip` 寄存器是一个 32 位读/写寄存器，其中位 31--1 读取为零，位 0 包含 MSIP 位。当内存映射的 `msip` 寄存器发生变化时，保证最终会反映在 `mip`.MSIP 中，但不一定立即反映。如果系统只有一个硬件线程，或者平台标准支持通过外部中断（MEI）递送机器级处理器间中断，则 `mip`.MSIP 和 `mie`.MSIE 可以都为只读零。'''
