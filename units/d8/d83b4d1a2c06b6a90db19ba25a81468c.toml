en = '''
If the ext:d[] extension is implemented, insn:fround.d[] and insn:froundnx.d[] instructions
are analogously defined to operate on double-precision numbers. They are
encoded like insn:fcvt.d.s[], but with _rs2_=4 and 5, respectively,'''
zh = '''
如果实现了 ext:d[] 扩展，insn:fround.d[] 和 insn:froundnx.d[] 指令类似地定义为对双精度数进行操作。它们的编码与 insn:fcvt.d.s[] 类似，但 _rs2_ 分别为 4 和 5，'''
