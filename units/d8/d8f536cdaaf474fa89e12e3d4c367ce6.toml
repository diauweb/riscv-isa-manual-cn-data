en = '''
[#norm:ecall_op1]#The `ECALL` instruction is used to make a service request to the execution environment.#
The `EEI` will define how parameters for the service request
are passed, but usually these will be in defined locations in the
integer register file.'''
zh = '''
[#norm:ecall_op1]##`ECALL` 指令用于向执行环境发出服务请求。##
`EEI` 将定义服务请求的参数如何传递，但通常这些参数位于整数寄存器堆中的已定义位置。'''
