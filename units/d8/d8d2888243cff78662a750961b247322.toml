en = '''
To avoid an infinite loop if the exception handler does not address the
cause of the exception, the debugger must execute no more than a single
extra step.'''
zh = '''
如果异常处理程序未处理异常原因，为避免无限循环，调试器必须执行不超过一次额外单步。'''
