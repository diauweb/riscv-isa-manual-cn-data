en = '''
If this register is implemented then bits corresponding to implemented
progbuf and data registers must be writable.  Other bits must be
hard-wired to 0.'''
zh = '''
若实现了此寄存器，则对应于已实现 progbuf 和 data 寄存器的位必须可写。其他位必须硬连线为 0。'''
