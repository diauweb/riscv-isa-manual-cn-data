en = '''
While the shift and add instructions are limited to a maximum left shift of 3, the insn:slli[] instruction from the base ISA can be used to perform similar shifts for indexing into arrays of wider elements. The insn:slli.uw[] added in this extension can be used when the index is to be interpreted as an unsigned word.'''
zh = '''
尽管移位加指令最多只能左移 3 位，但基础 ISA 中的 insn:slli[] 指令可用于执行类似移位，以索引更宽元素的数组。当索引要解释为无符号字时，可使用本扩展中新增的 insn:slli.uw[]。'''
