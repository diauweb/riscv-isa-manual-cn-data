en = '''
Widened scalar values, e.g., input and output to a widening reduction
operation, are held in the first element of a vector register and
have EMUL=1.'''
zh = '''
加宽的标量值（例如，加宽归约操作的输入和输出）保存在向量寄存器的第一个元素中，并具有 EMUL=1。'''
