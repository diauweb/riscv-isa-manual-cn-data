en = '''
The dynamic loader should activate the use of ext:zicfiss[] extension for an
application only if all executables (the application and the dependent
dynamically-linked libraries) used by that application use the ext:zicfiss[]
extension.'''
zh = '''
动态加载器应仅当应用程序使用的所有可执行文件（该应用程序及依赖的动态链接库）都使用 ext:zicfiss[] 扩展时，才为该应用程序激活 ext:zicfiss[] 扩展的使用。'''
