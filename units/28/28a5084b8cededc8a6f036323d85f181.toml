en = '''
The vector extension supports unit-stride, constant-stride, and
indexed (scatter/gather) addressing modes.  Vector load/store base
registers and strides are taken from the GPR `x` registers.'''
zh = '''
向量扩展支持单位步长、恒定步长和索引（分散/收集）寻址模式。向量加载/存储基址寄存器和步长取自 GPR `x` 寄存器。'''
