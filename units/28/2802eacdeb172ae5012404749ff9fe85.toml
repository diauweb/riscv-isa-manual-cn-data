en = '''
If the instruction being stepped over would normally stall the hart,
then instead the instruction is treated as a `nop`. This includes `wfi`,
`wrs.sto`, and `wrs.nto`.'''
zh = '''
若所单步跨过的指令通常会使硬件线程停顿，则该指令将被视为 `nop`。这包括 `wfi`、`wrs.sto` 和 `wrs.nto`。'''
