en = '''
(((floating point, convert and move)))
Floating-point-to-integer and integer-to-floating-point conversion
instructions are encoded in the OP-FP major opcode space. [#norm:fcvt-w-d_fcvt-l-d_op]#insn:fcvt.w.d[] or
insn:fcvt.l.d[] converts a double-precision floating-point number in
floating-point register _rs1_ to a signed 32-bit or 64-bit integer,
respectively, in integer register _rd_#. [#norm:fcvt-d-w_fcvt-d-l_op]#insn:fcvt.d.w[] or insn:fcvt.d.l[] converts a
32-bit or 64-bit signed integer, respectively, in integer register _rs1_
into a double-precision floating-point number in floating-point register
_rd_#. [#norm:fcvt-wu-d_fcvt-lu-d_fcvt-d-wu_fcvt-d-lu_op]#insn:fcvt.wu.d[], insn:fcvt.lu.d[], insn:fcvt.d.wu[] and insn:fcvt.d.lu[] variants convert to
or from unsigned integer values#. [#norm:fcvt-w-d_fcvt-wu-d_sign_ext]#For RV64, insn:fcvt.w.d[] and insn:fcvt.wu.d[] sign-extend the
32-bit result#. [#norm:fcvt_long_double_rv64_only]#insn:fcvt.l.d[], fcvt.lu.d[], fcvt.d.l[] and fcvt.d.lu[] are RV64-only instructions.#
[#norm:fcvt_int_double_valid_input]#The range of valid inputs for insn:fcvt.w.d[], insn:fcvt.wu.d[], insn:fcvt.l.d[] and insn:fcvt.lu.d[] and the behavior of these instructions for invalid
inputs are the same as for insn:fcvt.w.s[], insn:fcvt.wu.s[], insn:fcvt.l.s[] and insn:fcvt.lu.s[]#.
All floating-point to integer and integer to floating-point conversion
instructions round according to the _rm_ field. Note that insn:fcvt.d.w[] and insn:fcvt.d.wu[] always
produce an exact result and are unaffected by rounding mode.'''
zh = '''
(((floating point, convert and move)))
浮点到整数以及整数到浮点的转换指令编码在 OP-FP 主操作码空间中。[#norm:fcvt-w-d_fcvt-l-d_op]#insn:fcvt.w.d[] 或 insn:fcvt.l.d[] 分别将浮点寄存器 _rs1_ 中的双精度浮点数转换为整数寄存器 _rd_ 中的有符号 32 位或 64 位整数#。[#norm:fcvt-d-w_fcvt-d-l_op]#insn:fcvt.d.w[] 或 insn:fcvt.d.l[] 分别将整数寄存器 _rs1_ 中的 32 位或 64 位有符号整数转换为浮点寄存器 _rd_ 中的双精度浮点数#。[#norm:fcvt-wu-d_fcvt-lu-d_fcvt-d-wu_fcvt-d-lu_op]#insn:fcvt.wu.d[]、insn:fcvt.lu.d[]、insn:fcvt.d.wu[] 和 insn:fcvt.d.lu[] 变体用于与无符号整数值相互转换#。[#norm:fcvt-w-d_fcvt-wu-d_sign_ext]#对于 RV64，insn:fcvt.w.d[] 和 insn:fcvt.wu.d[] 对 32 位结果进行符号扩展#。[#norm:fcvt_long_double_rv64_only]#insn:fcvt.l.d[]、fcvt.lu.d[]、fcvt.d.l[] 和 fcvt.d.lu[] 是仅适用于 RV64 的指令。#
[#norm:fcvt_int_double_valid_input]#insn:fcvt.w.d[]、insn:fcvt.wu.d[]、insn:fcvt.l.d[] 和 insn:fcvt.lu.d[] 的有效输入范围以及这些指令对无效输入的行为与 insn:fcvt.w.s[]、insn:fcvt.wu.s[]、insn:fcvt.l.s[] 和 insn:fcvt.lu.s[] 相同#。
所有浮点到整数和整数到浮点转换指令都根据 _rm_ 字段进行舍入。注意，insn:fcvt.d.w[] 和 insn:fcvt.d.wu[] 总是产生精确结果，且不受舍入模式影响。'''
