en = '''
The csr::[mxr] and csr::[sum] mechanisms only affect the interpretation of permissions
encoded in page-table entries. In particular, they have no impact on
whether access-fault exceptions are raised due to PMAs or PMP.'''
zh = '''
csr::[mxr] 和 csr::[sum] 机制仅影响对页表项中编码的权限的解释。特别是，它们对是否因 PMA 或 PMP 而引发访问错误异常没有影响。'''
