en = '''
[NOTE]
====
Software can use the insn:pause[] instruction to reduce energy consumption
while executing spin-wait code sequences. Multithreaded cores might
temporarily relinquish execution resources to other harts when insn:pause[] is
executed. It is recommended that a insn:pause[] instruction generally be
included in the code sequence for a spin-wait loop.
(((PAUSE, energy consumption)))

The duration of a insn:pause[] instruction's effect may vary significantly
within and among implementations. In typical implementations this
duration should be much less than the time to perform a context switch,
probably more on the rough order of an on-chip cache miss latency or a
cacheless access to main memory.
(((PAUSE, duration)))

A series of insn:pause[] instructions can be used to create a cumulative delay
loosely proportional to the number of insn:pause[] instructions. In spin-wait
loops in portable code, however, only one insn:pause[] instruction should be
used before re-evaluating loop conditions, else the hart might stall
longer than optimal on some implementations, degrading system
performance.
===='''
zh = '''
[NOTE]
====
软件可以使用 insn:pause[] 指令在执行自旋等待代码序列时降低能耗。当执行 insn:pause[] 时，多线程核心可能会暂时将执行资源让给其他硬件线程。建议在自旋等待循环的代码序列中通常包含一条 insn:pause[] 指令。
(((PAUSE, energy consumption)))

insn:pause[] 指令作用的持续时间在实现内部和不同实现之间可能有显著差异。在典型实现中，该持续时间应远小于执行上下文切换的时间，大致上可能更接近片上缓存未命中延迟或无缓存访问主存的量级。
(((PAUSE, duration)))

一系列 insn:pause[] 指令可用于创建与 insn:pause[] 指令数量大致成比例的累积延迟。然而，在可移植代码的自旋等待循环中，在重新评估循环条件之前只应使用一条 insn:pause[] 指令，否则在某些实现上硬件线程可能会停顿过久，从而降低系统性能。
===='''
