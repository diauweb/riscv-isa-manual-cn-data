en = '''
[#norm:Ziccid_fetch_global_order]#An instruction fetch is a memory read operation that appears in the global
memory order, in program order with respect to other instruction fetches
from the same hart.#
[#norm:Ziccid_fetch_value]#For each instruction byte fetched from memory, memory
supplies the value written by the most recent store that precedes the read in
global memory order.#'''
zh = '''
[#norm:Ziccid_fetch_global_order]##指令取指是一种出现在全局内存顺序中的内存读操作，并且相对于来自同一硬件线程的其他指令取指按程序顺序出现。##
[#norm:Ziccid_fetch_value]##对于从内存取指的每个指令字节，内存提供在全局内存顺序中先于该读取的、最近一次存储所写入的值。##'''
