en = '''
[#norm:ctr_ccounter_impl]#An implementation that supports cycle counting must implement CCV and all
CCM bits, but may implement 0..4 exponent bits in CCE.# [#norm:ctr_ccounter_cce_rdonly0]#Unimplemented CCE
bits are read-only 0.# For implementations that support transfer type
filtering, it is recommended to implement at least 3 exponent bits. This
allows capturing the full latency of most functions, when recording only
calls and returns.'''
zh = '''
[#norm:ctr_ccounter_impl]#支持周期计数的实现必须实现 CCV 和所有
CCM 位，但可以在 CCE 中实现 0..4 个指数位。# [#norm:ctr_ccounter_cce_rdonly0]#未实现的 CCE
位为只读 0。# 对于支持转移类型
过滤的实现，建议至少实现 3 个指数位。当仅记录
调用和返回时，这可以捕获大多数函数的完整延迟。'''
