kind = "paragraph"
translatable = true
status = "machine"
en = '''
ext:zicfiss[] does not use all encodings of insn:mop.rr.7[] or insn:mop.r.28[]. When a
insn:mop.rr.7[] or insn:mop.r.28[] encoding is not used by the ext:zicfiss[] extension, the
corresponding instruction adheres to its ext:zimop[]-defined behavior, unless
redefined by another extension.'''
zh = '''
ext:zicfiss[] 不使用 insn:mop.rr.7[] 或 insn:mop.r.28[] 的所有编码。当某个 insn:mop.rr.7[] 或 insn:mop.r.28[] 编码未被 ext:zicfiss[] 扩展使用时，相应指令遵循其由 ext:zimop[] 定义的行为，除非被另一个扩展重新定义。'''
