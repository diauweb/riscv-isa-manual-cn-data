en = '''
[#norm:mstatus_sxl_acc_mxlen64]#When MXLEN=64, if S-mode is not supported, then SXL is read-only zero.
Otherwise, it is a *WARL* field that encodes the current value of SXLEN.#
In particular, [#norm:mstatus_sxl_rdonly_mxlen64]#an implementation may make SXL be a read-only field whose
value always ensures that SXLEN=MXLEN.#'''
zh = '''
[#norm:mstatus_sxl_acc_mxlen64]##当 MXLEN=64 时，若不支持 S 模式，则 SXL 为只读零。否则，它是一个编码 SXLEN 当前值的 *WARL* 字段。##特别是，[#norm:mstatus_sxl_rdonly_mxlen64]##实现可使 SXL 成为只读字段，其值始终确保 SXLEN=MXLEN。##'''
