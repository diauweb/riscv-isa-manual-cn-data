en = '''
insn:fmv.x.q[] and insn:fmv.q.x[] instructions are not provided in RV32 or RV64, so
quad-precision bit patterns must be moved to the integer registers via
memory.'''
zh = '''
RV32 或 RV64 中未提供 insn:fmv.x.q[] 和 insn:fmv.q.x[] 指令，因此四精度位模式必须通过内存移动到整数寄存器。'''
