en = '''
This chapter describes the two RISC-V memory consistency models:
<<memorymodel,RVWMO>>, the base weakly ordered model, and <<ztso,RVTSO>>,
a more strongly ordered model enabled via the Ztso standard extension.'''
zh = '''
本章描述两种 RISC-V 内存一致性模型：
<<memorymodel,RVWMO>>（基础弱排序模型）和 <<ztso,RVTSO>>（通过 Ztso 标准扩展启用的更强排序模型）。'''
