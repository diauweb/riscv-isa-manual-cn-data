zh = '''
====

RVWMO 内存模型尊重同一硬件线程中从加载到后续内存操作的依赖。Alpha 内存模型因选择__不__强制执行此类依赖的排序而闻名，但大多数现代硬件和软件内存模型认为允许依赖指令重排过于混乱和反直觉。此外，现代代码有时有意使用此类依赖作为特别轻量级的排序强制机制。

<<mem-dependencies>> 中的术语如下工作。当写入每个目的寄存器的值是源寄存器的函数时，称指令携带从源寄存器到目的寄存器的依赖。对于大多数指令，这意味着目的寄存器携带来自所有源寄存器的依赖。然而，有几个值得注意的例外。对于内存指令，写入目的寄存器的值最终来自内存系统而不是直接来自源寄存器，因此这打破了从源寄存器携带的依赖链。对于无条件跳转，写入目的寄存器的值来自当前 `pc`（内存模型从不将其视为源寄存器），因此同样，JALR（唯一带有源寄存器的跳转）不携带从 _rs1_ 到 _rd_ 的依赖。


[[fflags]]
.(c) 通过 fflags 对 (a) 和 (b) 都具有语法依赖，fflags 是 (a) 和 (b) 都隐式累积到的目的寄存器
[.text-center,source%linenums,asm]
----
(a) fadd f3,f1,f2
(b) fadd f6,f4,f5
(c) csrrs a0,fflags,x0
----

累积到目的寄存器而不是写入目的寄存器的概念反映了 `fflags` 等 CSR 的行为。特别地，对寄存器的累积不会破坏先前对该寄存器的任何写入或累积。例如，在 <<fflags>> 中，(c) 对 (a) 和 (b) 都具有语法依赖。

与其他现代内存模型一样，RVWMO 内存模型使用语法依赖而不是语义依赖。换句话说，此定义取决于不同指令所访问寄存器的身份，而不是这些寄存器的实际内容。这意味着即使计算看起来可以被 `optimized away`，也必须强制执行地址、控制或数据依赖。这一选择确保 RVWMO 与使用这些虚假语法依赖作为轻量级排序机制的代码保持兼容。

[[address]]
.语法地址依赖
[.text-center, source%linenums, asm]
----
ld a1,0(s0)
xor a2,a1,a1
add s1,s1,a2
ld a5,0(s1)
----

例如，在 <<address>> 中，从第一条指令生成的内存操作到最后一条指令生成的内存操作存在语法地址依赖，即使 `a1` XOR `a1` 为零，因而对第二个加载所访问的地址没有影响。

使用依赖作为轻量级同步机制的好处是，排序强制要求仅限于所讨论的两条特定指令。其他非依赖指令可以由激进的实现自由重排。一种替代方案是使用加载-获取，但这将强制第一个加载相对于__所有__后续指令排序。另一种是使用 FENCE R,R，但这将包括所有先前和所有后续加载，使此选项更昂贵。

[[control1]]
.语法控制依赖
[.text-center, source%linenums, asm]
----
lw x1,0(x2)
bne x1,x0,next
sw x3,0(x4)
next: sw x5,0(x6)
----

控制依赖与地址和数据依赖的不同之处在于，控制依赖总是扩展到程序顺序中原始目标之后的所有指令。考虑 <<control1>>，`next` 处的指令将始终执行，但最后一条指令生成的内存操作仍然具有来自第一条指令生成的内存操作的控制依赖。

[[control2]]
.另一种语法控制依赖
[.text-center,source%linenums,asm]
----
lw x1,0(x2)
bne x1,x0,next
next: sw x3,0(x4)
----

同样，考虑 <<control2>>。即使两个分支结果具有相同目标，从该片段中第一条指令生成的内存操作到最后一条指令生成的内存操作仍存在控制依赖。这个控制依赖定义比其他上下文中（例如 C++）可能看到的定义略强，但它符合文献中控制依赖的标准定义。

值得注意的是，PPO 规则 <<overlapping-ordering, 9-11>> 也有意设计为尊重源自成功存储条件指令输出的依赖。通常，SC 指令之后会跟一个条件分支，检查结果是否成功；这意味着从 SC 指令生成的存储操作到分支之后的任何内存操作将存在控制依赖。PPO 规则 <<ppo, 11>> 又意味着任何后续存储操作将在全局内存顺序中比由 SC 生成的存储操作更晚出现。然而，由于控制、地址和数据依赖是基于内存操作定义的，而不成功的 SC 不生成内存操作，因此不成功的 SC 与其依赖指令之间不强制任何顺序。此外，由于 SC 被定义为仅当 SC 成功时才携带从源寄存器到 _rd_ 的依赖，不成功的 SC 对全局内存顺序没有影响。

[[litmus_lb_lrsc]]
.LB litmus 测试的变体（禁止的结果）
[float="center",align="center",cols=".^1a,.^1a",frame="none",grid="none",options="noheader"]
|===
|
[%autowidth,cols="^,<,^,<",float="center",align="center"]
!===
4+!初始值：0(s0)=1；0(s2)=1
4+!
2+^!硬件线程 0 2+^!硬件线程 1
!(a) !ld a0,0(s0) !(e) !ld a3,0(s2)
!(b) !lr a1,0(s1) !(f) !sd a3,0(s0)
!(c) !sc a2,a0,0(s1) ! !
!(d) !sd a2,0(s2) ! !
4+!结果：`a0=0`、`a3=0`
!===
|
!===
//a! graphviz::images/graphviz/litmus_lb_lrsc.txt[]
a! image::graphviz/litmus_lb_lrsc.png[]
!===
|===

此外，选择尊重源自存储条件指令的依赖，确保某些类似“凭空产生”的行为将被防止。考虑 <<litmus_lb_lrsc>>。假设某个假设实现偶尔会提前保证存储条件操作将成功。在这种情况下，(c) 可能提前向 `a2` 返回 0（在实际执行之前），从而允许序列 (d)、(e)、(f)、(a)，然后 (b) 执行，然后 (c) 可能只在那时才（成功）执行。这将意味着 (c) 将自己的成功值写入 `0(s1)`！幸运的是，这种情况和其他类似情况被以下事实防止：RVWMO 尊重源自成功 SC 指令所生成存储的依赖。

我们还注意到，指令之间的语法依赖只有在采取语法地址、控制和/或数据依赖形式时才有强制力。例如：两条 `F` 指令之间通过 <<source-dest-regs>> 中某个 `accumulating CSRs` 形成的语法依赖，__不__意味着这两条 `F` 指令必须按顺序执行。此类依赖只会最终为后续访问相关 CSR 标志的 CSR 指令建立来自两条 `F` 指令的依赖。

