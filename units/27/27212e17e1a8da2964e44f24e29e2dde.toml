zh = '''
====

RVWMO 内存模型遵守同一硬件线程中从加载到较晚内存操作的依赖。Alpha 内存模型以选择__不__强制此类依赖的排序而闻名，但大多数现代硬件和软件内存模型认为允许有依赖的指令重排序过于令人困惑和反直觉。此外，现代代码有时有意使用此类依赖作为一种特别轻量级的排序强制机制。

<<mem-dependencies>> 中的术语如下所述。当写入每个目标寄存器的值是源寄存器的函数时，称指令从其源寄存器向目标寄存器携带依赖。对大多数指令而言，这意味着目标寄存器携带来自所有源寄存器的依赖。然而，有几个值得注意的例外。对于内存指令，写入目标寄存器的值最终来自内存系统而非直接来自源寄存器，因而这打断了从源寄存器携带的依赖链。对于无条件跳转，写入目标寄存器的值来自当前 `pc`（内存模型从不将其视为源寄存器），因此同样，JALR（唯一带源寄存器的跳转）不携带从 __rs1__ 到 __rd__ 的依赖。


[[fflags]]
.(c) 通过 fflags 对 (a) 和 (b) 都具有语法依赖，fflags 是 (a) 和 (b) 都隐式累积到的目标寄存器
[.text-center,source%linenums,asm]
----
(a) fadd f3,f1,f2
(b) fadd f6,f4,f5
(c) csrrs a0,fflags,x0
----

累积到目标寄存器而非写入目标寄存器的概念，反映了诸如 `fflags` 之类 CSR 的行为。特别地，对寄存器的累积不会破坏此前对同一寄存器的任何写入或累积。例如，在 <<fflags>> 中，(c) 对 (a) 和 (b) 都具有语法依赖。

与其他现代内存模型一样，RVWMO 内存模型使用语法依赖而非语义依赖。换言之，该定义取决于不同指令所访问寄存器的标识，而不是这些寄存器的实际内容。这意味着即使该计算看似可被 `optimized away`，也必须强制地址、控制或数据依赖。这一选择确保 RVWMO 仍与将这些虚假语法依赖用作轻量级排序机制的代码兼容。

[[address]]
.一个语法地址依赖
[.text-center, source%linenums, asm]
----
ld a1,0(s0)
xor a2,a1,a1
add s1,s1,a2
ld a5,0(s1)
----

例如，在 <<address>> 中，从第一条指令生成的内存操作到最后一条指令生成的内存操作存在语法地址依赖，即使 `a1` XOR `a1` 为零，因而对第二次加载所访问的地址没有影响。

将依赖用作轻量级同步机制的好处是，排序强制要求仅限于所涉及的特定两条指令。其他非依赖指令可被激进的实现自由重排序。一种替代方案是使用加载-获取，但这将强制第一次加载相对于__所有__后续指令的排序。另一种是使用 FENCE R,R，但这将包括所有先前和所有后续加载，使该选项更昂贵。

[[control1]]
.一个语法控制依赖
[.text-center, source%linenums, asm]
----
lw x1,0(x2)
bne x1,x0,next
sw x3,0(x4)
next: sw x5,0(x6)
----

控制依赖的行为与地址依赖和数据依赖不同，因为控制依赖总是延伸到程序顺序中原始目标之后的所有指令。考虑 <<control1>>，`next` 处的指令将总是执行，但由最后一条指令生成的内存操作仍然对由第一条指令生成的内存操作具有控制依赖。

[[control2]]
.另一个语法控制依赖
[.text-center,source%linenums,asm]
----
lw x1,0(x2)
bne x1,x0,next
next: sw x3,0(x4)
----

同样，考虑 <<control2>>。
即使两个分支结果具有相同的目标，从本片段中第一条指令生成的内存操作到最后一条指令生成的内存操作仍存在控制依赖。这一控制依赖定义比其他语境（例如 C++）中所见略强，但它符合文献中控制依赖的标准定义。

值得注意的是，PPO 规则 <<overlapping-ordering, 9-11>> 也有意设计为尊重源自成功条件存储指令输出的依赖。通常，SC 指令之后会跟一条条件分支，检查结果是否成功；这意味着从 SC 指令生成的存储操作到分支之后的任何内存操作都将存在控制依赖。PPO 规则 <<ppo, 11>> 进而意味着任何后续存储操作在全局内存顺序中将比 SC 指令生成的存储操作出现得更晚。然而，由于控制、地址和数据依赖是在内存操作上定义的，且不成功的 SC 不生成内存操作，因此不成功的 SC 与其依赖指令之间不强制任何顺序。此外，由于 SC 被定义为仅当 SC 成功时才从源寄存器向 __rd__ 携带依赖，不成功的 SC 对全局内存顺序没有影响。

[[litmus_lb_lrsc]]
.LB litmus 测试的一个变体（禁止的结果）
[float="center",align="center",cols=".^1a,.^1a",frame="none",grid="none",options="noheader"]
|===
|
[%autowidth,cols="^,<,^,<",float="center",align="center"]
!===
4+!初始值：0(s0)=1；0(s2)=1
4+!
2+^!硬件线程 0 2+^!硬件线程 1
!(a) !ld a0,0(s0) !(e) !ld a3,0(s2)
!(b) !lr a1,0(s1) !(f) !sd a3,0(s0)
!(c) !sc a2,a0,0(s1) ! !
!(d) !sd a2,0(s2) ! !
4+!结果：`a0=0`、`a3=0`
!===
|
!===
//a! graphviz::images/graphviz/litmus_lb_lrsc.txt[]
a! image::graphviz/litmus_lb_lrsc.png[]
!===
|===

此外，选择尊重源自条件存储指令的依赖可确保某些类凭空产生行为被阻止。考虑 <<litmus_lb_lrsc>>。假设某假想实现偶尔会提前保证某个条件存储操作将成功。在此情况下，(c) 可能提前（在实际执行之前）向 `a2` 返回 0，从而允许序列 (d)、(e)、(f)、(a) 然后 (b) 执行，之后 (c) 可能仅在那时才（成功）执行。这将意味着 (c) 将其自身的成功值写入 `0(s1)`！幸运的是，这一情形及其他类似情形被如下事实阻止：RVWMO 尊重源自成功 SC 指令所生成存储的依赖。

我们还指出，指令之间的语法依赖仅当采取语法地址、控制和/或数据依赖的形式时才具有效力。例如：通过 <<source-dest-regs>> 中某个 `accumulating CSRs` 在两个 `F` 指令之间形成的语法依赖，__不__意味着两条 `F` 指令必须按序执行。此类依赖只会最终在稍后建立从两条 `F` 指令到访问相关 CSR 标志的较晚 CSR 指令的依赖。

