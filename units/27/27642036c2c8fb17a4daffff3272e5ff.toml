en = '''
The V extension includes the insn:vmulh[] integer multiply
variants that return the high half of the product (insn:vmulh.vv[],
insn:vmulh.vx[], insn:vmulhu.vv[], insn:vmulhu.vx[], insn:vmulhsu.vv[],
insn:vmulhsu.vx[])  with EEW=64.'''
zh = '''
V 扩展包含 EEW=64 时返回乘积高半部分的 insn:vmulh[] 整数乘法变体（insn:vmulh.vv[]、insn:vmulh.vx[]、insn:vmulhu.vv[]、insn:vmulhu.vx[]、insn:vmulhsu.vv[]、insn:vmulhsu.vx[]）。'''
