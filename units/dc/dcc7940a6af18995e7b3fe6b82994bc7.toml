en = '''
Each bitmanip extension includes a group of several bitmanip instructions that have similar purposes and can often share the same logic. Some instructions are available in only one extension, while others are available in several.
The instructions have mnemonics and encodings that are independent of the extensions in which they appear.
Thus, when implementing extensions with overlapping instructions, there is no redundancy in logic or encoding.'''
zh = '''
每个位操作扩展都包含一组具有相似目的、且通常可以共享相同逻辑的位操作指令。有些指令仅在一种扩展中可用，而另一些则在多种扩展中可用。
这些指令具有独立于其所出现扩展的助记符和编码。
因此，在实现具有重叠指令的扩展时，逻辑或编码中不存在冗余。'''
