en = '''
. [#norm:mseccfg_mml_pmpcfg_L_op]#The meaning of `pmpcfg.L` changes:
  Instead of marking a rule as *locked* and
  *enforced* in all modes, it now marks a rule as *M-mode-only* when set and
  *S/U-mode-only* when unset. The formerly reserved encoding of `pmpcfg.RW=01`,
  and the encoding `pmpcfg.LRWX=1111`, now encode a *Shared-Region*.#          +
                                                                               +
  [#norm:mseccfg_mml_M_rule_op]#An _M-mode-only_ rule is *enforced* on accesses whose effective privilege
  mode is Machine and *denied* to accesses whose effective privilege mode is Supervisor
  or User. It also remains *locked* so that any further modifications to its
  associated configuration or address registers are ignored until a *PMP reset*,
  unless `mseccfg.RLB` is set.#                                                +
                                                                               +
  [#norm:mseccfg_mml_SorU_rule_op]#An _S/U-mode-only_ rule is *enforced* on accesses whose effective privilege
  mode is Supervisor or User and *denied* to accesses whose effective privilege
  mode is Machine.#                                                           +
                                                                               +
  [#norm:mseccfg_mml_shared_rule_op]#A _Shared-Region_ rule is *enforced* on all modes, with restrictions depending
  on the `pmpcfg.L` and `pmpcfg.X` bits:#                                      +
                                                                               +

  * [#norm:mseccfg_mml_shared_L0_op]#A _Shared-Region_ rule where `pmpcfg.L` is not set can be used for sharing
    data between M-mode and S/U-mode, so is not executable. M-mode has
    read/write access to that region, and S/U-mode has read access if `pmpcfg.X`
    is not set, or read/write access if `pmpcfg.X` is set.#
+
  * [#norm:mseccfg_mml_shared_L1_op]#A _Shared-Region_ rule where `pmpcfg.L` is set can be used for sharing code
    between M-mode and S/U-mode, so is not writable. Both M-mode and S/U-mode
    have execute access on the region, and M-mode also has read access if
    `pmpcfg.X` is set. The rule remains *locked* so that any further
    modifications to its associated configuration or address registers are
    ignored until a *PMP reset*, unless `mseccfg.RLB` is set.#
+
  * [#norm:mseccfg_mml_shared_LRWX_1111_op]#The encoding `pmpcfg.LRWX=1111` can be used for sharing data between M-mode
    and S/U mode, where both modes only have read-only access to the region. The
    rule remains *locked* so that any further modifications to its associated
    configuration or address registers are ignored until a *PMP reset*, unless
    `mseccfg.RLB` is set.#

. [#norm:mseccfg_mml_X_restrict]#Adding a rule with executable privileges that either is *M-mode-only* or a
  *locked* *Shared-Region* is not possible and such `pmpcfg` writes are
  ignored, leaving `pmpcfg` unchanged. This restriction can be temporarily
  lifted by setting `mseccfg.RLB`# e.g. during the boot process.

. [#norm:mseccfg_mml_exec_code]#Executing code with Machine mode privileges is only possible from memory
  regions with a matching *M-mode-only* rule or a *locked* *Shared-Region* rule
  with executable privileges. Executing code from a region without a matching
  rule or with a matching _S/U-mode-only_ rule is *denied*.#

. If `mseccfg.MML` is not set, the combination of `pmpcfg.RW=01` remains
  reserved for future standard use.'''
zh = '''
. [#norm:mseccfg_mml_pmpcfg_L_op]#`pmpcfg.L` 的含义发生变化：它不再将规则标记为在所有模式下**锁定**且**强制执行**，而是当置位时将规则标记为__仅 M 模式__，当清零时标记为__仅 S/U 模式__。原先保留的编码 `pmpcfg.RW=01` 以及编码 `pmpcfg.LRWX=1111` 现在编码一个__共享区域__。#          +
                                                                               +
  [#norm:mseccfg_mml_M_rule_op]#__仅 M 模式__规则对有效特权模式为机器模式的访问**强制执行**，对有效特权模式为监管模式或用户模式的访问**拒绝**。该规则还保持**锁定**，因此对其关联配置寄存器或地址寄存器的任何进一步修改都被忽略，直到发生 *PMP 复位*，除非设置了 `mseccfg.RLB`。#                                        +
                                                                               +
  [#norm:mseccfg_mml_SorU_rule_op]#__仅 S/U 模式__规则对有效特权模式为监管模式或用户模式的访问**强制执行**，对有效特权模式为机器模式的访问**拒绝**。#                                                   +
                                                                               +
  [#norm:mseccfg_mml_shared_rule_op]#__共享区域__规则在所有模式下**强制执行**，其限制取决于 `pmpcfg.L` 和 `pmpcfg.X` 位：#                                      +
                                                                               +

  * [#norm:mseccfg_mml_shared_L0_op]#`pmpcfg.L` 未置位的__共享区域__规则可用于在 M 模式与 S/U 模式之间共享数据，因此不可执行。M 模式对该区域具有读写访问权限；如果 `pmpcfg.X` 未置位，则 S/U 模式具有读访问权限，如果 `pmpcfg.X` 已置位，则具有读写访问权限。#
+
  * [#norm:mseccfg_mml_shared_L1_op]#`pmpcfg.L` 已置位的__共享区域__规则可用于在 M 模式与 S/U 模式之间共享代码，因此不可写。M 模式和 S/U 模式都对该区域具有执行访问权限；如果 `pmpcfg.X` 已置位，则 M 模式还具有读访问权限。该规则保持**锁定**，因此对其关联配置寄存器或地址寄存器的任何进一步修改都被忽略，直到发生 *PMP 复位*，除非设置了 `mseccfg.RLB`。#
+
  * [#norm:mseccfg_mml_shared_LRWX_1111_op]#编码 `pmpcfg.LRWX=1111` 可用于在 M 模式与 S/U 模式之间共享数据，两种模式对该区域都只有只读访问权限。该规则保持**锁定**，因此对其关联配置寄存器或地址寄存器的任何进一步修改都被忽略，直到发生 *PMP 复位*，除非设置了 `mseccfg.RLB`。#

. [#norm:mseccfg_mml_X_restrict]#添加具有可执行权限、且要么是**仅 M 模式**要么是**已锁定**的**共享区域**的规则是不可能的，此类 `pmpcfg` 写入被忽略，`pmpcfg` 保持不变。该限制可以通过设置 `mseccfg.RLB` 暂时解除#，例如在启动过程中。

. [#norm:mseccfg_mml_exec_code]#只有在具有匹配的**仅 M 模式**规则或具有可执行权限的**已锁定** **共享区域**规则的内存区域中，才可能以机器模式特权执行代码。从不具有匹配规则的区域或具有匹配的__仅 S/U 模式__规则的区域执行代码会被**拒绝**。#

. 如果未设置 `mseccfg.MML`，则 `pmpcfg.RW=01` 的组合仍保留供未来标准使用。'''
