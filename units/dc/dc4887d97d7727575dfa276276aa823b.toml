en = '''
[#norm:Ziccid_fetch_order]#Harts have two ordered operational stages: instruction fetch and execution.
Each hart has an instruction buffer of bounded capacity.
Instructions are fetched from memory in program order, then inserted into the
instruction buffer in program order.#'''
zh = '''
[#norm:Ziccid_fetch_order]#硬件线程具有两个有序的操作阶段：指令取指和执行。
每个硬件线程都有一个容量有界的指令缓冲。
指令按程序顺序从内存取指，然后按程序顺序插入指令缓冲。#'''
