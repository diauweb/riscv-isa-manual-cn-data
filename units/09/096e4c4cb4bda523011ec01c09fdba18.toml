en = '''
. Set {sbcs-sbbusy}.
. Perform a bus read from the new value of `sbaddress`.
. If the read succeeded and {sbcs-sbautoincrement} is set, increment `sbaddress`.
. Clear {sbcs-sbbusy}.'''
zh = '''
. 设置 {sbcs-sbbusy}。
. 从 `sbaddress` 的新值执行总线读取。
. 如果读取成功且 {sbcs-sbautoincrement} 置位，则递增 `sbaddress`。
. 清除 {sbcs-sbbusy}。'''
