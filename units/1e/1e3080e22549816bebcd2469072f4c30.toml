en = '''
[#norm:Zcmp_trap]#If a trap occurs during the sequence then _xEPC_ is updated with the PC of the instruction, _xTVAL_ (if not read-only-zero) updated with the bad address if it was an access fault and _xCAUSE_ updated with the type of trap.#'''
zh = '''
[#norm:Zcmp_trap]#若在该序列期间发生陷阱，则 _xEPC_ 更新为该指令的 PC，_xTVAL_（若非只读零）在发生访问故障时更新为出错地址，_xCAUSE_ 更新为陷阱类型。#'''
