位 `hip`.SGEIP 和 `hie`.SGEIE 是监管级（HS 级）客户机外部中断的中断挂起位和中断使能位。SGEIP 在 `hip` 中为只读，当且仅当 CSR `hgeip` 和 `hgeie` 的按位逻辑与在任何位上非零时为 1。（见 <<hgeinterruptregs>>。）

位 `hip`.VSEIP 和 `hie`.VSEIE 是 VS 级外部中断的中断挂起位和中断使能位。VSEIP 在 `hip` 中为只读，并且是以下中断源的逻辑或：

* `hvip` 的位 VSEIP；
* 由 `hstatus`.VGEIN 选择的 `hgeip` 的位；以及
* 导向 VS 级的任何其他平台特定外部中断信号。

位 `hip`.VSTIP 和 `hie`.VSTIE 是 VS 级定时器中断的中断挂起位和中断使能位。VSTIP 在 `hip` 中为只读，并且是 `hvip`.VSTIP 与导向 VS 级的任何其他平台特定定时器中断信号的逻辑或。

位 `hip`.VSSIP 和 `hie`.VSSIE 是 VS 级软件中断的中断挂起位和中断使能位。`hip` 中的 VSSIP 是 `hvip` 中相同位的别名（可写）。

发给 HS 模式的多个同时中断按以下递减优先级顺序处理：SEI、SSI、STI、SGEI、VSEI、VSSI、VSTI。

[[hgeinterruptregs]]
==== 虚拟机监控器客户机外部中断寄存器（`hgeip` 和 `hgeie`）

`hgeip` 寄存器是一个 HSXLEN 位只读寄存器，格式如 <<hgeipreg>> 所示，指示该硬件线程的挂起客户机外部中断。`hgeie` 寄存器是一个 HSXLEN 位读/写寄存器，格式如 <<hgeiereg>> 所示，包含该硬件线程上客户机外部中断的使能位。客户机外部中断号 _i_ 对应 `hgeip` 和 `hgeie` 中的位 _i_。

