zh = '''
====

当以下所有条件均成立时，中断 _i_ 将陷入 HS 模式：(a) 当前运行模式为 HS 模式且 `sstatus` 寄存器中的 SIE 位置位，或当前运行模式的特权低于 HS 模式；(b) 位 _i_ 在 `sip` 和 `sie` 中均置位，或在 `hip` 和 `hie` 中均置位；且 (c) 位 _i_ 未在 `hideleg` 中置位。

若 `sie` 的位 _i_ 为只读 0，则寄存器 `hip` 中的相同位可为可写或可为只读。当 `hip` 中的位 _i_ 可写时，可通过向该位写 0 来清除挂起中断 _i_。若中断 _i_ 可在 `hip` 中变为挂起，但 `hip` 中的位 _i_ 为只读，则要么可通过清除 `hvip` 的位 _i_ 来清除该中断，要么实现必须提供某种其他机制来清除挂起中断（这可能涉及对执行环境的调用）。

若相应中断能在 `hip` 中变为挂起，则 `hie` 中的相应位应可写。不可写的 `hie` 位应为只读 0。

寄存器 `hip` 和 `hie` 的标准部分（第 15:0 位）分别格式如 <<hipreg-standard>> 和 <<hiereg-standard>> 所示。

