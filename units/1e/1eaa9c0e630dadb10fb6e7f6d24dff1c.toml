客户机外部中断表示导向 VS 级各虚拟机的各中断。若 RISC-V 平台支持在虚拟机监控器干预最少的情况下将物理设备置于客户机 OS 的直接控制之下（称为虚拟机与物理设备之间的_直通_或_直接分配_），则在此类情况下，来自该设备的中断针对特定虚拟机。`hgeip` 的每一位汇总导向一个虚拟硬件线程的_所有_挂起中断，由中断控制器收集并报告。为区分来自多个设备的特定挂起中断，软件必须查询中断控制器。

