en = '''
[#norm:c-or_op]#`C.OR` computes the bitwise `OR` of the values in registers
_rd′_ and _rs2′_, then writes the result
to register _rd′_. `C.OR` expands into
`or rd′, rd′, rs2′`.#'''
zh = '''
[#norm:c-or_op]##`C.OR` 计算寄存器 _rd′_ 和 _rs2′_ 中的值的按位 `OR`，然后将结果写入寄存器 _rd′_。`C.OR` 展开为 `or rd′, rd′, rs2′`。##'''
