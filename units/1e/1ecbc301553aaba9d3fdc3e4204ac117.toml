en = '''
[#norm:rvwmo_aligned_memop]#Each aligned memory instruction that accesses XLEN or
fewer bits gives rise to exactly one memory operation, unless specified otherwise.#
[#norm:rvwmo_aligned_amo_memop]#An aligned AMO gives rise to a single memory operation that
is both a load operation and a store operation simultaneously.#'''
zh = '''
[#norm:rvwmo_aligned_memop]#每条访问 XLEN 或更少位的对齐内存指令恰好产生一个内存操作，除非另有规定。#
[#norm:rvwmo_aligned_amo_memop]#一条对齐的 AMO 恰好产生一个内存操作，该操作同时既是加载操作又是存储操作。#'''
