en = '''
The prologue / epilogue reduce from 60-bytes in the original code, to 14-bytes with _-msave-restore_,
and to 4-bytes with insn:push[] and insn:popret[].
As well as reducing the code-size insn:push[] and insn:popret[] eliminate the branches from
calling the millicode _save/restore_ routines and so may also perform better.'''
zh = '''
序言/尾声从原始代码的 60 字节，缩减为使用 _-msave-restore_ 的 14 字节，以及使用 insn:push[] 和 insn:popret[] 的 4 字节。除了减小代码体积外，insn:push[] 和 insn:popret[] 还消除了调用 millicode _save/restore_ 例程的分支，因此也可能具有更好的性能。'''
