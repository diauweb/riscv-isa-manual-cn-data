en = '''
[NOTE]
====
The ext:zilsd[] extension defines load-pair and store-pair instructions for RV32.
When this extension is not implemented, transferring double-precision operands
in ext:zdinx[] from or to memory requires two loads or stores. Register moves
need only a single insn:fsgnj.d[] instruction, however.
===='''
zh = '''
[NOTE]
====
ext:zilsd[] 扩展为 RV32 定义加载对和存储对指令。当未实现此扩展时，在 ext:zdinx[] 中将双精度操作数移入或移出内存需要两次加载或存储。不过，寄存器移动只需要一条 insn:fsgnj.d[] 指令。
===='''
