en = '''
(((compressed, CIW)))
[#norm:c-addi4spn_op]#C.ADDI4SPN (add immediate to stack pointer, non-destructive)
is a CIW-format instruction that adds a _zero_-extended
non-zero immediate, scaled by 4, to the stack pointer, `x2`, and writes
the result to `rd′`. This instruction is used to generate
pointers to stack-allocated variables, and expands to
`addi rd′, x2, nzuimm[9:2]`.#
[#norm:c-addi4spn_rsv]#C.ADDI4SPN is valid only when
_nzuimm_≠0; the code points with _nzuimm_=0 are
reserved.#'''
zh = '''
(((compressed, CIW)))
[#norm:c-addi4spn_op]#C.ADDI4SPN（加立即数到栈指针，非破坏性）是一条 CIW 格式指令，将一个 __零__扩展的非零立即数（按 4 缩放）加到栈指针 `x2` 上，并将结果写入 `rd′`。该指令用于生成指向栈分配变量的指针，并扩展为 `addi rd′, x2, nzuimm[9:2]`。#
[#norm:c-addi4spn_rsv]#C.ADDI4SPN 仅在 _nzuimm_≠0 时有效；_nzuimm_=0 的代码点保留。#'''
