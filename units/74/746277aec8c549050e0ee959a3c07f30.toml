en = '''
[#norm:Zabha_rs1_align_addr]#Similar to the AMOs specified in the ext:zaamo[] extension, the ext:zabha[] extension mandates
that the address contained in the `rs1` register must be naturally aligned to
the size of the operand.# The same exception options as specified in the
ext:zaamo[] extension are applicable in cases where the address is not naturally aligned.'''
zh = '''
[#norm:Zabha_rs1_align_addr]#与 ext:zaamo[] 扩展中规定的 AMO 类似，ext:zabha[] 扩展要求 `rs1` 寄存器中包含的地址必须按操作数大小自然对齐。# 在地址未自然对齐的情况下，适用与 ext:zaamo[] 扩展中规定的相同的异常选项。'''
