status = "machine"
en = '''
insn:hfence.gvma[] is valid only in HS-mode when csr:mstatus[tvm]=0, or in M-mode
(irrespective of csr:mstatus[tvm]). Executing an insn:hfence.gvma[] instruction
guarantees that any previous stores already visible to the current hart
are ordered before all implicit reads by that hart done for G-stage
address translation for instructions that follow the insn:hfence.gvma[]. If
operand __rs1__≠`x0`, it specifies a single guest
physical address, shifted right by qty:2[bits], and if operand
__rs2__≠`x0`, it specifies a single virtual machine
identifier (VMID).'''
zh = '''
insn:hfence.gvma[] 仅在 csr:mstatus[tvm]=0 时的 HS-mode 中有效，或在 M-mode 中有效（与 csr:mstatus[tvm] 无关）。执行 insn:hfence.gvma[] 指令保证当前硬件线程已可见的任何先前存储，在该硬件线程为 insn:hfence.gvma[] 之后指令的 G 级地址翻译所做的所有隐式读取之前排序。如果操作数 __rs1__≠`x0`，它指定单个客户物理地址右移 qty:2[位]；如果操作数 __rs2__≠`x0`，它指定单个虚拟机标识符（VMID）。'''
