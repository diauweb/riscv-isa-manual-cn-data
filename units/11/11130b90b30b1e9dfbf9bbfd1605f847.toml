en = '''
[#norm:ctr_ttf_default]#Default CTR behavior, when all transfer type filter bits (`__x__ctrctl`[47:32]) are unimplemented or 0, is to record all control transfers within enabled privileged modes. By setting transfer type filter bits, software can opt out of recording select transfer types, or opt into recording non-default operations.  All transfer type filter bits are optional.#'''
zh = '''
[#norm:ctr_ttf_default]#默认 CTR 行为（当所有转移类型过滤位（`__x__ctrctl`[47:32]）均未实现或为 0 时）是记录已使能特权模式内的所有控制转移。通过设置转移类型过滤位，软件可以选择不记录选定的转移类型，或选择加入记录非默认操作。所有转移类型过滤位都是可选的。#'''
