en = '''
Because the ext:p[] extension for Packed SIMD can be confused for the decimal
point in a version number, it must be preceded by an underscore if it follows
another extension with a version number. For example, rv32i2p2 means version
2.2 of RV32I, whereas rv32i2_p2 means version 2.0 of RV32I with version 2.0 of
the ext:p[] extension.'''
zh = '''
由于打包 SIMD 的 ext:p[] 扩展可能被误认为版本号中的小数点，因此当其跟在另一个带版本号的扩展之后时，其前面应加一条下划线。例如，rv32i2p2 表示 RV32I 的 2.2 版本，而 rv32i2_p2 表示 RV32I 的 2.0 版本并带有 ext:p[] 扩展的 2.0 版本。'''
