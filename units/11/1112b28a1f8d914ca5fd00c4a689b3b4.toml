en = '''
The C extension is compatible with all other standard instruction
extensions. [#norm:Zca_align16]#The C extension allows 16-bit instructions to be freely
intermixed with 32-bit instructions, with the latter now able to start
on any 16-bit boundary, i.e., IALIGN=16.# [#norm:Zca_no_misaligned]#With the addition of the C
extension, no instructions can raise instruction-address-misaligned
exceptions.#'''
zh = '''
C 扩展与所有其他标准指令扩展兼容。[#norm:Zca_align16]##C 扩展允许 16 位指令与 32 位指令自由混合，后者现在能够从任意 16 位边界开始，即 IALIGN=16。## [#norm:Zca_no_misaligned]##加入 C 扩展后，任何指令都不能引发指令地址非对齐异常。##'''
