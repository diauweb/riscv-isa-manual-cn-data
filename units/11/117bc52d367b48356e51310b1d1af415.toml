en = '''
[#norm:mip_meip_mie_meie_op]#Bits `mip`.MEIP and `mie`.MEIE are the interrupt-pending and
interrupt-enable bits for machine-level external interrupts.#
[#norm:mip_meip_rdonly]#MEIP is read-only in `mip`, and is set and cleared by a platform-specific
interrupt controller.#'''
zh = '''
[#norm:mip_meip_mie_meie_op]##`mip`.MEIP 和 `mie`.MEIE 位是机器级外部中断的中断挂起位和中断使能位。##[#norm:mip_meip_rdonly]##MEIP 在 `mip` 中为只读，由平台特定的中断控制器置位和清零。##'''
