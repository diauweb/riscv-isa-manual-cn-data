en = '''
[#norm:c-xor_op]#`C.XOR` computes the bitwise `XOR` of the values in registers
_rd′_ and _rs2′_, then writes the result
to register _rd′_. `C.XOR` expands into
`xor rd′, rd′, rs2′`.#'''
zh = '''
[#norm:c-xor_op]##`C.XOR` 计算寄存器 _rd′_ 和 _rs2′_ 中的值的按位 `XOR`，然后将结果写入寄存器 _rd′_。`C.XOR` 展开为 `xor rd′, rd′, rs2′`。##'''
