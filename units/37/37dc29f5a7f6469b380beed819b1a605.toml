en = '''
[#norm:zalasr_builds_on_amo]#The Zalasr extension builds on the atomic support provided by the Zaamo (Atomic Memory Operations), Zalrsc (Load-Reserved and Store-Conditional), and Zabha (Byte and Halfword Atomic Memory Operations) extensions by providing additional atomic operations (although it can be implemented independently of them).#
All of the AMO operations in Zaamo (and Zabha) are read-modify-write operations that both load and store.
The Zalrsc extension provides operations that are only loads or stores.
However, since it is designed to perform an atomic operation on a single memory word or doubleword, the loads and stores are designed to be paired.
The load-reserved implies that a future store-conditional will follow while store-conditional requires that there was a previous load-reserved without other intervening loads or stores.
Therefore, the Zalrsc extension does not provide a general atomic and ordered load or store.'''
zh = '''
[#norm:zalasr_builds_on_amo]#Zalasr 扩展建立在 Zaamo（原子内存操作）、Zalrsc（加载保留与条件存储）以及 Zabha（字节与半字原子内存操作）扩展所提供的原子支持之上，提供额外的原子操作（尽管它可以独立于这些扩展实现）。#
Zaamo（以及 Zabha）中的所有 AMO 操作都是既加载又存储的读取-修改-写入操作。
Zalrsc 扩展提供仅加载或仅存储的操作。
然而，由于它被设计为在单个内存字或双字上执行原子操作，其加载和存储被设计为成对使用。
加载保留意味着后续将有一条条件存储，而条件存储要求此前存在一条加载保留，且其间没有其他加载或存储。
因此，Zalrsc 扩展并不提供通用的原子且有序的加载或存储。'''
