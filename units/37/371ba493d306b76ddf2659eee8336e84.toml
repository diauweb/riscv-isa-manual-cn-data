en = '''
If the `vill` bit is set, then any attempt to execute a vector instruction
that depends upon `vtype` will raise an illegal-instruction exception.'''
zh = '''
如果 `vill` 位被置位，则任何尝试执行依赖 `vtype` 的向量指令都会引发非法指令异常。'''
