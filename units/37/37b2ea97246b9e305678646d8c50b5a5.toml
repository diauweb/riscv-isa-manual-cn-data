en = '''
Description::
The insn:xperm4[] instruction operates on nibbles.
The _rs1_ register contains a vector of XLEN/4 4-bit elements.
The _rs2_ register contains a vector of XLEN/4 4-bit indexes.
Each element of the result is formed by using the corresponding index element
from _rs2_ to select an element from _rs1_, or zero if the index element is out
of bounds.'''
zh = '''
说明::
insn:xperm4[] 指令对半字节进行操作。_rs1_ 寄存器包含由 XLEN/4 个 4 位元素组成的向量。_rs2_ 寄存器包含由 XLEN/4 个 4 位索引组成的向量。结果的每个元素通过使用来自 _rs2_ 的相应索引元素从 _rs1_ 中选择一个元素来形成；若索引元素越界，则为零。'''
