zh = '''
[#norm:mstateen_bit_63_op]##对于每个 `mstateen` CSR，第 63 位被定义为控制对对应的 `sstateen` 和 `hstateen` CSR 的访问。##也就是说，`mstateen0` 的第 63 位控制对 `sstateen0` 和 `hstateen0` 的访问；`mstateen1` 的第 63 位控制对 `sstateen1` 和 `hstateen1` 的访问；依此类推。[#norm:hstateen_bit_63_op]##同样，每个 `hstateen` 的第 63 位相应地控制对对应 `sstateen` CSR 的访问。##'''
