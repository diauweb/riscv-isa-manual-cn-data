en = '''
`vstval` is a *WARL* register that must be able to hold the same set of values
that `stval` can hold, with VSXLEN substituting for SXLEN.'''
zh = '''
`vstval` 是 *WARL* 寄存器，应能保存 `stval` 能保存的同一组值，其中 VSXLEN 替代 SXLEN。'''
