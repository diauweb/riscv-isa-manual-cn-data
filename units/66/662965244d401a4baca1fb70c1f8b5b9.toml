en = '''
If the virtual address in csr:ssp[] is not `XLEN` aligned, then the insn:sspush[],
insn:c.sspush[], insn:sspopchk[] and insn:c.sspopchk[] instructions cause a store/AMO access-fault
exception.'''
zh = '''
如果 csr:ssp[] 中的虚拟地址未按 `XLEN` 对齐，则 insn:sspush[]、
insn:c.sspush[]、insn:sspopchk[] 和 insn:c.sspopchk[] 指令将导致存储/AMO 访问故障
异常。'''
