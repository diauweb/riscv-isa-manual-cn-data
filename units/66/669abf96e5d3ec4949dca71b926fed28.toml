en = '''
.Supervisor Control Transfer Records Depth Register Field Definitions
[%unbreakable]
[width="100%",cols="15%,85%",options="header",]
|===
|Field |Description
|DEPTH |[#norm:sctrdepth_depth_op0]#WARL field that selects the depth of the CTR buffer.# Encodings:

‘000 - 16

‘001 - 32

‘010 - 64

‘011 - 128

‘100 - 256

'11x - reserved

[#norm:sctrdepth_depth_op1]#The depth of the CTR buffer dictates the number of entries to which the hardware records transfers. For a depth of N, the hardware records transfers to entries 0..N-1. All <<_entry_registers, Entry Registers>> read as '0' and are read-only when the selected entry is in the range N to 255.  When the depth is increased, the newly accessible entries contain unspecified but legal values.#

[#norm:sctrdepth_depth]#It is implementation-specific which DEPTH value(s) are supported.#
|==='''
zh = '''
.监管控制转移记录深度寄存器字段定义
[%unbreakable]
[width="100%",cols="15%,85%",options="header",]
|===
|字段 |描述
|DEPTH |[#norm:sctrdepth_depth_op0]#WARL 字段，用于选择 CTR 缓冲区的深度。# 编码：

'000 - 16

'001 - 32

'010 - 64

'011 - 128

'100 - 256

'11x - 保留

[#norm:sctrdepth_depth_op1]#CTR 缓冲区的深度决定硬件记录转移的条目数量。对于深度 N，硬件将转移记录到条目 0..N-1。当所选条目位于 N 到 255 的范围内时，所有 <<_entry_registers, 条目寄存器>> 读为 '0' 且为只读。当深度增加时，新可访问的条目包含未指定但合法的值。#

[#norm:sctrdepth_depth]#支持哪个（些）DEPTH 值取决于实现。#
|==='''
