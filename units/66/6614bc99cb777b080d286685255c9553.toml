en = '''
[#norm:c-fsdwsp_op]#C.FSDSP is an RV32DC/RV64DC-only instruction that stores a
double-precision floating-point value in floating-point register _rs2_
to memory. It computes an effective address by adding the
_zero_-extended offset, scaled by 8, to the stack pointer, `x2`. It
expands to `fsd rs2, offset(x2)`.#'''
zh = '''
[#norm:c-fsdwsp_op]#C.FSDSP 是一条仅限 RV32DC/RV64DC 的指令，将浮点寄存器 _rs2_ 中的一个双精度浮点值存储到内存。它通过将 __零__扩展的偏移量（按 8 缩放）加到栈指针 `x2` 上来计算有效地址。它扩展为 `fsd rs2, offset(x2)`。#'''
