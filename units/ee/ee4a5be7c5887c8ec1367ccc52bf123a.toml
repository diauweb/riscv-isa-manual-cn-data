en = '''
The three-bit `nf` field in the vector instruction encoding is an
unsigned integer that contains one less than the number of fields per
segment, _NFIELDS_.'''
zh = '''
向量指令编码中的三位 `nf` 字段是一个无符号整数，其值为每段字段数 _NFIELDS_ 减一。'''
