kind = "paragraph"
translatable = true
status = "machine"
en = '''
[#norm:mip_mandatory]#The csr:mip[] register must always be implemented,
but can contain read-only zeros in any position, indicating that interrupt
can never become pending.#
[#norm:mip_bits_wr_or_rdonly]#Each individual bit in register csr:mip[] may be writable or may be read-only.#
[#norm:mip_bits_wr_op]#When bit _i_ in csr:mip[] is writable, a pending interrupt _i_
can be cleared by writing 0 to this bit.#
[#norm:mip_bits_rdonly_op]#If interrupt _i_ can become pending but bit _i_ in csr:mip[] is read-only, the implementation must
provide some other mechanism for clearing the pending interrupt.#'''
zh = '''
[#norm:mip_mandatory]#csr:mip[] 寄存器必须始终实现，但可以在任意位置包含只读零，指示该中断永远不会变为挂起。#
[#norm:mip_bits_wr_or_rdonly]#csr:mip[] 寄存器中的各个位可以是可写的，也可以是只读的。#
[#norm:mip_bits_wr_op]#当 csr:mip[] 中的位 _i_ 可写时，可以通过向该位写入 0 来清除挂起的中断 _i_。#
[#norm:mip_bits_rdonly_op]#如果中断 _i_ 可以变为挂起，但 csr:mip[] 中的位 _i_ 为只读，则实现必须提供某种其他机制来清除该挂起中断。#'''
