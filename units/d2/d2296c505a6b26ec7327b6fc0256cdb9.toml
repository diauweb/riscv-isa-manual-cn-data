en = '''
ext:zalasr[] fills this gap by offering truly standalone atomic and ordered loads and stores.
The ext:zalasr[] instructions are atomic loads and stores that support ordering annotations.
All {cpp} atomic operations can be supported with single instructions with the combination of ext:zaamo[], ext:zabha[], ext:zacas[], and ext:zalasr[].'''
zh = '''
ext:zalasr[] 通过提供真正独立的原子且有序的加载和存储填补了这一空白。ext:zalasr[] 指令是支持顺序标注的原子加载和存储。结合 ext:zaamo[]、ext:zabha[]、ext:zacas[] 和 ext:zalasr[]，所有 {cpp} 原子操作都可以用单条指令来支持。'''
