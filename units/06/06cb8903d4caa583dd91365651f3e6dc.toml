en = '''
[#norm:ctr_trap_enabled]#Traps between enabled privilege modes are recorded as normal.#  [#norm:ctr_trap_disabled_src]#Traps from a disabled privilege mode to an enabled privilege mode are partially recorded, such that the `ctrsource`.PC is 0.# [#norm:ctr_trap_disabled_tgt]#Traps from an enabled mode to a disabled mode, known as external traps, are not recorded by default.#  See <<External Traps>> for how they can be recorded.'''
zh = '''
[#norm:ctr_trap_enabled]#在已使能特权模式之间发生的陷阱按正常方式记录。#  [#norm:ctr_trap_disabled_src]#从禁用的特权模式到已使能特权模式的陷阱被部分记录，使得 `ctrsource`.PC 为 0。# [#norm:ctr_trap_disabled_tgt]#从已使能模式到禁用模式的陷阱称为外部陷阱，默认情况下不被记录。#  有关如何记录它们，参见 <<External Traps>>。'''
