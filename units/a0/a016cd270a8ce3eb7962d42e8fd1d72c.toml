en = '''
Description::
This instruction sources a single byte from _rs2_ according to _bs_.
To this it applies the inverse AES SBox operation, and XOR's the result with
_rs1_.
This instruction must _always_ be implemented such that its execution
latency does not depend on the data being operated on.'''
zh = '''
描述::
该指令根据 _bs_ 从 _rs2_ 中取出一个字节。
对其应用逆 AES SBox 操作，并将结果与 _rs1_ 进行异或。
该指令必须 _始终_ 以实现为其执行延迟不依赖于所操作数据的方式实现。'''
