en = '''
[#norm:menvcfg_stce_op1]#The Sstc extension adds the `STCE` (STimecmp Enable) bit to `menvcfg` CSR.#
[#norm:menvcfg_stce_rdonly0]#When the Sstc extension is not implemented, `STCE` is read-only zero.#
[#norm:menvcfg_stce_op2]#The `STCE` bit enables `stimecmp` for S-mode when set to one.#
[#norm:menvcfg_stce_zero_op]#When this extension is implemented and `STCE` in `menvcfg` is zero, an attempt
to access `stimecmp` or `vstimecmp` in a mode other than M-mode raises an
illegal-instruction exception, `STCE` in `henvcfg` is read-only zero, and `STIP`
in `mip` and `sip` reverts to its defined behavior as if this extension is not
implemented.# [#norm:menvcfg_stce_zero_vstip]#Further, if the H extension is implemented, then `hip`.VSTIP also
reverts its defined behavior as if this extension is not implemented.#'''
zh = '''
[#norm:menvcfg_stce_op1]#Sstc 扩展在 `menvcfg` CSR 中增加了 `STCE`（STimecmp Enable，STimecmp 使能）位。#
[#norm:menvcfg_stce_rdonly0]#当未实现 Sstc 扩展时，`STCE` 为只读零。#
[#norm:menvcfg_stce_op2]#`STCE` 位在被置为 1 时为 S 模式使能 `stimecmp`。#
[#norm:menvcfg_stce_zero_op]#当实现了此扩展且 `menvcfg` 中的 `STCE` 为零时，在 M 模式以外的模式下尝试访问 `stimecmp` 或 `vstimecmp` 会引发非法指令异常，`henvcfg` 中的 `STCE` 为只读零，并且 `mip` 和 `sip` 中的 `STIP` 恢复为其已定义行为，如同未实现此扩展。# [#norm:menvcfg_stce_zero_vstip]#此外，如果实现了 H 扩展，则 `hip`.VSTIP 也恢复其已定义行为，如同未实现此扩展。#'''
