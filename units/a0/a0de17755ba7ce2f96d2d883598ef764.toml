Description::
本指令返回 _rs1_，其中 _shamt_ 所指定索引处的单个位被置位。该索引从 _shamt_ 的低 log2(XLEN) 位读取。
[#norm:bseti_shamt_rsv_rv32]##对于 RV32，与 shamt[5]=1 相对应的编码为保留编码。##'''
