en = '''
[#norm:misa_extensions_dependencies]#If an ISA feature _x_ depends on an ISA feature _y_, then attempting to
enable feature _x_ but disable feature _y_ results in both features
being disabled.#
For example, setting csr::[f]=0 and csr::[d]=1 results in both csr::[f] and csr::[d] being cleared.
Similarly, setting csr::[u]=0 and csr::[s]=1 results in both csr::[u] and csr::[s] being cleared.'''
zh = '''
[#norm:misa_extensions_dependencies]#如果 ISA 特性 _x_ 依赖于 ISA 特性 _y_，则尝试使能特性 _x_ 而禁用特性 _y_ 会导致两个特性都被禁用。#
例如，设置 csr::[f]=0 且 csr::[d]=1 会导致 csr::[f] 和 csr::[d] 都被清除。类似地，设置 csr::[u]=0 且 csr::[s]=1 会导致 csr::[u] 和 csr::[s] 都被清除。'''
