en = '''
* [#norm:zicfiss_m_menvcfg-sse]#If the privilege mode is less than M and `menvcfg.SSE` is 0, an
  illegal-instruction exception is raised.#
* [#norm:zicfiss_u_senvcfg-sse]#Otherwise, if in U-mode and `senvcfg.SSE` is 0, an illegal-instruction
  exception is raised.#
* [#norm:zicfiss_vs_henvcfg-sse]#Otherwise, if in VS-mode and `henvcfg.SSE` is 0, a virtual-instruction
  exception is raised.#
* [#norm:zicfiss_vu_henvcfg_senvcfg-sse]#Otherwise, if in VU-mode and either `henvcfg.SSE` or `senvcfg.SSE` is 0,
  a virtual-instruction  exception is raised.#
* [#norm:zicfiss_sse_access]#Otherwise, the access is allowed.#'''
zh = '''
* [#norm:zicfiss_m_menvcfg-sse]#若特权模式低于 M 且 `menvcfg.SSE` 为 0，则引发非法指令异常。#
* [#norm:zicfiss_u_senvcfg-sse]#否则，若处于 U 模式且 `senvcfg.SSE` 为 0，则引发非法指令异常。#
* [#norm:zicfiss_vs_henvcfg-sse]#否则，若处于 VS 模式且 `henvcfg.SSE` 为 0，则引发虚拟指令异常。#
* [#norm:zicfiss_vu_henvcfg_senvcfg-sse]#否则，若处于 VU 模式且 `henvcfg.SSE` 或 `senvcfg.SSE` 为 0，则引发虚拟指令异常。#
* [#norm:zicfiss_sse_access]#否则，允许该访问。#'''
