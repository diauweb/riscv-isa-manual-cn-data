en = '''
(((NaN, canonical, single-precision)))
For single-precision floating-point, the canonical NaN has a positive sign and
all significand bits clear except the MSB, the quiet bit. In other words, for
single-precision floating-point, the canonical NaN corresponds to the pattern
`0x7fc00000`.'''
zh = '''
(((NaN, 规范, 单精度)))
对于单精度浮点，规范 NaN 具有正号，且除最高有效位（静默位）外所有有效数位均为 0。换言之，对于单精度浮点，规范 NaN 对应于模式 `0x7fc00000`。'''
