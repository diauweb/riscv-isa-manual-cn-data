en = '''
The insn:pause[] instruction hints to a hart that it should temporarily reduce its
rate of execution.
It is normally used to save energy and execution resources while polling, e.g.
while waiting for a spinlock to become free.'''
zh = '''
insn:pause[] 指令向硬件线程提示：它应暂时降低执行速率。它通常用于在轮询时节省能量和执行资源，例如在等待自旋锁变为空闲时。'''
