en = '''
Accesses to the fields within each segment can occur in any order,
including the case where the byte stride is such that segments overlap
in memory.'''
zh = '''
对每个段内字段的访问可以以任意顺序发生，包括字节步长使得段在内存中重叠的情况。'''
