en = '''
[#norm:Zicsr_wide_csr_access]#If a standard CSR is wider than XLEN bits, then an explicit read
of the CSR returns the register's least-significant XLEN bits,
and an explicit write to the CSR modifies only the register's
least-significant XLEN bits, leaving the upper bits unchanged.#'''
zh = '''
[#norm:Zicsr_wide_csr_access]#如果标准 CSR 宽于 XLEN 位，则对该 CSR 的显式读取返回该寄存器的最低有效 XLEN 位，而对该 CSR 的显式写入仅修改该寄存器的最低有效 XLEN 位，高位保持不变。#'''
