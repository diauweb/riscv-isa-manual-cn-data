en = '''
[#norm:zicflip_lpad_enabled_instr_allowed]#When ext:zicfilp[] is enabled, insn:lpad[] is the only instruction allowed to execute when
the `ELP` state is `LP_EXPECTED`. If ext:zicfilp[] is not enabled then the instruction
is a no-op.# [#norm:zicflip_lpad_enabled_exception]#If ext:zicfilp[] is enabled, the insn:lpad[] instruction causes a
software-check exception with `__x__tval` set to "landing pad fault (code=2)"# if
any of the following conditions are true:'''
zh = '''
[#norm:zicflip_lpad_enabled_instr_allowed]#当 ext:zicfilp[] 启用时，insn:lpad[] 是 `ELP` 状态为 `LP_EXPECTED` 时唯一允许执行的指令。如果 ext:zicfilp[] 未启用，则该指令为空操作。# [#norm:zicflip_lpad_enabled_exception]#如果 ext:zicfilp[] 启用，则当以下任一条件为真时，insn:lpad[] 指令引发软件检查异常，并将 `__x__tval` 设置为 "landing pad fault (code=2)"#：'''
