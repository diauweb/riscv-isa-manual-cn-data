en = '''
Although the primary motivation for developing this standard was to define an encapsulation format for E-Trace packets that allows tools to parse and decode them in a standard manner, the encapsulation format defined in this chapter is agnostic to the packet payload structure and meaning and so can be used for any kind of unformatted data.  In addition to E-trace, it could also be used for a wide variety of other uses, for example: performance counter metrics, trace or other diagnostic data from a bus fabric monitor or on-chip logic analyser.'''
zh = '''
尽管制定本标准的主要动机是为 E-Trace 数据包定义一种封装格式，使工具能够以标准方式解析和解码这些数据包，但本章定义的封装格式与数据包有效载荷的结构和含义无关，因此可用于任何类型的未格式化数据。除 E-Trace 外，它还可用于多种其他用途，例如：性能计数器指标、来自总线互连监视器或片上逻辑分析仪的跟踪数据或其他诊断数据。'''
