en = '''
[NOTE]
====
If csr:jvt[mode] = 0 (Jump Table Mode) then insn:cm.jalt[] behaves as specified here. If csr:jvt[mode] is a reserved value, then insn:cm.jalt[] is also reserved. In the future other defined values of csr:jvt[mode] may change the behavior of insn:cm.jalt[].
===='''
zh = '''
[NOTE]
====
如果 csr:jvt[mode] = 0（跳转表模式），则 insn:cm.jalt[] 按此处规定运行。如果 csr:jvt[mode] 是保留值，则 insn:cm.jalt[] 也是保留的。将来其他已定义的 csr:jvt[mode] 值可能会改变 insn:cm.jalt[] 的行为。
