en = '''
For each `siselect` and `sireg*` combination defined in <<indirect-hpm-state-mappings>>, the table
further indicates the extensions upon which the underlying counter state
depends.[#norm:ssccfg_missing_extension_illegal]#If any extension upon which the underlying state depends is not implemented, an attempt from M or S mode to access the given state through `sireg*` raises an illegal-instruction exception.#'''
zh = '''
对于 <<indirect-hpm-state-mappings>> 中定义的每个 `siselect` 与 `sireg*` 组合，该表还指出了底层计数器状态所依赖的扩展。[#norm:ssccfg_missing_extension_illegal]#如果底层状态所依赖的任何扩展未实现，则从 M 或 S 模式通过 `sireg*` 访问给定状态的尝试会引发非法指令异常。#'''
