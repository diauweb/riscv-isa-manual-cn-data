status = "machine"
en = '''
[#norm:mhpmcounter_num]#The hardware performance monitor includes 29 additional 64-bit event
counters, csr:mhpmcounter3[]{endash}csr:mhpmcounter31[].#
[#norm:mhpmevent_sz_warl_op]#The event selector CSRs,
csr:mhpmevent3[]{endash}csr:mhpmevent31[], are 64-bit *WARL* registers that control which
event causes the corresponding counter to increment.#
[#norm:mhpmevent_enc]#The meaning of these events is defined by the platform,
but event 0 is defined to mean "`no event.`"#
[#norm:mhpmcounter_mandatory]#All counters should be implemented#, but
[#norm:mhpmcounter_mhpmevent_rdonly0]#a legal implementation is to make both the counter and its corresponding event selector be read-only 0.#'''
zh = '''
[#norm:mhpmcounter_num]#硬件性能监视器包含 29 个额外的 64 位事件计数器，csr:mhpmcounter3[]{endash}csr:mhpmcounter31[]。#
[#norm:mhpmevent_sz_warl_op]#事件选择器 CSR csr:mhpmevent3[]{endash}csr:mhpmevent31[] 是 64 位 *WARL* 寄存器，控制哪个事件导致相应计数器递增。#
[#norm:mhpmevent_enc]#这些事件的含义由平台定义，但事件 0 定义为表示“no event.”#
[#norm:mhpmcounter_mandatory]#所有计数器都应实现#，但 [#norm:mhpmcounter_mhpmevent_rdonly0]#一种合法实现是将计数器及其对应的事件选择器都设为只读 0。#'''
