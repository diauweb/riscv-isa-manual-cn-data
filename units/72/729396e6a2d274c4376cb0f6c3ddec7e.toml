en = '''
To provide more efficient support for release consistency,
[#norm:A_aq_rl_bits]#each atomic
instruction has two bits, _aq_ and _rl_, used to specify additional
memory ordering constraints as viewed by other RISC-V harts.#
[#norm:A_domain_specific_ordering]#The bits
order accesses to one of the two address domains, memory or I/O,
depending on which address domain the atomic instruction is accessing.
No ordering constraint is implied to accesses to the other domain, and a
insn:fence[] instruction should be used to order across both domains.#'''
zh = '''
为了更高效地支持释放一致性，[#norm:A_aq_rl_bits]#每条原子指令都有两个位，即 _aq_ 和 _rl_，用于指定其他 RISC-V 硬件线程所观察到的额外内存顺序约束。# [#norm:A_domain_specific_ordering]#这些位对两个地址域（内存或 I/O）之一的访问进行排序，具体取决于该原子指令所访问的地址域。对另一个域的访问不隐含任何顺序约束，并且应使用 insn:fence[] 指令在两个域之间进行排序。#'''
