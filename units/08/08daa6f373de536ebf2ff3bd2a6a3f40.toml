en = '''
If the current XLEN is greater than MXLEN, the PMP address registers are
zero-extended from MXLEN to XLEN bits for the purposes of address
matching.'''
zh = '''
若当前 XLEN 大于 MXLEN，则出于地址匹配目的，PMP 地址寄存器从 MXLEN 零扩展到 XLEN 位。'''
