en = '''
NOTE: ext:zifencei[] is mandated as it is the only standard way to support
instruction-cache coherence in RVA23 application processors.  A new
instruction-cache coherence mechanism, ext:ziccid[],
might be added as an option in the future.'''
zh = '''
NOTE: ext:zifencei[] 被列为强制项，因为它是 RVA23 应用处理器中支持指令缓存一致性的唯一标准方式。未来可能会将新的指令缓存一致性机制 ext:ziccid[] 添加为选项。'''
