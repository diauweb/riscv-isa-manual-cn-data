zh = '''
当实现了 Smstateen 时，`mstateen0`.CTR 位控制从低于 M 模式的特权模式对 CTR 寄存器状态的访问。当 `mstateen0`.CTR=1 时，对 CTR 寄存器状态的访问按上文 <<CSRs>> 和 <<Entry Registers>> 中所述执行，而 SCTRCLR 按 <<Supervisor CTR Clear Instruction>> 中所述执行。当 `mstateen0`.CTR=0 且特权模式低于 M 模式时，以下操作会引发非法指令异常：'''
