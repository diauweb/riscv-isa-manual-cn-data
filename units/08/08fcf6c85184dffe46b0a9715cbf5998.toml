zh = '''
当实现 Smstateen 时，`mstateen0`.CTR 位控制来自低于 M 模式的特权模式对 CTR 寄存器状态的访问。[#norm:mstateen_ctr1]##当 `mstateen0`.CTR=1 时，对 CTR 寄存器状态的访问按上文 <<CSRs>> 和 <<Entry Registers>> 所述执行，而 SCTRCLR 按 <<Supervisor CTR Clear Instruction>> 所述执行。## [#norm:mstateen_ctr0]##当 `mstateen0`.CTR=0 且特权模式低于 M 模式时，以下操作触发非法指令异常：##'''
