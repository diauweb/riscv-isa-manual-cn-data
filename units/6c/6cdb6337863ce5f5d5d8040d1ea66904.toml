MPV 位（Machine Previous Virtualization Mode，机器先前虚拟化模式）在陷入 M 模式时由实现写入。正如 MPP 字段被置为陷阱发生时的（名义）特权模式一样，MPV 位被置为陷阱发生时虚拟化模式 V 的值。当执行 MRET 指令时，虚拟化模式 V 被置为 MPV，除非 MPP=3，此时 V 保持为 0。

字段 GVA（客户机虚拟地址）在陷入 M 模式时由实现写入。对于任何将客户机虚拟地址写入 `mtval` 的陷阱（断点、地址非对齐、访问错误、页错误或客户机页错误），GVA 被置为 1。对于任何其他陷入 M 模式的陷阱，GVA 被置为 0。

`mstatus` 的 TSR 和 TVM 字段仅在 HS 模式下影响执行，在 VS 模式下不影响。TW 字段在除 M 模式外的所有模式下影响执行。

置 TVM=1 阻止 HS 模式访问 `hgatp` 或执行 HFENCE.GVMA 或 HINVAL.GVMA，但对访问 `vsatp` 或指令 HFENCE.VVMA 或 HINVAL.VVMA 没有影响。

[NOTE]
