en = '''
The extlink:zfinx[] and extlink:zdinx[] extensions add computational
instructions analogous to those in the ext:f[] and ext:d[] extensions, but they
instead operate on floating-point numbers in the `x` registers. [#norm:Zfinx_Zdinx_incompatible_F_D]#These extensions,
intended for lower-cost systems, are incompatible with the ext:f[] and ext:d[]
extensions.#'''
zh = '''
extlink:zfinx[] 和 extlink:zdinx[] 扩展添加了与 ext:f[] 和 ext:d[] 扩展中类似的计算指令，但它们改为对 `x` 寄存器中的浮点数进行操作。[#norm:Zfinx_Zdinx_incompatible_F_D]#这些扩展面向低成本系统，与 ext:f[] 和 ext:d[] 扩展不兼容。#'''
