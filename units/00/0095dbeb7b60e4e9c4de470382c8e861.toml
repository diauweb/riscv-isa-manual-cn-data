en = '''
[NOTE]
====
The sign-injection instructions provide floating-point insn:mv[], insn:abs[], and insn:neg[],
as well as supporting a few other operations, including the IEEE
754-2008 `copySign` operation and sign manipulation in transcendental
math function libraries. Although insn:mv[], insn:abs[], and insn:neg[] only need a single
register operand, whereas insn:fsgnj[] instructions need two, it is unlikely
most microarchitectures would add optimizations to benefit from the
reduced number of register reads for these relatively infrequent
instructions. Even in this case, a microarchitecture can simply detect
when both source registers are the same for insn:fsgnj[] instructions and only
read a single copy.
===='''
zh = '''
[NOTE]
====
符号注入指令提供了浮点的 insn:mv[]、insn:abs[] 和 insn:neg[]，并支持若干其他操作，包括 IEEE 754-2008 的 `copySign` 操作以及超越数学函数库中的符号操作。尽管 insn:mv[]、insn:abs[] 和 insn:neg[] 只需要一个寄存器操作数，而 insn:fsgnj[] 指令需要两个，但大多数微架构不太可能为这些相对不频繁的指令增加优化以从减少的寄存器读取中获益。即使在这种情况下，微架构也可以简单地检测 insn:fsgnj[] 指令的两个源寄存器是否相同，并只读取单个副本。
===='''
