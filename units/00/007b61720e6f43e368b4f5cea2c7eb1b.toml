en = '''
[NOTE]
====
insn:fence.i[] was designed to support a wide variety of implementations. A
simple implementation can flush the local instruction cache and the instruction
pipeline when the insn:fence.i[] is executed. A more complex implementation
might snoop the instruction (data) cache on every data (instruction) cache miss,
or use an inclusive unified private L2 cache to invalidate lines from the
primary instruction cache when they are being written by a local store
instruction. If instruction and data caches are kept coherent in this way, or if
the memory system consists of only uncached RAMs, then just the fetch pipeline
needs to be flushed at a insn:fence.i[].

insn:fence.i[] was previously part of the base ext:i[] instruction set. Two main
issues are driving moving this out of the mandatory base, although at time of
writing it is still the only standard method for maintaining instruction-fetch
coherence.

First, it has been recognized that on some systems, insn:fence.i[] will be
expensive to implement and alternate mechanisms are being discussed in the
memory model task group. In particular, for designs that have an incoherent
instruction cache and an incoherent data cache, or where the instruction cache
refill does not snoop a coherent data cache, both caches must be completely
flushed when a insn:fence.i[] instruction is encountered. This problem is
exacerbated when there are multiple levels of instruction and data caches in
front of a unified cache or outer memory system.

Second, the instruction is not powerful enough to make available at user level
in a Unix-like operating system environment. The insn:fence.i[] only
synchronizes the local hart, and the OS can reschedule the user hart to a
different physical hart after the insn:fence.i[]. This would require the OS to
execute an additional insn:fence.i[] as part of every context migration. For
this reason, the standard Linux ABI has removed insn:fence.i[] from user-level
and now requires a system call to maintain instruction-fetch coherence, which
allows the OS to minimize the number of insn:fence.i[] executions required on
current systems and provides forward-compatibility with future improved
instruction-fetch coherence mechanisms.

Future approaches to instruction-fetch coherence under discussion include
providing more restricted versions of insn:fence.i[] that only target a given
address specified in _rs1_, and/or allowing software to use an ABI that relies
on machine-mode cache-maintenance operations.
===='''
zh = '''
[NOTE]
====
insn:fence.i[] 的设计旨在支持多种多样的实现。简单的实现可以在执行 insn:fence.i[] 时刷新本地指令缓存和指令流水线。更复杂的实现可以在每次数据（指令）缓存缺失时侦听指令（数据）缓存，或者使用包含式的统一私有 L2 缓存，在本地存储指令写入主指令缓存中的行时使这些行失效。如果指令缓存和数据缓存以这种方式保持一致，或者内存系统仅由非缓存 RAM 组成，那么在 insn:fence.i[] 时只需刷新取指流水线。

insn:fence.i[] 以前是基础 ext:i[] 指令集的一部分。尽管在撰写本文时它仍然是维护指令取指一致性的唯一标准方法，但有两个主要问题促使将其移出强制性的基础指令集。

首先，人们已经认识到，在某些系统上 insn:fence.i[] 的实现代价高昂，内存模型任务组正在讨论替代机制。特别是，对于指令缓存与数据缓存不一致的设计，或者指令缓存重填不会侦听一致数据缓存的设计，在遇到 insn:fence.i[] 指令时必须完全刷新这两个缓存。当统一缓存或外部内存系统之前存在多级指令缓存和数据缓存时，这个问题会更加严重。

其次，该指令的能力不足以在类 Unix 操作系统环境的用户级提供使用。insn:fence.i[] 仅同步本地硬件线程，而操作系统可以在 insn:fence.i[] 之后将用户硬件线程重新调度到不同的物理硬件线程上。这将要求操作系统在每次上下文迁移时都执行额外的 insn:fence.i[]。因此，标准 Linux ABI 已将 insn:fence.i[] 从用户级移除，现在要求通过系统调用来维护指令取指一致性，这使操作系统能够在当前系统上最小化所需的 insn:fence.i[] 执行次数，并与未来改进的指令取指一致性机制保持向前兼容。

正在讨论的未来指令取指一致性方法包括：提供更受限的 insn:fence.i[] 版本，仅针对 _rs1_ 中指定的给定地址；和/或允许软件使用依赖机器模式缓存维护操作的 ABI。
===='''
