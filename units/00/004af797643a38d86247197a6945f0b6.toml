en = '''
If the ext:q[] extension is implemented, insn:fround.q[] and insn:froundnx.q[] instructions
are analogously defined to operate on quad-precision numbers. They are
encoded like insn:fcvt.q.s[], but with _rs2_=4 and 5, respectively,'''
zh = '''
若实现了 ext:q[] 扩展，则 insn:fround.q[] 和 insn:froundnx.q[] 指令类似地定义为对四精度数进行操作。它们的编码类似 insn:fcvt.q.s[]，但 _rs2_ 分别为 4 和 5，'''
