NOTE: "段" 这一名称反映了所移动的项是具有同质元素的子数组。这些操作可用于在内存和寄存器之间转置数组，并可通过将结构中的每个字段解包到单独的向量寄存器来支持对 "结构体数组" 数据类型的操作。'''
