en = '''
[#norm:mie_mandatory]#The csr:mie[] register must always be implemented.#
[#norm:mie_bits_wr]#A bit in csr:mie[] must be writable if the corresponding interrupt can ever become pending.#
[#norm:mie_bits_rdonly0]#Bits of csr:mie[] that are not writable must be read-only zero.#'''
zh = '''
[#norm:mie_mandatory]#csr:mie[] 寄存器必须始终实现。#
[#norm:mie_bits_wr]#如果相应中断可以变为挂起，则 csr:mie[] 中的该位必须可写。#
[#norm:mie_bits_rdonly0]#csr:mie[] 中不可写的位必须为只读零。#'''
