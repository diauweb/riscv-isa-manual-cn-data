en = '''
.Currently allocated RISC-V hypervisor and VS CSR addresses
[%autowidth,float="center",align="center",cols="<,<,<,<",options="header"]
|===
|Number |Privilege |Name |Description
4+^|Hypervisor Trap Setup

|`0x600` |HRW |csr:hstatus[]    |Hypervisor status register
|`0x602` |HRW |csr:hedeleg[]    |Hypervisor exception delegation register
|`0x603` |HRW |csr:hideleg[]    |Hypervisor interrupt delegation register
|`0x604` |HRW |csr:hie[]        |Hypervisor interrupt-enable register
|`0x606` |HRW |csr:hcounteren[] |Hypervisor counter enable
|`0x607` |HRW |csr:hgeie[]      |Hypervisor guest external interrupt-enable register
|`0x612` |HRW |csr:hedelegh[]   |Upper qty:32[bits] of csr:hedeleg[], RV32 only

4+^|Hypervisor Trap Handling

|`0x643` |HRW |csr:htval[]  |Hypervisor trap value
|`0x644` |HRW |csr:hip[]    |Hypervisor interrupt pending
|`0x645` |HRW |csr:hvip[]   |Hypervisor virtual interrupt pending
|`0x64A` |HRW |csr:htinst[] |Hypervisor trap instruction (transformed)
|`0xE12` |HRO |csr:hgeip[]  |Hypervisor guest external interrupt pending

4+^|Hypervisor Configuration

|`0x60A` |HRW |csr:henvcfg[]  |Hypervisor environment configuration register
|`0x61A` |HRW |csr:henvcfgh[] |Upper qty:32[bits] of csr:henvcfg[], RV32 only

4+^|Hypervisor Protection and Translation

|`0x680` |HRW |csr:hgatp[] |Hypervisor guest address translation and protection

4+^|Debug/Trace Registers

|`0x6A8` |HRW |csr:hcontext[] |Hypervisor-mode context register

4+^|Hypervisor Counter/Timer Virtualization Registers

|`0x605` |HRW |csr:htimedelta[]  |Delta for VS/VU-mode timer
|`0x615` |HRW |csr:htimedeltah[] |Upper qty:32[bits] of csr:htimedelta[], RV32 only

4+^|Hypervisor State Enable Registers

|`0x60C` |HRW |csr:hstateen0[]  |Hypervisor State Enable 0 Register
|`0x60D` |HRW |csr:hstateen1[]  |Hypervisor State Enable 1 Register
|`0x60E` |HRW |csr:hstateen2[]  |Hypervisor State Enable 2 Register
|`0x60F` |HRW |csr:hstateen3[]  |Hypervisor State Enable 3 Register
|`0x61C` |HRW |csr:hstateen0h[] |Upper qty:32[bits] of Hypervisor State Enable 0 Register, RV32 only
|`0x61D` |HRW |csr:hstateen1h[] |Upper qty:32[bits] of Hypervisor State Enable 1 Register, RV32 only
|`0x61E` |HRW |csr:hstateen2h[] |Upper qty:32[bits] of Hypervisor State Enable 2 Register, RV32 only
|`0x61F` |HRW |csr:hstateen3h[] |Upper qty:32[bits] of Hypervisor State Enable 3 Register, RV32 only

4+^|Virtual Supervisor Registers

|`0x200` |HRW |csr:vsstatus[]  |Virtual supervisor status register
|`0x204` |HRW |csr:vsie[]      |Virtual supervisor interrupt-enable register
|`0x205` |HRW |csr:vstvec[]    |Virtual supervisor trap handler base address
|`0x240` |HRW |csr:vsscratch[] |Virtual supervisor scratch register
|`0x241` |HRW |csr:vsepc[]     |Virtual supervisor exception program counter
|`0x242` |HRW |csr:vscause[]   |Virtual supervisor trap cause
|`0x243` |HRW |csr:vstval[]    |Virtual supervisor trap value
|`0x244` |HRW |csr:vsip[]      |Virtual supervisor interrupt pending
|`0x280` |HRW |csr:vsatp[]     |Virtual supervisor address translation and protection

4+^|Virtual Supervisor Indirect

|`0x250` |HRW |csr:vsiselect[] |Virtual supervisor indirect register select
|`0x251` |HRW |csr:vsireg[]    |Virtual supervisor indirect register alias
|`0x252` |HRW |csr:vsireg2[]   |Virtual supervisor indirect register alias 2
|`0x253` |HRW |csr:vsireg3[]   |Virtual supervisor indirect register alias 3
|`0x255` |HRW |csr:vsireg4[]   |Virtual supervisor indirect register alias 4
|`0x256` |HRW |csr:vsireg5[]   |Virtual supervisor indirect register alias 5
|`0x257` |HRW |csr:vsireg6[]   |Virtual supervisor indirect register alias 6
