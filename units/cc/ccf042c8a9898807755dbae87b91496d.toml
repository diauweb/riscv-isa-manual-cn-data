|`0x24D` |HRW |csr:vstimecmp[]  |Virtual supervisor timer compare
|`0x25D` |HRW |csr:vstimecmph[] |Upper qty:32[bits] of csr:vstimecmp[], RV32 only

4+^|Virtual Supervisor Control Transfer Records Configuration

|`0x24E` |HRW |csr:vsctrctl[] |Virtual Supervisor Control Transfer Records Control Register

