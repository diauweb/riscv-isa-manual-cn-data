zh = '''
.当前已分配的 RISC-V 虚拟机监控器与 VS CSR 地址
[%autowidth,float="center",align="center",cols="<,<,<,<",options="header"]
|===
|编号 |权限 |名称 |描述
4+^|虚拟机监控器陷阱设置

|`0x600` |HRW |csr:hstatus[]    |虚拟机监控器状态寄存器
|`0x602` |HRW |csr:hedeleg[]    |虚拟机监控器异常委托寄存器
|`0x603` |HRW |csr:hideleg[]    |虚拟机监控器中断委托寄存器
|`0x604` |HRW |csr:hie[]        |虚拟机监控器中断使能寄存器
|`0x606` |HRW |csr:hcounteren[] |虚拟机监控器计数器使能
|`0x607` |HRW |csr:hgeie[]      |虚拟机监控器客户机外部中断使能寄存器
|`0x612` |HRW |csr:hedelegh[]   |csr:hedeleg[] 的高 qty:32[bits]，仅 RV32

4+^|虚拟机监控器陷阱处理

|`0x643` |HRW |csr:htval[]  |虚拟机监控器陷阱值
|`0x644` |HRW |csr:hip[]    |虚拟机监控器中断挂起
|`0x645` |HRW |csr:hvip[]   |虚拟机监控器虚拟中断挂起
|`0x64A` |HRW |csr:htinst[] |虚拟机监控器陷阱指令（经变换）
|`0xE12` |HRO |csr:hgeip[]  |虚拟机监控器客户机外部中断挂起

4+^|虚拟机监控器配置

|`0x60A` |HRW |csr:henvcfg[]  |虚拟机监控器环境配置寄存器
|`0x61A` |HRW |csr:henvcfgh[] |csr:henvcfg[] 的高 qty:32[bits]，仅 RV32

4+^|虚拟机监控器保护与转换

|`0x680` |HRW |csr:hgatp[] |虚拟机监控器客户机地址转换与保护

4+^|调试/跟踪寄存器

|`0x6A8` |HRW |csr:hcontext[] |虚拟机监控器模式上下文寄存器

4+^|虚拟机监控器计数器/定时器虚拟化寄存器

|`0x605` |HRW |csr:htimedelta[]  |VS/VU 模式定时器的增量
|`0x615` |HRW |csr:htimedeltah[] |csr:htimedelta[] 的高 qty:32[bits]，仅 RV32

4+^|虚拟机监控器状态使能寄存器

|`0x60C` |HRW |csr:hstateen0[]  |虚拟机监控器状态使能 0 寄存器
|`0x60D` |HRW |csr:hstateen1[]  |虚拟机监控器状态使能 1 寄存器
|`0x60E` |HRW |csr:hstateen2[]  |虚拟机监控器状态使能 2 寄存器
|`0x60F` |HRW |csr:hstateen3[]  |虚拟机监控器状态使能 3 寄存器
|`0x61C` |HRW |csr:hstateen0h[] |虚拟机监控器状态使能 0 寄存器的高 qty:32[bits]，仅 RV32
|`0x61D` |HRW |csr:hstateen1h[] |虚拟机监控器状态使能 1 寄存器的高 qty:32[bits]，仅 RV32
|`0x61E` |HRW |csr:hstateen2h[] |虚拟机监控器状态使能 2 寄存器的高 qty:32[bits]，仅 RV32
|`0x61F` |HRW |csr:hstateen3h[] |虚拟机监控器状态使能 3 寄存器的高 qty:32[bits]，仅 RV32

4+^|虚拟监管级寄存器

|`0x200` |HRW |csr:vsstatus[]  |虚拟监管级状态寄存器
|`0x204` |HRW |csr:vsie[]      |虚拟监管级中断使能寄存器
|`0x205` |HRW |csr:vstvec[]    |虚拟监管级陷阱处理程序基址
|`0x240` |HRW |csr:vsscratch[] |虚拟监管级暂存寄存器
|`0x241` |HRW |csr:vsepc[]     |虚拟监管级异常程序计数器
|`0x242` |HRW |csr:vscause[]   |虚拟监管级陷阱原因
|`0x243` |HRW |csr:vstval[]    |虚拟监管级陷阱值
|`0x244` |HRW |csr:vsip[]      |虚拟监管级中断挂起
|`0x280` |HRW |csr:vsatp[]     |虚拟监管级地址转换与保护

4+^|虚拟监管级间接

|`0x250` |HRW |csr:vsiselect[] |虚拟监管级间接寄存器选择
|`0x251` |HRW |csr:vsireg[]    |虚拟监管级间接寄存器别名
|`0x252` |HRW |csr:vsireg2[]   |虚拟监管级间接寄存器别名 2
|`0x253` |HRW |csr:vsireg3[]   |虚拟监管级间接寄存器别名 3
|`0x255` |HRW |csr:vsireg4[]   |虚拟监管级间接寄存器别名 4
|`0x256` |HRW |csr:vsireg5[]   |虚拟监管级间接寄存器别名 5
|`0x257` |HRW |csr:vsireg6[]   |虚拟监管级间接寄存器别名 6
4+^|虚拟监管级定时器比较

|`0x24D` |HRW |csr:vstimecmp[]  |虚拟监管级定时器比较
|`0x25D` |HRW |csr:vstimecmph[] |csr:vstimecmp[] 的高 qty:32[bits]，仅 RV32

4+^|虚拟监管级控制转移记录配置

|`0x24E` |HRW |csr:vsctrctl[] |虚拟监管级控制转移记录控制寄存器

