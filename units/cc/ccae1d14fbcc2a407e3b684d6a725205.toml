status = "machine"
en = '''
In such cases, the `ELP` prior to the trap, the previous `ELP`, must be
preserved by the trap delivery such that it can be restored on a return from the
trap. [#norm:cfi_mstatus_mpelp_op]#To store the previous `ELP` state on trap delivery to M-mode, an `MPELP`
bit is provided in the `mstatus` CSR.# [#norm:cfi_mstatus_spelp_op]#To store the previous `ELP` state on trap
delivery to S/HS-mode, an `SPELP` bit is provided in the `mstatus` CSR.# [#norm:cfi_sstatus_spelp_op]#The
`SPELP` bit in `mstatus` can be accessed through the `sstatus` CSR.# [#norm:vsstatus_spelp_op2]#To store
the previous `ELP` state on traps to VS-mode, a `SPELP` bit is defined in the
`vsstatus` (VS-modes version of `sstatus`).# [#norm:dcsr_pelp_op]#To store the previous `ELP` state on
transition to Debug Mode, a `pelp` bit is defined in the `dcsr` register.#'''
zh = '''
在此类情况下，陷阱之前的 `ELP`（即先前的 `ELP`）应由陷阱递送过程保留，以便在从陷阱返回时能够恢复。[#norm:cfi_mstatus_mpelp_op]##为在陷阱递送到 M 模式时保存先前的 `ELP` 状态，在 `mstatus` CSR 中提供 `MPELP` 位。## [#norm:cfi_mstatus_spelp_op]##为在陷阱递送到 S/HS 模式时保存先前的 `ELP` 状态，在 `mstatus` CSR 中提供 `SPELP` 位。## [#norm:cfi_sstatus_spelp_op]##`mstatus` 中的 `SPELP` 位可通过 `sstatus` CSR 访问。## [#norm:vsstatus_spelp_op2]##为在陷阱递送到 VS 模式时保存先前的 `ELP` 状态，在 `vsstatus`（`sstatus` 的 VS 模式版本）中定义 `SPELP` 位。## [#norm:dcsr_pelp_op]##为在转换到调试模式时保存先前的 `ELP` 状态，在 `dcsr` 寄存器中定义 `pelp` 位。##'''
