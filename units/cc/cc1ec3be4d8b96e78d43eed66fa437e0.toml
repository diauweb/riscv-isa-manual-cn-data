en = '''
insn:sll[], insn:srl[], and insn:sra[] perform logical left, logical right, and arithmetic
right shifts on the value in register _rs1_ by the shift amount held in
register _rs2_. [#norm:sll_srl_sra_shamt_rv64i]#In RV64I, only the low 6 bits of _rs2_ are considered
for the shift amount.#'''
zh = '''
insn:sll[]、insn:srl[] 和 insn:sra[] 对寄存器 _rs1_ 中的值执行逻辑左移、逻辑右移和算术右移，移位量保存在寄存器 _rs2_ 中。[#norm:sll_srl_sra_shamt_rv64i]#在 RV64I 中，仅考虑 _rs2_ 的低 6 位作为移位量。#'''
