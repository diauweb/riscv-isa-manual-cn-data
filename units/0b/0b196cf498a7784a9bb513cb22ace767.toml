en = '''
This instruction is similar to insn:vfwcvt.f.f.v[] which converts a
floating-point value in an SEW-width format into a 2*SEW-width format.
However, here the SEW-width format is limited to BF16.'''
zh = '''
该指令类似于 insn:vfwcvt.f.f.v[]，后者将 SEW 宽格式的浮点值转换为 2*SEW 宽格式。然而，此处 SEW 宽格式限于 BF16。'''
