en = '''
If _rs2_ contains a nonzero value, this instruction writes the value zero to _rd_.  Otherwise, this instruction copies the contents of _rs1_ to _rd_.'''
zh = '''
如果 _rs2_ 的值为非零，则此指令将零写入 _rd_。否则，此指令将 _rs1_ 的内容复制到 _rd_。'''
