en = '''
The base RISC-V ISA has a relaxed memory model, <<rvwmo,RVWMO>>, with the
insn:fence[] instruction for additional ordering constraints. The address
space is divided by the execution environment into memory and I/O
domains, and the insn:fence[] instruction provides options to order accesses to
one or both of these two address domains.'''
zh = '''
基础 RISC-V ISA 采用宽松内存模型 <<rvwmo,RVWMO>>，并以 insn:fence[] 指令提供额外的排序约束。执行环境将地址空间划分为内存域和 I/O 域，insn:fence[] 指令提供选项，用于对这两个地址域之一或两者的访问进行排序。'''
