en = '''
Each bit in this read-only register indicates whether any of a group of
harts is halted or not. Unavailable/nonexistent harts are not considered to
be halted.'''
zh = '''
此只读寄存器中的每一位指示某组硬件线程中是否有任一线程停机。不可用/不存在的硬件线程不视为已停机。'''
