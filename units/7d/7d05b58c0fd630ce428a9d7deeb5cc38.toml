en = '''
*Trace Sink* - Hardware module that accepts a stream of trace messages/packets and records them into the memory or forwards them onward in some format.'''
zh = '''
**跟踪接收器** - 接受跟踪消息/数据包流，并将其记录到内存中，或以某种格式将其转发到别处的硬件模块。'''
