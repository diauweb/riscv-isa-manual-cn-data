en = '''
[#norm:Zama16b_mag]#If the ext:zama16b[] extension is implemented, then the
<<sec:misaligned-atomicity-granule,misaligned atomicity granule>>
in main memory regions with both the coherence and cacheability PMAs is at least 16 bytes.#
[#norm:Zama16b_atomic_ops]#Misaligned loads, stores and AMOs to those regions that do not cross a naturally
aligned 16-byte boundary are atomic.#'''
zh = '''
[#norm:Zama16b_mag]##若实现了 ext:zama16b[] 扩展，则在同时具有一致性和可缓存性 PMA 的主存区域中，<<sec:misaligned-atomicity-granule,非对齐原子性粒度>> 至少为 16 字节。## [#norm:Zama16b_atomic_ops]##对这些区域中不跨越自然对齐的 16 字节边界的非对齐加载、存储和 AMO 是原子的。##'''
