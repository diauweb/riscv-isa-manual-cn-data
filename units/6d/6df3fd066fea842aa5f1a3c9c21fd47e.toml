en = '''
An HFENCE.VVMA instruction applies only to a single virtual machine,
identified by the setting of `hgatp`.VMID when HFENCE.VVMA executes.'''
zh = '''
一条 HFENCE.VVMA 指令仅作用于由执行 HFENCE.VVMA 时的 `hgatp`.VMID 设置所标识的单个虚拟机。'''
