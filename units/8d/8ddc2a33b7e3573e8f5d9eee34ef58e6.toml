en = '''
NOTE: For RV32, the insn:pack[] instruction with _rs2_=`x0` is the insn:zext.h[]
instruction.
Hence, for RV32, any extension that contains the insn:pack[] instruction also
contains the insn:zext.h[] instruction.'''
zh = '''
注意：对于 RV32，_rs2_=`x0` 的 insn:pack[] 指令就是 insn:zext.h[]
指令。
因此，对于 RV32，任何包含 insn:pack[] 指令的扩展也
包含 insn:zext.h[] 指令。'''
