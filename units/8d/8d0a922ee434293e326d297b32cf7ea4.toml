en = '''
If extension Smstateen is implemented, refer to extensions Smcsrind/Sscsrind (<<ext:smcsrind>>) for how setting bit 60 of CSR
`mstateen0` to zero prevents access to registers `siselect`, `sireg*`,
`vsiselect`, and `vsireg*` from privileged modes less privileged than
M-mode, and likewise how setting bit 60 of `hstateen0` to zero prevents
access to `siselect` and `sireg*` (really `vsiselect` and `vsireg*`) from
VS-mode.'''
zh = '''
若实现了 Smstateen 扩展，请参阅 Smcsrind/Sscsrind 扩展（<<ext:smcsrind>>），了解将 CSR `mstateen0` 的位 60 置零如何阻止从低于 M 模式的特权模式访问寄存器 `siselect`、`sireg*`、`vsiselect` 和 `vsireg*`，以及同样地，将 `hstateen0` 的位 60 置零如何阻止从 VS 模式访问 `siselect` 和 `sireg*`（实际上是 `vsiselect` 和 `vsireg*`）。'''
