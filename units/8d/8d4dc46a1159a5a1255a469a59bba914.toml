en = '''
If S-mode is not supported, csr::[sbe] is read-only 0. Otherwise, csr::[sbe] controls
whether explicit load and store memory accesses made from S-mode are
little-endian (csr::[sbe]=0) or big-endian (csr::[sbe]=1).'''
zh = '''
如果不支持 S 模式，则 csr::[sbe] 为只读 0。否则，csr::[sbe] 控制从 S 模式进行的显式加载和存储内存访问是小端序（csr::[sbe]=0）还是大端序（csr::[sbe]=1）。'''
