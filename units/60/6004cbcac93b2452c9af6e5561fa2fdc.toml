en = '''
[#norm:pmlen_supported_values]#The current standard only supports PMLEN=XLEN-48 (i.e., PMLEN=16 in RV64) and PMLEN=XLEN-57 (i.e., PMLEN=7 in RV64).# [#norm:pmlen_future_reserved]#A setting has been reserved to potentially support other values of PMLEN in future standards.# In such future standards, different supported values of PMLEN may be defined for each privilege mode (U/VU, S/HS, and M).'''
zh = '''
[#norm:pmlen_supported_values]##当前标准仅支持 PMLEN=XLEN-48（即 RV64 中 PMLEN=16）和 PMLEN=XLEN-57（即 RV64 中 PMLEN=7）。## [#norm:pmlen_future_reserved]##已保留一种设置，以在未来标准中可能支持其他 PMLEN 值。## 在此类未来标准中，可为每个特权模式（U/VU、S/HS 和 M）定义不同的受支持 PMLEN 值。'''
