en = '''
The low bit of `mnepc` (`mnepc[0]`) is always zero. On implementations
that support only IALIGN=32, the two low bits (`mnepc[1:0]`) are always
zero.'''
zh = '''
`mnepc` 的低位（`mnepc[0]`）始终为零。在仅支持 IALIGN=32 的实现上，两个低位（`mnepc[1:0]`）始终为零。'''
