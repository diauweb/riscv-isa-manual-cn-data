en = '''
[#norm:mcause_exccode_priority_order]#If an instruction may raise multiple synchronous exceptions, the
decreasing priority order of <<norm:exc_priority>> indicates which
exception is taken and reported in `mcause`.#
[#norm:custom_exc_priority]#The priority of any custom synchronous exceptions is implementation-defined.#'''
zh = '''
[#norm:mcause_exccode_priority_order]#如果一条指令可能引发多个同步异常，则 <<norm:exc_priority>> 的递减优先级顺序指示采用哪个异常并在 `mcause` 中报告。#
[#norm:custom_exc_priority]#任何自定义同步异常的优先级由实现定义。#'''
