en = '''
For RV32, double-precision operands in ext:zdinx[] are held in aligned
`x`-register pairs. In other words, register numbers must be even. Use of
misaligned (odd-numbered) registers for double-width floating-point operands is
_reserved_.'''
zh = '''
对于 RV32，ext:zdinx[] 中的双精度操作数保存在对齐的 `x` 寄存器对中。换言之，寄存器编号必须为偶数。对双宽度浮点操作数使用未对齐（奇数编号）寄存器是__保留的__。'''
