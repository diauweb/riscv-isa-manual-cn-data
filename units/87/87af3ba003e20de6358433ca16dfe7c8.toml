en = '''
NOTE: Executing a insn:fence[w,w] instruction between two store instructions,
for example, suffices to guarantee that the second store will not become
visible to any instruction fetch before the first store does.'''
zh = '''
NOTE: 例如，在两条存储指令之间执行 insn:fence[w,w] 指令，足以保证第二条存储在第一条存储之前不会对任何指令取指可见。'''
