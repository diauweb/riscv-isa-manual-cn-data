en = '''
[#norm:mepc_bit1_dyn_ialign_op]#If an implementation allows IALIGN to be either 16 or 32 (by changing
CSR `misa`, for example), then, whenever IALIGN=32, bit `mepc[1]` is
masked on reads so that it appears to be 0. This masking occurs also for
the implicit read by the MRET instruction. Though masked, `mepc[1]`
remains writable when IALIGN=32.#'''
zh = '''
[#norm:mepc_bit1_dyn_ialign_op]#若实现允许 IALIGN 为 16 或 32（例如通过改变 CSR `misa`），那么每当 IALIGN=32 时，`mepc[1]` 位在读取时被掩码，从而看起来为 0。MRET 指令的隐式读取也会发生这种掩码。尽管被掩码，当 IALIGN=32 时 `mepc[1]` 仍可写。#'''
