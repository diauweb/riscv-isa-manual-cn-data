en = '''
- <<sv39,**Sv39**>> Page-Based 39-bit Virtual-Memory System.

- <<svade,**Svade**>> Page-fault exceptions are raised when a page is accessed
   when A bit is clear, or written when D bit is clear.

- <<ssccptr,**Ssccptr**>> Main memory regions with both the cacheability and
   coherence PMAs must support hardware page-table reads.

- <<sstvecd,**Sstvecd**>> `stvec.MODE` must be capable of holding the value 0
  (Direct).  When `stvec.MODE=Direct`, `stvec.BASE` must be capable of
  holding any valid four-byte-aligned address.

- <<sstvala,**Sstvala**>> stval must be written with the faulting virtual address
  for load, store, and instruction page-fault, access-fault, and
  misaligned exceptions, and for breakpoint exceptions other than
  those caused by execution of the EBREAK or C.EBREAK instructions.
  For virtual-instruction and illegal-instruction exceptions, stval must be written with the
  faulting instruction.

- <<sscounterenw,**Sscounterenw**>> For any hpmcounter that is not read-only zero, the corresponding bit in scounteren must be writable.'''
zh = '''
- <<sv39,**Sv39**>> 基于页面的 39 位虚拟内存系统。

- <<svade,**Svade**>> 当访问页时 A 位为 0，或写入页时 D 位为 0，则引发页错误异常。

- <<ssccptr,**Ssccptr**>> 同时具有可缓存性和一致性 PMA 的主内存区域必须支持硬件页表读取。

- <<sstvecd,**Sstvecd**>> `stvec.MODE` 必须能够保存值 0（Direct）。当 `stvec.MODE=Direct` 时，`stvec.BASE` 必须能够保存任何有效的 4 字节对齐地址。

- <<sstvala,**Sstvala**>> 对于加载、存储和指令页错误、访问错误以及非对齐异常，以及除由执行 EBREAK 或 C.EBREAK 指令引起的断点异常以外的断点异常，必须将出错虚拟地址写入 stval。对于虚拟指令和非法指令异常，必须将出错指令写入 stval。

- <<sscounterenw,**Sscounterenw**>> 对于任何不是只读零的 hpmcounter，scounteren 中的对应位必须可写。'''
