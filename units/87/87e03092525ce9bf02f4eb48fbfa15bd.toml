en = '''
For base ISAs with XLEN=32, the ext:zicntr[] extension enables the three
64-bit read-only counters to be accessed in 32-bit pieces. The insn:rdcycle[],
insn:rdtime[], and insn:rdinstret[] pseudoinstructions provide the lower 32 bits, and
the insn:rdcycleh[], insn:rdtimeh[], and insn:rdinstreth[] pseudoinstructions provide the
upper 32 bits of the respective counters.'''
zh = '''
对于 XLEN=32 的基础 ISA，ext:zicntr[] 扩展使这三个 64 位只读计数器能够以 32 位片段访问。insn:rdcycle[]、insn:rdtime[] 和 insn:rdinstret[] 伪指令提供低 32 位，而 insn:rdcycleh[]、insn:rdtimeh[] 和 insn:rdinstreth[] 伪指令提供相应计数器的高 32 位。'''
