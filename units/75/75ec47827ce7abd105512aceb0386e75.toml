en = '''
Description::
And the packh instruction packs the least-significant bytes of
_rs1_ and _rs2_ into the 16 least-significant bits of _rd_,
zero extending the rest of _rd_.'''
zh = '''
描述::
packh 指令将
_rs1_ 和 _rs2_ 的最低有效字节打包到 _rd_ 的 16 个最低有效位中，
并将 _rd_ 的其余部分零扩展。'''
