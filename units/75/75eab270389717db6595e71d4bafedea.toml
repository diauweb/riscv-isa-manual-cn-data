en = '''
HS-mode is more privileged than VS-mode, and VS-mode is more privileged
than VU-mode. VS-mode interrupts are globally disabled when executing in
U-mode.'''
zh = '''
HS 模式的特权高于 VS 模式，VS 模式的特权高于 VU 模式。在 U 模式中执行时，VS 模式中断被全局禁用。'''
