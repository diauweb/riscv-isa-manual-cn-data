en = '''
BF16 computational instructions defined in this chapter support all IEEE
754-2008 features, including all rounding modes, subnormal inputs and outputs,
overflow and underflow, and default exception handling.
Tininess is detected after rounding.'''
zh = '''
本章定义的 BF16 计算指令支持所有 IEEE 754-2008 特性，包括所有舍入模式、非规格化输入和输出、上溢和下溢以及默认异常处理。微小性在舍入后检测。'''
