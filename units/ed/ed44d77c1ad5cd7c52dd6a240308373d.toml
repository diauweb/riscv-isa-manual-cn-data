en = '''
[#norm:vmseq_vmsne_vmsltu_vmslt_vmsleu_vmsle_vmsgtu_vmsgt_op]#The following integer compare instructions write 1 to the destination
mask register element if the comparison evaluates to true, and 0
otherwise.  The destination mask vector is always held in a single
vector register, with a layout of elements as described in
<<sec-mask-register-layout>>.#  [#norm:vmseq_vmsne_vmsltu_vmslt_vmsleu_vmsle_vmsgtu_vmsgt_vd_v0_legal]#The destination mask vector register
may be the same as the source vector mask register (`v0`).#'''
zh = '''
[#norm:vmseq_vmsne_vmsltu_vmslt_vmsleu_vmsle_vmsgtu_vmsgt_op]#以下整数比较指令在比较结果为真时向目标掩码寄存器元素写入 1，否则写入 0。目标掩码向量始终保存在单个向量寄存器中，元素布局如 <<sec-mask-register-layout>> 所述。#  [#norm:vmseq_vmsne_vmsltu_vmslt_vmsleu_vmsle_vmsgtu_vmsgt_vd_v0_legal]#目标掩码向量寄存器可以与源向量掩码寄存器（`v0`）相同。#'''
