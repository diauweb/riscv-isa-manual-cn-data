en = '''
For base ISAs with XLEN{ge}64, CSR instructions can access
the full 64-bit CSRs directly. In particular, the RDCYCLE, RDTIME, and
RDINSTRET pseudoinstructions read the full 64 bits of the `cycle`,
`time`, and `instret` counters.'''
zh = '''
对于 XLEN{ge}64 的基础 ISA，CSR 指令可直接访问完整的 64 位 CSR。特别地，RDCYCLE、RDTIME 和 RDINSTRET 伪指令读取 `cycle`、`time` 和 `instret` 计数器的全部 64 位。'''
