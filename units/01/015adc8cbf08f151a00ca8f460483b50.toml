en = '''
[#norm:mcountinhibit_sz_warl_op1]#The counter-inhibit register `mcountinhibit` is a 32-bit
*WARL* register that controls which of the hardware performance-monitoring counters increment.#
[#norm:mcountinhibit_only_inc]#The settings in this register only control whether the
counters increment; their accessibility is not affected by the setting
of this register.#'''
zh = '''
[#norm:mcountinhibit_sz_warl_op1]#计数器抑制寄存器 `mcountinhibit` 是一个 32 位 *WARL* 寄存器，控制哪些硬件性能监视计数器递增。#
[#norm:mcountinhibit_only_inc]#此寄存器中的设置仅控制计数器是否递增；其可访问性不受此寄存器设置的影响。#'''
