en = '''
If bit FIOM (Fence of I/O implies Memory) is set to one in `senvcfg`,
FENCE instructions executed in U-mode are modified so the requirement to
order accesses to device I/O implies also the requirement to order main
memory accesses. <<norm:senvcfg_fiom_fence_presuc_op>> details the modified
interpretation of FENCE instruction bits PI, PO, SI, and SO in U-mode
when FIOM=1.'''
zh = '''
若 `senvcfg` 中的 FIOM 位（Fence of I/O implies Memory，I/O 栅栏蕴含内存）被置为 1，则在 U 模式下执行的 FENCE 指令会被修改，使对设备 I/O 的访问排序要求同时也蕴含对主存的访问排序要求。<<norm:senvcfg_fiom_fence_presuc_op>> 详细说明了当 FIOM=1 时 U 模式下 FENCE 指令的 PI、PO、SI 和 SO 位被修改后的解释。'''
