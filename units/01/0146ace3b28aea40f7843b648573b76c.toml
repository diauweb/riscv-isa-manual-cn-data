(((PAUSE, encoding)))

与其他 FENCE 指令一样，PAUSE 不能在 LR/SC 序列内使用而不使前向进展保证失效。
(((PAUSE, LR/RC sequences)))

由于后继集为空，选择 W 作为前驱集是任意的。其他类似 PAUSE 的 HINT 可能使用其他前驱集编码。
