en = '''
Note that pointer masking is purely an arithmetic operation on the address that makes no assumption about the meaning of the addresses it is applied to. [#norm:pm_deterministic_effect]#Pointer masking with the same value of PMLEN always has the same effect for the same type of address (virtual or physical).# This ensures that code that relies on pointer masking does not need to be aware of the environment it runs in once pointer masking has been enabled, as long as the value of PMLEN is known, and whether or not addresses are virtual or physical. For example, the same application or library code can run in user mode, supervisor mode or M-mode (with different address translation modes) without modification.'''
zh = '''
请注意，指针掩码纯粹是对地址的算术操作，不对其所应用地址的含义作任何假设。[#norm:pm_deterministic_effect]#具有相同 PMLEN 值的指针掩码对于相同类型的地址（虚拟或物理）始终具有相同的效果。# 这确保依赖指针掩码的代码在启用指针掩码后，只要知道 PMLEN 的值以及地址是虚拟还是物理，就不需要了解其运行环境。例如，相同的应用程序或库代码可以在用户模式、监管模式或 M 模式（具有不同的地址转换模式）下运行而无需修改。'''
