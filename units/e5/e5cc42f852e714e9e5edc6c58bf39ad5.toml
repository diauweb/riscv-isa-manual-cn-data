en = '''
Each RISC-V hart may implement a Trigger Module. When trigger conditions
are met, harts will halt and inform the debug module that they have
halted.'''
zh = '''
每个 RISC-V 硬件线程可以实现一个触发模块。当满足触发条件时，硬件线程会停止并通知调试模块它们已停止。'''
