en = '''
When bit 13 of `hideleg` is zero, `vsip`.LCOFIP and `vsie`.LCOFIE
are read-only zeros.
Else, `vsip`.LCOFIP and `vsie`.LCOFIE are aliases of `sip`.LCOFIP
and `sie`.LCOFIE.'''
zh = '''
当 `hideleg` 的位 13 为零时，`vsip`.LCOFIP 和 `vsie`.LCOFIE 为只读零。否则，`vsip`.LCOFIP 和 `vsie`.LCOFIE 是 `sip`.LCOFIP 和 `sie`.LCOFIE 的别名。'''
