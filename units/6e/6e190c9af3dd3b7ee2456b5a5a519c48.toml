en = '''
[#norm:csr_strongly_ordered]#The hardware platform may define that accesses to certain CSRs are
strongly ordered, as defined in <<sec:memory-ordering-pmas>>.
Accesses to strongly ordered CSRs have
stronger ordering constraints with respect to accesses to both weakly
ordered CSRs and accesses to memory-mapped I/O regions.#'''
zh = '''
[#norm:csr_strongly_ordered]#硬件平台可以定义对某些 CSR 的访问为强有序，如 <<sec:memory-ordering-pmas>> 中所定义。对强有序 CSR 的访问相对于对弱有序 CSR 的访问以及对内存映射 I/O 区域的访问具有更强的排序约束。#'''
