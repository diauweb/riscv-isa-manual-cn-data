- extlink:c[] 压缩指令。
- extlink:b[] 位操作指令。
- extlink:zicsr[]  CSR 指令。这些由 F 的存在隐含。
- extlink:zicntr[] 基础计数器和定时器。
- extlink:zihpm[] 硬件性能计数器。
- extlink:ziccif[] 同时具有一致性和可缓存性 PMA 的主内存区域应支持取指，并且对自然对齐的、大小至多 min(ILEN,XLEN)（即对于 RVA23 为 32 位）的 2 的幂大小的任何取指都是原子的。
- extlink:ziccrse[] 同时具有一致性和可缓存性 PMA 的主内存区域应支持 RsrvEventual。
- extlink:ziccamoa[] 同时具有一致性和可缓存性 PMA 的主内存区域应支持 AMOArithmetic。
- extlink:zicclsm[] 应支持对同时具有一致性和可缓存性 PMA 的主内存区域的非对齐加载和存储。
