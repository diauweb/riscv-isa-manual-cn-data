en = '''
[#norm:siselect_min_range]#The `siselect` register will support the value range 0..0xFFF at a
minimum.# A future extension may define a value range outside of this
minimum range. Only if such an extension is implemented will `siselect` be
required to support larger values.'''
zh = '''
[#norm:siselect_min_range]##`siselect` 寄存器至少支持 0..0xFFF 的值范围。## 未来扩展可能定义超出该最小范围的值范围。只有在实现此类扩展时，才要求 `siselect` 支持更大的值。'''
