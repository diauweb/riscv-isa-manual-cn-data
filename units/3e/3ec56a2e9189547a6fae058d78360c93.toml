en = '''
If using `x0` as `src` of SD or C.SDSP, the entire 64-bit operand is zero — i.e., register `x1` is not accessed.'''
zh = '''
如果将 `x0` 用作 SD 或 C.SDSP 的 `src`，则整个 64 位操作数为零——即不访问寄存器 `x1`。'''
