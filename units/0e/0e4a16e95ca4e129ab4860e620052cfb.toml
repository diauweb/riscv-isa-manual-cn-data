en = '''
The ext:zfinx[] variants of these ext:f[]-extension instructions have the same
semantics, except that whenever such an instruction would have accessed
an `f` register, it instead accesses the `x` register with the same
number.'''
zh = '''
这些 ext:f[] 扩展指令的 ext:zfinx[] 变体具有相同的语义，只是当此类指令原本要访问 `f` 寄存器时，它改为访问编号相同的 `x` 寄存器。'''
