VSXL 字段控制 VS 模式的有效 XLEN（称为 VSXLEN），它可能与 HS 模式的 XLEN（HSXLEN）不同。当 HSXLEN=32 时，VSXL 字段不存在，且 VSXLEN=32。当 HSXLEN=64 时，VSXL 是一个 *WARL* 字段，其编码与 `misa` 的 MXL 字段相同，如第 <<misabase, 19>> 页的 <<misabase>> 所示。特别地，实现可使 VSXL 成为只读字段，其值始终确保 VSXLEN=HSXLEN。

若将 HSXLEN 从 32 改为更宽的宽度，且字段 VSXL 未被限制为单个值，则其取值对应于不超过新 HSXLEN 的最宽受支持宽度。

`hstatus` 字段 VTSR、VTW 和 VTVM 的定义类似于 `mstatus` 字段 TSR、TW 和 TVM，但仅在 VS 模式下影响执行，并导致虚拟指令异常而非非法指令异常。当 VTSR=1 时，在 VS 模式下尝试执行 SRET 将引发虚拟指令异常。当 VTW=1（并假定 `mstatus`.TW=0）时，若 WFI 未在实现特定的有界时间限制内完成，则在 VS 模式下尝试执行 WFI 将引发虚拟指令异常。当 VTW=1（且 `mstatus`.TW=0）时，实现可使 WFI 在 VS 模式下始终引发虚拟指令异常，即使执行该指令时存在挂起的全局禁用中断。当 VTVM=1 时，在 VS 模式下尝试执行 SFENCE.VMA 或 SINVAL.VMA，或访问 CSR `satp`，将引发虚拟指令异常。

VGEIN（虚拟客户机外部中断号）字段为 VS 级外部中断选择一个客户机外部中断源。VGEIN 是一个 *WLRL* 字段，必须能够保存零到最大客户机外部中断号（称为 GEILEN）之间（含两端）的值。当 VGEIN=0 时，没有为客户机外部中断选择 VS 级外部中断源。GEILEN 可为零，此时 VGEIN 可为只读 0。客户机外部中断在 <<hgeinterruptregs>> 中说明，VGEIN 的使用在 <<hinterruptregs>> 中进一步介绍。

字段 HU（U 模式下的虚拟机监控器）控制虚拟机加载/存储指令 HLV、HLVX 和 HSV 是否也能在 U 模式下使用。当 HU=1 时，这些指令可在 U 模式下如同在 HS 模式下一样执行。当 HU=0 时，所有虚拟机监控器指令在 U 模式下导致非法指令异常。

[NOTE]
