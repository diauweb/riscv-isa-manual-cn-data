[#norm:nop_op]#The insn:nop[] instruction does not change any architecturally visible state,
except for advancing the `pc` and incrementing any applicable
performance counters.# [#norm:nop_enc]#insn:nop[] is encoded as insn:addi[x0,x0,0].#'''
