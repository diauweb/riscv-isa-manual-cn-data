en = '''
[#norm:rnmi_exception_nmie0]#When the Smdbltrp extension is not implemented, if the hart encounters an exception while executing in M-mode with the `mnstatus`.NMIE bit clear, the actions taken are the same as if the exception had occurred while `mnstatus`.NMIE were set, except that the program counter is set to the RNMI exception trap handler address.#
The behavior when the Smdbltrp extension is implemented is described in <<machine-double-trap>>.'''
zh = '''
[#norm:rnmi_exception_nmie0]#当未实现 Smdbltrp 扩展时，如果硬件线程在 `mnstatus`.NMIE 位清除的情况下在机器模式执行时遇到异常，则所采取的操作与在 `mnstatus`.NMIE 置位时发生异常相同，只是程序计数器被设置为 RNMI 异常陷阱处理程序地址。#
当实现了 Smdbltrp 扩展时的行为在 <<machine-double-trap>> 中描述。'''
