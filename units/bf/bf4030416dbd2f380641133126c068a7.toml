en = '''
[#norm:rvwmo_misaligned_ldst_memops]#A misaligned load or store instruction may be decomposed
into a set of component memory operations of any granularity.#
[#norm:rvwmo_fp_gt_xlen_memops]#A floating-point load or store of more than XLEN bits may
also be decomposed into a set of component memory operations of any granularity.#
[#norm:rvwmo_order_multi_memops]#The memory operations generated by such instructions
are not ordered with respect to each other in program order, but they are ordered normally with
respect to the memory operations generated by preceding and subsequent
instructions in program order.#
The atomics extension "A" does not require execution environments to support
misaligned atomic instructions at all.
However, [#norm:rvwmo_misaligned_in_atomic_pma]#if misaligned atomics are supported via the
misaligned atomicity granule PMA, then AMOs within an atomicity granule are not decomposed, nor are
loads and stores defined in the base ISAs, nor are loads and stores of no more
than XLEN bits defined in the F, D, and Q extensions.#
(((decomposition)))'''
zh = '''
[#norm:rvwmo_misaligned_ldst_memops]#非对齐加载或存储指令可分解为一组任意粒度的组成内存操作。#
[#norm:rvwmo_fp_gt_xlen_memops]#加载或存储多于 XLEN 位的浮点加载或存储也可分解为一组任意粒度的组成内存操作。#
[#norm:rvwmo_order_multi_memops]#此类指令生成的内存操作在程序顺序中彼此之间不排序，但它们相对于程序顺序中前序和后序指令生成的内存操作按常规排序。#
原子扩展“A”完全不要求执行环境支持非对齐原子指令。
然而，[#norm:rvwmo_misaligned_in_atomic_pma]#如果通过非对齐原子性粒度 PMA 支持非对齐原子操作，则原子性粒度内的 AMO 不进行分解，基础 ISA 中定义的加载和存储不进行分解，F、D 和 Q 扩展中定义的不超过 XLEN 位的加载和存储也不进行分解。#
(((decomposition)))'''
