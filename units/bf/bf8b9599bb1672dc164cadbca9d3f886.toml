en = '''
[#norm:c-addi16sp_op]#C.ADDI16SP (add immediate to stack pointer)
shares the opcode with C.LUI, but has a destination field of
`x2`. C.ADDI16SP adds the non-zero sign-extended 6-bit immediate to the
value in the stack pointer (`sp=x2`), where the immediate is scaled to
represent multiples of 16 in the range [-512, 496]. C.ADDI16SP is used to
adjust the stack pointer in procedure prologues and epilogues. It
expands into `addi x2, x2, nzimm[9:4]`.#
[#norm:c-addi16sp_rsv]#C.ADDI16SP is valid only when
_nzimm_≠0; the code point with _nzimm_=0 is reserved.#'''
zh = '''
[#norm:c-addi16sp_op]#C.ADDI16SP（加立即数到栈指针）与 C.LUI 共享操作码，但目的字段为 `x2`。C.ADDI16SP 将非零符号扩展的 6 位立即数加到栈指针（`sp=x2`）中的值上，其中立即数被缩放以表示范围 [-512, 496] 内 16 的倍数。C.ADDI16SP 用于在过程序言和尾声中调整栈指针。它扩展为 `addi x2, x2, nzimm[9:4]`。#
[#norm:c-addi16sp_rsv]#C.ADDI16SP 仅在 _nzimm_≠0 时有效；_nzimm_=0 的代码点保留。#'''
