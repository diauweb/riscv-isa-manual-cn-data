en = '''
Among instructions in RV32GC and RV64GC, each aligned memory instruction
gives rise to exactly one memory operation, with two exceptions. First,
an unsuccessful SC instruction does not give rise to any memory
operations.
Second, floating-point load and store instructions of more than XLEN bits
(e.g. FLD/FSD in RV32) may each give rise to multiple memory operations.
An aligned AMO
gives rise to a single memory operation that is both a load operation
and a store operation simultaneously.'''
zh = '''
在 RV32GC 和 RV64GC 的指令中，每条对齐的内存指令恰好产生一个内存操作，但有两个例外。第一，不成功的 SC 指令不产生任何内存操作。第二，多于 XLEN 位的浮点加载和存储指令（例如 RV32 中的 FLD/FSD）各自可能产生多个内存操作。对齐的 AMO 产生单个同时既是加载操作又是存储操作的内存操作。'''
