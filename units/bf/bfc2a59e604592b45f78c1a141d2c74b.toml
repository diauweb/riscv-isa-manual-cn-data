[#norm:inst:c-sd:operation]##从寄存器 `rs2'` 和 `rs2'+1` 存储 64 位值。它通过将零扩展的偏移（按 8 缩放）与寄存器 rs1' 中的基址相加来计算有效地址。它展开为 `sd rs2', offset(rs1')`。##'''
