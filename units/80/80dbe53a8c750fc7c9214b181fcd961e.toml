en = '''
* The previous version of this document was released under a Creative
Commons Attribution 4.0 International License by the original authors,
and this and future versions of this document will be released under the
same license.
* The explicit convention on shadow CSR addresses has been removed to
reclaim CSR space. Shadow CSRs can still be added as needed.
* The csr:mvendorid[] register now contains the JEDEC code of the core
provider as opposed to a code supplied by the Foundation. This avoids
redundancy and offloads work from the Foundation.
* The interrupt-enable stack discipline has been simplified.
* An optional mechanism to change the base ISA used by supervisor and
user modes has been added to the csr:mstatus[] CSR, and the field previously
called Base in csr:misa[] has been renamed to csr::[mxl] for consistency.
* Clarified expected use of csr::[xs] to summarize additional extension state
status fields in csr:mstatus[].
* Optional vectored interrupt support has been added to the csr:mtvec[] and
csr:stvec[] CSRs.
* The csr::[seip] and csr::[ueip] bits in the csr:mip[] CSR have been redefined to support
software injection of external interrupts.
* The csr:mbadaddr[] register has been subsumed by a more general csr:mtval[]
register that can now capture bad instruction bits on an illegal-instruction
fault to speed instruction emulation.
* The machine-mode base-and-bounds translation and protection schemes
have been removed from the specification as part of moving the virtual
memory configuration to csr:sptbr[] (now csr:satp[]). Some of the motivation for
the base and bound schemes are now covered by the PMP registers, but
space remains available in csr:mstatus[] to add these back at a later date
if deemed useful.
* In systems with only M-mode, or with both M-mode and U-mode but
without U-mode trap support, the csr:medeleg[] and csr:mideleg[] registers now
do not exist, whereas previously they returned zero.
* Virtual-memory page faults now have csr:mcause[] values distinct from
physical-memory access faults. Page-fault exceptions can now be
delegated to S-mode without delegating exceptions generated by PMA and
PMP checks.
* An optional physical-memory protection (PMP) scheme has been proposed.
* The supervisor virtual memory configuration has been moved from the
csr:mstatus[] register to the csr:sptbr[] register. Accordingly, the csr:sptbr[]
register has been renamed to csr:satp[] (Supervisor Address Translation and
Protection) to reflect its broadened role.
* The insn:sfence.vm[] instruction has been removed in favor of the improved
insn:sfence.vma[] instruction.
* The csr:mstatus[] bit csr::[mxr] has been exposed to S-mode via csr:sstatus[].
* The polarity of the csr::[pum] bit in csr:sstatus[] has been inverted to shorten
code sequences involving csr::[mxr]. The bit has been renamed to csr::[sum].
* Hardware management of page-table entry Accessed and Dirty bits has
been made optional; simpler implementations may trap to software to set
them.
* The counter-enable scheme has changed, so that S-mode can control
availability of counters to U-mode.
* H-mode has been removed, as we are focusing on recursive
virtualization support in S-mode. The encoding space has been reserved
and may be repurposed at a later date.
* A mechanism to improve virtualization performance by trapping S-mode
virtual-memory management operations has been added.
* The Supervisor Binary Interface (SBI) chapter has been removed, so
that it can be maintained as a separate specification.'''
zh = '''
* 本文档的先前版本由原作者根据 Creative Commons Attribution 4.0 International License 发布，本文档的当前版本和未来版本将根据相同的许可证发布。
* 已移除关于影子 CSR 地址的显式约定，以回收 CSR 空间。仍可根据需要添加影子 CSR。
* csr:mvendorid[] 寄存器现在包含核心提供商的 JEDEC 代码，而不是基金会提供的代码。这避免了冗余并减轻了基金会的工作。
* 简化了中断使能栈的规则。
* 在 csr:mstatus[] CSR 中增加了用于更改监管模式和用户模式所用基础 ISA 的可选机制，并且为保持一致，csr:misa[] 中先前称为 Base 的字段已重命名为 csr::[mxl]。
* 澄清了 csr::[xs] 用于汇总 csr:mstatus[] 中额外扩展状态字段的预期用途。
* 在 csr:mtvec[] 和 csr:stvec[] CSR 中增加了可选的向量中断支持。
* 重新定义了 csr:mip[] CSR 中的 csr::[seip] 和 csr::[ueip] 位，以支持外部中断的软件注入。
* csr:mbadaddr[] 寄存器已被更通用的 csr:mtval[] 寄存器取代，后者现在可以在非法指令错误时捕获错误指令位，以加速指令模拟。
* 作为将虚拟内存配置移至 csr:sptbr[]（现为 csr:satp[]）的一部分，机器模式基址-边界转换和保护方案已从规范中移除。基址-边界方案的部分动机现在由 PMP 寄存器涵盖，但 csr:mstatus[] 中仍有可用空间，如果认为有用，可在以后重新添加这些方案。
* 在仅有 M 模式的系统中，或同时具有 M 模式和 U 模式但不支持 U 模式陷阱的系统中，csr:medeleg[] 和 csr:mideleg[] 寄存器现在不存在，而先前它们返回零。
* 虚拟内存页错误现在具有与物理内存访问错误不同的 csr:mcause[] 值。页错误异常现在可以委托给 S 模式，而无需委托由 PMA 和 PMP 检查生成的异常。
* 提出了可选的物理内存保护（PMP）方案。
* 监管虚拟内存配置已从 csr:mstatus[] 寄存器移至 csr:sptbr[] 寄存器。相应地，csr:sptbr[] 寄存器已重命名为 csr:satp[]（Supervisor Address Translation and Protection，监管地址转换与保护），以反映其扩大的作用。
* 已移除 insn:sfence.vm[] 指令，改用改进的 insn:sfence.vma[] 指令。
* csr:mstatus[] 的 csr::[mxr] 位已通过 csr:sstatus[] 暴露给 S 模式。
* csr:sstatus[] 中 csr::[pum] 位的极性已反转，以缩短涉及 csr::[mxr] 的代码序列。该位已重命名为 csr::[sum]。
* 页表项 Accessed 和 Dirty 位的硬件管理已变为可选；更简单的实现可以陷入软件来设置它们。
* 计数器使能方案已更改，使 S 模式可以控制 U 模式对计数器的可用性。
* 已移除 H 模式，因为我们专注于 S 模式中的递归虚拟化支持。编码空间已保留，并可能在以后重新利用。
* 增加了通过陷入 S 模式虚拟内存管理操作来提高虚拟化性能的机制。
* 已移除监管二进制接口（SBI）章节，以便将其作为单独的规范维护。'''
