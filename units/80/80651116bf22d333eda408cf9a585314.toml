en = '''
The insn:fleq.s[] and insn:fltq.s[] instructions are defined like the insn:fle.s[] and insn:flt.s[] instructions,
except that quiet NaN inputs do not cause the invalid
operation exception flag to be set.'''
zh = '''
insn:fleq.s[] 和 insn:fltq.s[] 指令的定义与 insn:fle.s[] 和 insn:flt.s[] 指令类似，不同之处在于静默 NaN 输入不会导致置位无效运算异常标志。'''
