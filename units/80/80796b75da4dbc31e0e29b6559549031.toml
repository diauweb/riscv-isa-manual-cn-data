en = '''
Executing a system call causes all caller-saved vector registers
(`v0`-`v31`, `vl`, `vtype`) and `vstart` to become unspecified.'''
zh = '''
执行系统调用会导致所有调用者保存的向量寄存器（`v0`-`v31`、`vl`、`vtype`）以及 `vstart` 变为未指定。'''
