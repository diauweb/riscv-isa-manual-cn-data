en = '''
[#norm:mip_meip_mie_meie_op]#Bits csr:mip[meip] and csr:mie[meie] are the interrupt-pending and
interrupt-enable bits for machine-level external interrupts.#
[#norm:mip_meip_rdonly]#csr::[meip] is read-only in csr:mip[], and is set and cleared by a platform-specific
interrupt controller.#'''
zh = '''
[#norm:mip_meip_mie_meie_op]#位 csr:mip[meip] 和 csr:mie[meie] 是机器级外部中断的中断挂起位和中断使能位。#
[#norm:mip_meip_rdonly]#csr::[meip] 在 csr:mip[] 中为只读，由平台特定的中断控制器置位和清除。#'''
