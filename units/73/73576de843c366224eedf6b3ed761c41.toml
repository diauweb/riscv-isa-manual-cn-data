en = '''
(((floating-point, classification)))
The insn:fclass.s[] instruction examines the value in floating-point register
_rs1_ and writes to integer register _rd_ a 10-bit mask that indicates
the class of the floating-point number. The format of the mask is
described in <<fclass>>. The corresponding bit in _rd_ will
be set if the property is true and clear otherwise. All other bits in
_rd_ are cleared. Note that exactly one bit in _rd_ will be set.
insn:fclass.s[] does not set the floating-point exception flags.'''
zh = '''
(((floating-point, classification)))
insn:fclass.s[] 指令检查浮点寄存器 _rs1_ 中的值，并向整数寄存器 _rd_ 写入一个 10 位掩码，用于指示该浮点数的类别。该掩码的格式在 <<fclass>> 中描述。如果对应性质为真，则 _rd_ 中的相应位被置位，否则清除。_rd_ 中的所有其他位均被清除。注意，_rd_ 中恰好有一位会被置位。insn:fclass.s[] 不设置浮点异常标志。'''
