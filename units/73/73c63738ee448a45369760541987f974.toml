en = '''
Vector constant-stride operations access the first memory element at the base
effective address, and then access subsequent elements at address
increments given by the byte offset contained in the `x` register
specified by `rs2`.'''
zh = '''
向量恒定步长操作在基址有效地址处访问第一个内存元素，然后以 `rs2` 指定的 `x` 寄存器中包含的字节偏移给出的地址增量访问后续元素。'''
