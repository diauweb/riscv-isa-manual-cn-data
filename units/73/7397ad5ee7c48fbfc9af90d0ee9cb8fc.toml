en = '''
RVA22S64 has four unprivileged options (ext:zfh[], ext:v[], ext:zkn[], ext:zks[]) from RVA22U64, and
eight privileged options (Sv48, Sv57, Svnapot, Ssu64xl, Sstc, Sscofpmf, ext:zkr[], H).'''
zh = '''
RVA22S64 有四个来自 RVA22U64 的非特权选项（ext:zfh[]、ext:v[]、ext:zkn[]、ext:zks[]），以及八个特权选项（Sv48、Sv57、Svnapot、Ssu64xl、Sstc、Sscofpmf、ext:zkr[]、H）。'''
