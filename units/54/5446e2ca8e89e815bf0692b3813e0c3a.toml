en = '''
<<ax-prog, Progress Axiom>>: No memory operation may be preceded in the global
memory order by an infinite sequence of other memory operations.'''
zh = '''
<<ax-prog, 进展公理>>：任何内存操作都不能在全局内存顺序中被其他内存操作的无限序列所先于。'''
