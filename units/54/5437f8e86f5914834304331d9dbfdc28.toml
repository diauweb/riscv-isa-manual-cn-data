en = '''
This section describes the ext:f[] standard extension for _single-precision_
floating-point, which adds [#norm:f_ieee_compliance]#computational instructions
compliant with the IEEE 754-2008 arithmetic standard's binary32 format and
operations.# [#norm:f_depends_zicsr]#The ext:f[] extension depends on the
ext:zicsr[] extension.#
[#norm:flen]#The ext:f[] extension adds 32 floating-point registers, `f0`-`f31`,
each 32 bits wide (FLEN=32 in <<fprs>>)#.'''
zh = '''
本节描述用于__单精度__浮点的 ext:f[] 标准扩展，它添加了 [#norm:f_ieee_compliance]#符合 IEEE 754-2008 算术标准 binary32 格式和操作的计算指令。# [#norm:f_depends_zicsr]#ext:f[] 扩展依赖于 ext:zicsr[] 扩展。#
[#norm:flen]#ext:f[] 扩展添加 32 个浮点寄存器 `f0`-`f31`，每个 32 位宽（<<fprs>> 中 FLEN=32）#。'''
