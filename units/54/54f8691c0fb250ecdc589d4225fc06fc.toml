en = '''
[#norm:menvcfg_cbze_op]#The Zicboz extension adds the `CBZE` (Cache Block Zero instruction enable) field
to `menvcfg`. When the `CBZE` field is set to 1, it enables execution of the
cache block zero instruction, `CBO.ZERO`, in modes less privileged than M.
Otherwise, the instruction raises an illegal-instruction exception in modes less
privileged than M.#
[#norm:menvcfg_cbze_rdonly0]#When the Zicboz extension is not implemented, `CBZE` is read-only zero.#'''
zh = '''
[#norm:menvcfg_cbze_op]##Zicboz 扩展向 `menvcfg` 添加 `CBZE`（Cache Block Zero instruction enable）字段。当 `CBZE` 字段设置为 1 时，它使能在低于 M 的模式下执行缓存块零指令 `CBO.ZERO`。否则，该指令在低于 M 的模式下引发非法指令异常。##
[#norm:menvcfg_cbze_rdonly0]##当未实现 Zicboz 扩展时，`CBZE` 为只读零。##'''
