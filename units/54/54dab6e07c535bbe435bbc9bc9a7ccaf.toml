en = '''
- extlink:m[] Integer multiplication and division.
- extlink:a[] Atomic instructions.
- extlink:f[] Single-precision floating-point instructions.
- extlink:d[] Double-precision floating-point instructions.
- extlink:c[] Compressed instructions.
- extlink:b[] Bit-manipulation instructions.
- extlink:zicsr[]  CSR instructions.  These are implied by presence of F.
- extlink:zicntr[] Base counters and timers.
- extlink:zihpm[] Hardware performance counters.
- extlink:ziccif[] Main memory regions with both the coherence and
  cacheability PMAs must support instruction fetch, and any instruction
  fetches of naturally aligned power-of-2 sizes up to min(ILEN,XLEN)
  (i.e., 32 bits for RVB23) are atomic.
- extlink:ziccrse[] Main memory regions with both the coherence and cacheability
  PMAs must support RsrvEventual.
- extlink:ziccamoa[] Main memory regions with both the coherence and
  cacheability PMAs must support AMOArithmetic.
- extlink:zicclsm[] Misaligned loads and stores to main memory regions with both
  the coherence and cacheability PMAs must be supported.
- extlink:za64rs[] Reservation sets must be contiguous, naturally aligned, and a
  maximum of 64 bytes.
- extlink:zihintpause[] Pause hint.
- extlink:zic64b[] Cache blocks must be 64 bytes in size, naturally aligned
  in the address space.
- extlink:zicbom[] Cache-Block Management Operations.
- extlink:zicbop[] Cache-Block Prefetch Operations.
- extlink:zicboz[] Cache-Block Zero Operations.
- extlink:zkt[] Data-independent execution latency.'''
zh = '''
- extlink:m[] 整数乘法与除法。
- extlink:a[] 原子指令。
- extlink:f[] 单精度浮点指令。
- extlink:d[] 双精度浮点指令。
- extlink:c[] 压缩指令。
- extlink:b[] 位操作指令。
- extlink:zicsr[] CSR 指令。这些由 F 的存在所蕴含。
- extlink:zicntr[] 基础计数器与定时器。
- extlink:zihpm[] 硬件性能计数器。
- extlink:ziccif[] 同时具有一致性与可缓存性 PMA 的主内存区域必须支持取指，且任何对自然对齐的 2 的幂大小（至多 min(ILEN,XLEN)，即 RVB23 为 32 位）的取指都是原子的。
- extlink:ziccrse[] 同时具有一致性与可缓存性 PMA 的主内存区域必须支持 RsrvEventual。
- extlink:ziccamoa[] 同时具有一致性与可缓存性 PMA 的主内存区域必须支持 AMOArithmetic。
- extlink:zicclsm[] 必须支持对同时具有一致性与可缓存性 PMA 的主内存区域的非对齐加载与存储。
- extlink:za64rs[] 保留集必须连续、自然对齐，且最大为 64 字节。
- extlink:zihintpause[] 暂停提示。
- extlink:zic64b[] 缓存块大小必须为 64 字节，且在地址空间中自然对齐。
- extlink:zicbom[] 缓存块管理操作。
- extlink:zicbop[] 缓存块预取操作。
- extlink:zicboz[] 缓存块清零操作。
- extlink:zkt[] 数据无关执行延迟。'''
