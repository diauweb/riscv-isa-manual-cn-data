en = '''
The ext:zmmul[] extension implements the multiplication subset of the ext:m[]
extension. It adds the following instructions defined in extlink:m[]:
insn:mul[], insn:mulh[], insn:mulhu[], insn:mulhsu[], and (for RV64 only)
insn:mulw[]. [#norm:Zmmul_enc_same]#The encodings and semantics are identical to those of the
corresponding instructions in ext:m[].# [#norm:M_implies_Zmmul]#ext:m[] implies ext:zmmul[].#'''
zh = '''
ext:zmmul[] 扩展实现 ext:m[] 扩展的乘法子集。它添加了 extlink:m[] 中定义的以下指令：insn:mul[]、insn:mulh[]、insn:mulhu[]、insn:mulhsu[] 以及（仅 RV64）insn:mulw[]。[#norm:Zmmul_enc_same]##其编码和语义与 ext:m[] 中对应指令的编码和语义完全相同。## [#norm:M_implies_Zmmul]##ext:m[] 蕴含 ext:zmmul[]。##'''
