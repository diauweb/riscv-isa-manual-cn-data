en = '''
[#norm:pmp_no_entry_match]#If no PMP entry matches any byte of an M-mode memory operation, the operation succeeds.
If no PMP entry matches any byte of an S-mode or U-mode memory operation, the operation
fails if at least one PMP entry is implemented and succeeds otherwise.#'''
zh = '''
[#norm:pmp_no_entry_match]#如果没有 PMP 条目匹配 M 模式内存操作的任何字节，则该操作成功。如果没有 PMP 条目匹配 S 模式或 U 模式内存操作的任何字节，则如果至少实现了一个 PMP 条目，该操作失败，否则成功。#'''
